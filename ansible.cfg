[defaults]
inventory = inventories/homelab/hosts.yml.example
roles_path = roles
action_plugins = plugins/action
module_utils = plugins/module_utils
host_key_checking = True
retry_files_enabled = False
stdout_callback = default
callback_result_format = yaml
interpreter_python = auto_silent
collections_path = .ansible/collections:~/.ansible/collections:/usr/share/ansible/collections
# Public inventory examples use *.example and should be parsed as YAML.
yaml_valid_extensions = .yaml, .yml, .json, .example

[ssh_connection]
pipelining = True
