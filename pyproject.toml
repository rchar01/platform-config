[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests/python"]
python_files = ["test_*.py"]
addopts = [
  "-p", "no:cacheprovider",
  "--strict-config",
  "--strict-markers",
  "--tb=short",
  "-ra",
]
filterwarnings = ["default"]
markers = [
  "pki: host-local PKI helper and role tests",
  "serial: tests that coordinate timing-sensitive child processes",
]
required_plugins = ["pytest-xdist==3.8.0"]
xfail_strict = true
