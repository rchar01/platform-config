---
- name: Block unavailable monitoring HA smoke checks
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Stop before an obsolete or empty smoke result
      ansible.builtin.fail:
        msg: "Monitoring HA smoke checks are not implemented."

- name: Block obsolete monitoring smoke checks
  hosts: monitoring
  gather_facts: false
  tasks:
    - name: Stop until monitoring HA smoke checks are available
      ansible.builtin.fail:
        msg: >-
          Monitoring HA smoke checks are not implemented. The previous smoke
          playbook validated only the retired single-host stack, not HA endpoint,
          quorum, ingestion, query, alerting, or external-observer behavior.

- name: Reject smoke checks limited away from monitoring
  hosts: all
  gather_facts: false
  tasks:
    - name: Stop before a limited smoke run can report false success
      ansible.builtin.fail:
        msg: >-
          Monitoring HA smoke checks are not implemented. A limit that excludes
          the replacement service group is not a valid smoke result.
      when: inventory_hostname not in groups.get('monitoring', [])
