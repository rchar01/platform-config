---
- name: Smoke test container runtime hosts
  hosts: container_hosts
  become: true
  gather_facts: false
  vars:
    podman_host_quadlet_generator_candidates:
      - /usr/lib/systemd/system-generators/podman-system-generator
      - /usr/lib/systemd/system-generators/podman-generator
      - /usr/libexec/podman/quadlet
      - /usr/lib/podman/quadlet
    podman_host_socket_non_enabled_states:
      - disabled
      - indirect
      - static
    container_runtime_kernel_smoke_unit_path: /etc/systemd/system/platform-container-runtime-overlayfs-exception.service
    container_runtime_kernel_smoke_unit_content: |
      [Unit]
      Description=Platform container runtime OverlayFS policy exception
      Documentation=man:modprobe(8)
      DefaultDependencies=no
      Conflicts=shutdown.target
      Before=sysinit.target shutdown.target

      [Service]
      Type=oneshot
      ExecStart=/usr/sbin/modprobe --ignore-install overlay
      RemainAfterExit=yes

      [Install]
      WantedBy=sysinit.target
  tasks:
    - name: Check loaded OverlayFS state
      ansible.builtin.stat:
        path: /sys/module/overlay
      register: container_runtime_kernel_smoke_overlayfs

    - name: Require loaded OverlayFS
      ansible.builtin.assert:
        that:
          - container_runtime_kernel_smoke_overlayfs.stat.isdir | default(false)
        fail_msg: "OverlayFS is not loaded."

    - name: Check managed OverlayFS exception unit
      ansible.builtin.stat:
        path: "{{ container_runtime_kernel_smoke_unit_path }}"
      register: container_runtime_kernel_smoke_unit

    - name: Read managed OverlayFS exception unit
      ansible.builtin.slurp:
        src: "{{ container_runtime_kernel_smoke_unit_path }}"
      register: container_runtime_kernel_smoke_unit_data
      when: container_runtime_overlayfs_policy_exception_enabled | default(true) | bool

    - name: Check managed OverlayFS exception enabled state
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - platform-container-runtime-overlayfs-exception.service
      register: container_runtime_kernel_smoke_unit_enabled
      changed_when: false
      when: container_runtime_overlayfs_policy_exception_enabled | default(true) | bool

    - name: Check managed OverlayFS exception active state
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - platform-container-runtime-overlayfs-exception.service
      register: container_runtime_kernel_smoke_unit_active
      changed_when: false
      when: container_runtime_overlayfs_policy_exception_enabled | default(true) | bool

    - name: Assert managed OverlayFS exception state
      ansible.builtin.assert:
        that:
          - container_runtime_kernel_smoke_unit.stat.isreg | default(false)
          - container_runtime_kernel_smoke_unit.stat.pw_name == 'root'
          - container_runtime_kernel_smoke_unit.stat.gr_name == 'root'
          - container_runtime_kernel_smoke_unit.stat.mode == '0644'
          - (container_runtime_kernel_smoke_unit_data.content | b64decode) == container_runtime_kernel_smoke_unit_content
          - container_runtime_kernel_smoke_unit_enabled.stdout == 'enabled'
          - container_runtime_kernel_smoke_unit_active.stdout == 'active'
        fail_msg: "Managed OverlayFS policy exception state is invalid."
      when: container_runtime_overlayfs_policy_exception_enabled | default(true) | bool

    - name: Assert managed OverlayFS exception is absent when disabled
      ansible.builtin.assert:
        that:
          - not (container_runtime_kernel_smoke_unit.stat.exists | default(false))
        fail_msg: "Managed OverlayFS policy exception remains while disabled."
      when: not (container_runtime_overlayfs_policy_exception_enabled | default(true) | bool)

    - name: Inspect normal OverlayFS policy when exception is disabled
      ansible.builtin.command:
        argv:
          - /usr/sbin/modprobe
          - --showconfig
      register: container_runtime_kernel_smoke_modprobe_config
      changed_when: false
      when: not (container_runtime_overlayfs_policy_exception_enabled | default(true) | bool)

    - name: Assert normal OverlayFS policy is unrestricted
      ansible.builtin.assert:
        that:
          - >-
            (container_runtime_kernel_smoke_modprobe_config.stdout
            | regex_search('(?m)^install[ \t]+overlay(?:[ \t]|$)')) is none
          - >-
            (container_runtime_kernel_smoke_modprobe_config.stdout
            | regex_search('(?m)^blacklist[ \t]+overlay(?:[ \t]|$)')) is none
        fail_msg: "Normal OverlayFS policy is restricted while the managed exception is disabled."
      when: not (container_runtime_overlayfs_policy_exception_enabled | default(true) | bool)

    - name: Check Podman version
      ansible.builtin.command:
        argv:
          - podman
          - --version
      register: podman_host_smoke_version
      changed_when: false

    - name: Query installed Podman package identity
      ansible.builtin.command:
        argv:
          - rpm
          - -q
          - --qf
          - "%{NAME}-%{EPOCHNUM}:%{VERSION}-%{RELEASE}.%{ARCH}"
          - "{{ podman_host_package_name | default('podman') }}"
      register: podman_host_smoke_installed_nevra
      changed_when: false

    - name: Require exact installed Podman package identity
      ansible.builtin.assert:
        that:
          - podman_host_package_nevra | default('') | length > 0
          - podman_host_smoke_installed_nevra.stdout == podman_host_package_nevra
        fail_msg: Installed Podman does not match the exact inventory NEVRA.

    - name: Query effective Podman versionlocks
      ansible.builtin.command:
        argv:
          - dnf
          - -q
          - versionlock
          - list
      register: podman_host_smoke_versionlocks
      changed_when: false

    - name: Require one exact effective Podman versionlock
      ansible.builtin.assert:
        that:
          - >-
            podman_host_smoke_versionlocks.stdout_lines
            | select('match', '^!?podman(?:-|$)')
            | list | length == 1
          - podman_host_package_nevra in podman_host_smoke_versionlocks.stdout_lines
        fail_msg: Podman does not have the exact inventory versionlock.

    - name: Check system Quadlet directory
      ansible.builtin.stat:
        path: "{{ podman_host_quadlet_dir | default('/etc/containers/systemd') }}"
      register: podman_host_smoke_quadlet_dir

    - name: Assert system Quadlet directory exists
      ansible.builtin.assert:
        that:
          - podman_host_smoke_quadlet_dir.stat.isdir | default(false)
        fail_msg: "System Quadlet directory is missing."

    - name: Check Podman Quadlet generator candidates
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ podman_host_quadlet_generator_candidates }}"
      register: podman_host_smoke_quadlet_generators

    - name: Assert Podman Quadlet generator is available
      ansible.builtin.assert:
        that:
          - >-
            podman_host_smoke_quadlet_generators.results
            | selectattr('stat.exists')
            | list
            | length > 0
        fail_msg: "No known Podman Quadlet generator path exists."

    - name: Check Podman socket enabled state
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - "{{ podman_host_socket_name | default('podman.socket') }}"
      register: podman_host_smoke_socket_enabled
      changed_when: false
      failed_when: podman_host_smoke_socket_enabled.rc not in [0, 1]
      when: podman_host_socket_manage | default(true) | bool

    - name: Check Podman socket active state
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - "{{ podman_host_socket_name | default('podman.socket') }}"
      register: podman_host_smoke_socket_active
      changed_when: false
      failed_when: podman_host_smoke_socket_active.rc not in [0, 3]
      when: podman_host_socket_manage | default(true) | bool

    - name: Assert Podman socket state matches inventory
      ansible.builtin.assert:
        that:
          - >-
            (
              podman_host_socket_enabled | default(false) | bool
              and podman_host_smoke_socket_enabled.stdout == 'enabled'
              and podman_host_smoke_socket_active.stdout == 'active'
            )
            or
            (
              not (podman_host_socket_enabled | default(false) | bool)
              and podman_host_smoke_socket_enabled.stdout in podman_host_socket_non_enabled_states
              and podman_host_smoke_socket_active.stdout == 'inactive'
            )
        fail_msg: "Podman socket state does not match inventory."
      when: podman_host_socket_manage | default(true) | bool
