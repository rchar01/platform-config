---
- name: Converge restricted registry PKI exchange access
  hosts: registry
  gather_facts: false
  become: true
  tasks:
    - name: Require one exact registry target for exchange access enablement
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all == [inventory_hostname]
          - groups.get('registry', []) | select('equalto', inventory_hostname) | list | length == 1
        fail_msg: Exchange access enablement requires one exact registry target.

    - name: Require owned host-local PKI exchange operation lease
      ansible.builtin.include_role:
        name: pki_host_local_exchange_access
        tasks_from: require_lease

    - name: Install host-local PKI lifecycle helper for enabled exchange access
      ansible.builtin.include_role:
        name: pki_host_local_certificate
        tasks_from: lifecycle_helper

    - name: Install host-local PKI exchange endpoint for enabled access
      ansible.builtin.include_role:
        name: pki_host_local_certificate
        tasks_from: exchange_helper

    - name: Run fixed enabled host-local PKI exchange access boundary
      ansible.builtin.include_role:
        name: pki_host_local_exchange_access
        tasks_from: enable_access
