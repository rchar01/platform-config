---
- name: Publish one fresh target-local client certificate request
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Require one literal client request host in apply mode
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all == [inventory_hostname]
          - ansible_limit | default('') == inventory_hostname
          - not ansible_check_mode
        fail_msg: Initial client requests require apply mode and an explicit limit naming one inventory host.

    - name: Publish through the existing issue-only client exchange
      ansible.builtin.include_role:
        name: pki_host_local_certificate
        tasks_from: client_request_publish
