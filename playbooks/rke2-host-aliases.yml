---
- name: Prepare RKE2 host aliases only
  hosts: rke2_cluster
  become: true
  gather_facts: false
  strategy: linear
  any_errors_fatal: true
  pre_tasks:
    - name: Require the complete coherent RKE2 alias scope
      ansible.builtin.import_tasks: tasks/rke2-host-aliases-scope.yml

    - name: Check aliases on every node before any write
      ansible.builtin.import_role:
        name: common
        tasks_from: host_aliases_preflight
  tasks:
    - name: Apply only the common host alias tasks
      ansible.builtin.import_role:
        name: common
        tasks_from: host_aliases
