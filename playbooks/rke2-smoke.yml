---
- name: Smoke test RKE2 node services
  hosts: rke2_cluster
  become: true
  gather_facts: false
  tasks:
    - name: Check RKE2 service active state
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - "{{ rke2_service_name | default('rke2-server.service' if inventory_hostname in groups.get('rke2_servers', []) else 'rke2-agent.service') }}"
      register: rke2_smoke_service_active
      changed_when: false

    - name: Assert RKE2 service is active
      ansible.builtin.assert:
        that:
          - rke2_smoke_service_active.stdout == 'active'
        fail_msg: "RKE2 service is not active."

- name: Smoke test RKE2 cluster from bootstrap server
  hosts: rke2_servers
  become: true
  gather_facts: false
  vars:
    rke2_smoke_is_bootstrap: "{{ inventory_hostname == groups['rke2_servers'][0] }}"
    rke2_smoke_expected_nodes: "{{ groups.get('rke2_cluster', []) | length }}"
    rke2_smoke_kubectl: /var/lib/rancher/rke2/bin/kubectl
    rke2_smoke_kubeconfig: /etc/rancher/rke2/rke2.yaml
  tasks:
    - name: Wait for all RKE2 nodes to become Ready
      ansible.builtin.command:
        argv:
          - "{{ rke2_smoke_kubectl }}"
          - --kubeconfig
          - "{{ rke2_smoke_kubeconfig }}"
          - wait
          - --for=condition=Ready
          - nodes
          - --all
          - --timeout=600s
      changed_when: false
      when: rke2_smoke_is_bootstrap | bool

    - name: List RKE2 nodes
      ansible.builtin.command:
        argv:
          - "{{ rke2_smoke_kubectl }}"
          - --kubeconfig
          - "{{ rke2_smoke_kubeconfig }}"
          - get
          - nodes
          - --no-headers
      register: rke2_smoke_nodes
      changed_when: false
      when: rke2_smoke_is_bootstrap | bool

    - name: Assert expected RKE2 node count
      ansible.builtin.assert:
        that:
          - rke2_smoke_nodes.stdout_lines | length == rke2_smoke_expected_nodes | int
        fail_msg: "Unexpected RKE2 node count."
      when: rke2_smoke_is_bootstrap | bool

    - name: Confirm default RKE2 ingress is disabled
      ansible.builtin.command:
        argv:
          - "{{ rke2_smoke_kubectl }}"
          - --kubeconfig
          - "{{ rke2_smoke_kubeconfig }}"
          - -n
          - kube-system
          - get
          - helmchart
          - rke2-ingress-nginx
      register: rke2_smoke_ingress_nginx
      changed_when: false
      failed_when: rke2_smoke_ingress_nginx.rc not in [0, 1]
      when: rke2_smoke_is_bootstrap | bool

    - name: Assert default RKE2 ingress is absent
      ansible.builtin.assert:
        that:
          - rke2_smoke_ingress_nginx.rc == 1
        fail_msg: "Default RKE2 ingress-nginx HelmChart exists but should be disabled."
      when: rke2_smoke_is_bootstrap | bool
