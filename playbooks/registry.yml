---
- name: Configure OCI registry hosts
  hosts: registry
  become: true
  pre_tasks:
    - name: Revoke host-local PKI exchange access before service convergence
      ansible.builtin.include_role:
        name: pki_host_local_exchange_access
        tasks_from: revoke
  roles:
    - firewalld
    - podman_host
    - zot_registry

- name: Configure OCI registry client hosts
  hosts: registry_clients
  become: true
  roles:
    - registry_client_tools
