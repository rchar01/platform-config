---
- name: Block unavailable OpenBao HA status checks
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Stop before an obsolete or empty status result
      ansible.builtin.fail:
        msg: "Strict OpenBao HA status checks are not implemented."

- name: Block obsolete OpenBao status checks
  hosts: openbao
  gather_facts: false
  tasks:
    - name: Stop until strict HA status checks are available
      ansible.builtin.fail:
        msg: >-
          Strict OpenBao HA status checks are not implemented. The previous check
          accepted sealed, standby, and uninitialized nodes and disabled
          certificate validation by default.

- name: Reject status checks limited away from OpenBao
  hosts: all
  gather_facts: false
  tasks:
    - name: Stop before a limited status run can report false success
      ansible.builtin.fail:
        msg: >-
          Strict OpenBao HA status checks are not implemented. A limit that
          excludes the replacement service group is not a valid status result.
      when: inventory_hostname not in groups.get('openbao', [])
