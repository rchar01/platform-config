---
- name: Approve and activate the exact staged OpenBao VIP
  hosts: openbao
  become: true
  gather_facts: false
  strategy: linear
  any_errors_fatal: true
  tasks:
    - name: Qualify exact OpenBao Keepalived activation candidates
      ansible.builtin.include_tasks: tasks/openbao-keepalived-preflight.yml

    - name: Prepare and approve the OpenBao Keepalived activation plan
      ansible.builtin.include_tasks: tasks/openbao-edge-prepare.yml
      vars:
        openbao_edge_operation: keepalived
        openbao_edge_evidence: "{{ openbao_keepalived_activation_evidence }}"

    - name: Acquire all OpenBao edge guards before final preflight
      ansible.builtin.include_tasks: tasks/openbao-edge-acquire.yml

    - name: Requalify exact OpenBao Keepalived activation candidates
      ansible.builtin.include_tasks: tasks/openbao-keepalived-preflight.yml

    - name: Verify the same OpenBao Keepalived activation plan before mutation
      openbao_activation_plan:
        action: verify
        operation: keepalived
        mode: "{{ openbao_activation_mode | default('interactive') }}"
        path: "{{ openbao_activation_plan_path | default('') }}"
        evidence: "{{ openbao_keepalived_activation_evidence }}"
        plan: "{{ openbao_edge_prepared.plan }}"
      run_once: true # noqa run-once[task]
      no_log: true

    - name: Preserve the exact approved OpenBao Keepalived activation
      ansible.builtin.set_fact:
        openbao_keepalived_approved_evidence: "{{ openbao_edge_prepared.plan.evidence }}"
        openbao_keepalived_preferred_host: >-
          {{ (openbao_keepalived_vip_evidence | sort(attribute='instances.0.priority') | last).inventory_host }}
      run_once: true # noqa run-once[task]
      no_log: true

    - name: Initialize all OpenBao Keepalived transaction results
      ansible.builtin.set_fact:
        openbao_keepalived_started: false
        openbao_keepalived_qualified: false
        keepalived_vip_activation_rollback_confirmed: false

    - name: Activate and qualify OpenBao Keepalived with cluster-wide recovery
      any_errors_fatal: false
      ignore_unreachable: true
      block:
        - name: Activate backup-priority OpenBao Keepalived members first
          when: inventory_hostname != openbao_keepalived_preferred_host
          block:
            - name: Start only the approved backup Keepalived service
              ansible.builtin.systemd_service:
                name: "{{ keepalived_vip_service_name | default('keepalived.service') }}"
                enabled: true
                state: started
              register: openbao_keepalived_backup_start
              ignore_unreachable: true

            - name: Require reachable backup Keepalived activation
              ansible.builtin.assert:
                that:
                  - not openbao_keepalived_backup_start.unreachable | default(false)
                  - openbao_keepalived_backup_start is succeeded

            - name: Record successful backup Keepalived activation
              ansible.builtin.set_fact:
                openbao_keepalived_started: true
          rescue:
            - name: Record failed backup Keepalived activation
              ansible.builtin.set_fact:
                openbao_keepalived_started: false

        - name: Activate the preferred OpenBao Keepalived member after both backups
          when:
            - inventory_hostname == openbao_keepalived_preferred_host
            - >-
              groups['openbao'] | reject('equalto', openbao_keepalived_preferred_host)
              | map('extract', hostvars, 'openbao_keepalived_started') | select('equalto', true) | length == 2
          block:
            - name: Start only the approved preferred Keepalived service
              ansible.builtin.systemd_service:
                name: "{{ keepalived_vip_service_name | default('keepalived.service') }}"
                enabled: true
                state: started
              register: openbao_keepalived_preferred_start
              ignore_unreachable: true

            - name: Require reachable preferred Keepalived activation
              ansible.builtin.assert:
                that:
                  - not openbao_keepalived_preferred_start.unreachable | default(false)
                  - openbao_keepalived_preferred_start is succeeded

            - name: Record successful preferred Keepalived activation
              ansible.builtin.set_fact:
                openbao_keepalived_started: true
          rescue:
            - name: Record failed preferred Keepalived activation
              ansible.builtin.set_fact:
                openbao_keepalived_started: false

        - name: Qualify the activated OpenBao VIP on all three hosts
          when: >-
            groups['openbao'] | map('extract', hostvars, 'openbao_keepalived_started')
            | select('equalto', true) | length == 3
          block:
            - name: Allow the initial hard-fault script and VRRP election to settle
              ansible.builtin.pause:
                seconds: >-
                  {{ 4 * (keepalived_vip_advert_interval | default(1) | int)
                     + ((keepalived_vip_script_rise | default(2) | int) + 1)
                     * (keepalived_vip_script_interval | default(1) | int) + 2 }}

            # Keep all hosts scheduled; the helper rejects unreachable probe results.
            - name: Require stable unique VIP ownership and strict service-DNS TLS
              ansible.builtin.include_tasks:
                file: ../tasks/openbao-vip-status.yml
                apply:
                  ignore_unreachable: true

            - name: Requalify strict direct OpenBao state after VIP activation
              ansible.builtin.include_role:
                name: openbao_status

            - name: Require unchanged runtime OpenBao cluster after VIP activation
              ansible.builtin.assert:
                that:
                  - >-
                    openbao_status_health_results.results | map(attribute='json.cluster_id') | unique | list
                    == [openbao_keepalived_approved_evidence.cluster[0].cluster_id]

            - name: Record fully qualified OpenBao VIP activation
              ansible.builtin.set_fact:
                openbao_keepalived_qualified: true
          rescue:
            - name: Record failed OpenBao VIP qualification
              ansible.builtin.set_fact:
                openbao_keepalived_qualified: false

    - name: Clear host errors before the independent all-host recovery play
      ansible.builtin.meta: clear_host_errors

- name: Recover or confirm OpenBao Keepalived activation on every selected host
  hosts: openbao
  become: true
  gather_facts: false
  strategy: linear
  any_errors_fatal: false
  tasks:
    - name: End OpenBao Keepalived recovery in plan mode
      ansible.builtin.meta: end_play
      when: openbao_activation_mode | default('interactive') == 'plan'

    - name: Roll back every reachable Keepalived service after any failure
      when: >-
        groups['openbao'] | map('extract', hostvars, 'openbao_keepalived_qualified')
        | select('equalto', true) | length != 3
      block:
        - name: Stop and disable Keepalived with verified VIP withdrawal
          ansible.builtin.include_role:
            name: keepalived_vip
            tasks_from: activation_rollback.yml
            apply:
              ignore_unreachable: true
      rescue:
        - name: Preserve an unverified OpenBao Keepalived rollback
          ansible.builtin.set_fact:
            keepalived_vip_activation_rollback_confirmed: false

    - name: Initialize unverified OpenBao Keepalived rollback report
      ansible.builtin.set_fact:
        openbao_keepalived_unverified_hosts: []
      run_once: true # noqa run-once[task]

    - name: Collect every unverified OpenBao Keepalived rollback
      ansible.builtin.set_fact:
        openbao_keepalived_unverified_hosts: "{{ openbao_keepalived_unverified_hosts + [item] }}"
      loop: "{{ groups['openbao'] | sort }}"
      when:
        - >-
          groups['openbao'] | map('extract', hostvars, 'openbao_keepalived_qualified')
          | select('equalto', true) | length != 3
        - not hostvars[item].keepalived_vip_activation_rollback_confirmed | default(false)
      run_once: true # noqa run-once[task]

    - name: Release only verified OpenBao edge guards
      ansible.builtin.include_tasks: tasks/openbao-edge-release.yml
      when: >-
        (groups['openbao'] | map('extract', hostvars, 'openbao_keepalived_qualified')
         | select('equalto', true) | length == 3)
        or keepalived_vip_activation_rollback_confirmed | default(false)

    - name: Require fully qualified OpenBao Keepalived activation
      ansible.builtin.assert:
        that:
          - >-
            groups['openbao'] | map('extract', hostvars, 'openbao_keepalived_qualified')
            | select('equalto', true) | length == 3
        fail_msg: >-
          OpenBao Keepalived activation or postqualification failed.
          Unverified rollback hosts: {{ openbao_keepalived_unverified_hosts
          | join(', ') | default('none', true) }}. OpenBao and HAProxy were not mutated.
      run_once: true # noqa run-once[task]
