---
- name: Require exact explicit OpenBao HAProxy activation selection
  ansible.builtin.assert:
    that:
      - groups.get('openbao', []) | length == 3
      - ansible_limit is defined
      - ansible_limit | default('') | length > 0
      - >-
        query('ansible.builtin.inventory_hostnames', ansible_limit) | sort
        == groups.get('openbao', []) | sort
      - ansible_play_hosts_all | sort == groups.get('openbao', []) | sort
      - not ansible_check_mode
      - openbao_activation_mode | default('interactive') in ['plan', 'interactive', 'ci']
      - openbao_haproxy_activation_ready | default(false) is boolean
      - openbao_activation_mode | default('interactive') == 'plan' or openbao_haproxy_activation_ready | default(false)
      - openbao_haproxy_service_enabled | default(false) is boolean
      - not openbao_haproxy_service_enabled | default(false)
      - openbao_haproxy_service_state | default('stopped') == 'stopped'
      - keepalived_vip_service_enabled | default(false) is boolean
      - not keepalived_vip_service_enabled | default(false)
      - keepalived_vip_service_state | default('stopped') == 'stopped'
    fail_msg: >-
      OpenBao HAProxy activation requires explicit boolean readiness, normal apply,
      exactly all three hosts, and desired disabled/stopped HAProxy and Keepalived.

- name: Gather current OpenBao activation host facts
  ansible.builtin.setup:

- name: Inspect exact active OpenBao lifecycle
  ansible.builtin.include_role:
    name: openbao
    tasks_from: active_preflight.yml

- name: Inspect exact staged OpenBao HAProxy activation
  ansible.builtin.include_role:
    name: openbao_haproxy
    tasks_from: activation_preflight.yml

- name: Inspect current OpenBao edge services
  ansible.builtin.service_facts:

# service_facts retains raw ActiveState for systemd units absent from list-units.
- name: Require actual inactive OpenBao edge services
  ansible.builtin.assert:
    that:
      - >-
        ansible_facts.services.get(keepalived_vip_service_name | default('keepalived.service'), {}).get('state', '')
        in ['stopped', 'inactive']
      - >-
        ansible_facts.services.get(keepalived_vip_service_name | default('keepalived.service'), {}).get('status', '')
        == 'disabled'
      - >-
        ansible_facts.services.get(openbao_haproxy_service_name | default('haproxy.service'), {}).get('state', '')
        in ['stopped', 'inactive']
      - >-
        ansible_facts.services.get(openbao_haproxy_service_name | default('haproxy.service'), {}).get('status', '')
        == 'disabled'
    fail_msg: >-
      OpenBao HAProxy activation requires actual inactive and boot-disabled edge services.
      Expected edge state stopped/inactive and status disabled.
      Observed Keepalived state={{
      ansible_facts.services.get(keepalived_vip_service_name | default('keepalived.service'), {}).get('state', 'missing')
      }} status={{
      ansible_facts.services.get(keepalived_vip_service_name | default('keepalived.service'), {}).get('status', 'missing')
      }}; HAProxy state={{
      ansible_facts.services.get(openbao_haproxy_service_name | default('haproxy.service'), {}).get('state', 'missing')
      }} status={{
      ansible_facts.services.get(openbao_haproxy_service_name | default('haproxy.service'), {}).get('status', 'missing')
      }}. Firewall lifecycle and policy are verified by the preceding role preflight.

- name: Collect sorted OpenBao HAProxy activation evidence
  ansible.builtin.set_fact:
    openbao_haproxy_activation_observations: >-
      {{ groups['openbao'] | map('extract', hostvars, 'openbao_active_observation')
         | sort(attribute='inventory_host') | list }}
    openbao_haproxy_activation_edge_observations: >-
      {{ groups['openbao'] | map('extract', hostvars, 'openbao_haproxy_activation_observation')
         | sort(attribute='inventory_host') | list }}
  run_once: true # noqa run-once[task]
  no_log: true

- name: Require one exact active OpenBao cluster
  ansible.builtin.assert:
    that:
      - openbao_haproxy_activation_observations | map(attribute='inventory_host') | list == groups['openbao'] | sort
      - openbao_haproxy_activation_edge_observations | map(attribute='inventory_host') | list == groups['openbao'] | sort
      - openbao_haproxy_activation_observations | map(attribute='cluster_id') | unique | length == 1
      - openbao_haproxy_activation_observations | map(attribute='cluster_signature') | unique | length == 1
      - openbao_haproxy_activation_observations | map(attribute='node_id') | unique | length == 3
    fail_msg: OpenBao HAProxy activation requires one exact active cluster.
  run_once: true # noqa run-once[task]

- name: Require strict OpenBao state before HAProxy activation
  ansible.builtin.include_role:
    name: openbao_status
  run_once: true # noqa run-once[task]

- name: Require marker and runtime OpenBao cluster identity match
  ansible.builtin.assert:
    that:
      - >-
        openbao_status_health_results.results | map(attribute='json.cluster_id') | unique | list
        == [openbao_haproxy_activation_observations[0].cluster_id]
    fail_msg: OpenBao runtime cluster identity does not match activation markers.
  run_once: true # noqa run-once[task]

- name: Build exact OpenBao HAProxy approval evidence
  ansible.builtin.set_fact:
    openbao_haproxy_activation_evidence:
      cluster: "{{ openbao_haproxy_activation_observations }}"
      edge: "{{ openbao_haproxy_activation_edge_observations }}"
  run_once: true # noqa run-once[task]
  no_log: true
