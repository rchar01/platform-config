---
- name: Preflight pristine OpenBao bootstrap
  hosts: openbao
  become: true
  gather_facts: true
  any_errors_fatal: true
  tasks:
    - name: Require exact explicit OpenBao bootstrap selection
      ansible.builtin.assert:
        that:
          - groups.get('openbao', []) | length == 3
          - ansible_limit is defined
          - ansible_limit | default('') | length > 0
          - >-
            query('ansible.builtin.inventory_hostnames', ansible_limit) | list | sort
            == groups.get('openbao', []) | list | sort
        fail_msg: >-
          OpenBao bootstrap requires an explicit limit selecting exactly all
          three OpenBao hosts and no other inventory hosts.
      run_once: true # noqa run-once[task]

    - name: Inspect local pristine OpenBao bootstrap state
      ansible.builtin.include_role:
        name: openbao
        tasks_from: bootstrap_preflight.yml

    - name: Collect pristine OpenBao bootstrap observations
      ansible.builtin.set_fact:
        openbao_bootstrap_observations: >-
          {{
            ansible_play_hosts_all
            | map('extract', hostvars, 'openbao_bootstrap_observation')
            | sort(attribute='inventory_host')
            | list
          }}
      run_once: true # noqa run-once[task]

    - name: Require complete pristine OpenBao bootstrap observations
      ansible.builtin.assert:
        that:
          - openbao_bootstrap_observations | length == 3
          - >-
            openbao_bootstrap_observations | map(attribute='inventory_host') | list | sort
            == groups.get('openbao', []) | list | sort
          - >-
            openbao_bootstrap_observations | map(attribute='node_id') | unique | length == 3
          - >-
            openbao_bootstrap_observations | map(attribute='ca_checksum') | unique | length == 1
          - >-
            openbao_bootstrap_observations | map(attribute='image_digest') | unique | length == 1
        fail_msg: OpenBao bootstrap observations are incomplete or inconsistent.
      run_once: true # noqa run-once[task]

    - name: Derive exact OpenBao bootstrap evidence
      ansible.builtin.set_fact:
        openbao_bootstrap_cluster_signature: >-
          {{ openbao_bootstrap_observations | to_json | hash('sha256') }}
      run_once: true # noqa run-once[task]

    - name: Preserve validated OpenBao bootstrap observations
      ansible.builtin.set_fact:
        openbao_bootstrap_validated_observations: "{{ openbao_bootstrap_observations }}"
        openbao_bootstrap_validated_signature: "{{ openbao_bootstrap_cluster_signature }}"
      run_once: true # noqa run-once[task]
      delegate_to: localhost
      delegate_facts: true

- name: Revalidate OpenBao immediately before bootstrap start
  hosts: openbao
  become: true
  gather_facts: true
  any_errors_fatal: true
  tasks:
    - name: Reinspect pristine OpenBao bootstrap state
      ansible.builtin.include_role:
        name: openbao
        tasks_from: bootstrap_preflight.yml

    - name: Require unchanged validated OpenBao bootstrap observations
      ansible.builtin.assert:
        that:
          - >-
            ansible_play_hosts_all
            | map('extract', hostvars, 'openbao_bootstrap_observation')
            | sort(attribute='inventory_host')
            | list
            == hostvars['localhost'].openbao_bootstrap_validated_observations
        fail_msg: OpenBao bootstrap evidence changed after initial validation.
      run_once: true # noqa run-once[task]

- name: Start every pristine OpenBao bootstrap member
  hosts: openbao
  become: true
  gather_facts: false
  any_errors_fatal: false
  tasks:
    - name: Reset local OpenBao bootstrap start result
      ansible.builtin.set_fact:
        openbao_bootstrap_local_start_complete: false

    - name: Start local pristine OpenBao bootstrap member
      block:
        - name: Start local OpenBao bootstrap service
          ansible.builtin.include_role:
            name: openbao
            tasks_from: bootstrap_start.yml
      rescue:
        - name: Record failed local OpenBao bootstrap start
          ansible.builtin.set_fact:
            openbao_bootstrap_local_start_complete: false
            openbao_bootstrap_local_start_failure:
              task: "{{ ansible_failed_task.name | default('unknown task') }}"
              message: >-
                {{ ansible_failed_result.msg | default('No failure message was returned.') }}

    - name: Reactivate unreachable OpenBao bootstrap members for rollback
      ansible.builtin.meta: clear_host_errors

    - name: Initialize failed OpenBao bootstrap results
      ansible.builtin.set_fact:
        openbao_bootstrap_failures: []
      run_once: true # noqa run-once[task]
      delegate_to: localhost
      delegate_facts: true

    - name: Collect failed OpenBao bootstrap results
      ansible.builtin.set_fact:
        openbao_bootstrap_failures: >-
          {{
            hostvars['localhost'].openbao_bootstrap_failures
            + [
              {
                'host': item,
                'task': (
                  hostvars[item].openbao_bootstrap_local_start_failure
                  | default({})
                ).get('task', 'unreachable host'),
                'message': (
                  hostvars[item].openbao_bootstrap_local_start_failure
                  | default({})
                ).get('message', 'The host returned no failure details.')
              }
            ]
          }}
      loop: "{{ groups.get('openbao', []) }}"
      when: not hostvars[item].openbao_bootstrap_local_start_complete | default(false) | bool
      run_once: true # noqa run-once[task]
      delegate_to: localhost
      delegate_facts: true

    - name: Roll back reachable pristine OpenBao bootstrap members
      ansible.builtin.include_role:
        name: openbao
        tasks_from: bootstrap_rollback.yml
      when: hostvars['localhost'].openbao_bootstrap_failures | length > 0

    - name: Require every pristine OpenBao bootstrap member started
      ansible.builtin.assert:
        that:
          - hostvars['localhost'].openbao_bootstrap_failures | length == 0
        fail_msg: >-
          OpenBao bootstrap failed before initialization. Reachable members were
          returned to stopped staging. Failures: {{
            hostvars['localhost'].openbao_bootstrap_failures | to_json
          }}
      run_once: true # noqa run-once[task]

- name: Publish pending manual-custody markers
  hosts: openbao
  become: true
  gather_facts: false
  any_errors_fatal: false
  tasks:
    - name: Reset local OpenBao marker publication result
      ansible.builtin.set_fact:
        openbao_bootstrap_local_publish_complete: false

    - name: Publish local pending OpenBao bootstrap state
      block:
        - name: Write local pending OpenBao bootstrap marker
          ansible.builtin.include_role:
            name: openbao
            tasks_from: bootstrap_publish_pending.yml

        - name: Record completed local OpenBao marker publication
          ansible.builtin.set_fact:
            openbao_bootstrap_local_publish_complete: true
      rescue:
        - name: Record failed local OpenBao marker publication
          ansible.builtin.set_fact:
            openbao_bootstrap_local_publish_complete: false
            openbao_bootstrap_local_publish_failure:
              task: "{{ ansible_failed_task.name | default('unknown task') }}"
              message: >-
                {{ ansible_failed_result.msg | default('No failure message was returned.') }}

    - name: Reactivate unreachable OpenBao marker publication members
      ansible.builtin.meta: clear_host_errors

    - name: Initialize failed OpenBao marker publication results
      ansible.builtin.set_fact:
        openbao_bootstrap_publish_failures: []
      run_once: true # noqa run-once[task]
      delegate_to: localhost
      delegate_facts: true

    - name: Collect failed OpenBao marker publication results
      ansible.builtin.set_fact:
        openbao_bootstrap_publish_failures: >-
          {{
            hostvars['localhost'].openbao_bootstrap_publish_failures
            + [
              {
                'host': item,
                'task': (
                  hostvars[item].openbao_bootstrap_local_publish_failure
                  | default({})
                ).get('task', 'unreachable host'),
                'message': (
                  hostvars[item].openbao_bootstrap_local_publish_failure
                  | default({})
                ).get('message', 'The host returned no failure details.')
              }
            ]
          }}
      loop: "{{ groups.get('openbao', []) }}"
      when: not hostvars[item].openbao_bootstrap_local_publish_complete | default(false) | bool
      run_once: true # noqa run-once[task]
      delegate_to: localhost
      delegate_facts: true

    - name: Reset local OpenBao marker recovery results
      ansible.builtin.set_fact:
        openbao_bootstrap_local_publish_rollback_complete: false
        openbao_bootstrap_local_publish_cleanup_complete: false
      when: hostvars['localhost'].openbao_bootstrap_publish_failures | length > 0

    - name: Roll back local OpenBao member after marker publication failure
      when: hostvars['localhost'].openbao_bootstrap_publish_failures | length > 0
      block:
        - name: Stop and remask local OpenBao member
          ansible.builtin.include_role:
            name: openbao
            tasks_from: bootstrap_rollback.yml

        - name: Record completed local OpenBao publication rollback
          ansible.builtin.set_fact:
            openbao_bootstrap_local_publish_rollback_complete: true
      rescue:
        - name: Record failed local OpenBao publication rollback
          ansible.builtin.set_fact:
            openbao_bootstrap_local_publish_rollback_complete: false
            openbao_bootstrap_local_publish_rollback_failure:
              task: "{{ ansible_failed_task.name | default('unknown task') }}"
              message: >-
                {{ ansible_failed_result.msg | default('No failure message was returned.') }}

    - name: Reactivate unreachable OpenBao publication rollback members
      ansible.builtin.meta: clear_host_errors

    - name: Remove local partial pending OpenBao bootstrap marker
      when: hostvars['localhost'].openbao_bootstrap_publish_failures | length > 0
      block:
        - name: Remove local pending OpenBao bootstrap marker
          ansible.builtin.include_role:
            name: openbao
            tasks_from: bootstrap_remove_pending.yml

        - name: Record completed local OpenBao marker cleanup
          ansible.builtin.set_fact:
            openbao_bootstrap_local_publish_cleanup_complete: true
      rescue:
        - name: Record failed local OpenBao marker cleanup
          ansible.builtin.set_fact:
            openbao_bootstrap_local_publish_cleanup_complete: false
            openbao_bootstrap_local_publish_cleanup_failure:
              task: "{{ ansible_failed_task.name | default('unknown task') }}"
              message: >-
                {{ ansible_failed_result.msg | default('No failure message was returned.') }}

    - name: Reactivate unreachable OpenBao marker cleanup members
      ansible.builtin.meta: clear_host_errors

    - name: Initialize failed OpenBao marker recovery results
      ansible.builtin.set_fact:
        openbao_bootstrap_publish_recovery_failures: []
      run_once: true # noqa run-once[task]
      delegate_to: localhost
      delegate_facts: true

    - name: Collect failed OpenBao publication rollback results
      ansible.builtin.set_fact:
        openbao_bootstrap_publish_recovery_failures: >-
          {{
            hostvars['localhost'].openbao_bootstrap_publish_recovery_failures
            + [
              {
                'host': item,
                'phase': 'service rollback',
                'task': (
                  hostvars[item].openbao_bootstrap_local_publish_rollback_failure
                  | default({})
                ).get('task', 'unreachable host'),
                'message': (
                  hostvars[item].openbao_bootstrap_local_publish_rollback_failure
                  | default({})
                ).get('message', 'The host returned no failure details.')
              }
            ]
          }}
      loop: "{{ groups.get('openbao', []) }}"
      when:
        - hostvars['localhost'].openbao_bootstrap_publish_failures | length > 0
        - >-
          not hostvars[item].openbao_bootstrap_local_publish_rollback_complete
          | default(false)
          | bool
      run_once: true # noqa run-once[task]
      delegate_to: localhost
      delegate_facts: true

    - name: Collect failed OpenBao marker cleanup results
      ansible.builtin.set_fact:
        openbao_bootstrap_publish_recovery_failures: >-
          {{
            hostvars['localhost'].openbao_bootstrap_publish_recovery_failures
            + [
              {
                'host': item,
                'phase': 'marker cleanup',
                'task': (
                  hostvars[item].openbao_bootstrap_local_publish_cleanup_failure
                  | default({})
                ).get('task', 'unreachable host'),
                'message': (
                  hostvars[item].openbao_bootstrap_local_publish_cleanup_failure
                  | default({})
                ).get('message', 'The host returned no failure details.')
              }
            ]
          }}
      loop: "{{ groups.get('openbao', []) }}"
      when:
        - hostvars['localhost'].openbao_bootstrap_publish_failures | length > 0
        - >-
          not hostvars[item].openbao_bootstrap_local_publish_cleanup_complete
          | default(false)
          | bool
      run_once: true # noqa run-once[task]
      delegate_to: localhost
      delegate_facts: true

    - name: Require every pending OpenBao bootstrap marker published
      ansible.builtin.assert:
        that:
          - hostvars['localhost'].openbao_bootstrap_publish_failures | length == 0
        fail_msg: >-
          OpenBao pending-marker publication failed. Service rollback and marker
          cleanup were attempted independently on every reachable member.
          Publication failures: {{
            hostvars['localhost'].openbao_bootstrap_publish_failures | to_json
          }}. Recovery failures: {{
            hostvars['localhost'].openbao_bootstrap_publish_recovery_failures | to_json
          }}.
      run_once: true # noqa run-once[task]

    - name: Report manual OpenBao custody checkpoint
      ansible.builtin.debug:
        msg: >-
          Direct OpenBao processes are running without boot enablement. Two
          approved custodians must now initialize exactly one node with five
          shares and threshold three, store all custody material outside Ansible,
          unseal all three nodes, verify file-audit-1 and file-audit-2, create the
          least-privilege status token, and retain the initial root token in
          approved custody until named administrator authentication is verified.
          Then run openbao-bootstrap-complete.yml.
      run_once: true # noqa run-once[task]
