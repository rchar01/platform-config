---
- name: Verify mounted storage after single-node apply
  hosts: storage_volume_hosts
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Require one storage host in the fixed verification scope
      ansible.builtin.assert:
        that:
          - storage_verify_scope | default('rke2') in ['rke2', 'openbao', 'registry']
          - ansible_play_hosts_all | length == 1
          - storage_volumes | default([]) | length > 0
          - >-
            (storage_verify_scope | default('rke2') == 'rke2'
             and inventory_hostname in groups.get('rke2_cluster', [])
             and ((inventory_hostname in groups.get('rke2_servers', []))
                  != (inventory_hostname in groups.get('rke2_agents', []))))
            or
            (storage_verify_scope | default('rke2') == 'openbao'
             and inventory_hostname in groups.get('openbao_storage', [])
             and (groups.get('openbao_storage', []) | length == 3)
             and (groups.get('openbao_storage', [])
                  | difference(groups.get('storage_volume_hosts', [])) | length == 0)
             and (groups.get('openbao_storage', [])
                  | intersect(groups.get('rocky', []) + groups.get('container_hosts', [])
                    + groups.get('openbao', []) + groups.get('rke2_cluster', [])
                    + groups.get('rke2_servers', []) + groups.get('rke2_agents', []))
                  | length == 0))
            or
            (storage_verify_scope | default('rke2') == 'registry'
             and groups.get('registry', []) == [inventory_hostname]
             and inventory_hostname in groups.get('rocky', [])
             and inventory_hostname in groups.get('container_hosts', [])
             and inventory_hostname not in (groups.get('registry_clients', [])
                 + groups.get('gitlab_runners', []) + groups.get('rke2_cluster', [])
                 + groups.get('rke2_servers', []) + groups.get('rke2_agents', [])
                 + groups.get('openbao', [])))

    - name: Read storage defaults without overriding inventory
      ansible.builtin.include_vars:
        file: ../../roles/storage_volume/defaults/main.yml
        name: storage_verify_defaults

    - name: Verify each declared mounted volume
      ansible.builtin.include_tasks: tasks/storage-volumes-verify-mount.yml
      loop: "{{ storage_volumes }}"
      loop_control:
        loop_var: storage_verify_volume
        label: "{{ storage_verify_volume.mountpoint }}"
      vars:
        storage_verify_layout: >-
          {{ storage_volume_layouts | default([])
             | selectattr('name', 'equalto', storage_verify_volume.layout | default(''))
             | first | default({}) }}
        storage_volume_mountpoint: "{{ storage_verify_volume.mountpoint }}"
        storage_volume_lv_device: >-
          /dev/{{ storage_verify_volume.vg_name | default(storage_verify_layout.vg_name) }}/{{ storage_verify_volume.lv_name }}
        storage_verify_fstype: >-
          {{ storage_verify_volume.fstype | default(storage_volume_default_fstype | default(storage_verify_defaults.storage_volume_default_fstype)) }}
        storage_verify_options: >-
          {{ (storage_verify_volume.mount_options | default(storage_volume_default_mount_options | default(storage_verify_defaults.storage_volume_default_mount_options))).split(',') }}
