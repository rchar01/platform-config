---
- name: Preflight active OpenBao cluster for HAProxy activation
  hosts: openbao
  become: true
  gather_facts: false
  strategy: linear
  any_errors_fatal: true
  tasks:
    - name: Qualify exact OpenBao HAProxy activation candidates
      ansible.builtin.include_tasks: tasks/openbao-haproxy-preflight.yml

    - name: Prepare and approve the OpenBao HAProxy activation plan
      ansible.builtin.include_tasks: tasks/openbao-edge-prepare.yml
      vars:
        openbao_edge_operation: haproxy
        openbao_edge_evidence: "{{ openbao_haproxy_activation_evidence }}"

- name: Revalidate OpenBao immediately before HAProxy activation
  hosts: openbao
  become: true
  gather_facts: false
  strategy: linear
  any_errors_fatal: true
  tasks:
    - name: End OpenBao HAProxy revalidation in plan mode
      ansible.builtin.meta: end_play
      when: openbao_activation_mode | default('interactive') == 'plan'

    - name: Acquire all OpenBao edge guards before final preflight
      ansible.builtin.include_tasks: tasks/openbao-edge-acquire.yml

    - name: Requalify exact OpenBao HAProxy activation candidates
      ansible.builtin.include_tasks: tasks/openbao-haproxy-preflight.yml

    - name: Verify the same OpenBao HAProxy activation plan before mutation
      openbao_activation_plan:
        action: verify
        operation: haproxy
        mode: "{{ openbao_activation_mode | default('interactive') }}"
        path: "{{ openbao_activation_plan_path | default('') }}"
        evidence: "{{ openbao_haproxy_activation_evidence }}"
        plan: "{{ openbao_edge_prepared.plan }}"
      run_once: true # noqa run-once[task]
      no_log: true

- name: Activate OpenBao HAProxy on every cluster node
  hosts: openbao
  become: true
  gather_facts: false
  strategy: linear
  any_errors_fatal: false
  tasks:
    - name: End OpenBao HAProxy activation in plan mode
      ansible.builtin.meta: end_play
      when: openbao_activation_mode | default('interactive') == 'plan'

    - name: Reset local OpenBao HAProxy activation result
      ansible.builtin.set_fact:
        openbao_haproxy_local_activation_complete: false

    - name: Activate local OpenBao HAProxy
      block:
        - name: Enable verified staged local OpenBao HAProxy
          ansible.builtin.include_role:
            name: openbao_haproxy
            tasks_from: activation_enable.yml
          vars:
            openbao_haproxy_service_enabled: true
            openbao_haproxy_service_state: started

        - name: Inspect local OpenBao HAProxy boot enablement
          ansible.builtin.command:
            argv: [systemctl, is-enabled, "{{ openbao_haproxy_service_name | default('haproxy.service') }}"]
          register: openbao_haproxy_activation_enabled
          changed_when: false

        - name: Require local OpenBao HAProxy boot enablement
          ansible.builtin.assert:
            that:
              - openbao_haproxy_activation_enabled.stdout == 'enabled'
            fail_msg: OpenBao HAProxy activation did not persist boot enablement.

        - name: Record completed local OpenBao HAProxy activation
          ansible.builtin.set_fact:
            openbao_haproxy_local_activation_complete: true
      rescue:
        - name: Record failed local OpenBao HAProxy activation
          ansible.builtin.set_fact:
            openbao_haproxy_local_activation_complete: false

    - name: Reactivate unreachable OpenBao HAProxy hosts for rollback
      ansible.builtin.meta: clear_host_errors

    - name: Initialize failed OpenBao HAProxy activation hosts
      ansible.builtin.set_fact:
        openbao_haproxy_failed_hosts: []
      run_once: true # noqa run-once[task]
      delegate_to: localhost
      delegate_facts: true

    - name: Collect failed OpenBao HAProxy activation hosts
      ansible.builtin.set_fact:
        openbao_haproxy_failed_hosts: >-
          {%- set report = namespace(hosts=[]) -%}
          {%- for host in groups.get('openbao', []) -%}
          {%- if not hostvars[host].openbao_haproxy_local_activation_complete | default(false) | bool -%}
          {%- set report.hosts = report.hosts + [host] -%}
          {%- endif -%}
          {%- endfor -%}
          {{ report.hosts }}
      run_once: true # noqa run-once[task]
      delegate_to: localhost
      delegate_facts: true

    - name: Roll back OpenBao HAProxy after failed activation
      ansible.builtin.include_role:
        name: openbao_haproxy
        tasks_from: activation_rollback.yml
        apply:
          ignore_unreachable: true
      when: hostvars['localhost'].openbao_haproxy_failed_hosts | length > 0

    - name: Initialize unverified OpenBao HAProxy activation rollbacks
      ansible.builtin.set_fact:
        openbao_haproxy_unverified_rollback_hosts: []
      run_once: true # noqa run-once[task]
      delegate_to: localhost
      delegate_facts: true

    - name: Collect unverified OpenBao HAProxy activation rollbacks
      ansible.builtin.set_fact:
        openbao_haproxy_unverified_rollback_hosts: >-
          {%- set report = namespace(hosts=[]) -%}
          {%- for host in groups.get('openbao', []) -%}
          {%- if not hostvars[host].openbao_haproxy_activation_rollback_confirmed | default(false) | bool -%}
          {%- set report.hosts = report.hosts + [host] -%}
          {%- endif -%}
          {%- endfor -%}
          {{ report.hosts }}
      when: hostvars['localhost'].openbao_haproxy_failed_hosts | length > 0
      run_once: true # noqa run-once[task]
      delegate_to: localhost
      delegate_facts: true

    - name: Release OpenBao edge guards after verified activation rollback
      ansible.builtin.include_tasks: tasks/openbao-edge-release.yml
      when:
        - hostvars['localhost'].openbao_haproxy_failed_hosts | length > 0
        - openbao_haproxy_activation_rollback_confirmed | default(false)

    - name: Require every OpenBao HAProxy host activated
      ansible.builtin.assert:
        that:
          - hostvars['localhost'].openbao_haproxy_failed_hosts | length == 0
        fail_msg: >-
          OpenBao HAProxy activation failed. Unverified rollback hosts: {{
          hostvars['localhost'].openbao_haproxy_unverified_rollback_hosts
          | join(', ') | default('none', true) }}. OpenBao remained active.
      run_once: true # noqa run-once[task]

- name: Qualify active OpenBao HAProxy paths
  hosts: openbao
  gather_facts: false
  strategy: linear
  any_errors_fatal: false
  tasks:
    - name: End OpenBao HAProxy qualification in plan mode
      ansible.builtin.meta: end_play
      when: openbao_activation_mode | default('interactive') == 'plan'

    - name: Select local OpenBao HAProxy member
      ansible.builtin.set_fact:
        openbao_haproxy_local_member: >-
          {{
            openbao_cluster_members
            | selectattr('name', 'equalto', inventory_hostname)
            | first
          }}

    - name: Query local OpenBao HAProxy client path
      block:
        - name: Wait for the strict OpenBao HAProxy health check
          ansible.builtin.command:
            argv:
              - curl
              - --silent
              - --show-error
              - --noproxy
              - "*"
              - --connect-timeout
              - "{{ openbao_status_request_timeout | default(5) | string }}"
              - --max-time
              - "{{ openbao_status_request_timeout | default(5) | string }}"
              - --cacert
              - "{{ openbao_tls_ca_src }}"
              - --resolve
              - "{{ openbao_service_dns }}:{{ openbao_client_port }}:{{ openbao_haproxy_local_member.address }}"
              - --output
              - /dev/null
              - --write-out
              - "%{http_code}"
              - "https://{{ openbao_service_dns }}:{{ openbao_client_port }}/v1/sys/health"
          delegate_to: localhost
          become: false
          register: openbao_haproxy_activation_health
          changed_when: false
          no_log: true
          # One initial attempt plus nine retries lets backend checks settle.
          retries: 9
          delay: 1
          until:
            - openbao_haproxy_activation_health.rc | default(-1) == 0
            - openbao_haproxy_activation_health.stdout | default('') == '200'
      rescue:
        - name: Report failed OpenBao HAProxy health check
          ansible.builtin.debug:
            msg:
              host: "{{ inventory_hostname }}"
              curl_rc: "{{ openbao_haproxy_activation_health.rc | default('unavailable') }}"
              http_status: "{{ openbao_haproxy_activation_health.stdout | default('unavailable') }}"
              attempt_limit: 10

    - name: Record local OpenBao HAProxy path qualification
      ansible.builtin.set_fact:
        openbao_haproxy_path_qualified: >-
          {{
            openbao_haproxy_activation_health is succeeded
            and openbao_haproxy_activation_health is not unreachable
            and openbao_haproxy_activation_health is not skipped
            and openbao_haproxy_activation_health.rc | default(-1) == 0
            and openbao_haproxy_activation_health.stdout | default('') == '200'
          }}

    - name: Roll back OpenBao HAProxy after failed path qualification
      ansible.builtin.include_role:
        name: openbao_haproxy
        tasks_from: activation_rollback.yml
        apply:
          become: true
          ignore_unreachable: true
      when: >-
        groups.get('openbao', [])
        | map('extract', hostvars, 'openbao_haproxy_path_qualified')
        | select('equalto', false)
        | list
        | length > 0

    - name: Initialize OpenBao HAProxy path failure report
      ansible.builtin.set_fact:
        openbao_haproxy_failed_path_hosts: []
        openbao_haproxy_unverified_path_rollback_hosts: []
      run_once: true # noqa run-once[task]
      delegate_to: localhost
      delegate_facts: true

    - name: Collect failed OpenBao HAProxy paths
      ansible.builtin.set_fact:
        openbao_haproxy_failed_path_hosts: >-
          {%- set report = namespace(hosts=[]) -%}
          {%- for host in groups.get('openbao', []) -%}
          {%- if not hostvars[host].openbao_haproxy_path_qualified | default(false) | bool -%}
          {%- set report.hosts = report.hosts + [host] -%}
          {%- endif -%}
          {%- endfor -%}
          {{ report.hosts }}
      run_once: true # noqa run-once[task]
      delegate_to: localhost
      delegate_facts: true

    - name: Collect unverified OpenBao HAProxy path rollbacks
      ansible.builtin.set_fact:
        openbao_haproxy_unverified_path_rollback_hosts: >-
          {%- set report = namespace(hosts=[]) -%}
          {%- for host in groups.get('openbao', []) -%}
          {%- if not hostvars[host].openbao_haproxy_activation_rollback_confirmed | default(false) | bool -%}
          {%- set report.hosts = report.hosts + [host] -%}
          {%- endif -%}
          {%- endfor -%}
          {{ report.hosts }}
      when: hostvars['localhost'].openbao_haproxy_failed_path_hosts | length > 0
      run_once: true # noqa run-once[task]
      delegate_to: localhost
      delegate_facts: true

    - name: Release only verified OpenBao edge guards
      ansible.builtin.include_tasks: tasks/openbao-edge-release.yml
      when: >-
        hostvars['localhost'].openbao_haproxy_failed_path_hosts | length == 0
        or openbao_haproxy_activation_rollback_confirmed | default(false)

    - name: Require successful OpenBao HAProxy path activation
      ansible.builtin.assert:
        that:
          - hostvars['localhost'].openbao_haproxy_failed_path_hosts | length == 0
        fail_msg: >-
          OpenBao HAProxy path qualification failed on {{
          hostvars['localhost'].openbao_haproxy_failed_path_hosts | join(', ') }}.
          Unverified rollback hosts: {{
          hostvars['localhost'].openbao_haproxy_unverified_path_rollback_hosts
          | join(', ') | default('none', true) }}. OpenBao remained active.
      run_once: true # noqa run-once[task]
