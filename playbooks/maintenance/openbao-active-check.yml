---
- name: Require canonical OpenBao active check selection
  hosts: "{{ ansible_limit | default('localhost') }}"
  connection: local
  gather_facts: false
  tasks:
    - name: Require exact explicit OpenBao active check selection
      ansible.builtin.assert:
        that:
          - groups.get('openbao', []) | length == 3
          - ansible_limit is defined
          - ansible_limit | default('') | length > 0
          - >-
            query('ansible.builtin.inventory_hostnames',
                  ansible_limit | default('')) | list | sort
            == groups.get('openbao', []) | list | sort
        fail_msg: >-
          Active OpenBao check requires an explicit limit selecting exactly all
          three OpenBao hosts and no other inventory hosts.
      run_once: true # noqa run-once[task]

- name: Check active OpenBao convergence without mutation
  hosts: openbao
  become: true
  gather_facts: true
  any_errors_fatal: true
  tasks:
    - name: Require check mode and the complete active service contract
      ansible.builtin.assert:
        that:
          - ansible_check_mode
          - ansible_play_hosts_all | list | sort == groups.get('openbao', []) | list | sort
          - (openbao_enabled | default(false)) is boolean
          - openbao_enabled | default(false)
          - (openbao_service_enabled | default(false)) is boolean
          - openbao_service_enabled | default(false)
          - openbao_service_state | default('stopped') == 'started'
        fail_msg: >-
          Active OpenBao convergence check requires check mode and the enabled,
          started service contract on all three exact voters.

    - name: Inspect exact active OpenBao lifecycle before convergence check
      ansible.builtin.include_role:
        name: openbao
        tasks_from: active_preflight.yml
      vars:
        openbao_active_preflight_allow_desired_config_drift: true

    - name: Collect active OpenBao check observations
      ansible.builtin.set_fact:
        openbao_active_check_observations: >-
          {{
            ansible_play_hosts_all
            | map('extract', hostvars, 'openbao_active_observation')
            | sort(attribute='inventory_host')
            | list
          }}
      run_once: true # noqa run-once[task]

    - name: Require one exact marker-bound OpenBao check cluster
      ansible.builtin.assert:
        that:
          - openbao_active_check_observations | length == 3
          - >-
            openbao_active_check_observations
            | map(attribute='cluster_id') | unique | length == 1
          - >-
            openbao_active_check_observations
            | map(attribute='cluster_signature') | unique | length == 1
          - >-
            openbao_active_check_observations
            | map(attribute='node_id') | unique | length == 3
          - >-
            openbao_active_check_observations
            | map(attribute='image_digest') | unique | length == 1
          - >-
            openbao_active_check_observations
            | map(attribute='image_reference') | unique | length == 1
          - >-
            openbao_active_check_observations
            | map(attribute='ca_checksum') | unique | length == 1
        fail_msg: >-
          Active OpenBao check requires one exact cluster on the same desired
          image reference, digest, and controller CA.
      run_once: true # noqa run-once[task]

    - name: Require strict active OpenBao status before convergence check
      ansible.builtin.include_role:
        name: openbao_status
      vars:
        ansible_become: false
      run_once: true # noqa run-once[task]

    - name: Require marked and runtime OpenBao check identity match
      ansible.builtin.assert:
        that:
          - >-
            openbao_status_health_results.results[0].json.cluster_id
            == openbao_active_check_observations[0].cluster_id
        fail_msg: OpenBao runtime cluster identity does not match active markers.
      run_once: true # noqa run-once[task]

    - name: Check OpenBao role convergence
      ansible.builtin.include_role:
        name: openbao
      vars:
        openbao_active_preflight_allow_desired_config_drift: true
