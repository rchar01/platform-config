---
- name: Inspect pending OpenBao manual-custody completion
  hosts: openbao
  become: true
  gather_facts: true
  any_errors_fatal: true
  tasks:
    - name: Require exact explicit OpenBao completion selection
      ansible.builtin.assert:
        that:
          - groups.get('openbao', []) | length == 3
          - ansible_limit is defined
          - ansible_limit | default('') | length > 0
          - >-
            query('ansible.builtin.inventory_hostnames', ansible_limit) | list | sort
            == groups.get('openbao', []) | list | sort
        fail_msg: >-
          OpenBao bootstrap completion requires an explicit limit selecting
          exactly all three OpenBao hosts and no other inventory hosts.
      run_once: true # noqa run-once[task]

    - name: Inspect local pending OpenBao bootstrap state
      ansible.builtin.include_role:
        name: openbao
        tasks_from: bootstrap_pending_preflight.yml

    - name: Collect pending OpenBao bootstrap observations
      ansible.builtin.set_fact:
        openbao_bootstrap_pending_observations: >-
          {{
            ansible_play_hosts_all
            | map('extract', hostvars, 'openbao_bootstrap_pending_observation')
            | sort(attribute='inventory_host')
            | list
          }}
      run_once: true # noqa run-once[task]

    - name: Require consistent pending OpenBao bootstrap state
      ansible.builtin.assert:
        that:
          - openbao_bootstrap_pending_observations | length == 3
          - >-
            openbao_bootstrap_pending_observations
            | map(attribute='node_id') | unique | length == 3
          - >-
            openbao_bootstrap_pending_observations
            | map(attribute='ca_checksum') | unique | length == 1
        fail_msg: OpenBao pending manual-custody markers are inconsistent.
      run_once: true # noqa run-once[task]

    - name: Derive resumable OpenBao completion signature
      ansible.builtin.set_fact:
        openbao_bootstrap_complete_signature: >-
          {{ openbao_bootstrap_pending_observations | to_json | hash('sha256') }}
        openbao_bootstrap_existing_signatures: >-
          {{
            ansible_play_hosts_all
            | map('extract', hostvars, 'openbao_bootstrap_pending_marker_signature')
            | reject('equalto', '')
            | unique
            | list
          }}
      run_once: true # noqa run-once[task]

    - name: Require existing OpenBao markers match derived signature
      ansible.builtin.assert:
        that:
          - openbao_bootstrap_existing_signatures | length == 1
          - >-
            openbao_bootstrap_existing_signatures[0]
            == openbao_bootstrap_complete_signature
        fail_msg: Existing OpenBao markers do not match current completion evidence.
      run_once: true # noqa run-once[task]

    - name: Preserve validated OpenBao completion observations
      ansible.builtin.set_fact:
        openbao_bootstrap_complete_approved_observations: >-
          {{ openbao_bootstrap_pending_observations }}
        openbao_bootstrap_complete_approved_signature: >-
          {{ openbao_bootstrap_complete_signature }}
      run_once: true # noqa run-once[task]
      delegate_to: localhost
      delegate_facts: true

- name: Revalidate and qualify manual OpenBao custody completion
  hosts: openbao
  become: true
  gather_facts: true
  any_errors_fatal: true
  tasks:
    - name: Reinspect local pending OpenBao bootstrap state
      ansible.builtin.include_role:
        name: openbao
        tasks_from: bootstrap_pending_preflight.yml

    - name: Require unchanged approved OpenBao completion observations
      ansible.builtin.assert:
        that:
          - >-
            ansible_play_hosts_all
            | map('extract', hostvars, 'openbao_bootstrap_pending_observation')
            | sort(attribute='inventory_host')
            | list
            == hostvars['localhost'].openbao_bootstrap_complete_approved_observations
        fail_msg: OpenBao completion evidence changed after approval.
      run_once: true # noqa run-once[task]

    - name: Require revalidated OpenBao markers match approved signature
      ansible.builtin.assert:
        that:
          - >-
            ansible_play_hosts_all
            | map('extract', hostvars, 'openbao_bootstrap_pending_marker_signature')
            | reject('equalto', '')
            | unique
            | difference([hostvars['localhost'].openbao_bootstrap_complete_approved_signature])
            | length == 0
        fail_msg: OpenBao marker signature changed after completion approval.
      run_once: true # noqa run-once[task]

    - name: Require initialized, unsealed, audited OpenBao cluster
      ansible.builtin.include_role:
        name: openbao_status
      vars:
        ansible_become: false
      run_once: true # noqa run-once[task]

    - name: Preserve accepted OpenBao cluster identity
      ansible.builtin.set_fact:
        openbao_bootstrap_accepted_cluster_id: >-
          {{ openbao_status_health_results.results[0].json.cluster_id }}
      run_once: true # noqa run-once[task]
      delegate_to: localhost
      delegate_facts: true

- name: Persist the accepted OpenBao cluster
  hosts: openbao
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Enable persistent OpenBao activation
      ansible.builtin.include_role:
        name: openbao
        tasks_from: activation_enable.yml
      when: not ansible_check_mode

- name: Requalify and publish active OpenBao completion
  hosts: openbao
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Requalify persistently active OpenBao cluster
      ansible.builtin.include_role:
        name: openbao_status
      vars:
        ansible_become: false
      run_once: true # noqa run-once[task]
      when: not ansible_check_mode

    - name: Require final OpenBao runtime cluster identity is unchanged
      ansible.builtin.assert:
        that:
          - >-
            openbao_status_health_results.results[0].json.cluster_id
            == hostvars['localhost'].openbao_bootstrap_accepted_cluster_id
        fail_msg: OpenBao runtime cluster identity changed during persistent activation.
      run_once: true # noqa run-once[task]
      when: not ansible_check_mode

    - name: Publish active OpenBao bootstrap marker
      ansible.builtin.include_role:
        name: openbao
        tasks_from: bootstrap_publish_active.yml
      when: not ansible_check_mode
