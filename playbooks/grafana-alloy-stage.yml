---
- name: Install and configure one stopped Alloy process
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Require one literal Alloy staging host
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all == [inventory_hostname]
          - ansible_limit | default('') == inventory_hostname
        fail_msg: Alloy staging requires an explicit limit naming one inventory host.

    - name: Stage the fresh disabled Alloy installation
      ansible.builtin.include_role:
        name: grafana_alloy
        tasks_from: initial_stage
