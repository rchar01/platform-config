---
- name: Recover an interrupted Alloy initial start
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Require one literal Alloy recovery host in apply mode
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all == [inventory_hostname]
          - ansible_limit | default('') == inventory_hostname
          - not ansible_check_mode
        fail_msg: Alloy initial recovery requires apply mode and one literal inventory host limit.

    - name: Run authenticated stop-only initial recovery
      ansible.builtin.include_role:
        name: grafana_alloy
        tasks_from: initial_recover
