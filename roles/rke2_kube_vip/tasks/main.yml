---
- name: Assert RKE2 kube-vip inputs are configured
  ansible.builtin.assert:
    that:
      - groups.get(rke2_kube_vip_server_group, []) | length > 0
      - rke2_kube_vip_api_vip | length > 0
      - rke2_kube_vip_interface | length > 0
      - rke2_kube_vip_chart_repo | length > 0
      - rke2_kube_vip_chart_name | length > 0
      - rke2_kube_vip_chart_version | string | length > 0
      - rke2_kube_vip_image_tag | length > 0
      - >-
        (rke2_kube_vip_env.get('vip_leaseduration', '') | string)
        is match('^[1-9][0-9]*$')
      - >-
        (rke2_kube_vip_env.get('vip_renewdeadline', '') | string)
        is match('^[1-9][0-9]*$')
      - >-
        (rke2_kube_vip_env.get('vip_retryperiod', '') | string)
        is match('^[1-9][0-9]*$')
      - >-
        (rke2_kube_vip_env.get('vip_leaseduration', '0') | int)
        > (rke2_kube_vip_env.get('vip_renewdeadline', '0') | int)
      - >-
        (rke2_kube_vip_env.get('vip_renewdeadline', '0') | float)
        > ((rke2_kube_vip_env.get('vip_retryperiod', '0') | float) * 1.2)
      - rke2_kube_vip_api_vip in rke2_tls_sans
    fail_msg: >-
      RKE2 kube-vip requires rke2 server hosts, rke2_kube_vip_api_vip,
      rke2_kube_vip_interface, pinned chart and image settings, valid leader
      election timings, and the VIP in rke2_tls_sans.
  when: rke2_kube_vip_enabled | bool

- name: Discover route to kube-vip API VIP
  ansible.builtin.command:
    argv:
      - ip
      - -o
      - route
      - get
      - "{{ rke2_kube_vip_api_vip }}"
  register: rke2_kube_vip_route
  check_mode: false
  changed_when: false
  when: rke2_kube_vip_enabled | bool

- name: Check configured kube-vip interface exists
  ansible.builtin.command:
    argv:
      - ip
      - -o
      - link
      - show
      - dev
      - "{{ rke2_kube_vip_interface }}"
  register: rke2_kube_vip_interface_link
  check_mode: false
  changed_when: false
  when: rke2_kube_vip_enabled | bool

- name: Assert configured kube-vip interface exists
  ansible.builtin.assert:
    that:
      - rke2_kube_vip_interface_link.rc == 0
    fail_msg: "Configured kube-vip interface does not exist on {{ inventory_hostname }}: {{ rke2_kube_vip_interface }}"
  when: rke2_kube_vip_enabled | bool

- name: Assert kube-vip API VIP uses the configured interface
  ansible.builtin.assert:
    that:
      - >-
        rke2_kube_vip_route.stdout is search(' dev ' ~ (rke2_kube_vip_interface | regex_escape) ~ ' ')
        or rke2_kube_vip_route.stdout is search('^local ' ~ (rke2_kube_vip_api_vip | regex_escape) ~ ' dev lo ')
    fail_msg: >-
      Route to {{ rke2_kube_vip_api_vip }} must use {{ rke2_kube_vip_interface }} before
      kube-vip ownership, or dev lo after this node owns the VIP. Route output on
      {{ inventory_hostname }}: {{ rke2_kube_vip_route.stdout }}
  when: rke2_kube_vip_enabled | bool

- name: Check RKE2 kube-vip manifest directory on bootstrap server
  ansible.builtin.stat:
    path: "{{ rke2_kube_vip_manifest_dir }}"
  register: rke2_kube_vip_manifest_dir_stat
  when:
    - rke2_kube_vip_enabled | bool
    - inventory_hostname == rke2_kube_vip_bootstrap_host

- name: Assert RKE2 kube-vip manifest directory exists on bootstrap server
  ansible.builtin.assert:
    that:
      - rke2_kube_vip_manifest_dir_stat.stat.exists
      - rke2_kube_vip_manifest_dir_stat.stat.isdir
    fail_msg: "RKE2 manifest directory does not exist: {{ rke2_kube_vip_manifest_dir }}"
  when:
    - rke2_kube_vip_enabled | bool
    - inventory_hostname == rke2_kube_vip_bootstrap_host

- name: Check existing RKE2 kube-vip manifest on bootstrap server
  ansible.builtin.stat:
    path: "{{ rke2_kube_vip_manifest_path }}"
  register: rke2_kube_vip_manifest_stat
  when:
    - rke2_kube_vip_enabled | bool
    - inventory_hostname == rke2_kube_vip_bootstrap_host

- name: Read existing RKE2 kube-vip manifest on bootstrap server
  ansible.builtin.slurp:
    path: "{{ rke2_kube_vip_manifest_path }}"
  register: rke2_kube_vip_manifest_content
  when:
    - rke2_kube_vip_enabled | bool
    - inventory_hostname == rke2_kube_vip_bootstrap_host
    - rke2_kube_vip_manifest_stat.stat.exists

- name: Initialize existing RKE2 kube-vip manifest validation
  ansible.builtin.set_fact:
    rke2_kube_vip_existing_manifest_valid: false
  when:
    - rke2_kube_vip_enabled | bool
    - inventory_hostname == rke2_kube_vip_bootstrap_host

- name: Parse Ansible-owned fields from existing RKE2 kube-vip manifest
  when:
    - rke2_kube_vip_enabled | bool
    - inventory_hostname == rke2_kube_vip_bootstrap_host
    - rke2_kube_vip_manifest_stat.stat.exists
  block:
    - name: Parse existing RKE2 kube-vip manifest
      ansible.builtin.set_fact:
        rke2_kube_vip_existing_manifest: >-
          {{ rke2_kube_vip_manifest_content.content | b64decode | from_yaml }}

    - name: Remove RKE2-managed fields from existing kube-vip manifest
      ansible.builtin.set_fact:
        # RKE2 injects cluster-global spec.set values into HelmChart files.
        rke2_kube_vip_existing_ansible_fields: >-
          {{
            rke2_kube_vip_existing_manifest
            | combine({
              'spec': rke2_kube_vip_existing_manifest.get('spec', {})
              | dict2items
              | rejectattr('key', 'equalto', 'set')
              | items2dict
            })
          }}
        rke2_kube_vip_existing_manifest_valid: true

  rescue:
    - name: Mark invalid RKE2 kube-vip manifest for repair
      ansible.builtin.set_fact:
        rke2_kube_vip_existing_manifest_valid: false

- name: Check RKE2 server service on bootstrap server
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - rke2-server.service
  register: rke2_kube_vip_server_service
  check_mode: false
  changed_when: false
  when:
    - rke2_kube_vip_enabled | bool
    - inventory_hostname == rke2_kube_vip_bootstrap_host

- name: Assert RKE2 server service is active on bootstrap server
  ansible.builtin.assert:
    that:
      - rke2_kube_vip_server_service.stdout == 'active'
    fail_msg: "rke2-server.service must be active before installing kube-vip."
  when:
    - rke2_kube_vip_enabled | bool
    - inventory_hostname == rke2_kube_vip_bootstrap_host

- name: Write RKE2 kube-vip HelmChart manifest when Ansible-owned fields differ
  vars:
    rke2_kube_vip_desired_manifest: >-
      {{ lookup('ansible.builtin.template', 'kube-vip-helmchart.yaml.j2') | from_yaml }}
  ansible.builtin.template:
    src: kube-vip-helmchart.yaml.j2
    dest: "{{ rke2_kube_vip_manifest_path }}"
    owner: root
    group: root
    mode: "0644"
  when:
    - rke2_kube_vip_enabled | bool
    - inventory_hostname == rke2_kube_vip_bootstrap_host
    - >-
      not rke2_kube_vip_manifest_stat.stat.exists
      or not rke2_kube_vip_existing_manifest_valid
      or rke2_kube_vip_existing_ansible_fields != rke2_kube_vip_desired_manifest

- name: Enforce RKE2 kube-vip manifest metadata on bootstrap server
  ansible.builtin.file:
    path: "{{ rke2_kube_vip_manifest_path }}"
    state: file
    owner: root
    group: root
    mode: "0644"
  when:
    - rke2_kube_vip_enabled | bool
    - inventory_hostname == rke2_kube_vip_bootstrap_host
    - rke2_kube_vip_manifest_stat.stat.exists or not ansible_check_mode
