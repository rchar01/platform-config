---
- name: Require safe Zot TLS lifecycle helper paths
  ansible.builtin.assert:
    that:
      - zot_registry_tls_lifecycle_helper_source.stat.exists
      - zot_registry_tls_lifecycle_helper_source.stat.isreg
      - not zot_registry_tls_lifecycle_helper_source.stat.islnk
      - >-
        not zot_registry_tls_custody_state.helper.exists
        or (
          zot_registry_tls_custody_state.helper.isreg
          and not zot_registry_tls_custody_state.helper.islnk
          and zot_registry_tls_custody_state.helper.uid == 0
          and zot_registry_tls_custody_state.helper.gid == 0
        )
    fail_msg: >-
      Zot TLS custody requires a regular shipped source and an absent or
      root-owned regular installed helper before normal copy convergence.
