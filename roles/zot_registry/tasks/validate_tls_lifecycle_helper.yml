---
- name: Require a trusted Zot TLS lifecycle helper upgrade state
  ansible.builtin.assert:
    that:
      - zot_registry_tls_lifecycle_helper_source.stat.exists
      - zot_registry_tls_lifecycle_helper_source.stat.isreg
      - not zot_registry_tls_lifecycle_helper_source.stat.islnk
      - zot_registry_tls_lifecycle_helper_source.stat.checksum == '3d446de2d3e56314ca70e881b5354a2c341566f17a6e4472f58faced92daa7c0'
      - >-
        not zot_registry_tls_custody_state.helper.exists
        or (
          zot_registry_tls_custody_state.helper.isreg
          and not zot_registry_tls_custody_state.helper.islnk
          and zot_registry_tls_custody_state.helper.uid == 0
          and zot_registry_tls_custody_state.helper.gid == 0
          and zot_registry_tls_custody_state.helper.mode == '0755'
          and (
            zot_registry_tls_custody_state.helper.checksum
              == zot_registry_tls_lifecycle_helper_source.stat.checksum
            or (
              not ansible_check_mode
              and zot_registry_tls_custody_state.helper.checksum in
                [
                  '3044058c3d4884a3ab1d51f1dc128a5c84407e387d2805fa99087c65d98eb280',
                  '9b6c62c6380fb1ab00e0a10dc5905ec4f88af2b57b503c1b44ec4db497b68fb3'
                ]
            )
          )
        )
      - >-
        not zot_registry_tls_custody_state.state_root.exists
        or zot_registry_tls_custody_state.helper.exists
    fail_msg: >-
      Zot TLS custody requires the exact shipped root:root 0755 lifecycle helper.
      Normal convergence may replace only an exact trusted v2 or v3 predecessor;
      check mode, source drift, unsafe metadata, unknown helper drift, and an
      absent helper with initialized state fail closed.
