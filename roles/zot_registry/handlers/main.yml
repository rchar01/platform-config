---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart Zot registry
  ansible.builtin.systemd_service:
    name: "{{ zot_registry_service_name }}"
    state: restarted
  when:
    - zot_registry_service_enabled | bool
    - zot_registry_tls_effective_custody != 'dormant'
    - not ansible_check_mode
