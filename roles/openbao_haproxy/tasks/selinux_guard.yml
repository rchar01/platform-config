---
- name: Reset OpenBao HAProxy SELinux observation
  ansible.builtin.set_fact:
    openbao_haproxy_selinux_observation:
      managed: false
  ignore_errors: false
  ignore_unreachable: false

- name: Verify staged OpenBao HAProxy SELinux listener and backend labels
  when: openbao_haproxy_selinux_manage | bool
  ignore_errors: false
  ignore_unreachable: false
  block:
    - name: Read native OpenBao HAProxy SELinux policy without changing it
      ansible.builtin.command:
        argv:
          - "{{ ansible_facts.python.executable }}"
          - -c
          - |
            import json
            import subprocess
            import sys

            mode = subprocess.check_output(["getenforce"], text=True).strip()
            if mode not in ("Enforcing", "Permissive", "Disabled"):
                raise SystemExit("Unrecognized SELinux mode")
            ports = {}
            if mode != "Disabled":
                import seobject
                import semanage

                policy = seobject.portRecords()
                for port in sorted({int(value) for value in sys.argv[2:]}):
                    key = record = None
                    try:
                        # Exact native queries preserve first-match ordering of duplicate records.
                        rc, key = semanage.semanage_port_key_create(
                            policy.sh, port, port, semanage.SEMANAGE_PROTO_TCP)
                        if rc < 0 or key is None:
                            raise SystemExit("Unable to create SELinux TCP port key for " + str(port))
                        rc, record = semanage.semanage_port_query(policy.sh, key)
                        if rc < 0 or record is None:
                            raise SystemExit("Missing staged SELinux TCP label for " + str(port))
                        context = semanage.semanage_port_get_con(record)
                        port_type = semanage.semanage_context_get_type(context)
                        if port_type != sys.argv[1]:
                            raise SystemExit("Incorrect staged SELinux TCP label for " + str(port))
                        ports[str(port)] = [port_type, semanage.semanage_context_get_mls(context)]
                    finally:
                        if record is not None:
                            semanage.semanage_port_free(record)
                        if key is not None:
                            semanage.semanage_port_key_free(key)
            print(json.dumps({"managed": True, "mode": mode, "ports": ports}, sort_keys=True))
          - "{{ openbao_haproxy_selinux_port_type }}"
          - "{{ openbao_haproxy_client_port | string }}"
          - "{{ openbao_haproxy_stats_port | string }}"
          - "{{ openbao_haproxy_backend_port | string }}"
      register: openbao_haproxy_selinux_probe
      changed_when: false
      check_mode: false

    - name: Require a complete reachable OpenBao HAProxy SELinux observation
      ansible.builtin.assert:
        that:
          - openbao_haproxy_selinux_probe is not unreachable
          - openbao_haproxy_selinux_probe is not skipped
          - openbao_haproxy_selinux_probe.rc | default(-1) == 0
        fail_msg: OpenBao HAProxy activation requires verified staged SELinux listener and backend labels.

    - name: Record verified OpenBao HAProxy SELinux observation
      ansible.builtin.set_fact:
        openbao_haproxy_selinux_observation: "{{ openbao_haproxy_selinux_probe.stdout | from_json }}"
