---
- name: Assert OpenBao HAProxy inputs are safe
  ansible.builtin.assert:
    that:
      - openbao_haproxy_package_name == 'haproxy'
      - openbao_haproxy_package_nevra is match('^haproxy-0:3[.]0[.][0-9]+-[A-Za-z0-9_.+~-]+[.]x86_64$')
      - openbao_haproxy_binary_path == '/usr/sbin/haproxy'
      - openbao_haproxy_config_path == '/etc/haproxy/haproxy.cfg'
      - openbao_haproxy_config_validate_command == openbao_haproxy_binary_path ~ ' -c -f %s'
      - openbao_haproxy_service_name == 'haproxy.service'
      - openbao_haproxy_enabled is boolean
      - openbao_haproxy_service_enabled is boolean
      - openbao_haproxy_activation_ready is boolean
      - openbao_haproxy_service_state in ['started', 'stopped']
      - (openbao_haproxy_service_enabled | bool) == (openbao_haproxy_service_state == 'started')
      - not haproxy_workload_lb_enabled | default(false) | bool
      - openbao_haproxy_user is match('^[a-z_][a-z0-9_-]*[$]?$')
      - openbao_haproxy_group is match('^[a-z_][a-z0-9_-]*[$]?$')
      - openbao_haproxy_maxconn | type_debug == 'int'
      - openbao_haproxy_maxconn >= 1 and openbao_haproxy_maxconn <= 1000000
      - openbao_haproxy_client_bind == '*'
      - openbao_haproxy_client_port | type_debug == 'int'
      - openbao_haproxy_backend_port | type_debug == 'int'
      - openbao_haproxy_cluster_port | type_debug == 'int'
      - openbao_haproxy_stats_port | type_debug == 'int'
      - openbao_haproxy_client_port >= 1 and openbao_haproxy_client_port <= 65535
      - openbao_haproxy_backend_port >= 1 and openbao_haproxy_backend_port <= 65535
      - openbao_haproxy_cluster_port >= 1 and openbao_haproxy_cluster_port <= 65535
      - openbao_haproxy_stats_port >= 1 and openbao_haproxy_stats_port <= 65535
      - >-
        [
          openbao_haproxy_client_port,
          openbao_haproxy_backend_port,
          openbao_haproxy_cluster_port,
          openbao_haproxy_stats_port
        ] | unique | length == 4
      - openbao_cluster_members | type_debug == 'list'
      - openbao_cluster_members | length == 3
      - openbao_cluster_members | selectattr('name', 'defined') | list | length == 3
      - openbao_cluster_members | selectattr('address', 'defined') | list | length == 3
      - openbao_cluster_members | selectattr('dns', 'defined') | list | length == 3
      - openbao_cluster_members | map(attribute='name') | unique | length == 3
      - openbao_cluster_members | map(attribute='address') | unique | length == 3
      - openbao_cluster_members | map(attribute='dns') | unique | length == 3
      - openbao_haproxy_backend_ca_path is match('^/[A-Za-z0-9_./-]+$')
      - >-
        openbao_haproxy_backend_health_host is match(
          '^(?=.{1,253}$)[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?'
          ~ '(?:[.][a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)*$'
        )
      - openbao_haproxy_backend_health_path == '/v1/sys/health'
      - openbao_haproxy_stats_bind_address is match('^[0-9]{1,3}([.][0-9]{1,3}){3}$')
      - openbao_haproxy_stats_bind_address.split('.') | map('int') | select('gt', 255) | list | length == 0
      - openbao_haproxy_stats_path == '/metrics'
      - openbao_haproxy_client_allowed_sources | length > 0
      - openbao_haproxy_stats_allowed_sources | length > 0
      - openbao_haproxy_client_allowed_sources | unique | length == openbao_haproxy_client_allowed_sources | length
      - openbao_haproxy_stats_allowed_sources | unique | length == openbao_haproxy_stats_allowed_sources | length
      - openbao_haproxy_timeout_connect is match('^[1-9][0-9]*[smh]$')
      - openbao_haproxy_timeout_client is match('^[1-9][0-9]*[smh]$')
      - openbao_haproxy_timeout_server is match('^[1-9][0-9]*[smh]$')
      - openbao_haproxy_timeout_check is match('^[1-9][0-9]*[smh]$')
      - openbao_haproxy_check_interval is match('^[1-9][0-9]*[smh]$')
      - openbao_haproxy_check_fast_interval is match('^[1-9][0-9]*[smh]$')
      - openbao_haproxy_check_down_interval is match('^[1-9][0-9]*[smh]$')
      - openbao_haproxy_check_rise | type_debug == 'int'
      - openbao_haproxy_check_fall | type_debug == 'int'
      - openbao_haproxy_check_rise >= 1
      - openbao_haproxy_check_fall >= 1
      - openbao_haproxy_firewalld_manifest_path | dirname == openbao_haproxy_state_dir
      - openbao_haproxy_firewalld_manage is boolean
      - >-
        openbao_haproxy_service_state != 'started'
        or openbao_haproxy_firewalld_manage | bool
      - openbao_haproxy_selinux_manage is boolean
      - openbao_haproxy_selinux_port_type is match('^[a-z0-9_]+_t$')
    fail_msg: >-
      OpenBao HAProxy requires an exact HAProxy 3.0 package, disabled-or-active
      coherent lifecycle, three canonical direct backends, strict health and
      metrics policy, unique ports, and source-scoped firewall inputs.

- name: Validate each OpenBao HAProxy backend
  ansible.builtin.include_tasks: validate_backend.yml
  loop: "{{ openbao_cluster_members }}"
  loop_control:
    loop_var: openbao_haproxy_backend
    label: "{{ openbao_haproxy_backend.name | default('undefined') }}"

- name: Assert OpenBao HAProxy firewall sources are IPv4 CIDRs
  ansible.builtin.assert:
    that:
      - >-
        openbao_haproxy_all_allowed_sources
        | select('match', '^[0-9]{1,3}([.][0-9]{1,3}){3}/([0-9]|[12][0-9]|3[0-2])$')
        | list | length == openbao_haproxy_all_allowed_sources | length
    fail_msg: "OpenBao HAProxy firewall sources must be IPv4 CIDRs."
  vars:
    openbao_haproxy_all_allowed_sources: >-
      {{ openbao_haproxy_client_allowed_sources + openbao_haproxy_stats_allowed_sources }}

- name: Validate each OpenBao HAProxy firewall source
  ansible.builtin.include_tasks: validate_source.yml
  loop: "{{ openbao_haproxy_client_allowed_sources + openbao_haproxy_stats_allowed_sources }}"
  loop_control:
    loop_var: openbao_haproxy_source
    label: "{{ openbao_haproxy_source }}"
