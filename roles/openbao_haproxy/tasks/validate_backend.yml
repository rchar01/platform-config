---
- name: Assert OpenBao HAProxy backend is safe
  ansible.builtin.assert:
    that:
      - openbao_haproxy_backend.name is match('^[A-Za-z0-9_.-]+$')
      - openbao_haproxy_backend.address is match('^[0-9]{1,3}([.][0-9]{1,3}){3}$')
      - openbao_haproxy_backend.address.split('.') | map('int') | select('gt', 255) | list | length == 0
      - >-
        openbao_haproxy_backend.dns is match(
          '^(?=.{1,253}$)[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?'
          ~ '(?:[.][a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)*$'
        )
    fail_msg: >-
      OpenBao HAProxy backends require safe names, valid IPv4 addresses, and
      lowercase node-specific DNS identities.
