---
platform_external_probe_enabled: false
platform_external_probe_observer_id: "{{ inventory_hostname }}"
platform_external_probe_environment: "{{ platform_environment | default('dev') }}"
platform_external_probe_targets: []
platform_external_probe_scrape_interval: 5s
platform_external_probe_scrape_timeout: 4s
platform_external_probe_metrics_receiver: prometheus.remote_write.platform_metrics.receiver
platform_external_probe_alloy_fragment: ""

platform_external_probe_vip_ownership: []
platform_external_probe_keepalived_service: keepalived.service
platform_external_probe_metrics_dir: /var/lib/alloy/platform-external-probe
platform_external_probe_metrics_path: "{{ platform_external_probe_metrics_dir }}/vip-ownership.prom"
platform_external_probe_script_path: /usr/local/libexec/platform/platform-external-probe-ownership
platform_external_probe_service_name: platform-external-probe-ownership.service
platform_external_probe_timer_name: platform-external-probe-ownership.timer
platform_external_probe_timer_enabled: false
platform_external_probe_timer_state: stopped
platform_external_probe_timer_interval: 5s

platform_external_probe_postgresql_primary: {}
platform_external_probe_postgresql_metrics_path: "{{ platform_external_probe_metrics_dir }}/postgresql-primary.prom"
platform_external_probe_postgresql_script_path: /usr/local/libexec/platform/platform-external-probe-postgresql-primary
platform_external_probe_postgresql_service_name: platform-external-probe-postgresql-primary.service
platform_external_probe_postgresql_timer_name: platform-external-probe-postgresql-primary.timer
platform_external_probe_postgresql_timer_enabled: false
platform_external_probe_postgresql_timer_state: stopped
platform_external_probe_postgresql_timer_interval: 5s
platform_external_probe_postgresql_connect_timeout: 4
platform_external_probe_postgresql_statement_timeout_ms: 3000
platform_external_probe_postgresql_psql_path: /usr/bin/psql

platform_external_probe_garage_canary: {}
platform_external_probe_garage_metrics_path: "{{ platform_external_probe_metrics_dir }}/garage-canary.prom"
platform_external_probe_garage_script_path: /usr/local/libexec/platform/platform-external-probe-garage-canary
platform_external_probe_garage_service_name: platform-external-probe-garage-canary.service
platform_external_probe_garage_timer_name: platform-external-probe-garage-canary.timer
platform_external_probe_garage_timer_enabled: false
platform_external_probe_garage_timer_state: stopped
platform_external_probe_garage_timer_interval: 30s
platform_external_probe_garage_request_timeout: 3
platform_external_probe_garage_run_timeout: 10
platform_external_probe_garage_python_path: /usr/bin/python3
