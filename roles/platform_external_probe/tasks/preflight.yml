---
- name: Validate external probe lifecycle paths
  ansible.builtin.assert:
    that:
      - platform_external_probe_enabled is boolean
      - platform_external_probe_postgresql_service_name is match('^[A-Za-z0-9_.@-]+[.]service$')
      - platform_external_probe_garage_service_name is match('^[A-Za-z0-9_.@-]+[.]service$')
      - platform_external_probe_garage_script_path is match('^/[A-Za-z0-9_./-]+$')
      - platform_external_probe_timer_name is match('^[A-Za-z0-9_.@-]+[.]timer$')
      - platform_external_probe_metrics_path is match('^/[A-Za-z0-9_./-]+[.]prom$')
      - platform_external_probe_postgresql_timer_name is match('^[A-Za-z0-9_.@-]+[.]timer$')
      - platform_external_probe_postgresql_metrics_path is match('^/[A-Za-z0-9_./-]+[.]prom$')
      - platform_external_probe_garage_timer_name is match('^[A-Za-z0-9_.@-]+[.]timer$')
      - platform_external_probe_garage_metrics_path is match('^/[A-Za-z0-9_./-]+[.]prom$')
      - platform_external_probe_garage_metrics_path | dirname == platform_external_probe_metrics_dir
      - "'..' not in platform_external_probe_metrics_path.split('/')"
      - "'..' not in platform_external_probe_postgresql_metrics_path.split('/')"
      - "'..' not in platform_external_probe_garage_metrics_path.split('/')"
      - "'..' not in platform_external_probe_garage_script_path.split('/')"
      - platform_external_probe_garage_metrics_path not in [platform_external_probe_metrics_path, platform_external_probe_postgresql_metrics_path]
      - platform_external_probe_garage_script_path not in [platform_external_probe_script_path, platform_external_probe_postgresql_script_path]
      - >-
        [
          platform_external_probe_script_path,
          platform_external_probe_postgresql_script_path,
          platform_external_probe_garage_script_path
        ]
        | intersect([
          platform_external_probe_metrics_path,
          platform_external_probe_postgresql_metrics_path,
          platform_external_probe_garage_metrics_path
        ])
        | length == 0
      - platform_external_probe_garage_service_name not in [platform_external_probe_service_name, platform_external_probe_postgresql_service_name]
      - platform_external_probe_garage_timer_name not in [platform_external_probe_timer_name, platform_external_probe_postgresql_timer_name]
    fail_msg: "External probe lifecycle inputs must use safe systemd and absolute path names."

- name: Validate enabled external probe inputs
  ansible.builtin.include_tasks: validate.yml
  when: platform_external_probe_enabled | bool
