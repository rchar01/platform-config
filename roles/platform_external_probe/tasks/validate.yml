---
- name: Assert locked external probe profiles are canonical
  ansible.builtin.assert:
    that:
      - >-
        platform_external_probe_locked_profiles == {
          'grafana_health': {
            'service': 'grafana',
            'path': '/api/health',
            'valid_status_codes': [200],
            'required_body_regexes': [
              '"database"[[:space:]]*:[[:space:]]*"ok"',
              '"version"[[:space:]]*:[[:space:]]*"13[.]1[.]3"'
            ],
            'forbidden_body_regexes': [
              '"database"[[:space:]]*:[[:space:]]*"(failed|error|unknown)"'
            ]
          },
          'loki_ready': {
            'service': 'loki',
            'path': '/ready',
            'valid_status_codes': [200],
            'required_body_regexes': ['^ready[[:space:]]*$'],
            'forbidden_body_regexes': [
              '(Application is stopping|not ready|Some services are not Running)'
            ]
          },
          'mimir_ready': {
            'service': 'mimir',
            'path': '/ready',
            'valid_status_codes': [200],
            'required_body_regexes': ['^ready[[:space:]]*$'],
            'forbidden_body_regexes': [
              '(Application is stopping|not ready|Some services are not Running)'
            ]
          }
        }
    fail_msg: "Locked external probe profiles must match the role-owned contract."

- name: Assert external probe inputs are configured safely
  ansible.builtin.assert:
    that:
      - platform_external_probe_observer_id is match('^[A-Za-z0-9_.-]+$')
      - platform_external_probe_environment is match('^[A-Za-z0-9_.-]+$')
      - platform_external_probe_enabled is boolean
      - platform_external_probe_targets | length > 0
      - platform_external_probe_targets | selectattr('name', 'defined') | list | length == platform_external_probe_targets | length
      - platform_external_probe_targets | map(attribute='name') | unique | length == platform_external_probe_targets | length
      - platform_external_probe_metrics_receiver is match('^[a-z][a-z0-9_]*[.][a-z][a-z0-9_]*[.][a-z][a-z0-9_]*[.][a-z][a-z0-9_]*$')
      - platform_external_probe_scrape_interval is match('^[1-9][0-9]*s$')
      - platform_external_probe_scrape_timeout is match('^[1-9][0-9]*s$')
      - platform_external_probe_scrape_timeout | regex_replace('s$', '') | int < platform_external_probe_scrape_interval | regex_replace('s$', '') | int
      - platform_external_probe_timer_enabled is boolean
      - platform_external_probe_timer_state in ['started', 'stopped']
      - (platform_external_probe_timer_enabled | bool) == (platform_external_probe_timer_state == 'started')
      - platform_external_probe_timer_interval is match('^[1-9][0-9]*s$')
      - platform_external_probe_vip_ownership | length > 0 or not platform_external_probe_timer_enabled | bool
      - platform_external_probe_postgresql_timer_enabled is boolean
      - platform_external_probe_postgresql_timer_state in ['started', 'stopped']
      - >-
        (platform_external_probe_postgresql_timer_enabled | bool)
        == (platform_external_probe_postgresql_timer_state == 'started')
      - platform_external_probe_postgresql_primary | length > 0 or not platform_external_probe_postgresql_timer_enabled | bool
      - platform_external_probe_garage_timer_enabled is boolean
      - platform_external_probe_garage_timer_state in ['started', 'stopped']
      - >-
        (platform_external_probe_garage_timer_enabled | bool)
        == (platform_external_probe_garage_timer_state == 'started')
      - platform_external_probe_garage_canary | length > 0 or not platform_external_probe_garage_timer_enabled | bool
      - platform_external_probe_keepalived_service is match('^[A-Za-z0-9_.@-]+[.]service$')
      - platform_external_probe_metrics_dir is match('^/[A-Za-z0-9_./-]+$')
      - platform_external_probe_metrics_path is match('^/[A-Za-z0-9_./-]+[.]prom$')
      - platform_external_probe_metrics_path | dirname == platform_external_probe_metrics_dir
      - platform_external_probe_postgresql_metrics_path is match('^/[A-Za-z0-9_./-]+[.]prom$')
      - platform_external_probe_postgresql_metrics_path | dirname == platform_external_probe_metrics_dir
      - platform_external_probe_script_path is match('^/[A-Za-z0-9_./-]+$')
      - platform_external_probe_service_name is match('^[A-Za-z0-9_.@-]+[.]service$')
      - platform_external_probe_timer_name is match('^[A-Za-z0-9_.@-]+[.]timer$')
      - platform_external_probe_postgresql_script_path is match('^/[A-Za-z0-9_./-]+$')
      - platform_external_probe_postgresql_service_name is match('^[A-Za-z0-9_.@-]+[.]service$')
      - platform_external_probe_postgresql_timer_name is match('^[A-Za-z0-9_.@-]+[.]timer$')
      - platform_external_probe_garage_metrics_path is match('^/[A-Za-z0-9_./-]+[.]prom$')
      - platform_external_probe_garage_metrics_path | dirname == platform_external_probe_metrics_dir
      - platform_external_probe_garage_script_path is match('^/[A-Za-z0-9_./-]+$')
      - platform_external_probe_garage_service_name is match('^[A-Za-z0-9_.@-]+[.]service$')
      - platform_external_probe_garage_timer_name is match('^[A-Za-z0-9_.@-]+[.]timer$')
      - "'..' not in platform_external_probe_metrics_dir.split('/')"
      - "'..' not in platform_external_probe_script_path.split('/')"
      - "'..' not in platform_external_probe_postgresql_script_path.split('/')"
      - "'..' not in platform_external_probe_garage_script_path.split('/')"
    fail_msg: >-
      External probes require a safe observer identity, unique typed targets, a
      stable Alloy metrics receiver, bounded intervals, and a coherent disabled
      or active ownership timer state.

- name: Validate each external HTTPS probe target
  ansible.builtin.include_tasks: validate_target.yml
  loop: "{{ platform_external_probe_targets }}"
  loop_control:
    loop_var: platform_external_probe_target
    label: "{{ platform_external_probe_target.name | default('undefined') }}"

- name: Validate each external VIP ownership target
  ansible.builtin.include_tasks: validate_vip.yml
  loop: "{{ platform_external_probe_vip_ownership }}"
  loop_control:
    loop_var: platform_external_probe_vip
    label: "{{ platform_external_probe_vip.instance | default('undefined') }}"

- name: Assert external VIP ownership identities are unique
  ansible.builtin.assert:
    that:
      - platform_external_probe_vip_ownership | map(attribute='instance') | unique | length == platform_external_probe_vip_ownership | length
      - platform_external_probe_vip_ownership | map(attribute='vip') | unique | length == platform_external_probe_vip_ownership | length
    fail_msg: "External VIP ownership observations require unique instance names and VIPs."
  when: platform_external_probe_vip_ownership | length > 0

- name: Assert PostgreSQL primary probe contract is exact and read-only
  ansible.builtin.assert:
    that:
      - platform_external_probe_postgresql_primary | length == 10
      - platform_external_probe_postgresql_primary.name | default('') is match('^[a-z][a-z0-9_]*$')
      - platform_external_probe_postgresql_primary.service | default('') == 'postgresql'
      - platform_external_probe_postgresql_primary.address_mode | default('') == 'vip'
      - >-
        platform_external_probe_postgresql_primary.host | default('') is match(
          '^[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?'
          ~ '(?:[.][A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?)+$'
        )
      - >-
        platform_external_probe_postgresql_primary.host | default('') is not match(
          '^(?:25[0-5]|2[0-4][0-9]|1?[0-9]{1,2})'
          ~ '(?:[.](?:25[0-5]|2[0-4][0-9]|1?[0-9]{1,2})){3}$'
        )
      - platform_external_probe_postgresql_primary.host | default('') is search('[A-Za-z]')
      - platform_external_probe_postgresql_primary.host | default('') | length <= 253
      - >-
        platform_external_probe_postgresql_primary.host
        | default('')
        | split('.')
        | map('length')
        | select('gt', 63)
        | list
        | length == 0
      - platform_external_probe_postgresql_primary.port | default(0) is integer
      - platform_external_probe_postgresql_primary.port == 5432
      - platform_external_probe_postgresql_primary.database | default('') is match('^[a-z_][a-z0-9_]{0,62}$')
      - platform_external_probe_postgresql_primary.user | default('') is match('^[a-z_][a-z0-9_]{0,62}$')
      - platform_external_probe_postgresql_primary.ca_file | default('') is match('^/(?:etc|run)/[A-Za-z0-9_./-]+$')
      - platform_external_probe_postgresql_primary.client_cert_file | default('') is match('^/(?:etc|run)/[A-Za-z0-9_./-]+$')
      - platform_external_probe_postgresql_primary.client_key_file | default('') is match('^/(?:etc|run)/[A-Za-z0-9_./-]+$')
      - "'..' not in (platform_external_probe_postgresql_primary.ca_file | default('')).split('/')"
      - "'..' not in (platform_external_probe_postgresql_primary.client_cert_file | default('')).split('/')"
      - "'..' not in (platform_external_probe_postgresql_primary.client_key_file | default('')).split('/')"
      - platform_external_probe_postgresql_timer_interval == '5s'
      - platform_external_probe_postgresql_connect_timeout is integer
      - platform_external_probe_postgresql_connect_timeout == 4
      - platform_external_probe_postgresql_statement_timeout_ms is integer
      - platform_external_probe_postgresql_statement_timeout_ms == 3000
      - platform_external_probe_postgresql_psql_path is match('^/[A-Za-z0-9_./-]+$')
      - "'..' not in platform_external_probe_postgresql_psql_path.split('/')"
      - platform_external_probe_postgresql_metrics_path != platform_external_probe_metrics_path
      - platform_external_probe_postgresql_script_path != platform_external_probe_script_path
      - platform_external_probe_postgresql_service_name != platform_external_probe_service_name
      - platform_external_probe_postgresql_timer_name != platform_external_probe_timer_name
    fail_msg: >-
      The PostgreSQL primary probe requires the locked five-second,
      certificate-only, verify-full, read-only VIP contract.
  when: platform_external_probe_postgresql_primary | length > 0

- name: Assert Garage semantic canary contract is exact and least privilege
  ansible.builtin.assert:
    that:
      - platform_external_probe_garage_canary | length == 12
      - platform_external_probe_garage_canary.name | default('') is match('^[a-z][a-z0-9_]*$')
      - platform_external_probe_garage_canary.service | default('') == 'garage'
      - platform_external_probe_garage_canary.address_mode | default('') == 'vip'
      - >-
        platform_external_probe_garage_canary.host | default('') is match(
          '^(?=.{1,253}$)[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?'
          ~ '(?:[.][a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)+$'
        )
      - platform_external_probe_garage_canary.host | default('') is search('[a-z]')
      - platform_external_probe_garage_canary.port | default(0) is integer
      - platform_external_probe_garage_canary.port == 443
      - platform_external_probe_garage_canary.region | default('') is match('^[a-z][a-z0-9-]{0,31}$')
      - platform_external_probe_garage_canary.bucket | default('') is match('^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$')
      - platform_external_probe_garage_canary.object_key | default('') is match('^canary/[a-z0-9][a-z0-9_.-]{0,62}$')
      - platform_external_probe_garage_canary.bucket == 'observer-canary-' ~ platform_external_probe_observer_id
      - platform_external_probe_garage_canary.object_key == 'canary/' ~ platform_external_probe_observer_id
      - platform_external_probe_observer_id is match('^[a-z0-9][a-z0-9-]{0,62}$')
      - platform_external_probe_garage_canary.client_cert_file | basename == 'garage-' ~ platform_external_probe_observer_id ~ '.crt'
      - platform_external_probe_garage_canary.client_key_file | basename == 'garage-' ~ platform_external_probe_observer_id ~ '.key'
      - platform_external_probe_garage_canary.credentials_file | basename == 'garage-' ~ platform_external_probe_observer_id ~ '.json'
      - platform_external_probe_garage_canary.ca_file | default('') is match('^/(?:etc|run)/[A-Za-z0-9_./-]+$')
      - platform_external_probe_garage_canary.client_cert_file | default('') is match('^/(?:etc|run)/[A-Za-z0-9_./-]+$')
      - platform_external_probe_garage_canary.client_key_file | default('') is match('^/(?:etc|run)/[A-Za-z0-9_./-]+$')
      - platform_external_probe_garage_canary.credentials_file | default('') is match('^/(?:etc|run)/[A-Za-z0-9_./-]+[.]json$')
      - "'..' not in platform_external_probe_garage_canary.ca_file.split('/')"
      - "'..' not in platform_external_probe_garage_canary.client_cert_file.split('/')"
      - "'..' not in platform_external_probe_garage_canary.client_key_file.split('/')"
      - "'..' not in platform_external_probe_garage_canary.credentials_file.split('/')"
      - platform_external_probe_garage_timer_interval == '30s'
      - platform_external_probe_garage_request_timeout is integer
      - platform_external_probe_garage_request_timeout == 3
      - platform_external_probe_garage_run_timeout is integer
      - platform_external_probe_garage_run_timeout == 10
      - platform_external_probe_garage_python_path == '/usr/bin/python3'
      - platform_external_probe_garage_metrics_path not in [platform_external_probe_metrics_path, platform_external_probe_postgresql_metrics_path]
      - platform_external_probe_garage_script_path not in [platform_external_probe_script_path, platform_external_probe_postgresql_script_path]
      - platform_external_probe_garage_service_name not in [platform_external_probe_service_name, platform_external_probe_postgresql_service_name]
      - platform_external_probe_garage_timer_name not in [platform_external_probe_timer_name, platform_external_probe_postgresql_timer_name]
    fail_msg: >-
      The Garage semantic canary requires the locked thirty-second, fixed-key,
      mTLS and SigV4 PUT, GET, verify, and DELETE contract.
  when: platform_external_probe_garage_canary | length > 0
