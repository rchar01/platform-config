---
- name: Assert monitoring etcd member contract
  ansible.builtin.assert:
    that:
      - monitoring_etcd_member is mapping
      - monitoring_etcd_member.keys() | list | sort == ['address', 'dns', 'name']
      - monitoring_etcd_member.name is string
      - monitoring_etcd_member.address is string
      - monitoring_etcd_member.dns is string
      - >-
        monitoring_etcd_member.name
        is match('^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$')
      - >-
        monitoring_etcd_member.address is match(
          '^(0|[1-9][0-9]{0,2})([.](0|[1-9][0-9]{0,2})){3}$'
        )
      - >-
        monitoring_etcd_member.address.split('.') | map('int')
        | select('gt', 255) | list | length == 0
      - >-
        monitoring_etcd_member.dns is match(
          '^(?=.{1,253}$)[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?'
          ~ '(?:[.][a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)+$'
        )
    fail_msg: >-
      Monitoring etcd members require exactly one safe name, canonical IPv4
      address, and lowercase FQDN identity.
