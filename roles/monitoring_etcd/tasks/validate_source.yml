---
- name: Assert monitoring etcd allowed source
  ansible.builtin.assert:
    that:
      - monitoring_etcd_allowed_source is string
      - >-
        monitoring_etcd_allowed_source is match(
          '^(0|[1-9][0-9]{0,2})([.](0|[1-9][0-9]{0,2})){3}'
          ~ '/(3[0-2]|[12]?[0-9])$'
        )
      - >-
        monitoring_etcd_allowed_source.split('/')[0].split('.')
        | map('int') | select('gt', 255) | list | length == 0
    fail_msg: >-
      Monitoring etcd additional client sources require canonical IPv4 CIDRs.
