---
- name: Assert monitoring etcd lifecycle selectors
  ansible.builtin.assert:
    that:
      - monitoring_etcd_enabled is boolean
      - monitoring_etcd_converge is boolean
      - not monitoring_etcd_converge or monitoring_etcd_enabled
      - monitoring_etcd_service_enabled is boolean
      - not monitoring_etcd_service_enabled
      - monitoring_etcd_service_state == 'stopped'
    fail_msg: >-
      Monitoring etcd convergence requires explicit enabled ownership and keeps
      the service disabled and stopped. Activation is a separate cluster-wide
      maintenance gate.

- name: Validate staged monitoring etcd contract
  ansible.builtin.include_tasks: validate.yml
  when: monitoring_etcd_enabled

- name: Converge inactive monitoring etcd foundation
  ansible.builtin.include_tasks: converge.yml
  when:
    - monitoring_etcd_enabled
    - monitoring_etcd_converge
