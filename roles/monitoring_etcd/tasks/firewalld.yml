---
- name: Build current monitoring etcd firewalld policy
  ansible.builtin.set_fact:
    monitoring_etcd_current_firewalld_rules: []

- name: Add monitoring etcd client firewalld policy
  ansible.builtin.set_fact:
    monitoring_etcd_current_firewalld_rules: >-
      {{
        monitoring_etcd_current_firewalld_rules
        + [
          'rule family="ipv4" source address="' ~ monitoring_etcd_source
          ~ '" port port="' ~ (monitoring_etcd_client_port | string)
          ~ '" protocol="tcp" accept'
        ]
      }}
  loop: >-
    {{
      (
        monitoring_etcd_cluster_members
        | map(attribute='address')
        | map('regex_replace', '$', '/32')
        | list
        + monitoring_etcd_client_allowed_sources
      )
      | unique
      | sort
    }}
  loop_control:
    loop_var: monitoring_etcd_source

- name: Add monitoring etcd peer firewalld policy
  ansible.builtin.set_fact:
    monitoring_etcd_current_firewalld_rules: >-
      {{
        monitoring_etcd_current_firewalld_rules
        + [
          'rule family="ipv4" source address="' ~ monitoring_etcd_member.address
          ~ '/32" port port="' ~ (monitoring_etcd_peer_port | string)
          ~ '" protocol="tcp" accept'
        ]
      }}
  loop: >-
    {{
      monitoring_etcd_cluster_members
      | rejectattr('name', 'equalto', monitoring_etcd_node_name)
      | list
    }}
  loop_control:
    loop_var: monitoring_etcd_member
    label: "{{ monitoring_etcd_member.name }}"

- name: Inspect previous monitoring etcd firewalld manifest
  ansible.builtin.stat:
    path: "{{ monitoring_etcd_firewalld_manifest_path }}"
    follow: false
  register: monitoring_etcd_firewalld_manifest_stat
  check_mode: false

- name: Reject unsafe monitoring etcd firewalld manifest
  ansible.builtin.assert:
    that:
      - >-
        not monitoring_etcd_firewalld_manifest_stat.stat.exists
        or (
          monitoring_etcd_firewalld_manifest_stat.stat.isreg
          and not monitoring_etcd_firewalld_manifest_stat.stat.islnk
          and monitoring_etcd_firewalld_manifest_stat.stat.pw_name == 'root'
          and monitoring_etcd_firewalld_manifest_stat.stat.gr_name == 'root'
          and monitoring_etcd_firewalld_manifest_stat.stat.mode[-2:]
              is not search('[2367]')
        )
    fail_msg: >-
      Monitoring etcd firewalld state must be a safe root-owned regular file.

- name: Read previous monitoring etcd firewalld manifest
  ansible.builtin.slurp:
    path: "{{ monitoring_etcd_firewalld_manifest_path }}"
  register: monitoring_etcd_firewalld_manifest_data
  check_mode: false
  when: monitoring_etcd_firewalld_manifest_stat.stat.exists

- name: Track previous monitoring etcd firewalld policy
  ansible.builtin.set_fact:
    monitoring_etcd_previous_firewalld_manifest: >-
      {{
        (monitoring_etcd_firewalld_manifest_data.content | b64decode | from_yaml)
        if monitoring_etcd_firewalld_manifest_stat.stat.exists
        else {'zone': monitoring_etcd_firewalld_zone, 'rich_rules': []}
      }}

- name: Validate previous monitoring etcd firewalld policy
  ansible.builtin.assert:
    that:
      - monitoring_etcd_previous_firewalld_manifest is mapping
      - >-
        monitoring_etcd_previous_firewalld_manifest.keys() | sort
        == ['rich_rules', 'zone']
      - >-
        monitoring_etcd_previous_firewalld_manifest.zone
        == monitoring_etcd_firewalld_zone
      - monitoring_etcd_previous_firewalld_manifest.rich_rules is sequence
      - monitoring_etcd_previous_firewalld_manifest.rich_rules is not string
    fail_msg: Monitoring etcd firewalld state has an invalid schema or zone.

- name: Validate previous monitoring etcd firewalld rules
  ansible.builtin.include_tasks: validate_firewalld_rule.yml
  loop: "{{ monitoring_etcd_previous_firewalld_manifest.rich_rules }}"
  loop_control:
    loop_var: monitoring_etcd_previous_firewalld_rule
    label: previous-rule

- name: Disable stale monitoring etcd firewalld policy
  ansible.posix.firewalld:
    zone: "{{ monitoring_etcd_firewalld_zone }}"
    rich_rule: "{{ monitoring_etcd_firewalld_rule }}"
    permanent: true
    immediate: >-
      {{
        firewalld_service_state | default('stopped')
        in ['started', 'restarted', 'reloaded']
      }}
    offline: true
    state: disabled
  loop: >-
    {{
      monitoring_etcd_previous_firewalld_manifest.rich_rules
      | difference(monitoring_etcd_current_firewalld_rules)
    }}
  loop_control:
    loop_var: monitoring_etcd_firewalld_rule
  when: firewalld_dependencies_ready | default(true) | bool

- name: Enable current monitoring etcd firewalld policy
  ansible.posix.firewalld:
    zone: "{{ monitoring_etcd_firewalld_zone }}"
    rich_rule: "{{ monitoring_etcd_firewalld_rule }}"
    permanent: true
    immediate: >-
      {{
        firewalld_service_state | default('stopped')
        in ['started', 'restarted', 'reloaded']
      }}
    offline: true
    state: enabled
  loop: "{{ monitoring_etcd_current_firewalld_rules | unique | sort }}"
  loop_control:
    loop_var: monitoring_etcd_firewalld_rule
  when: firewalld_dependencies_ready | default(true) | bool

- name: Write monitoring etcd firewalld manifest
  ansible.builtin.copy:
    dest: "{{ monitoring_etcd_firewalld_manifest_path }}"
    owner: root
    group: root
    mode: "0644"
    content: >-
      {{
        {
          'zone': monitoring_etcd_firewalld_zone,
          'rich_rules': monitoring_etcd_current_firewalld_rules | unique | sort
        }
        | to_nice_yaml
      }}
  when: firewalld_dependencies_ready | default(true) | bool
