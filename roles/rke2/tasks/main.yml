---
- name: Assert RKE2 inputs are configured
  ansible.builtin.assert:
    that:
      - rke2_node_role in ['server', 'agent']
      - rke2_token_src | length > 0
      - rke2_cni | length > 0
      - platform_ingress_controller in ['traefik', 'kong']
      - kong_ingress_enabled is not defined
      - "'ingress-controller' not in rke2_extra_config"
      - groups.get(rke2_server_group, []) | length > 0
      - rke2_version | length > 0 or rke2_allow_unpinned | bool
    fail_msg: >-
      RKE2 requires server/agent groups, rke2_token_src, rke2_cni, a supported
      platform_ingress_controller, and an explicit rke2_version pin. Configure
      ingress through platform_ingress_controller rather than rke2_extra_config.
      Remove the retired kong_ingress_enabled variable before applying this role.
      Set rke2_allow_unpinned=true only for intentional one-off discovery installs.

- name: Assert bundled Traefik NodePorts are configured
  ansible.builtin.assert:
    that:
      - rke2_traefik_node_port_min | int > 0
      - rke2_traefik_node_port_max | int >= rke2_traefik_node_port_min | int
      - rke2_traefik_http_node_port | int >= rke2_traefik_node_port_min | int
      - rke2_traefik_http_node_port | int <= rke2_traefik_node_port_max | int
      - rke2_traefik_https_node_port | int >= rke2_traefik_node_port_min | int
      - rke2_traefik_https_node_port | int <= rke2_traefik_node_port_max | int
      - rke2_traefik_http_node_port | int != rke2_traefik_https_node_port | int
    fail_msg: "Bundled Traefik requires distinct HTTP and HTTPS NodePorts within the configured range."
  when: platform_ingress_controller == 'traefik'

- name: Check RKE2 token source on control node
  ansible.builtin.stat:
    path: "{{ rke2_token_src }}"
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false
  register: rke2_token_src_stat

- name: Assert RKE2 token source exists on control node
  ansible.builtin.assert:
    that:
      - rke2_token_src_stat.stat.exists
      - rke2_token_src_stat.stat.isreg
    fail_msg: "RKE2 token file does not exist on the control node: {{ rke2_token_src }}"

- name: Assert RKE2 token source permissions are private
  ansible.builtin.assert:
    that:
      - rke2_token_src_stat.stat.mode is match('^0?[46]00$')
    fail_msg: "RKE2 token file should be readable only by its owner: {{ rke2_token_src }}"

- name: Check RKE2 registry CA source when configured
  ansible.builtin.stat:
    path: "{{ rke2_registry_ca_src }}"
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false
  register: rke2_registry_ca_src_stat
  when: rke2_registry_ca_src | length > 0

- name: Assert RKE2 registry CA source exists when configured
  ansible.builtin.assert:
    that:
      - rke2_registry_ca_src_stat.stat.exists
      - rke2_registry_ca_src_stat.stat.isreg
    fail_msg: "RKE2 registry CA file does not exist on the control node: {{ rke2_registry_ca_src }}"
  when: rke2_registry_ca_src | length > 0

- name: Persist RKE2 kernel modules
  ansible.builtin.copy:
    dest: /etc/modules-load.d/rke2.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      {% for module in rke2_kernel_modules %}
      {{ module }}
      {% endfor %}

- name: Load RKE2 kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: "{{ rke2_kernel_modules }}"

- name: Configure RKE2 sysctl settings
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_set: true
    state: present
    reload: true
  loop: "{{ rke2_sysctl | dict2items }}"

- name: Check installed RKE2 binary
  ansible.builtin.stat:
    path: "{{ rke2_binary_path }}"
  register: rke2_binary_stat

- name: Check existing RKE2 kubeconfig
  ansible.builtin.stat:
    path: "{{ rke2_kubeconfig }}"
  register: rke2_kubeconfig_stat
  when:
    - platform_ingress_controller == 'traefik'
    - inventory_hostname == rke2_bootstrap_host

- name: Check for the managed Kong manifest before enabling Traefik
  ansible.builtin.stat:
    path: "{{ rke2_kong_manifest_path }}"
  register: rke2_kong_manifest_stat
  when:
    - platform_ingress_controller == 'traefik'
    - inventory_hostname == rke2_bootstrap_host

- name: Check for RKE2-managed Kong resources before enabling Traefik
  ansible.builtin.command:
    argv:
      - "{{ rke2_kubectl }}"
      - --kubeconfig
      - "{{ rke2_kubeconfig }}"
      - -n
      - kube-system
      - get
      - addon/kong-ingress
      - helmchart/kong
      - --ignore-not-found
      - -o=name
  register: rke2_kong_cluster_resources
  check_mode: false
  changed_when: false
  when:
    - platform_ingress_controller == 'traefik'
    - inventory_hostname == rke2_bootstrap_host
    - rke2_binary_stat.stat.exists
    - rke2_kubeconfig_stat.stat.exists

- name: Check for the Kong IngressClass before enabling Traefik
  ansible.builtin.command:
    argv:
      - "{{ rke2_kubectl }}"
      - --kubeconfig
      - "{{ rke2_kubeconfig }}"
      - get
      - ingressclass/kong
      - --ignore-not-found
      - -o=name
  register: rke2_kong_ingressclass
  check_mode: false
  changed_when: false
  when:
    - platform_ingress_controller == 'traefik'
    - inventory_hostname == rke2_bootstrap_host
    - rke2_binary_stat.stat.exists
    - rke2_kubeconfig_stat.stat.exists

- name: Check for the Kong proxy service before enabling Traefik
  ansible.builtin.command:
    argv:
      - "{{ rke2_kubectl }}"
      - --kubeconfig
      - "{{ rke2_kubeconfig }}"
      - get
      - service
      - --all-namespaces
      - --field-selector=metadata.name=kong-gateway-proxy
      - -o=name
  register: rke2_kong_proxy_service
  check_mode: false
  changed_when: false
  when:
    - platform_ingress_controller == 'traefik'
    - inventory_hostname == rke2_bootstrap_host
    - rke2_binary_stat.stat.exists
    - rke2_kubeconfig_stat.stat.exists

- name: Assert Kong is absent before enabling Traefik
  ansible.builtin.assert:
    that:
      - not rke2_kong_manifest_stat.stat.exists
      - not rke2_binary_stat.stat.exists or not rke2_kubeconfig_stat.stat.exists or rke2_kong_cluster_resources.stdout | length == 0
      - not rke2_binary_stat.stat.exists or not rke2_kubeconfig_stat.stat.exists or rke2_kong_ingressclass.stdout | length == 0
      - not rke2_binary_stat.stat.exists or not rke2_kubeconfig_stat.stat.exists or rke2_kong_proxy_service.stdout | length == 0
    fail_msg: >-
      Kong resources remain on this cluster. Migrate application Ingress resources
      and explicitly uninstall Kong before selecting bundled Traefik.
  when:
    - platform_ingress_controller == 'traefik'
    - inventory_hostname == rke2_bootstrap_host

- name: Ensure RKE2 configuration directory exists
  ansible.builtin.file:
    path: "{{ rke2_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure RKE2 server manifest directory exists
  ansible.builtin.file:
    path: "{{ rke2_server_manifest_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: rke2_node_role == 'server'

- name: Configure bundled Traefik NodePorts on the bootstrap server
  ansible.builtin.template:
    src: rke2-traefik-helmchartconfig.yaml.j2
    dest: "{{ rke2_traefik_helmchartconfig_path }}"
    owner: root
    group: root
    mode: "0644"
  when:
    - platform_ingress_controller == 'traefik'
    - inventory_hostname == rke2_bootstrap_host

- name: Remove bundled Traefik configuration when Kong is selected
  ansible.builtin.file:
    path: "{{ rke2_traefik_helmchartconfig_path }}"
    state: absent
  when:
    - platform_ingress_controller == 'kong'
    - inventory_hostname == rke2_bootstrap_host

- name: Copy RKE2 cluster token
  ansible.builtin.copy:
    src: "{{ rke2_token_src }}"
    dest: "{{ rke2_token_path }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart RKE2

- name: Copy RKE2 registry CA certificate
  ansible.builtin.copy:
    src: "{{ rke2_registry_ca_src }}"
    dest: "{{ rke2_registry_ca_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart RKE2
  when: rke2_registry_ca_src | length > 0

- name: Write RKE2 configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ rke2_config_path }}"
    owner: root
    group: root
    mode: "0600"
  notify: Restart RKE2

- name: Write RKE2 registries configuration
  ansible.builtin.template:
    src: registries.yaml.j2
    dest: "{{ rke2_registries_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart RKE2
  when: rke2_registry_mirrors | length > 0 or rke2_registry_configs | length > 0

- name: Remove RKE2 registries configuration when unused
  ansible.builtin.file:
    path: "{{ rke2_registries_path }}"
    state: absent
  notify: Restart RKE2
  when: rke2_registry_mirrors | length == 0 and rke2_registry_configs | length == 0

- name: Check installed RKE2 version
  ansible.builtin.command:
    argv:
      - "{{ rke2_binary_path }}"
      - --version
  register: rke2_installed_version
  changed_when: false
  when: rke2_binary_stat.stat.exists

- name: Download RKE2 install script
  ansible.builtin.get_url:
    url: "{{ rke2_install_script_url }}"
    dest: "{{ rke2_install_script_path }}"
    owner: root
    group: root
    mode: "0755"
  when: not ansible_check_mode

- name: Install RKE2
  ansible.builtin.command:
    argv:
      - /bin/sh
      - "{{ rke2_install_script_path }}"
  environment:
    INSTALL_RKE2_TYPE: "{{ rke2_node_role }}"
    INSTALL_RKE2_CHANNEL: "{{ rke2_channel }}"
    INSTALL_RKE2_VERSION: "{{ rke2_version }}"
  changed_when: true
  when:
    - not ansible_check_mode
    - >-
      not rke2_binary_stat.stat.exists or
      (rke2_version | length > 0 and not (rke2_installed_version.stdout is search('^rke2 version ' ~ (rke2_version | regex_escape) ~ ' ')))

- name: Manage RKE2 service
  ansible.builtin.systemd_service:
    name: "{{ rke2_service_name }}"
    enabled: "{{ rke2_service_enabled }}"
    state: "{{ rke2_service_state }}"
  when: not ansible_check_mode

- name: Wait for RKE2 supervisor on server nodes
  ansible.builtin.wait_for:
    host: "{{ rke2_node_ip }}"
    port: 9345
    timeout: "{{ rke2_wait_for_supervisor_timeout }}"
  when:
    - not ansible_check_mode
    - rke2_node_role == 'server'

- name: Manage RKE2 cluster firewalld rich rules
  ansible.posix.firewalld:
    rich_rule: "rule family=\"{{ 'ipv6' if ':' in item else 'ipv4' }}\" source address=\"{{ item }}\" accept"
    permanent: true
    immediate: "{{ (firewalld_service_state | default('stopped')) in ['started', 'restarted', 'reloaded'] }}"
    offline: true
    state: enabled
  loop: "{{ rke2_firewalld_cluster_sources }}"
  when:
    - rke2_firewalld_manage | bool
    - rke2_firewalld_cluster_sources | length > 0
    - firewalld_dependencies_ready | default(true)

- name: Manage RKE2 API firewalld rich rules
  ansible.posix.firewalld:
    rich_rule: "rule family=\"{{ 'ipv6' if ':' in item.0 else 'ipv4' }}\" source address=\"{{ item.0 }}\" port port=\"{{ item.1 }}\" protocol=\"tcp\" accept"
    permanent: true
    immediate: "{{ (firewalld_service_state | default('stopped')) in ['started', 'restarted', 'reloaded'] }}"
    offline: true
    state: enabled
  loop: "{{ rke2_firewalld_api_sources | product(rke2_firewalld_api_ports) | list }}"
  when:
    - rke2_firewalld_manage | bool
    - rke2_node_role == 'server'
    - rke2_firewalld_api_sources | length > 0
    - firewalld_dependencies_ready | default(true)
