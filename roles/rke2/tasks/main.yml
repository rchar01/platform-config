---
- name: Validate RKE2 registry mirror configuration
  ansible.builtin.import_tasks: validate_registry_mirrors.yml

- name: Validate RKE2 RPM source configuration
  ansible.builtin.import_tasks: validate_rpm_sources.yml

- name: Assert RKE2 inputs are configured
  ansible.builtin.assert:
    that:
      - rke2_node_role in ['server', 'agent']
      - rke2_token_src | length > 0
      - rke2_cni | length > 0
      - platform_ingress_controller in ['traefik', 'kong']
      - kong_ingress_enabled is not defined
      - "'ingress-controller' not in rke2_extra_config"
      - "'disable-default-registry-endpoint' not in rke2_extra_config"
      - rke2_registry_configs is mapping
      - rke2_kernel_module_package_state in ['present', 'latest']
      - rke2_kernel_module_reboot_timeout | int > 0
      - rke2_kernel_module_reboot_marker_path | length > 0
      - rke2_kernel_module_readiness_marker_path | length > 0
      - rke2_kernel_module_reboot_marker_path != rke2_kernel_module_readiness_marker_path
      - groups.get(rke2_server_group, []) | length > 0
      - rke2_version is match('^v[0-9]+\.[0-9]+\.[0-9]+\+rke2r[0-9]+$')
      - rke2_rpm_common_repository_id | length > 0
      - rke2_rpm_version_repository_id | length > 0
      - rke2_rpm_common_repository_id != rke2_rpm_version_repository_id
      - rke2_rpm_repository_file | length > 0
      - rke2_rpm_el_major is match('^[0-9]+$')
      - ansible_distribution_major_version == rke2_rpm_el_major
      - ansible_architecture == rke2_rpm_arch
      - rke2_rpm_package_release is match('^[0-9]+\.el[0-9]+$')
      - rke2_rpm_selinux_package_nevra is match('^rke2-selinux-[0-9][A-Za-z0-9_.~+-]*-[0-9]+\.el[0-9]+\.noarch$')
      - rke2_rpm_gpg_key_sha256 is match('^[0-9a-f]{64}$')
      - rke2_rpm_gpg_key_fingerprint is match('^[0-9A-F]{40}$')
      - >-
        hostvars[rke2_bootstrap_host].ansible_ssh_private_key_file
        | default('')
        | length > 0
    fail_msg: >-
      RKE2 requires server/agent groups, rke2_token_src, rke2_cni, a supported
      platform_ingress_controller, an exact rke2_version and native RPM release,
      reviewed HTTPS common and version repository URLs, and a reviewed RPM key
      URL with its lowercase SHA-256 and uppercase fingerprint. The configured
      EL major and architecture must match the managed host. Configure ingress
      through platform_ingress_controller rather than rke2_extra_config and
      remove the retired kong_ingress_enabled variable before applying this role.
      The rke2_bootstrap_host must resolve to an inventory host with a non-empty
      ansible_ssh_private_key_file for delegated readiness checks.

- name: Schedule RKE2 restart after system registry trust changes
  ansible.builtin.debug:
    msg: System registry trust changed; RKE2 will restart before readiness checks.
  changed_when: true
  notify: Restart RKE2
  when:
    - registry_ca_trust_refresh_required | default(false) | bool
    - rke2_service_enabled | bool
    - rke2_service_state == 'started'

- name: Record exact RKE2 RPM package identity
  ansible.builtin.set_fact:
    rke2_rpm_version: >-
      {{ rke2_version | regex_replace('^v', '') | regex_replace('[+-]', '~') }}
    rke2_rpm_node_package_nevra: >-
      rke2-{{ rke2_node_role }}-{{ rke2_version | regex_replace('^v', '') | regex_replace('[+-]', '~') }}-{{ rke2_rpm_package_release }}.{{ rke2_rpm_arch }}

- name: Assert bundled Traefik NodePorts are configured
  ansible.builtin.assert:
    that:
      - rke2_traefik_node_port_min | int > 0
      - rke2_traefik_node_port_max | int >= rke2_traefik_node_port_min | int
      - rke2_traefik_http_node_port | int >= rke2_traefik_node_port_min | int
      - rke2_traefik_http_node_port | int <= rke2_traefik_node_port_max | int
      - rke2_traefik_https_node_port | int >= rke2_traefik_node_port_min | int
      - rke2_traefik_https_node_port | int <= rke2_traefik_node_port_max | int
      - rke2_traefik_http_node_port | int != rke2_traefik_https_node_port | int
    fail_msg: "Bundled Traefik requires distinct HTTP and HTTPS NodePorts within the configured range."
  when: platform_ingress_controller == 'traefik'

- name: Check RKE2 token source on control node
  ansible.builtin.stat:
    path: "{{ rke2_token_src }}"
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false
  register: rke2_token_src_stat

- name: Assert RKE2 token source exists on control node
  ansible.builtin.assert:
    that:
      - rke2_token_src_stat.stat.exists
      - rke2_token_src_stat.stat.isreg
    fail_msg: "RKE2 token file does not exist on the control node: {{ rke2_token_src }}"

- name: Assert RKE2 token source permissions are private
  ansible.builtin.assert:
    that:
      - rke2_token_src_stat.stat.mode is match('^0?[46]00$')
    fail_msg: "RKE2 token file should be readable only by its owner: {{ rke2_token_src }}"

- name: Check RKE2 registry CA source when configured
  ansible.builtin.stat:
    path: "{{ rke2_registry_ca_src }}"
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false
  register: rke2_registry_ca_src_stat
  when: rke2_registry_ca_src | length > 0

- name: Assert RKE2 registry CA source exists when configured
  ansible.builtin.assert:
    that:
      - rke2_registry_ca_src_stat.stat.exists
      - rke2_registry_ca_src_stat.stat.isreg
    fail_msg: "RKE2 registry CA file does not exist on the control node: {{ rke2_registry_ca_src }}"
  when: rke2_registry_ca_src | length > 0

- name: Install RKE2 kernel module packages
  ansible.builtin.package:
    name: "{{ rke2_kernel_module_packages }}"
    state: "{{ rke2_kernel_module_package_state }}"
  when: rke2_kernel_module_packages | length > 0

- name: Inspect RKE2 kernel modules after package installation
  ansible.builtin.command:
    argv:
      - modinfo
      - "{{ item }}"
  loop: "{{ rke2_kernel_modules }}"
  register: rke2_kernel_module_inspection
  check_mode: false
  changed_when: false
  failed_when: false

- name: Record unavailable RKE2 kernel modules
  ansible.builtin.set_fact:
    rke2_unavailable_kernel_modules: >-
      {{
        rke2_kernel_module_inspection.results
        | selectattr('rc', 'ne', 0)
        | map(attribute='item')
        | list
      }}

- name: Check for an incomplete RKE2 kernel transition
  ansible.builtin.stat:
    path: "{{ rke2_kernel_module_reboot_marker_path }}"
  register: rke2_kernel_module_reboot_marker_stat

- name: Check for incomplete post-reboot RKE2 readiness
  ansible.builtin.stat:
    path: "{{ rke2_kernel_module_readiness_marker_path }}"
  register: rke2_kernel_module_readiness_marker_stat

- name: Read the incomplete RKE2 kernel transition target
  ansible.builtin.slurp:
    src: "{{ rke2_kernel_module_reboot_marker_path }}"
  register: rke2_kernel_module_reboot_marker
  when: rke2_kernel_module_reboot_marker_stat.stat.exists

- name: Record the incomplete RKE2 kernel transition target
  ansible.builtin.set_fact:
    rke2_previous_kernel_reboot_target: >-
      {{
        (rke2_kernel_module_reboot_marker.content | b64decode | trim)
        if rke2_kernel_module_reboot_marker_stat.stat.exists
        else ''
      }}

- name: Stop after an unsuccessful RKE2 kernel transition
  ansible.builtin.assert:
    that:
      - >-
        not rke2_kernel_module_reboot_marker_stat.stat.exists
        or rke2_previous_kernel_reboot_target == ansible_facts['kernel']
    fail_msg: >-
      The previous reboot expected kernel {{ rke2_previous_kernel_reboot_target }}
      but the host returned on {{ ansible_facts['kernel'] }} without required modules.
      Correct the bootloader target and remove
      {{ rke2_kernel_module_reboot_marker_path }} only after verification.
  when: not ansible_check_mode

- name: Clear a completed RKE2 kernel transition marker
  ansible.builtin.file:
    path: "{{ rke2_kernel_module_reboot_marker_path }}"
    state: absent
  when:
    - not ansible_check_mode
    - rke2_kernel_module_reboot_marker_stat.stat.exists
    - rke2_previous_kernel_reboot_target == ansible_facts['kernel']
    - rke2_unavailable_kernel_modules | length == 0

- name: Read the default boot kernel
  ansible.builtin.command:
    argv:
      - "{{ rke2_grubby_path }}"
      - --default-kernel
  register: rke2_default_kernel_command
  check_mode: false
  changed_when: false
  failed_when: false
  when: rke2_unavailable_kernel_modules | length > 0

- name: Record the default boot kernel release
  ansible.builtin.set_fact:
    rke2_default_kernel_release: >-
      {{
        (rke2_default_kernel_command.stdout | basename | regex_replace('^vmlinuz-', ''))
        if rke2_default_kernel_command.rc | default(1) == 0
        else ''
      }}

- name: Inspect RKE2 modules for the default boot kernel
  ansible.builtin.command:
    argv:
      - modinfo
      - -k
      - "{{ rke2_default_kernel_release }}"
      - "{{ item }}"
  loop: "{{ rke2_kernel_modules }}"
  register: rke2_default_kernel_module_inspection
  check_mode: false
  changed_when: false
  failed_when: false
  when:
    - rke2_unavailable_kernel_modules | length > 0
    - rke2_default_kernel_release | length > 0
    - rke2_default_kernel_release != ansible_facts['kernel']

- name: Determine whether a kernel reboot can resolve module availability
  ansible.builtin.set_fact:
    rke2_kernel_module_reboot_eligible: >-
      {{
        rke2_unavailable_kernel_modules | length > 0
        and not rke2_kernel_module_reboot_marker_stat.stat.exists
        and rke2_default_kernel_release | length > 0
        and rke2_default_kernel_release != ansible_facts['kernel']
        and (
          rke2_default_kernel_module_inspection.results | default([])
          | selectattr('rc', 'defined') | list | length
          == rke2_kernel_modules | length
        )
        and (
          rke2_default_kernel_module_inspection.results | default([])
          | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0)
          | list | length == 0
        )
      }}

- name: Assert unavailable modules have a verified reboot path
  ansible.builtin.assert:
    that:
      - >-
        rke2_unavailable_kernel_modules | length == 0
        or (rke2_reboot_for_kernel_modules | bool and rke2_kernel_module_reboot_eligible | bool)
    fail_msg: >-
      Modules {{ rke2_unavailable_kernel_modules | join(', ') }} are unavailable
      for running kernel {{ ansible_facts['kernel'] }}, and default boot kernel
      {{ rke2_default_kernel_release | default('unknown') }} does not provide a
      verified reboot path. Install matching module packages or select a boot
      kernel that provides every required module.
  when: not ansible_check_mode

- name: Check installed RKE2 binary before a prerequisite reboot
  ansible.builtin.stat:
    path: "{{ rke2_binary_path }}"
  register: rke2_binary_stat

- name: Read RKE2 service state before a prerequisite reboot
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - "{{ rke2_service_name }}"
  register: rke2_pre_reboot_service_active
  check_mode: false
  changed_when: false
  failed_when: false
  when: rke2_binary_stat.stat.exists

- name: Determine whether post-reboot RKE2 readiness is required
  ansible.builtin.set_fact:
    rke2_post_reboot_readiness_required: >-
      {{
        rke2_kernel_module_readiness_marker_stat.stat.exists
        or (
          rke2_kernel_module_reboot_eligible | bool
          and rke2_binary_stat.stat.exists
        )
      }}

- name: Require an installed RKE2 node to be active before reboot
  ansible.builtin.assert:
    that:
      - rke2_pre_reboot_service_active.stdout | default('') == 'active'
    fail_msg: >-
      {{ rke2_service_name }} is installed but not active. Restore the existing
      node and cluster health before allowing a prerequisite kernel reboot.
  when:
    - rke2_kernel_module_reboot_eligible | bool
    - rke2_binary_stat.stat.exists

- name: Verify an existing RKE2 server API before prerequisite reboot
  ansible.builtin.command:
    argv:
      - "{{ rke2_kubectl }}"
      - --kubeconfig
      - "{{ rke2_kubeconfig }}"
      - get
      - --raw=/readyz
  register: rke2_pre_reboot_api_ready
  retries: 12
  delay: 5
  until:
    - rke2_pre_reboot_api_ready.rc == 0
    - rke2_pre_reboot_api_ready.stdout == 'ok'
  check_mode: false
  changed_when: false
  when:
    - rke2_kernel_module_reboot_eligible | bool
    - rke2_binary_stat.stat.exists
    - rke2_node_role == 'server'

- name: Verify an existing RKE2 node is Ready before prerequisite reboot
  ansible.builtin.command:
    argv:
      - "{{ rke2_kubectl }}"
      - --kubeconfig
      - "{{ rke2_kubeconfig }}"
      - get
      - node
      - "{{ rke2_node_name }}"
      - -o=jsonpath={.status.conditions[?(@.type=="Ready")].status}
  delegate_to: "{{ rke2_bootstrap_host }}"
  vars:
    ansible_ssh_private_key_file: >-
      {{ hostvars[rke2_bootstrap_host].ansible_ssh_private_key_file }}
  register: rke2_pre_reboot_node_ready
  retries: 12
  delay: 5
  until:
    - rke2_pre_reboot_node_ready.rc == 0
    - rke2_pre_reboot_node_ready.stdout == 'True'
  check_mode: false
  changed_when: false
  when:
    - rke2_kernel_module_reboot_eligible | bool
    - rke2_binary_stat.stat.exists

- name: Record the verified RKE2 kernel reboot target
  ansible.builtin.copy:
    dest: "{{ rke2_kernel_module_reboot_marker_path }}"
    content: "{{ rke2_default_kernel_release }}\n"
    owner: root
    group: root
    mode: "0600"
  when:
    - not ansible_check_mode
    - rke2_kernel_module_reboot_eligible | bool

- name: Record pending post-reboot RKE2 readiness
  ansible.builtin.copy:
    dest: "{{ rke2_kernel_module_readiness_marker_path }}"
    content: "{{ rke2_node_name }}\n"
    owner: root
    group: root
    mode: "0600"
  when:
    - not ansible_check_mode
    - rke2_kernel_module_reboot_eligible | bool
    - rke2_binary_stat.stat.exists

- name: Reboot into a kernel with verified RKE2 modules
  ansible.builtin.reboot:
    msg: "Rebooting to activate kernel modules required by RKE2"
    reboot_timeout: "{{ rke2_kernel_module_reboot_timeout }}"
    post_reboot_delay: 5
  register: rke2_kernel_module_reboot
  when:
    - not ansible_check_mode
    - rke2_reboot_for_kernel_modules | bool
    - rke2_kernel_module_reboot_eligible | bool

- name: Refresh kernel facts after an RKE2 prerequisite reboot
  ansible.builtin.setup:
    filter: ansible_kernel
  when:
    - not ansible_check_mode
    - rke2_kernel_module_reboot.changed | default(false)

- name: Assert the verified RKE2 kernel reboot target is active
  ansible.builtin.assert:
    that:
      - ansible_facts['kernel'] == rke2_default_kernel_release
    fail_msg: >-
      The reboot returned on kernel {{ ansible_facts['kernel'] }} instead of the
      verified target {{ rke2_default_kernel_release }}. The transition marker
      remains for operator recovery.
  when:
    - not ansible_check_mode
    - rke2_kernel_module_reboot.changed | default(false)

- name: Verify RKE2 kernel modules are available
  ansible.builtin.command:
    argv:
      - modinfo
      - "{{ item }}"
  loop: "{{ rke2_kernel_modules }}"
  register: rke2_kernel_module_verification
  changed_when: false
  when: not ansible_check_mode

- name: Clear the verified RKE2 kernel reboot target
  ansible.builtin.file:
    path: "{{ rke2_kernel_module_reboot_marker_path }}"
    state: absent
  when:
    - not ansible_check_mode
    - rke2_kernel_module_reboot.changed | default(false)

- name: Wait for an existing RKE2 server after prerequisite reboot
  ansible.builtin.wait_for:
    host: "{{ rke2_node_ip }}"
    port: 9345
    timeout: "{{ rke2_wait_for_supervisor_timeout }}"
  check_mode: false
  when:
    - rke2_post_reboot_readiness_required | bool
    - rke2_binary_stat.stat.exists
    - rke2_node_role == 'server'

- name: Verify an existing RKE2 server API after prerequisite reboot
  ansible.builtin.command:
    argv:
      - "{{ rke2_kubectl }}"
      - --kubeconfig
      - "{{ rke2_kubeconfig }}"
      - get
      - --raw=/readyz
  register: rke2_post_reboot_api_ready
  check_mode: false
  retries: 60
  delay: 5
  until:
    - rke2_post_reboot_api_ready.rc == 0
    - rke2_post_reboot_api_ready.stdout == 'ok'
  changed_when: false
  when:
    - rke2_post_reboot_readiness_required | bool
    - rke2_binary_stat.stat.exists
    - rke2_node_role == 'server'

- name: Verify an existing RKE2 agent after prerequisite reboot
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - "{{ rke2_service_name }}"
  register: rke2_post_reboot_agent_active
  check_mode: false
  retries: 60
  delay: 5
  until: rke2_post_reboot_agent_active.stdout == 'active'
  changed_when: false
  when:
    - rke2_post_reboot_readiness_required | bool
    - rke2_binary_stat.stat.exists
    - rke2_node_role == 'agent'

- name: Assert pending RKE2 readiness has an installed node
  ansible.builtin.assert:
    that:
      - rke2_binary_stat.stat.exists
    fail_msg: >-
      Post-reboot readiness remains pending but {{ rke2_binary_path }} is absent.
      Inspect the node and clear {{ rke2_kernel_module_readiness_marker_path }}
      only after confirming that no existing RKE2 service requires recovery.
  when: rke2_post_reboot_readiness_required | bool

- name: Wait for an existing RKE2 node to return Ready after reboot
  ansible.builtin.command:
    argv:
      - "{{ rke2_kubectl }}"
      - --kubeconfig
      - "{{ rke2_kubeconfig }}"
      - get
      - node
      - "{{ rke2_node_name }}"
      - -o=jsonpath={.status.conditions[?(@.type=="Ready")].status}
  delegate_to: "{{ rke2_bootstrap_host }}"
  vars:
    ansible_ssh_private_key_file: >-
      {{ hostvars[rke2_bootstrap_host].ansible_ssh_private_key_file }}
  register: rke2_post_reboot_node_ready
  check_mode: false
  retries: 60
  delay: 5
  until:
    - rke2_post_reboot_node_ready.rc == 0
    - rke2_post_reboot_node_ready.stdout == 'True'
  changed_when: false
  when:
    - rke2_post_reboot_readiness_required | bool
    - rke2_binary_stat.stat.exists

- name: Clear completed post-reboot RKE2 readiness
  ansible.builtin.file:
    path: "{{ rke2_kernel_module_readiness_marker_path }}"
    state: absent
  when:
    - not ansible_check_mode
    - rke2_post_reboot_readiness_required | bool

- name: Report unavailable RKE2 kernel modules in check mode
  ansible.builtin.debug:
    msg: >-
      Kernel module {{ item.item }} is unavailable for the running kernel.
      Apply the role to install prerequisites and perform the approved reboot.
  loop: "{{ rke2_kernel_module_inspection.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - ansible_check_mode
    - item.rc != 0

- name: Select RKE2 kernel modules handled directly
  ansible.builtin.set_fact:
    rke2_direct_kernel_modules: >-
      {{
        rke2_kernel_modules
        | reject('equalto', 'overlay')
        | list
        if container_runtime_overlayfs_policy_exception_enabled | default(true) | bool
        else rke2_kernel_modules
      }}

- name: Prepare the RKE2 container runtime kernel
  ansible.builtin.include_role:
    name: container_runtime_kernel
  when:
    - not ansible_check_mode or rke2_unavailable_kernel_modules | length == 0

- name: Persist RKE2 kernel modules
  ansible.builtin.copy:
    dest: /etc/modules-load.d/rke2.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      {% for module in rke2_direct_kernel_modules %}
      {{ module }}
      {% endfor %}

- name: Load RKE2 kernel modules
  ansible.builtin.command:
    argv:
      - /usr/sbin/modprobe
      - "{{ item }}"
  loop: "{{ rke2_direct_kernel_modules }}"
  changed_when: false
  when: not ansible_check_mode

- name: Configure RKE2 sysctl settings
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_set: true
    state: present
    reload: true
  loop: "{{ rke2_sysctl | dict2items }}"
  when:
    - not ansible_check_mode or rke2_unavailable_kernel_modules | length == 0

- name: Check existing RKE2 kubeconfig
  ansible.builtin.stat:
    path: "{{ rke2_kubeconfig }}"
  register: rke2_kubeconfig_stat
  when:
    - platform_ingress_controller == 'traefik'
    - inventory_hostname == rke2_bootstrap_host

- name: Check for the managed Kong manifest before enabling Traefik
  ansible.builtin.stat:
    path: "{{ rke2_kong_manifest_path }}"
  register: rke2_kong_manifest_stat
  when:
    - platform_ingress_controller == 'traefik'
    - inventory_hostname == rke2_bootstrap_host

- name: Check for RKE2-managed Kong resources before enabling Traefik
  ansible.builtin.command:
    argv:
      - "{{ rke2_kubectl }}"
      - --kubeconfig
      - "{{ rke2_kubeconfig }}"
      - -n
      - kube-system
      - get
      - addon/kong-ingress
      - helmchart/kong
      - --ignore-not-found
      - -o=name
  register: rke2_kong_cluster_resources
  check_mode: false
  changed_when: false
  when:
    - platform_ingress_controller == 'traefik'
    - inventory_hostname == rke2_bootstrap_host
    - rke2_binary_stat.stat.exists
    - rke2_kubeconfig_stat.stat.exists

- name: Check for the Kong IngressClass before enabling Traefik
  ansible.builtin.command:
    argv:
      - "{{ rke2_kubectl }}"
      - --kubeconfig
      - "{{ rke2_kubeconfig }}"
      - get
      - ingressclass/kong
      - --ignore-not-found
      - -o=name
  register: rke2_kong_ingressclass
  check_mode: false
  changed_when: false
  when:
    - platform_ingress_controller == 'traefik'
    - inventory_hostname == rke2_bootstrap_host
    - rke2_binary_stat.stat.exists
    - rke2_kubeconfig_stat.stat.exists

- name: Check for the Kong proxy service before enabling Traefik
  ansible.builtin.command:
    argv:
      - "{{ rke2_kubectl }}"
      - --kubeconfig
      - "{{ rke2_kubeconfig }}"
      - get
      - service
      - --all-namespaces
      - --field-selector=metadata.name=kong-gateway-proxy
      - -o=name
  register: rke2_kong_proxy_service
  check_mode: false
  changed_when: false
  when:
    - platform_ingress_controller == 'traefik'
    - inventory_hostname == rke2_bootstrap_host
    - rke2_binary_stat.stat.exists
    - rke2_kubeconfig_stat.stat.exists

- name: Assert Kong is absent before enabling Traefik
  ansible.builtin.assert:
    that:
      - not rke2_kong_manifest_stat.stat.exists
      - not rke2_binary_stat.stat.exists or not rke2_kubeconfig_stat.stat.exists or rke2_kong_cluster_resources.stdout | length == 0
      - not rke2_binary_stat.stat.exists or not rke2_kubeconfig_stat.stat.exists or rke2_kong_ingressclass.stdout | length == 0
      - not rke2_binary_stat.stat.exists or not rke2_kubeconfig_stat.stat.exists or rke2_kong_proxy_service.stdout | length == 0
    fail_msg: >-
      Kong resources remain on this cluster. Migrate application Ingress resources
      and explicitly uninstall Kong before selecting bundled Traefik.
  when:
    - platform_ingress_controller == 'traefik'
    - inventory_hostname == rke2_bootstrap_host

- name: Download the RKE2 RPM signing key
  ansible.builtin.get_url:
    url: "{{ rke2_rpm_gpg_key_url }}"
    dest: "{{ rke2_rpm_gpg_key_path }}"
    owner: root
    group: root
    mode: "0644"
    checksum: "sha256:{{ rke2_rpm_gpg_key_sha256 }}"
  when: not ansible_check_mode

- name: Import the verified RKE2 RPM signing key
  ansible.builtin.rpm_key:
    key: "{{ rke2_rpm_gpg_key_path }}"
    fingerprint:
      - "{{ rke2_rpm_gpg_key_fingerprint }}"
    state: present
  when: not ansible_check_mode

- name: Configure the disabled RKE2 common RPM repository
  ansible.builtin.yum_repository:
    name: "{{ rke2_rpm_common_repository_id }}"
    description: Rancher RKE2 Common
    file: "{{ rke2_rpm_repository_file }}"
    baseurl: "{{ rke2_rpm_common_repository_url }}"
    enabled: false
    gpgcheck: true
    repo_gpgcheck: true
    gpgkey: "file://{{ rke2_rpm_gpg_key_path }}"

- name: Configure the disabled RKE2 version RPM repository
  ansible.builtin.yum_repository:
    name: "{{ rke2_rpm_version_repository_id }}"
    description: Rancher RKE2 {{ rke2_rpm_version }}
    file: "{{ rke2_rpm_repository_file }}"
    baseurl: "{{ rke2_rpm_version_repository_url }}"
    enabled: false
    gpgcheck: true
    repo_gpgcheck: true
    gpgkey: "file://{{ rke2_rpm_gpg_key_path }}"

- name: Install exact native RKE2 RPM packages
  ansible.builtin.dnf:
    name:
      - "{{ rke2_rpm_selinux_package_nevra }}"
      - "{{ rke2_rpm_node_package_nevra }}"
    state: present
    allow_downgrade: false
    enablerepo:
      - "{{ rke2_rpm_common_repository_id }}"
      - "{{ rke2_rpm_version_repository_id }}"
  when: not ansible_check_mode

- name: Read the installed RKE2 node package identity
  ansible.builtin.command:
    argv:
      - rpm
      - --query
      - --queryformat=%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}
      - "rke2-{{ rke2_node_role }}"
  register: rke2_installed_package
  check_mode: false
  changed_when: false
  when: not ansible_check_mode

- name: Require the exact RKE2 node package
  ansible.builtin.assert:
    that:
      - rke2_installed_package.stdout == rke2_rpm_node_package_nevra
    fail_msg: >-
      Expected {{ rke2_rpm_node_package_nevra }}, found
      {{ rke2_installed_package.stdout | default('no installed package', true) }}.
      Reviewed RKE2 downgrades are not supported by this role.
  when: not ansible_check_mode

- name: Read the installed RKE2 SELinux package identity
  ansible.builtin.command:
    argv:
      - rpm
      - --query
      - --queryformat=%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}
      - rke2-selinux
  register: rke2_installed_selinux_package
  check_mode: false
  changed_when: false
  when: not ansible_check_mode

- name: Require the exact RKE2 SELinux package
  ansible.builtin.assert:
    that:
      - rke2_installed_selinux_package.stdout == rke2_rpm_selinux_package_nevra
    fail_msg: >-
      Expected {{ rke2_rpm_selinux_package_nevra }}, found
      {{ rke2_installed_selinux_package.stdout | default('no installed package', true) }}.
  when: not ansible_check_mode

- name: Read the installed RKE2 version
  ansible.builtin.command:
    argv:
      - "{{ rke2_binary_path }}"
      - --version
  register: rke2_installed_version
  check_mode: false
  changed_when: false
  when: not ansible_check_mode

- name: Require the exact RKE2 version
  ansible.builtin.assert:
    that:
      - rke2_installed_version.stdout is search('^rke2 version ' ~ (rke2_version | regex_escape) ~ ' ')
    fail_msg: >-
      Expected {{ rke2_version }}, found
      {{ rke2_installed_version.stdout | default('no installed RKE2 binary', true) }}.
  when: not ansible_check_mode

- name: Check the existing RKE2 configuration directory
  ansible.builtin.stat:
    path: "{{ rke2_config_dir }}"
  register: rke2_config_dir_stat

- name: Check the existing RKE2 server manifest directory
  ansible.builtin.stat:
    path: "{{ rke2_server_manifest_dir }}"
  register: rke2_server_manifest_dir_stat
  when: rke2_node_role == 'server'

- name: Validate fresh-node RKE2 templates in check mode
  ansible.builtin.assert:
    that:
      - (lookup('ansible.builtin.template', 'config.yaml.j2') | from_yaml) is mapping
      - >-
        rke2_registry_mirrors | length == 0
        and rke2_registry_configs | length == 0
        or (lookup('ansible.builtin.template', 'registries.yaml.j2') | from_yaml) is mapping
    fail_msg: Fresh-node RKE2 configuration templates did not render as YAML mappings.
  no_log: true
  when:
    - ansible_check_mode
    - not rke2_config_dir_stat.stat.exists

- name: Validate fresh-node Traefik template in check mode
  ansible.builtin.assert:
    that:
      - >-
        (lookup('ansible.builtin.template', 'rke2-traefik-helmchartconfig.yaml.j2')
        | from_yaml) is mapping
    fail_msg: Fresh-node Traefik configuration did not render as a YAML mapping.
  when:
    - ansible_check_mode
    - rke2_node_role == 'server'
    - inventory_hostname == rke2_bootstrap_host
    - platform_ingress_controller == 'traefik'
    - not rke2_server_manifest_dir_stat.stat.exists

- name: Report fresh-node RKE2 bootstrap changes in check mode
  ansible.builtin.debug:
    msg: >-
      Bootstrap will install {{ rke2_rpm_node_package_nevra }} and
      {{ rke2_rpm_selinux_package_nevra }}, create {{ rke2_config_dir }}, and
      manage the cluster token, RKE2 configuration, optional registry trust,
      and selected ingress configuration. Child-file diffs are unavailable
      until their parent directories exist on the managed node.
  changed_when: true
  when:
    - ansible_check_mode
    - not rke2_config_dir_stat.stat.exists

- name: Ensure RKE2 configuration directory exists
  ansible.builtin.file:
    path: "{{ rke2_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure RKE2 server manifest directory exists
  ansible.builtin.file:
    path: "{{ rke2_server_manifest_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: rke2_node_role == 'server'

- name: Configure bundled Traefik NodePorts on the bootstrap server
  ansible.builtin.template:
    src: rke2-traefik-helmchartconfig.yaml.j2
    dest: "{{ rke2_traefik_helmchartconfig_path }}"
    owner: root
    group: root
    mode: "0644"
  when:
    - platform_ingress_controller == 'traefik'
    - inventory_hostname == rke2_bootstrap_host
    - not ansible_check_mode or rke2_server_manifest_dir_stat.stat.exists

- name: Remove bundled Traefik configuration when Kong is selected
  ansible.builtin.file:
    path: "{{ rke2_traefik_helmchartconfig_path }}"
    state: absent
  when:
    - platform_ingress_controller == 'kong'
    - inventory_hostname == rke2_bootstrap_host

- name: Copy RKE2 cluster token
  ansible.builtin.copy:
    content: |
      {{
        (lookup('ansible.builtin.file', rke2_token_src, rstrip=false)
        | regex_replace('\n\Z', ''))
      }}
    dest: "{{ rke2_token_path }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart RKE2
  when: not ansible_check_mode or rke2_config_dir_stat.stat.exists

- name: Copy RKE2 registry CA certificate
  ansible.builtin.copy:
    src: "{{ rke2_registry_ca_src }}"
    dest: "{{ rke2_registry_ca_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart RKE2
  when:
    - rke2_registry_ca_src | length > 0
    - not ansible_check_mode or rke2_config_dir_stat.stat.exists

- name: Remove RKE2 registry CA certificate when unused
  ansible.builtin.file:
    path: "{{ rke2_registry_ca_path }}"
    state: absent
  when:
    - rke2_registry_ca_src | length == 0
    - rke2_registry_mirrors | length == 0
    - rke2_registry_configs | length == 0

- name: Write RKE2 configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ rke2_config_path }}"
    owner: root
    group: root
    mode: "0600"
  notify: Restart RKE2
  when: not ansible_check_mode or rke2_config_dir_stat.stat.exists

- name: Write RKE2 registries configuration
  ansible.builtin.template:
    src: registries.yaml.j2
    dest: "{{ rke2_registries_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart RKE2
  when:
    - rke2_registry_mirrors | length > 0 or rke2_registry_configs | length > 0
    - not ansible_check_mode or rke2_config_dir_stat.stat.exists

- name: Remove RKE2 registries configuration when unused
  ansible.builtin.file:
    path: "{{ rke2_registries_path }}"
    state: absent
  notify: Restart RKE2
  when: rke2_registry_mirrors | length == 0 and rke2_registry_configs | length == 0

- name: Manage RKE2 cluster firewalld rich rules
  ansible.posix.firewalld:
    rich_rule: "rule family=\"{{ 'ipv6' if ':' in item else 'ipv4' }}\" source address=\"{{ item }}\" accept"
    permanent: true
    immediate: "{{ (firewalld_service_state | default('stopped')) in ['started', 'restarted', 'reloaded'] }}"
    offline: true
    state: enabled
  loop: "{{ rke2_firewalld_cluster_sources }}"
  when:
    - rke2_firewalld_manage | bool
    - rke2_firewalld_cluster_sources | length > 0
    - firewalld_dependencies_ready | default(true)

- name: Manage RKE2 API firewalld rich rules
  ansible.posix.firewalld:
    rich_rule: "rule family=\"{{ 'ipv6' if ':' in item.0 else 'ipv4' }}\" source address=\"{{ item.0 }}\" port port=\"{{ item.1 }}\" protocol=\"tcp\" accept"
    permanent: true
    immediate: "{{ (firewalld_service_state | default('stopped')) in ['started', 'restarted', 'reloaded'] }}"
    offline: true
    state: enabled
  loop: "{{ rke2_firewalld_api_sources | product(rke2_firewalld_api_ports) | list }}"
  when:
    - rke2_firewalld_manage | bool
    - rke2_node_role == 'server'
    - rke2_firewalld_api_sources | length > 0
    - firewalld_dependencies_ready | default(true)

- name: Manage RKE2 service
  ansible.builtin.systemd_service:
    name: "{{ rke2_service_name }}"
    enabled: "{{ rke2_service_enabled }}"
    state: "{{ rke2_service_state }}"
  when: not ansible_check_mode

- name: Apply pending RKE2 restart before readiness checks
  ansible.builtin.meta: flush_handlers

- name: Wait for the local RKE2 service after convergence
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - "{{ rke2_service_name }}"
  register: rke2_converged_service_active
  check_mode: false
  changed_when: false
  retries: 60
  delay: 5
  until: rke2_converged_service_active.stdout == 'active'
  when:
    - not ansible_check_mode
    - rke2_service_enabled | bool
    - rke2_service_state == 'started'

- name: Wait for RKE2 supervisor on server nodes
  ansible.builtin.wait_for:
    host: "{{ rke2_node_ip }}"
    port: 9345
    timeout: "{{ rke2_wait_for_supervisor_timeout }}"
  when:
    - not ansible_check_mode
    - rke2_node_role == 'server'
    - rke2_service_enabled | bool
    - rke2_service_state == 'started'

- name: Wait for the local RKE2 server API after convergence
  ansible.builtin.command:
    argv:
      - "{{ rke2_kubectl }}"
      - --kubeconfig
      - "{{ rke2_kubeconfig }}"
      - get
      - --raw=/readyz
  register: rke2_converged_api_ready
  check_mode: false
  changed_when: false
  retries: 60
  delay: 5
  until:
    - rke2_converged_api_ready.rc == 0
    - rke2_converged_api_ready.stdout == 'ok'
  when:
    - not ansible_check_mode
    - rke2_node_role == 'server'
    - rke2_service_enabled | bool
    - rke2_service_state == 'started'

- name: Wait for the converged RKE2 node to become Ready
  ansible.builtin.command:
    argv:
      - "{{ rke2_kubectl }}"
      - --kubeconfig
      - "{{ rke2_kubeconfig }}"
      - get
      - node
      - "{{ rke2_node_name }}"
      - -o=jsonpath={.status.conditions[?(@.type=="Ready")].status}
  delegate_to: "{{ rke2_bootstrap_host }}"
  vars:
    ansible_ssh_private_key_file: >-
      {{ hostvars[rke2_bootstrap_host].ansible_ssh_private_key_file }}
  register: rke2_converged_node_ready
  check_mode: false
  changed_when: false
  retries: 60
  delay: 5
  until:
    - rke2_converged_node_ready.rc == 0
    - rke2_converged_node_ready.stdout == 'True'
  when:
    - not ansible_check_mode
    - rke2_service_enabled | bool
    - rke2_service_state == 'started'

- name: Complete RKE2 system registry trust convergence
  ansible.builtin.file:
    path: "{{ registry_ca_trust_refresh_marker }}"
    state: absent
  changed_when: false
  when:
    - registry_ca_trust_source | default('') | length > 0
    - not ansible_check_mode
