---
- name: Ensure Kubernetes bastion binary directory exists
  ansible.builtin.file:
    path: "{{ k8s_bastion_bin_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: k8s_bastion_symlinks | length > 0

- name: Create Kubernetes bastion command symlinks
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
  loop: "{{ k8s_bastion_symlinks }}"
