---
grafana_alloy_version: 1.16.1
grafana_alloy_arch: amd64
grafana_alloy_rpm_name: "alloy-{{ grafana_alloy_version }}-1.{{ grafana_alloy_arch }}.rpm"
grafana_alloy_download_url: "https://github.com/grafana/alloy/releases/download/v{{ grafana_alloy_version }}/{{ grafana_alloy_rpm_name }}"
grafana_alloy_download_checksum: sha256:4f5ad2b8716c8a233a7a7ffd36bba84edcf53205725ead17c2b6674b0218b52f
grafana_alloy_cache_dir: /var/cache/platform/grafana-alloy

grafana_alloy_config_dir: /etc/alloy
grafana_alloy_config_path: "{{ grafana_alloy_config_dir }}/config.alloy"
grafana_alloy_storage_dir: /var/lib/alloy/data
grafana_alloy_service_name: alloy.service
grafana_alloy_service_enabled: true
grafana_alloy_service_state: started
grafana_alloy_http_listen_address: 127.0.0.1
grafana_alloy_http_listen_port: 12345

grafana_alloy_loki_url: ""
grafana_alloy_environment: "{{ platform_environment | default('dev') }}"
grafana_alloy_vm_name: "{{ inventory_hostname }}"
grafana_alloy_ip: "{{ ansible_host | default(inventory_hostname) }}"
grafana_alloy_platform_role: >-
  {{
    'rke2-server' if inventory_hostname in groups.get('rke2_servers', []) else
    'rke2-agent' if inventory_hostname in groups.get('rke2_agents', []) else
    'monitoring' if inventory_hostname in groups.get('monitoring', []) else
    'gitlab-runner' if inventory_hostname in groups.get('gitlab_runners', []) else
    'registry' if inventory_hostname in groups.get('registry', []) else
    'openbao' if inventory_hostname in groups.get('openbao', []) else
    'bastion' if inventory_hostname in groups.get('bastion', []) else
    'vm'
  }}
grafana_alloy_journal_max_age: 12h
