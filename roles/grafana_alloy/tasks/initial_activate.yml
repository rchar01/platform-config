---
- name: Require explicit single-host initial start intent
  ansible.builtin.assert:
    that:
      - not ansible_check_mode
      - ansible_play_hosts_all == [inventory_hostname]
      - ansible_limit | default('') == inventory_hostname
      - grafana_alloy_enabled is sameas true
      - grafana_alloy_service_enabled is sameas true
      - grafana_alloy_service_state == 'started'
    fail_msg: Initial activation requires apply mode, one literal host limit and explicit enabled/started desired state.

- name: Verify installed initial activation sources
  ansible.builtin.import_tasks: initial_installed.yml

- name: Run the fixed initial activation command
  ansible.builtin.command:
    argv: [/usr/local/libexec/platform-alloy-initial-activate, activate, --config, /etc/alloy/pki/initial-activation.json]
  register: grafana_alloy_initial_command
  changed_when: >-
    grafana_alloy_initial_command.rc == 0 and
    (grafana_alloy_initial_command.stdout | from_json | grafana_alloy_initial_outcome('activate')).changed
  check_mode: false

- name: Validate and record the exact initial activation outcome
  ansible.builtin.set_fact:
    grafana_alloy_initial_result: "{{ grafana_alloy_initial_command.stdout | from_json | grafana_alloy_initial_outcome('activate') }}"

- name: Report initial activation result
  ansible.builtin.import_tasks: initial_report.yml
