---
- name: Verify installed initial status sources
  ansible.builtin.import_tasks: initial_installed.yml

- name: Run the fixed read-only initial status
  ansible.builtin.command:
    argv: [/usr/local/libexec/platform-alloy-initial-activate, status, --config, /etc/alloy/pki/initial-activation.json]
  register: grafana_alloy_initial_command
  changed_when: false
  check_mode: false

- name: Validate and record the exact initial status outcome
  ansible.builtin.set_fact:
    grafana_alloy_initial_result: "{{ grafana_alloy_initial_command.stdout | from_json | grafana_alloy_initial_outcome('status') }}"

- name: Report initial status result
  ansible.builtin.import_tasks: initial_report.yml
