---
- name: Assert Grafana Alloy inputs are configured
  ansible.builtin.assert:
    that:
      - grafana_alloy_version | length > 0
      - grafana_alloy_loki_url | length > 0
      - grafana_alloy_vm_name | length > 0
      - grafana_alloy_ip | length > 0
    fail_msg: "Grafana Alloy requires a pinned version, Loki URL, VM name, and IP label."

- name: Ensure Grafana Alloy cache and state directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ grafana_alloy_cache_dir }}"
      mode: "0755"
    - path: "{{ grafana_alloy_config_dir }}"
      mode: "0755"
    - path: "{{ grafana_alloy_storage_dir }}"
      mode: "0755"
    - path: /etc/systemd/system/alloy.service.d
      mode: "0755"

- name: Check installed Grafana Alloy version
  ansible.builtin.command:
    argv:
      - rpm
      - -q
      - --qf
      - "%{VERSION}"
      - alloy
  register: grafana_alloy_installed_version
  changed_when: false
  failed_when: false

- name: Decide whether Grafana Alloy install or upgrade is needed
  ansible.builtin.set_fact:
    grafana_alloy_install_needed: >-
      {{
        grafana_alloy_installed_version.rc != 0
        or grafana_alloy_installed_version.stdout != grafana_alloy_version
      }}

- name: Download Grafana Alloy RPM
  ansible.builtin.get_url:
    url: "{{ grafana_alloy_download_url }}"
    dest: "{{ grafana_alloy_cache_dir }}/{{ grafana_alloy_rpm_name }}"
    checksum: "{{ grafana_alloy_download_checksum }}"
    owner: root
    group: root
    mode: "0644"
  when:
    - not ansible_check_mode
    - grafana_alloy_install_needed | bool

- name: Install Grafana Alloy RPM
  ansible.builtin.dnf:
    name: "{{ grafana_alloy_cache_dir }}/{{ grafana_alloy_rpm_name }}"
    state: present
    disable_gpg_check: true
  notify: Restart Grafana Alloy
  when:
    - not ansible_check_mode
    - grafana_alloy_install_needed | bool

- name: Write Grafana Alloy configuration
  ansible.builtin.template:
    src: config.alloy.j2
    dest: "{{ grafana_alloy_config_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Grafana Alloy

- name: Write Grafana Alloy systemd override
  ansible.builtin.template:
    src: alloy.service.override.conf.j2
    dest: /etc/systemd/system/alloy.service.d/platform.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart Grafana Alloy

- name: Reload systemd manager configuration
  ansible.builtin.systemd_service:
    daemon_reload: true
  changed_when: false
  when: not ansible_check_mode

- name: Manage Grafana Alloy service
  ansible.builtin.systemd_service:
    name: "{{ grafana_alloy_service_name }}"
    enabled: "{{ grafana_alloy_service_enabled }}"
    state: "{{ grafana_alloy_service_state }}"
  when: not ansible_check_mode
