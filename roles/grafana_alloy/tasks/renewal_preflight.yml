---
- name: Require one literal host and a configured renewal writer
  ansible.builtin.assert:
    that:
      - ansible_play_hosts_all == [inventory_hostname]
      - ansible_limit | default('') == inventory_hostname
      - grafana_alloy_renewal_writer is string
      - grafana_alloy_renewal_writer in ['loki', 'mimir']
      - grafana_alloy_initial_writers is mapping
      - grafana_alloy_renewal_writer in grafana_alloy_initial_writers
    fail_msg: Renewal preflight requires one literal host limit and one configured Loki or Mimir writer.
  no_log: true

- name: Verify exact installed renewal predecessor inputs
  ansible.builtin.import_tasks: initial_installed.yml
  no_log: true

- name: Run the fixed read-only renewal preflight
  ansible.builtin.command:
    argv:
      - /usr/local/libexec/platform-alloy-initial-activate
      - renewal-preflight
      - --config
      - /etc/alloy/pki/initial-activation.json
      - --writer
      - "{{ grafana_alloy_renewal_writer }}"
  register: grafana_alloy_renewal_command
  changed_when: false
  failed_when: grafana_alloy_renewal_command.rc != 0 or grafana_alloy_renewal_command.stderr != ''
  check_mode: false
  no_log: true

- name: Validate and record the exact renewal predecessor observation
  ansible.builtin.set_fact:
    grafana_alloy_renewal_result: >-
      {{ grafana_alloy_renewal_command.stdout | from_json | grafana_alloy_initial_renewal_outcome(
           grafana_alloy_initial_inputs.context, grafana_alloy_renewal_writer) }}
  no_log: true

- name: Report bounded renewal preflight result
  ansible.builtin.debug:
    msg:
      schema: "{{ grafana_alloy_renewal_result.schema }}"
      status: "{{ grafana_alloy_renewal_result.status }}"
      changed: "{{ grafana_alloy_renewal_result.changed }}"
      target: "{{ grafana_alloy_renewal_result.target }}"
      writer: "{{ grafana_alloy_renewal_result.writer }}"
