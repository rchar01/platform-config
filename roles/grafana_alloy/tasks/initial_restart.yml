---
- name: Guard Grafana Alloy restart handler
  ansible.builtin.import_tasks: initial_guard.yml

- name: Restart ordinary Grafana Alloy
  ansible.builtin.systemd_service:
    name: "{{ grafana_alloy_service_name }}"
    state: restarted
  when:
    - grafana_alloy_service_enabled | bool
    - grafana_alloy_service_state == 'started'
    - not ansible_check_mode
