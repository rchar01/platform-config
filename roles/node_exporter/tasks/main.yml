---
- name: Ensure node_exporter group exists
  ansible.builtin.group:
    name: "{{ node_exporter_group }}"
    system: true

- name: Ensure node_exporter user exists
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    group: "{{ node_exporter_group }}"
    system: true
    shell: /sbin/nologin
    home: /var/lib/node_exporter
    create_home: false

- name: Ensure node_exporter cache directory exists
  ansible.builtin.file:
    path: "{{ node_exporter_cache_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Check installed node_exporter binary
  ansible.builtin.stat:
    path: "{{ node_exporter_binary_path }}"
  register: node_exporter_binary_stat

- name: Check installed node_exporter version
  ansible.builtin.command:
    argv:
      - "{{ node_exporter_binary_path }}"
      - --version
  register: node_exporter_version_check
  changed_when: false
  failed_when: false
  when: node_exporter_binary_stat.stat.exists

- name: Decide whether node_exporter install or upgrade is needed
  ansible.builtin.set_fact:
    node_exporter_install_needed: >-
      {{
        not node_exporter_binary_stat.stat.exists
        or ('version ' ~ node_exporter_version) not in (node_exporter_version_check.stdout | default(''))
      }}

- name: Download node_exporter archive
  ansible.builtin.get_url:
    url: "{{ node_exporter_download_url }}"
    dest: "{{ node_exporter_cache_dir }}/{{ node_exporter_archive_name }}.tar.gz"
    checksum: "{{ node_exporter_download_checksum | default(omit, true) }}"
    owner: root
    group: root
    mode: "0644"
  when:
    - not ansible_check_mode
    - node_exporter_install_needed | bool

- name: Extract node_exporter archive
  ansible.builtin.unarchive:
    src: "{{ node_exporter_cache_dir }}/{{ node_exporter_archive_name }}.tar.gz"
    dest: "{{ node_exporter_cache_dir }}"
    remote_src: true
    creates: "{{ node_exporter_cache_dir }}/{{ node_exporter_archive_name }}/node_exporter"
  when:
    - not ansible_check_mode
    - node_exporter_install_needed | bool

- name: Install node_exporter binary
  ansible.builtin.copy:
    src: "{{ node_exporter_cache_dir }}/{{ node_exporter_archive_name }}/node_exporter"
    dest: "{{ node_exporter_binary_path }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  notify: Restart node_exporter
  when:
    - not ansible_check_mode
    - node_exporter_install_needed | bool

- name: Write node_exporter systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: "/etc/systemd/system/{{ node_exporter_service_name }}"
    owner: root
    group: root
    mode: "0644"
  register: node_exporter_unit_result
  notify:
    - Reload systemd
    - Restart node_exporter

- name: Reload systemd manager configuration
  ansible.builtin.systemd_service:
    daemon_reload: true
  changed_when: false
  when: not ansible_check_mode

- name: Manage node_exporter service
  ansible.builtin.systemd_service:
    name: "{{ node_exporter_service_name }}"
    enabled: "{{ node_exporter_service_enabled }}"
    state: "{{ node_exporter_service_state }}"
  when: not (ansible_check_mode and node_exporter_unit_result is changed)

- name: Check permanent node_exporter firewalld rich rules
  ansible.builtin.command:
    argv:
      - firewall-offline-cmd
      - --query-rich-rule
      - "rule family=\"{{ 'ipv6' if ':' in item else 'ipv4' }}\" source address=\"{{ item }}\" port port=\"{{ node_exporter_web_listen_port }}\" protocol=\"tcp\" accept"
  loop: "{{ node_exporter_firewalld_allowed_sources }}"
  register: node_exporter_firewalld_rich_rule_checks
  check_mode: false
  changed_when: false
  failed_when: node_exporter_firewalld_rich_rule_checks.rc not in [0, 1]
  when:
    - node_exporter_firewalld_manage | bool
    - node_exporter_firewalld_allowed_sources | length > 0

- name: Add permanent node_exporter firewalld rich rules
  ansible.builtin.command:
    argv:
      - firewall-offline-cmd
      - --add-rich-rule
      - "{{ item.cmd[2] }}"
  loop: "{{ node_exporter_firewalld_rich_rule_checks.results | default([]) | selectattr('rc', 'eq', 1) | list }}"
  changed_when: true
  when:
    - node_exporter_firewalld_manage | bool
    - not ansible_check_mode
