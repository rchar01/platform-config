---
- name: Install SSH server package
  ansible.builtin.package:
    name: "{{ ssh_server_package }}"
    state: present

- name: Ensure SSH configuration drop-in directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: ssh_config_dropins | length > 0 or ssh_config_dropins_prune_managed

- name: Ensure SSH managed state directory exists
  ansible.builtin.file:
    path: "{{ ssh_managed_state_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: ssh_config_dropins_prune_managed

- name: Check previous SSH managed drop-ins manifest
  ansible.builtin.stat:
    path: "{{ ssh_config_dropins_managed_manifest_path }}"
  register: ssh_previous_dropins_manifest_stat
  when: ssh_config_dropins_prune_managed

- name: Read previous SSH managed drop-ins manifest
  ansible.builtin.slurp:
    path: "{{ ssh_config_dropins_managed_manifest_path }}"
  register: ssh_previous_dropins_manifest_slurp
  when:
    - ssh_config_dropins_prune_managed
    - ssh_previous_dropins_manifest_stat.stat.exists

- name: Track SSH managed drop-in paths
  ansible.builtin.set_fact:
    ssh_previous_managed_dropin_paths: >-
      {{
        (
          ssh_previous_dropins_manifest_slurp.content
          | b64decode
          | from_yaml
        ).managedPaths | default([])
        if ssh_config_dropins_prune_managed
        and ssh_previous_dropins_manifest_stat.stat.exists
        else []
      }}
    ssh_current_managed_dropin_paths: []
  when: ssh_config_dropins_prune_managed

- name: Track current SSH managed drop-in paths
  ansible.builtin.set_fact:
    ssh_current_managed_dropin_paths: >-
      {{
        ssh_current_managed_dropin_paths
        + ['/etc/ssh/sshd_config.d/' + item.name + '.conf']
      }}
  loop: "{{ ssh_config_dropins }}"
  when: ssh_config_dropins_prune_managed

- name: Configure SSH daemon drop-ins
  ansible.builtin.copy:
    dest: "/etc/ssh/sshd_config.d/{{ item.name }}.conf"
    owner: root
    group: root
    mode: "0644"
    content: "{{ item.content }}\n"
    validate: /usr/sbin/sshd -t -f %s
  loop: "{{ ssh_config_dropins }}"
  notify: Reload sshd

- name: Remove stale SSH managed drop-ins
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{
      ssh_previous_managed_dropin_paths | default([])
      | difference(ssh_current_managed_dropin_paths | default([]))
    }}
  notify: Reload sshd
  when: ssh_config_dropins_prune_managed

- name: Write SSH managed drop-ins manifest
  ansible.builtin.copy:
    dest: "{{ ssh_config_dropins_managed_manifest_path }}"
    owner: root
    group: root
    mode: "0644"
    content: >-
      {{
        {
          'managedPaths': ssh_current_managed_dropin_paths | unique | sort
        } | to_nice_yaml
      }}
  when: ssh_config_dropins_prune_managed

- name: Ensure SSH service is enabled and running
  ansible.builtin.service:
    name: "{{ ssh_service_name }}"
    enabled: "{{ ssh_service_enabled }}"
    state: "{{ ssh_service_state }}"
