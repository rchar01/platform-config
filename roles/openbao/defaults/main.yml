---
openbao_enabled: false

openbao_version: 2.6.1
openbao_image_registry: ghcr.io/openbao/openbao
openbao_image_digest: sha256:15e90b578c970ae57b596ed51295380cd54f93860fe36758f05b455d71aae0e0
openbao_image: "{{ openbao_image_registry }}@{{ openbao_image_digest }}"
openbao_image_architecture: amd64
openbao_image_user: openbao
openbao_container_uid: "100"
openbao_container_gid: "1000"

openbao_container_name: openbao
openbao_quadlet_name: openbao.container
openbao_service_name: openbao.service
openbao_service_enabled: false
openbao_service_state: stopped
openbao_bootstrap_ready: false
openbao_bootstrap_complete_ready: false
openbao_audit_migration_ready: false

openbao_config_dir: /etc/openbao
openbao_tls_dir: "{{ openbao_config_dir }}/tls"
openbao_config_path: "{{ openbao_config_dir }}/openbao.hcl"
openbao_listener_path: "{{ openbao_config_dir }}/listener.hcl"
openbao_audit_config_path: "{{ openbao_config_dir }}/audit.hcl"
openbao_tls_ca_path: "{{ openbao_tls_dir }}/ca.crt"
openbao_dormant_tls_cert_path: "{{ openbao_tls_dir }}/tls.crt"
openbao_dormant_tls_key_path: "{{ openbao_tls_dir }}/tls.key"
openbao_validator_dir: /usr/local/libexec/platform
openbao_validator_path: "{{ openbao_validator_dir }}/openbao-validate-config"
openbao_base_config_validate_command: "{{ openbao_validator_path }} base %s"
openbao_dormant_base_config_validate_command: "{{ openbao_validator_path }} base-dormant %s"
openbao_config_validate_command: "{{ openbao_validator_path }} listener %s"
openbao_audit_config_validate_command: "{{ openbao_validator_path }} audit %s"

openbao_data_dir: /var/lib/openbao
openbao_audit_1_dir: /var/log/openbao/audit-1
openbao_audit_2_dir: /var/log/openbao/audit-2
openbao_backup_staging_dir: /var/lib/openbao-backup-staging
openbao_container_config_dir: /openbao/config
openbao_container_data_dir: /openbao/data
openbao_container_audit_1_dir: /openbao/audit-1
openbao_container_audit_2_dir: /openbao/audit-2
openbao_required_mounts:
  - "{{ openbao_data_dir }}"
  - "{{ openbao_audit_1_dir }}"
  - "{{ openbao_audit_2_dir }}"
  - "{{ openbao_backup_staging_dir }}"

openbao_cluster_members: []
openbao_node_name: ""
openbao_node_address: ""
openbao_node_dns: ""
openbao_service_dns: ""
openbao_service_vip: ""
openbao_client_port: 8200
openbao_backend_port: 18200
openbao_cluster_port: 8201

openbao_tls_ca_src: ""
openbao_tls_min_version: tls12
openbao_tls_max_version: tls13
openbao_tls_disable_client_certs: true

openbao_seal_type: shamir
openbao_raft_performance_multiplier: 1
openbao_ui_enabled: true
openbao_log_level: info
openbao_log_format: json
openbao_telemetry_prometheus_retention_time: 24h
openbao_telemetry_disable_hostname: true
openbao_telemetry_enable_hostname_label: true

openbao_quadlet_dir: "{{ podman_host_quadlet_dir | default('/etc/containers/systemd') }}"
openbao_quadlet_path: "{{ openbao_quadlet_dir }}/{{ openbao_quadlet_name }}"
openbao_quadlet_restart_policy: on-failure
openbao_quadlet_restart_sec: 5s
openbao_quadlet_memory_swap_max: "0"

openbao_firewalld_manage: true
openbao_backend_allowed_sources: []
openbao_state_dir: /var/lib/platform-config
openbao_firewalld_manifest_path: "{{ openbao_state_dir }}/openbao-firewalld.yml"
openbao_bootstrap_marker_path: "{{ openbao_state_dir }}/openbao-bootstrap.json"
openbao_bootstrap_marker_owner: root
openbao_bootstrap_marker_group: root
openbao_active_preflight_allow_desired_config_drift: false
openbao_rolling_force_restart: false
openbao_rolling_unseal_retries: 60
openbao_rolling_unseal_delay: 20
openbao_rolling_unseal_request_timeout: 5
openbao_rolling_transaction_dir: /var/lib/platform-config/openbao-rolling-transaction

pki_host_local_certificate_lifecycle_helper_path: /usr/local/libexec/platform-pki-host-local-lifecycle
pki_host_local_certificate_openbao_backend_port: "{{ openbao_backend_port }}"
pki_host_local_certificate_openbao_cluster_port: "{{ openbao_cluster_port }}"
pki_host_local_certificate_openbao_container_versions_root: /openbao/config/tls-versions
pki_host_local_certificate_openbao_base_config_dir: /openbao/config
pki_host_local_certificate_openbao_raft_data_dir: "{{ openbao_data_dir }}"
pki_host_local_certificate_openbao_bootstrap_marker_path: "{{ openbao_bootstrap_marker_path }}"
