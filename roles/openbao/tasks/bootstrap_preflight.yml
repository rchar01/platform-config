---
- name: Require safe OpenBao bootstrap preflight inputs
  ansible.builtin.assert:
    that:
      - openbao_bootstrap_ready | bool
      - not ansible_check_mode
      - not openbao_service_enabled | bool
      - openbao_service_state == 'stopped'
    fail_msg: >-
      OpenBao bootstrap start requires explicit readiness, normal apply mode,
      and the stopped, disabled service contract.

- name: Validate OpenBao bootstrap inputs
  ansible.builtin.include_tasks: validate.yml

- name: Resolve authenticated OpenBao bootstrap custody
  ansible.builtin.include_tasks: custody.yml

- name: Reject dormant OpenBao bootstrap custody
  ansible.builtin.assert:
    that:
      - openbao_tls_custody.custody == 'host-local'
    fail_msg: OpenBao bootstrap requires authenticated host-local TLS custody.

- name: Inspect staged OpenBao bootstrap artifacts
  ansible.builtin.stat:
    path: "{{ item }}"
    checksum_algorithm: sha256
  register: openbao_bootstrap_artifact_stats
  loop:
    - "{{ openbao_config_path }}"
    - "{{ openbao_listener_path }}"
    - "{{ openbao_quadlet_path }}"
    - "{{ openbao_tls_ca_path }}"
    - "{{ openbao_tls_custody.host_cert_path }}"
    - "{{ openbao_tls_custody.host_key_path }}"
    - "{{ openbao_tls_custody.host_cert_path | dirname }}/tls.crt"
    - "{{ openbao_tls_custody.host_cert_path | dirname }}/ca-chain.crt"

- name: Require complete staged OpenBao bootstrap artifacts
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
    fail_msg: "OpenBao bootstrap artifact {{ item.item }} is not staged."
  loop: "{{ openbao_bootstrap_artifact_stats.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Inspect OpenBao CA source checksum
  ansible.builtin.stat:
    path: "{{ openbao_tls_ca_src }}"
    checksum_algorithm: sha256
  register: openbao_bootstrap_ca_source_stat
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false

- name: Require staged OpenBao CA matches its approved source
  ansible.builtin.assert:
    that:
      - openbao_bootstrap_ca_source_stat.stat.checksum == openbao_bootstrap_artifact_stats.results[3].stat.checksum
    fail_msg: Staged OpenBao CA does not match its approved source.

- name: Verify staged OpenBao certificate identities
  ansible.builtin.command:
    argv:
      - openssl
      - verify
      - -CAfile
      - "{{ openbao_tls_ca_path }}"
      - -untrusted
      - "{{ openbao_tls_custody.host_cert_path | dirname }}/ca-chain.crt"
      - -verify_hostname
      - "{{ item }}"
      - "{{ openbao_tls_custody.host_cert_path | dirname }}/tls.crt"
  changed_when: false
  loop:
    - "{{ openbao_node_dns }}"
    - "{{ openbao_service_dns }}"

- name: Resolve canonical OpenBao bootstrap member addresses
  ansible.builtin.command:
    argv:
      - getent
      - ahostsv4
      - "{{ item.dns }}"
  register: openbao_bootstrap_member_resolution
  changed_when: false
  failed_when: false
  loop: "{{ openbao_cluster_members }}"
  loop_control:
    label: "{{ item.dns }}"

- name: Require canonical OpenBao bootstrap member resolution
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - >-
        item.item.address in
        (item.stdout_lines | default([]) | map('split') | map('first') | list)
      - >-
        (
          item.stdout_lines
          | default([])
          | map('split')
          | map('first')
          | unique
          | difference(
              [item.item.address]
              + (['127.0.0.1'] if item.item.name == inventory_hostname else [])
            )
          | list
          | length
        ) == 0
    fail_msg: >-
      OpenBao bootstrap member {{ item.item.dns }} must resolve to its canonical
      IPv4 address {{ item.item.address }} on every cluster host.
  loop: "{{ openbao_bootstrap_member_resolution.results }}"
  loop_control:
    label: "{{ item.item.dns }}"

- name: Inspect pristine OpenBao data directory
  ansible.builtin.command:
    argv:
      - find
      - "{{ openbao_data_dir }}"
      - -mindepth
      - "1"
      - -maxdepth
      - "1"
      - -print
      - -quit
  register: openbao_bootstrap_data_entries
  changed_when: false
  check_mode: false

- name: Inspect OpenBao bootstrap lifecycle paths
  ansible.builtin.stat:
    path: "{{ item }}"
  register: openbao_bootstrap_lifecycle_paths
  loop:
    - "{{ openbao_bootstrap_marker_path }}"
    - "/run/systemd/generator/multi-user.target.wants/{{ openbao_service_name }}"
    - "/etc/systemd/system/multi-user.target.wants/{{ openbao_service_name }}"

- name: Inspect OpenBao bootstrap services
  ansible.builtin.service_facts:

- name: Inspect OpenBao bootstrap container
  ansible.builtin.command:
    argv: [/usr/bin/podman, container, exists, "{{ openbao_container_name }}"]
  register: openbao_bootstrap_container_exists
  changed_when: false
  failed_when: false
  check_mode: false

- name: Derive exact staged OpenBao Quadlet checksum
  ansible.builtin.set_fact:
    openbao_bootstrap_expected_quadlet_checksum: >-
      {{ lookup('ansible.builtin.template', 'openbao.container.j2') | hash('sha256') }}
  vars:
    openbao_service_enabled: false

- name: Require pristine stopped OpenBao bootstrap state
  ansible.builtin.assert:
    that:
      - openbao_bootstrap_data_entries.stdout | trim | length == 0
      - not openbao_bootstrap_lifecycle_paths.results[0].stat.exists
      - not openbao_bootstrap_lifecycle_paths.results[1].stat.exists
      - not openbao_bootstrap_lifecycle_paths.results[2].stat.exists
      - >-
        ansible_facts.services.get(openbao_service_name, {}).get('state', 'stopped')
        != 'running'
      - openbao_bootstrap_container_exists.rc != 0
      - >-
        openbao_bootstrap_artifact_stats.results[2].stat.checksum
        == openbao_bootstrap_expected_quadlet_checksum
    fail_msg: >-
      OpenBao bootstrap requires pristine data, no lifecycle marker, no boot
      enablement, and no running service or container. Preserve unknown or
      partial state for reviewed recovery.

- name: Build local OpenBao bootstrap observation
  ansible.builtin.set_fact:
    openbao_bootstrap_observation:
      inventory_host: "{{ inventory_hostname }}"
      node_id: "{{ openbao_node_name }}"
      config_checksum: >-
        {{
          {
            'base_config_sha256': openbao_bootstrap_artifact_stats.results[0].stat.checksum,
            'listener_sha256': openbao_bootstrap_artifact_stats.results[1].stat.checksum
          } | to_json | hash('sha256')
        }}
      quadlet_checksum: "{{ openbao_bootstrap_artifact_stats.results[2].stat.checksum }}"
      ca_checksum: "{{ openbao_bootstrap_artifact_stats.results[3].stat.checksum }}"
      certificate_checksum: "{{ openbao_bootstrap_artifact_stats.results[4].stat.checksum }}"
      key_checksum: "{{ openbao_bootstrap_artifact_stats.results[5].stat.checksum }}"
      image_digest: "{{ openbao_image_digest }}"
