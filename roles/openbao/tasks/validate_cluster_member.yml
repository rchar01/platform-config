---
- name: Assert OpenBao HA cluster member is safe
  ansible.builtin.assert:
    that:
      - openbao_cluster_member.name is match('^[A-Za-z0-9_.-]+$')
      - openbao_cluster_member.node_id is match('^[A-Za-z0-9_.-]+$')
      - openbao_cluster_member.address is match('^[0-9]{1,3}([.][0-9]{1,3}){3}$')
      - openbao_cluster_member.address.split('.') | map('int') | select('gt', 255) | list | length == 0
      - openbao_cluster_member.dns is match('^[a-z0-9.-]+$')
      - openbao_cluster_member.dns != openbao_service_dns
    fail_msg: >-
      Every OpenBao cluster member requires safe unique inventory, node, IPv4,
      and node-specific DNS identities.
