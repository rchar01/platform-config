---
- name: Require initial filesystem OpenBao issuance and matching validation CA
  ansible.builtin.assert:
    that:
      - openbao_initial_action in ['pki-request', 'pki-activate']
      - pki_host_local_certificate_transport == 'filesystem'
      - pki_host_local_certificate_operation == 'issue'
      - pki_host_local_certificate_service_adapter == 'openbao-pristine-v1'
      - pki_host_local_certificate_reviewed_ca_source == openbao_tls_ca_src
      - pki_host_local_certificate_reviewed_ca_sha256 == openbao_tls_ca_sha256

- name: Validate the existing target-local PKI contract
  ansible.builtin.include_tasks: ../../pki_host_local_certificate/tasks/validate_target_local.yml
  vars:
    pki_host_local_certificate_request_ttl_seconds: "{{ openbao_pki_request_ttl_seconds | default(3600) }}"

- name: Validate the existing trust bindings
  ansible.builtin.include_tasks: ../../pki_host_local_certificate/tasks/validate_trust.yml

- name: Bind the four fixed public controller trust inputs
  ansible.builtin.assert:
    that:
      - >-
        item.value == lookup('ansible.builtin.env', 'PLATFORM_INFRASTRUCTURE_CONFIG_DIR')
        ~ '/pki-source/pki/csr-trust/' ~ item.key
  loop: "{{ pki_host_local_certificate_trust_sources | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Inspect public controller trust bytes without transfer
  ansible.builtin.stat:
    path: "{{ item.value }}"
    follow: false
    checksum_algorithm: sha256
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false
  loop: "{{ pki_host_local_certificate_trust_sources | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: openbao_initial_trust_sources

- name: Require exact reviewed public controller trust bytes
  ansible.builtin.assert:
    that:
      - item.stat.exists and item.stat.isreg and not item.stat.islnk
      - item.stat.nlink == 1
      - item.stat.mode == '0600'
      - item.stat.size > 0 and item.stat.size <= 65536
      - item.stat.checksum == pki_host_local_certificate_trust_sha256[item.item.key]
  loop: "{{ openbao_initial_trust_sources.results }}"
  loop_control:
    label: "{{ item.item.key }}"

- name: Inspect preprovisioned target trust without installing it
  ansible.builtin.stat:
    path: "{{ item.value }}"
    follow: false
    checksum_algorithm: sha256
  loop: "{{ pki_host_local_certificate_trust_paths | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: openbao_initial_target_trust

- name: Require exact protected preprovisioned target trust
  ansible.builtin.assert:
    that:
      - item.stat.exists and item.stat.isreg and not item.stat.islnk
      - item.stat.nlink == 1 and item.stat.uid == 0 and item.stat.gid == 0
      - item.stat.mode == '0600'
      - item.stat.checksum == pki_host_local_certificate_trust_sha256[item.item.key]
  loop: "{{ openbao_initial_target_trust.results }}"
  loop_control:
    label: "{{ item.item.key }}"

- name: Inspect staged lifecycle helper bytes
  ansible.builtin.stat:
    path: "{{ pki_host_local_certificate_lifecycle_helper_path }}"
    follow: false
    checksum_algorithm: sha256
  register: openbao_initial_helper

- name: Inspect shipped lifecycle helper bytes
  ansible.builtin.stat:
    path: "{{ role_path }}/../pki_host_local_certificate/files/platform-pki-host-local-lifecycle"
    follow: false
    checksum_algorithm: sha256
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false
  register: openbao_initial_helper_source

- name: Require the exact protected staged lifecycle helper
  ansible.builtin.assert:
    that:
      - openbao_initial_helper.stat.exists and openbao_initial_helper.stat.isreg and not openbao_initial_helper.stat.islnk
      - openbao_initial_helper.stat.nlink == 1
      - openbao_initial_helper.stat.uid == 0 and openbao_initial_helper.stat.gid == 0
      - openbao_initial_helper.stat.mode == '0755'
      - openbao_initial_helper.stat.checksum == openbao_initial_helper_source.stat.checksum

- name: Inspect existing filesystem exchange without provisioning access
  ansible.builtin.include_tasks: ../../pki_host_local_certificate/tasks/filesystem_preflight.yml

- name: Inspect stopped masked OpenBao staging
  ansible.builtin.systemd_service:
    name: openbao.service
  register: openbao_initial_unit

- name: Require inactive masked OpenBao before PKI
  ansible.builtin.assert:
    that:
      - openbao_initial_unit.status.ActiveState == 'inactive'
      - openbao_initial_unit.status.UnitFileState == 'masked'

- name: Authenticate request-side OpenBao custody using the existing adapter
  ansible.builtin.include_tasks: custody.yml
  when: openbao_initial_action == 'pki-request'

- name: Require dormant custody before initial request creation
  ansible.builtin.assert:
    that:
      - openbao_tls_custody.custody == 'dormant'
  when: openbao_initial_action == 'pki-request'

# Custody rejects interrupted activation journals. The existing response status
# contract instead admits authenticated replay/recovery without repairing state.
- name: Authenticate activation replay and recovery using existing response preflight
  ansible.builtin.include_tasks: ../../pki_host_local_certificate/tasks/response_preflight.yml
  when: openbao_initial_action == 'pki-activate'
