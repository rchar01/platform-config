---
- name: Inspect active OpenBao lifecycle artifacts
  ansible.builtin.stat:
    path: "{{ item }}"
    checksum_algorithm: sha256
  register: openbao_active_lifecycle_stats
  loop:
    - "{{ openbao_bootstrap_marker_path }}"
    - "{{ openbao_quadlet_path }}"
    - "/run/systemd/generator/multi-user.target.wants/{{ openbao_service_name }}"
    - "{{ openbao_config_path }}"
    - "{{ openbao_listener_path }}"
    - "{{ openbao_tls_ca_path }}"

- name: Require private active OpenBao marker
  ansible.builtin.assert:
    that:
      - openbao_active_lifecycle_stats.results[0].stat.exists
      - openbao_active_lifecycle_stats.results[0].stat.isreg
      - openbao_active_lifecycle_stats.results[0].stat.pw_name == 'root'
      - openbao_active_lifecycle_stats.results[0].stat.mode == '0600'
    fail_msg: OpenBao active lifecycle requires a private completion marker.

- name: Inspect active declarative OpenBao audit configuration
  ansible.builtin.stat:
    path: "{{ openbao_audit_config_path }}"
    checksum_algorithm: sha256
  register: openbao_active_audit_config_stat

- name: Require exact active declarative OpenBao audit configuration
  ansible.builtin.assert:
    that:
      - openbao_active_audit_config_stat.stat.exists
      - openbao_active_audit_config_stat.stat.isreg
      - >-
        openbao_active_audit_config_stat.stat.checksum
        == lookup('ansible.builtin.template', 'audit.hcl.j2') | hash('sha256')
    fail_msg: Active OpenBao lifecycle requires its exact audit configuration.

- name: Read active OpenBao marker
  ansible.builtin.slurp:
    path: "{{ openbao_bootstrap_marker_path }}"
  register: openbao_active_marker_slurp

- name: Parse active OpenBao marker
  ansible.builtin.set_fact:
    openbao_active_marker: >-
      {{ openbao_active_marker_slurp.content | b64decode | from_json }}

- name: Read active OpenBao listener selection
  ansible.builtin.slurp:
    path: "{{ openbao_listener_path }}"
  register: openbao_active_listener_slurp

- name: Derive active OpenBao host-local request
  ansible.builtin.set_fact:
    openbao_active_request_ids: >-
      {{
        openbao_active_listener_slurp.content
        | b64decode
        | regex_findall('/openbao/config/tls-versions/([0-9a-f]{32})/(?:fullchain[.]crt|tls[.]key)')
      }}

- name: Require one exact active OpenBao host-local request
  ansible.builtin.assert:
    that:
      - openbao_active_request_ids | length == 2
      - openbao_active_request_ids | unique | length == 1
    fail_msg: Active OpenBao lifecycle rejects dormant or ambiguous TLS custody.

- name: Inspect active OpenBao host-local leaf files
  ansible.builtin.stat:
    path: "{{ item }}"
    checksum_algorithm: sha256
  register: openbao_active_leaf_stats
  loop:
    - "/etc/openbao/tls-versions/{{ openbao_active_request_ids | first }}/fullchain.crt"
    - "/etc/openbao/tls-versions/{{ openbao_active_request_ids | first }}/tls.key"

- name: Inspect active OpenBao service state
  ansible.builtin.service_facts:

- name: Inspect active OpenBao container state
  ansible.builtin.command:
    argv: [/usr/bin/podman, container, inspect, "{{ openbao_container_name }}"]
  register: openbao_active_container_inspect_command
  changed_when: false

- name: Parse active OpenBao container state
  ansible.builtin.set_fact:
    openbao_active_container_inspect: >-
      {{ openbao_active_container_inspect_command.stdout | from_json | first }}

- name: Require exact active OpenBao lifecycle
  ansible.builtin.assert:
    that:
      - openbao_active_marker.schema == 1
      - openbao_active_marker.state == 'active'
      - openbao_active_marker.inventory_hosts | sort == groups.get('openbao', []) | sort
      - openbao_active_marker.inventory_host == inventory_hostname
      - openbao_active_marker.node_id == openbao_node_name
      - openbao_active_marker.cluster_id is string
      - openbao_active_marker.cluster_id | length > 0
      - openbao_active_marker.cluster_signature is string
      - openbao_active_marker.cluster_signature is match('^[a-f0-9]{64}$')
      - openbao_active_marker.image_digest == openbao_image_digest
      - >-
        openbao_active_marker.audit_config_checksum
        == openbao_active_audit_config_stat.stat.checksum
      - openbao_active_marker.quadlet_checksum == openbao_active_lifecycle_stats.results[1].stat.checksum
      - >-
        openbao_active_marker.config_checksum
        == ({
              'base_config_sha256': openbao_active_lifecycle_stats.results[3].stat.checksum,
              'listener_sha256': openbao_active_lifecycle_stats.results[4].stat.checksum
            } | to_json | hash('sha256'))
      - openbao_active_marker.ca_checksum == openbao_active_lifecycle_stats.results[5].stat.checksum
      - openbao_active_marker.certificate_checksum == openbao_active_leaf_stats.results[0].stat.checksum
      - openbao_active_marker.key_checksum == openbao_active_leaf_stats.results[1].stat.checksum
      - openbao_active_lifecycle_stats.results[2].stat.exists
      - openbao_active_lifecycle_stats.results[2].stat.islnk
      - >-
        openbao_active_lifecycle_stats.results[2].stat.lnk_source
        == '/run/systemd/generator/' ~ openbao_service_name
      - ansible_facts.services.get(openbao_service_name, {}).get('state', '') == 'running'
      - openbao_active_container_inspect.State.Running | bool
      - openbao_active_container_inspect.ImageName == openbao_image
    fail_msg: >-
      OpenBao active lifecycle marker, Quadlet, service, or container is not exact.

- name: Build active OpenBao lifecycle observation
  ansible.builtin.set_fact:
    openbao_active_observation:
      inventory_host: "{{ inventory_hostname }}"
      node_id: "{{ openbao_active_marker.node_id }}"
      cluster_id: "{{ openbao_active_marker.cluster_id }}"
      cluster_signature: "{{ openbao_active_marker.cluster_signature }}"
      image_digest: "{{ openbao_active_marker.image_digest }}"
