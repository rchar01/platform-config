---
- name: Reconcile token and GitLab CA with private data logging disabled
  ansible.builtin.include_tasks: reconcile.yml
  vars:
    _dr_secret_name: "{{ 'rke2-gitlab-' ~ _dr_runner.profile ~ '-' ~ item }}"
    _dr_secret_base: "{{ _dr_objects | selectattr('kind', 'equalto', 'Secret') | selectattr('metadata.name', 'equalto', _dr_secret_name) | first }}"
    _dr_secret_data: >-
      {{ {'runner-token': _dr_material[_dr_runner.profile] | b64encode, 'runner-registration-token': ''}
         if item == 'token' else {(_dr.gitlab_url | urlsplit('hostname')) ~ '.crt': _dr_material.ca | b64encode} }}
    _dr_desired: "{{ _dr_secret_base | combine({'type': 'Opaque', 'data': _dr_secret_data}) }}"
  loop: [token, ca]
  no_log: true
