---
# The fixed printer returns at most 690 characters, never unrelated Secret data
# or metadata. Kubernetes may return no object for the exact legacy name only.
- name: Read a bounded authentication-only projection of the exact Secret
  ansible.builtin.command:
    argv: >-
      {{ _dr_kubectl + ['get', 'secret', _dr_token_name, '-n', _dr_token_namespace,
         '--ignore-not-found', '--allow-missing-template-keys=false',
         '-o=go-template=' ~ lookup('ansible.builtin.file', role_path ~ '/templates/token-secret.gotmpl')] }}
  register: _dr_token_secret_result
  changed_when: false
  check_mode: false
  no_log: true

- name: Require the exact Opaque token Secret shape and bounded canonical base64
  ansible.builtin.assert:
    that:
      - _dr_token_secret_result.stdout != '' or _dr_token_optional
      - _dr_token_secret_result.stdout | length <= 690
      - _dr_token_secret_result.stdout == '' or _dr_token_secret_result.stdout is match('^token:[A-Za-z0-9+/]*={0,2}\Z')
      - _dr_token_secret_result.stdout == '' or ((_dr_token_secret_result.stdout[6:] | length) % 4 == 0)
  no_log: true

- name: Validate decoded authentication bytes without normalization
  vars:
    _dr_encoded: "{{ _dr_token_secret_result.stdout[6:] }}"
    _dr_decoded: "{{ _dr_encoded | b64decode }}"
  ansible.builtin.assert:
    that:
      - _dr_decoded | b64encode == _dr_encoded
      - >-
        (_dr_token_optional and _dr_decoded == '') or
        (_dr_decoded is match('^glrt-[A-Za-z0-9_.-]+\Z') and _dr_decoded | length <= 512)
  no_log: true

- name: Retain only the private comparison value
  ansible.builtin.set_fact:
    _dr_identity_tokens: "{{ _dr_identity_tokens | combine({_dr_token_key: _dr_token_secret_result.stdout[6:] | b64decode}) }}"
  no_log: true
