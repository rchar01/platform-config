---
- name: Assert monitoring stack inputs are configured
  ansible.builtin.assert:
    that:
      - monitoring_stack_prometheus_targets | length > 0
      - monitoring_stack_grafana_admin_password_src | length > 0
    fail_msg: "monitoring_stack_prometheus_targets and monitoring_stack_grafana_admin_password_src are required."

- name: Check Grafana admin password source on control node
  ansible.builtin.stat:
    path: "{{ monitoring_stack_grafana_admin_password_src }}"
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false
  register: monitoring_stack_grafana_admin_password_src_stat

- name: Assert Grafana admin password source exists on control node
  ansible.builtin.assert:
    that:
      - monitoring_stack_grafana_admin_password_src_stat.stat.exists
      - monitoring_stack_grafana_admin_password_src_stat.stat.isreg
    fail_msg: "Grafana admin password file does not exist on the control node: {{ monitoring_stack_grafana_admin_password_src }}"

- name: Assert Grafana admin password source permissions are private
  ansible.builtin.assert:
    that:
      - monitoring_stack_grafana_admin_password_src_stat.stat.mode is match('^0?[46]00$')
    fail_msg: "Grafana admin password file should be readable only by its owner: {{ monitoring_stack_grafana_admin_password_src }}"

- name: Ensure monitoring stack directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ monitoring_stack_config_dir }}"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ monitoring_stack_prometheus_config_dir }}"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ monitoring_stack_prometheus_data_dir }}"
      owner: "{{ monitoring_stack_prometheus_user }}"
      group: "{{ monitoring_stack_prometheus_group }}"
      mode: "0755"
    - path: "{{ monitoring_stack_loki_config_dir }}"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ monitoring_stack_loki_data_dir }}"
      owner: "{{ monitoring_stack_loki_user }}"
      group: "{{ monitoring_stack_loki_group }}"
      mode: "0755"
    - path: "{{ monitoring_stack_grafana_config_dir }}"
      owner: root
      group: "{{ monitoring_stack_grafana_group }}"
      mode: "0750"
    - path: "{{ monitoring_stack_grafana_datasources_dir }}"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ monitoring_stack_grafana_dashboards_dir }}"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ monitoring_stack_grafana_platform_dashboards_dir }}"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ monitoring_stack_grafana_data_dir }}"
      owner: "{{ monitoring_stack_grafana_user }}"
      group: "{{ monitoring_stack_grafana_group }}"
      mode: "0755"

- name: Copy Grafana admin password
  ansible.builtin.copy:
    src: "{{ monitoring_stack_grafana_admin_password_src }}"
    dest: "{{ monitoring_stack_grafana_admin_password_path }}"
    owner: root
    group: "{{ monitoring_stack_grafana_group }}"
    mode: "0640"
  no_log: true
  notify: Restart Grafana

- name: Write Prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ monitoring_stack_prometheus_config_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Prometheus

- name: Write Loki configuration
  ansible.builtin.template:
    src: loki.yml.j2
    dest: "{{ monitoring_stack_loki_config_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Loki

- name: Write Grafana Prometheus datasource
  ansible.builtin.template:
    src: grafana-datasource-prometheus.yml.j2
    dest: "{{ monitoring_stack_grafana_datasource_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Grafana

- name: Write Grafana dashboard provider
  ansible.builtin.template:
    src: grafana-dashboard-provider-platform.yml.j2
    dest: "{{ monitoring_stack_grafana_dashboard_provider_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Grafana

- name: Write Grafana VM overview dashboard
  ansible.builtin.template:
    src: grafana-dashboard-dev-vm-overview.json.j2
    dest: "{{ monitoring_stack_grafana_vm_overview_dashboard_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Grafana

- name: Write Grafana logs overview dashboard
  ansible.builtin.template:
    src: grafana-dashboard-dev-logs-overview.json.j2
    dest: "{{ monitoring_stack_grafana_logs_dashboard_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Grafana

- name: Write Prometheus Quadlet unit
  ansible.builtin.template:
    src: prometheus.container.j2
    dest: "{{ monitoring_stack_quadlet_dir }}/{{ monitoring_stack_prometheus_quadlet_name }}"
    owner: root
    group: root
    mode: "0644"
  register: monitoring_stack_prometheus_quadlet_result
  notify:
    - Reload systemd
    - Restart Prometheus

- name: Write Loki Quadlet unit
  ansible.builtin.template:
    src: loki.container.j2
    dest: "{{ monitoring_stack_quadlet_dir }}/{{ monitoring_stack_loki_quadlet_name }}"
    owner: root
    group: root
    mode: "0644"
  register: monitoring_stack_loki_quadlet_result
  notify:
    - Reload systemd
    - Restart Loki

- name: Write Grafana Quadlet unit
  ansible.builtin.template:
    src: grafana.container.j2
    dest: "{{ monitoring_stack_quadlet_dir }}/{{ monitoring_stack_grafana_quadlet_name }}"
    owner: root
    group: root
    mode: "0644"
  register: monitoring_stack_grafana_quadlet_result
  notify:
    - Reload systemd
    - Restart Grafana

- name: Reload systemd manager configuration
  ansible.builtin.systemd_service:
    daemon_reload: true
  changed_when: false
  when: not ansible_check_mode

- name: Manage Prometheus service
  ansible.builtin.systemd_service:
    name: "{{ monitoring_stack_prometheus_service_name }}"
    enabled: "{{ monitoring_stack_service_enabled }}"
    state: "{{ monitoring_stack_service_state }}"
  when: not (ansible_check_mode and monitoring_stack_prometheus_quadlet_result is changed)

- name: Manage Loki service
  ansible.builtin.systemd_service:
    name: "{{ monitoring_stack_loki_service_name }}"
    enabled: "{{ monitoring_stack_service_enabled }}"
    state: "{{ monitoring_stack_service_state }}"
  when: not (ansible_check_mode and monitoring_stack_loki_quadlet_result is changed)

- name: Manage Grafana service
  ansible.builtin.systemd_service:
    name: "{{ monitoring_stack_grafana_service_name }}"
    enabled: "{{ monitoring_stack_service_enabled }}"
    state: "{{ monitoring_stack_service_state }}"
  when: not (ansible_check_mode and monitoring_stack_grafana_quadlet_result is changed)

- name: Check permanent Grafana firewalld rich rules
  ansible.builtin.command:
    argv:
      - firewall-offline-cmd
      - --query-rich-rule
      - "rule family=\"{{ 'ipv6' if ':' in item else 'ipv4' }}\" source address=\"{{ item }}\" port port=\"{{ monitoring_stack_grafana_http_port }}\" protocol=\"tcp\" accept"
  loop: "{{ monitoring_stack_grafana_firewalld_allowed_sources }}"
  register: monitoring_stack_grafana_firewalld_rich_rule_checks
  check_mode: false
  changed_when: false
  failed_when: monitoring_stack_grafana_firewalld_rich_rule_checks.rc not in [0, 1]
  when:
    - monitoring_stack_firewalld_manage | bool
    - monitoring_stack_grafana_firewalld_allowed_sources | length > 0

- name: Add permanent Grafana firewalld rich rules
  ansible.builtin.command:
    argv:
      - firewall-offline-cmd
      - --add-rich-rule
      - "{{ item.cmd[2] }}"
  loop: "{{ monitoring_stack_grafana_firewalld_rich_rule_checks.results | default([]) | selectattr('rc', 'eq', 1) | list }}"
  changed_when: true
  when:
    - monitoring_stack_firewalld_manage | bool
    - not ansible_check_mode

- name: Check permanent Loki firewalld rich rules
  ansible.builtin.command:
    argv:
      - firewall-offline-cmd
      - --query-rich-rule
      - "rule family=\"{{ 'ipv6' if ':' in item else 'ipv4' }}\" source address=\"{{ item }}\" port port=\"{{ monitoring_stack_loki_http_listen_port }}\" protocol=\"tcp\" accept"
  loop: "{{ monitoring_stack_loki_firewalld_allowed_sources }}"
  register: monitoring_stack_loki_firewalld_rich_rule_checks
  check_mode: false
  changed_when: false
  failed_when: monitoring_stack_loki_firewalld_rich_rule_checks.rc not in [0, 1]
  when:
    - monitoring_stack_firewalld_manage | bool
    - monitoring_stack_loki_firewalld_allowed_sources | length > 0

- name: Add permanent Loki firewalld rich rules
  ansible.builtin.command:
    argv:
      - firewall-offline-cmd
      - --add-rich-rule
      - "{{ item.cmd[2] }}"
  loop: "{{ monitoring_stack_loki_firewalld_rich_rule_checks.results | default([]) | selectattr('rc', 'eq', 1) | list }}"
  changed_when: true
  when:
    - monitoring_stack_firewalld_manage | bool
    - not ansible_check_mode
