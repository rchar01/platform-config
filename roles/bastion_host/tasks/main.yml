---
- name: Install bastion host packages
  ansible.builtin.package:
    name: "{{ bastion_host_base_packages }}"
    state: present
  when: bastion_host_base_packages | length > 0

- name: Ensure platform directory layout exists
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ bastion_host_platform_dir }}"
    - "{{ bastion_host_bin_dir }}"
    - "{{ bastion_host_etc_dir }}"
    - "{{ bastion_host_lib_dir }}"
    - "{{ bastion_host_runtime_dir }}"
