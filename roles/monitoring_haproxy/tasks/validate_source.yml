---
- name: Assert monitoring HAProxy source syntax
  ansible.builtin.assert:
    that:
      - >-
        monitoring_haproxy_source is match(
          '^(0|[1-9][0-9]{0,2})([.](0|[1-9][0-9]{0,2})){3}'
          ~ '/([1-9]|[12][0-9]|3[0-2])$'
        )
      - monitoring_haproxy_source_prefix | int >= monitoring_haproxy_source_group.minimum_prefix
      - >-
        monitoring_haproxy_source.split('/') | first | split('.')
        | map('int') | select('gt', 255) | list | length == 0
      - >-
        (monitoring_haproxy_source_integer | int)
        % (2 ** (32 - (monitoring_haproxy_source_prefix | int))) == 0
    fail_msg: >-
      Monitoring HAProxy source {{ monitoring_haproxy_source }} must be a
      unique, network-normalized IPv4 CIDR no broader than
      /{{ monitoring_haproxy_source_group.minimum_prefix }}.
  vars:
    monitoring_haproxy_source_octets: >-
      {{ monitoring_haproxy_source.split('/') | first | split('.') | map('int') | list }}
    monitoring_haproxy_source_prefix: >-
      {{ monitoring_haproxy_source.split('/') | last | int }}
    monitoring_haproxy_source_integer: >-
      {{
        monitoring_haproxy_source_octets[0] * 16777216
        + monitoring_haproxy_source_octets[1] * 65536
        + monitoring_haproxy_source_octets[2] * 256
        + monitoring_haproxy_source_octets[3]
      }}
