---
- name: Assert monitoring HAProxy scalar contract
  ansible.builtin.assert:
    that:
      - monitoring_haproxy_contract_ready is boolean
      - monitoring_haproxy_contract_ready
      - monitoring_haproxy_enabled is boolean
      - monitoring_haproxy_service_enabled is boolean
      - monitoring_haproxy_package_nevra is match('^haproxy-[0-9]+:[0-9][A-Za-z0-9_.+-]*-[A-Za-z0-9_.+~-]+[.]x86_64$')
      - monitoring_haproxy_package_nevra == 'haproxy-0:3.0.5-6.el10_2.1.x86_64'
      - monitoring_haproxy_user == 'haproxy'
      - monitoring_haproxy_group == 'haproxy'
      - monitoring_haproxy_maxconn is integer
      - monitoring_haproxy_maxconn >= 1
      - monitoring_haproxy_maxconn <= 1000000
      - monitoring_haproxy_frontend_bind_address == '*'
      - monitoring_haproxy_https_port is integer
      - monitoring_haproxy_postgresql_frontend_port is integer
      - monitoring_haproxy_metrics_port is integer
      - monitoring_haproxy_https_port | int == 443
      - monitoring_haproxy_postgresql_frontend_port | int == 5432
      - monitoring_haproxy_metrics_port | int >= 1
      - monitoring_haproxy_metrics_port | int <= 65535
      - monitoring_haproxy_metrics_path == '/metrics'
      - monitoring_haproxy_tenant is match('^[A-Za-z0-9_.-]+$')
      - monitoring_haproxy_timeout_connect is match('^[1-9][0-9]*[smh]$')
      - monitoring_haproxy_timeout_client is match('^[1-9][0-9]*[smh]$')
      - monitoring_haproxy_timeout_server is match('^[1-9][0-9]*[smh]$')
      - monitoring_haproxy_timeout_check is match('^[1-9][0-9]*[smh]$')
      - monitoring_haproxy_check_interval is match('^[1-9][0-9]*[smh]$')
      - monitoring_haproxy_check_rise is integer
      - monitoring_haproxy_check_rise >= 1
      - monitoring_haproxy_check_fall is integer
      - monitoring_haproxy_check_fall >= 1
    fail_msg: >-
      Monitoring HAProxy requires an explicitly ready contract, exact HAProxy
      NEVRA, fixed client ports, a valid metrics port, and a safe tenant.

- name: Build monitoring HAProxy listener port contract
  ansible.builtin.set_fact:
    monitoring_haproxy_listener_ports:
      - "{{ monitoring_haproxy_https_port }}"
      - "{{ monitoring_haproxy_postgresql_frontend_port }}"
      - "{{ monitoring_haproxy_metrics_port }}"

- name: Assert monitoring HAProxy listener ports are unique
  ansible.builtin.assert:
    that:
      - monitoring_haproxy_listener_ports | unique | length == 3
    fail_msg: >-
      Monitoring HAProxy requires unique HTTPS, PostgreSQL frontend, and metrics
      listener ports.

- name: Assert exact monitoring HAProxy backend service set
  ansible.builtin.assert:
    that:
      - monitoring_haproxy_backends is mapping
      - >-
        monitoring_haproxy_backends.keys() | list | sort
        == ['alertmanager', 'grafana', 'loki', 'mimir', 'postgresql', 's3']
    fail_msg: >-
      Monitoring HAProxy requires exactly Grafana, Loki, Mimir, integrated
      Alertmanager, S3, and PostgreSQL backend entries.

- name: Assert role-owned monitoring health policy contract
  ansible.builtin.assert:
    that:
      - >-
        monitoring_haproxy_health_policies == {
          'grafana': {
            'method': 'GET', 'path': '/api/health', 'protocol': 'https',
            'port_relation': 'service'
          },
          'loki': {
            'method': 'GET', 'path': '/ready', 'protocol': 'https',
            'port_relation': 'service'
          },
          'mimir': {
            'method': 'GET', 'path': '/ready', 'protocol': 'https',
            'port_relation': 'service'
          },
          'alertmanager': {
            'method': 'GET', 'path': '/ready', 'protocol': 'https',
            'port_relation': 'service'
          },
          's3': {
            'method': 'GET', 'path': '/health', 'protocol': 'http',
            'port_relation': 'separate'
          },
          'postgresql': {
            'method': 'HEAD', 'path': '/primary', 'protocol': 'https',
            'port_relation': 'separate'
          }
        }
    fail_msg: >-
      Monitoring HAProxy health policies are role-owned exact status-only
      routing policy and cannot be overridden.

- name: Validate monitoring HAProxy backend services
  ansible.builtin.include_tasks: validate_backend.yml
  loop: "{{ monitoring_haproxy_backends | dict2items }}"
  loop_control:
    loop_var: monitoring_haproxy_backend_service
    label: "{{ monitoring_haproxy_backend_service.key }}"

- name: Require unrelated monitoring backend ports to be unique
  ansible.builtin.assert:
    that:
      - >-
        monitoring_haproxy_backends
        | dict2items
        | rejectattr('key', 'equalto', 'alertmanager')
        | map(attribute='value.port')
        | unique
        | length == 5
    fail_msg: >-
      Monitoring HAProxy backend ports must be unique except for integrated
      Alertmanager sharing Mimir's backend port.

- name: Require integrated Alertmanager to share the Mimir backend port
  ansible.builtin.assert:
    that:
      - >-
        monitoring_haproxy_backends.alertmanager.port
        == monitoring_haproxy_backends.mimir.port
      - >-
        monitoring_haproxy_backends.alertmanager.targets
        == monitoring_haproxy_backends.mimir.targets
    fail_msg: >-
      The integrated Alertmanager must use the exact Mimir backend port and
      target topology; standalone Alertmanager is outside the locked monitoring
      topology.

- name: Assert separate monitoring health ports are isolated
  ansible.builtin.assert:
    that:
      - >-
        monitoring_haproxy_backends.s3.health_port
        != monitoring_haproxy_backends.postgresql.health_port
      - >-
        monitoring_haproxy_backends.s3.health_port
        not in monitoring_haproxy_listener_ports
      - >-
        monitoring_haproxy_backends.postgresql.health_port
        not in monitoring_haproxy_listener_ports
      - >-
        monitoring_haproxy_backends.s3.health_port
        not in monitoring_haproxy_backends.values() | map(attribute='port') | list
      - >-
        monitoring_haproxy_backends.postgresql.health_port
        not in monitoring_haproxy_backends.values() | map(attribute='port') | list
    fail_msg: >-
      Garage Admin and Patroni REST health ports must be distinct private ports
      that do not collide with HAProxy listeners or service backend ports.

- name: Assert monitoring HAProxy metrics bind address
  ansible.builtin.assert:
    that:
      - >-
        monitoring_haproxy_metrics_bind_address is match(
          '^(0|[1-9][0-9]{0,2})([.](0|[1-9][0-9]{0,2})){3}$'
        )
      - >-
        monitoring_haproxy_metrics_bind_address.split('.') | map('int')
        | select('gt', 255) | list | length == 0
      - monitoring_haproxy_metrics_bind_address != '0.0.0.0'
    fail_msg: >-
      Monitoring HAProxy metrics require a restricted valid IPv4 bind address.

- name: Assert monitoring HAProxy TLS source paths
  ansible.builtin.assert:
    that:
      - monitoring_haproxy_tls_source is string
      - monitoring_haproxy_tls_source is match('^/[^\n\r\u0000]+$')
    fail_msg: >-
      Monitoring HAProxy TLS sources must be non-empty absolute controller paths.
  loop:
    - "{{ monitoring_haproxy_frontend_pem_src }}"
    - "{{ monitoring_haproxy_client_ca_src }}"
    - "{{ monitoring_haproxy_client_crl_src }}"
    - "{{ monitoring_haproxy_backend_ca_src }}"
    - "{{ monitoring_haproxy_backend_client_pem_src }}"
  loop_control:
    loop_var: monitoring_haproxy_tls_source
    label: "{{ monitoring_haproxy_tls_source }}"

- name: Assert monitoring HAProxy installed TLS and map paths
  ansible.builtin.assert:
    that:
      - monitoring_haproxy_installed_path is string
      - >-
        monitoring_haproxy_installed_path
        is match('^/[A-Za-z0-9_./-]+$')
    fail_msg: >-
      Monitoring HAProxy installed TLS and identity-map paths must be safe
      absolute paths.
  loop:
    - "{{ monitoring_haproxy_frontend_pem_path }}"
    - "{{ monitoring_haproxy_client_ca_path }}"
    - "{{ monitoring_haproxy_client_crl_path }}"
    - "{{ monitoring_haproxy_backend_ca_path }}"
    - "{{ monitoring_haproxy_backend_client_pem_path }}"
    - "{{ monitoring_haproxy_identity_map_path }}"
  loop_control:
    loop_var: monitoring_haproxy_installed_path
    label: "{{ monitoring_haproxy_installed_path }}"

- name: Build monitoring HAProxy service DNS list
  ansible.builtin.set_fact:
    monitoring_haproxy_service_dns_names:
      - "{{ monitoring_haproxy_grafana_dns }}"
      - "{{ monitoring_haproxy_loki_dns }}"
      - "{{ monitoring_haproxy_mimir_dns }}"
      - "{{ monitoring_haproxy_s3_dns }}"
      - "{{ monitoring_haproxy_alertmanager_dns }}"
      - "{{ monitoring_haproxy_postgresql_dns }}"

- name: Assert monitoring HAProxy service DNS names
  ansible.builtin.assert:
    that:
      - >-
        monitoring_haproxy_service_dns_name is match(
          '^(?=.{1,253}$)[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?'
          ~ '(?:[.][a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)+$'
        )
    fail_msg: >-
      Monitoring HAProxy service DNS names must be unique lowercase FQDNs.
  loop: "{{ monitoring_haproxy_service_dns_names }}"
  loop_control:
    loop_var: monitoring_haproxy_service_dns_name

- name: Assert monitoring HAProxy service DNS names are unique
  ansible.builtin.assert:
    that:
      - >-
        monitoring_haproxy_service_dns_names | unique | length
        == monitoring_haproxy_service_dns_names | length
    fail_msg: Monitoring HAProxy service DNS names must be unique.

- name: Assert monitoring HAProxy identity map collection
  ansible.builtin.assert:
    that:
      - monitoring_haproxy_identity_roles is sequence
      - monitoring_haproxy_identity_roles is not string
      - monitoring_haproxy_identity_roles | length >= 10
    fail_msg: >-
      Monitoring HAProxy requires a populated identity-role sequence.

- name: Validate monitoring HAProxy identity entries
  ansible.builtin.include_tasks: validate_identity.yml
  loop: "{{ monitoring_haproxy_identity_roles }}"
  loop_control:
    loop_var: monitoring_haproxy_identity
    label: "{{ monitoring_haproxy_identity.role | default('invalid') }}"

- name: Assert monitoring HAProxy identity map is complete
  ansible.builtin.assert:
    that:
      - >-
        [
          'alloy_loki_writer',
          'alloy_mimir_writer',
          'garage_s3',
          'grafana_alertmanager',
          'grafana_browser',
          'grafana_loki_query',
          'grafana_mimir_query',
          'monitoring_probe',
          'monitoring_s3_probe',
          'operator'
        ]
        | difference(monitoring_haproxy_identity_roles | map(attribute='role') | list)
        | length == 0
      - >-
        monitoring_haproxy_identity_roles | map(attribute='subject_dn') | unique | length
        == monitoring_haproxy_identity_roles | length
    fail_msg: >-
      Monitoring HAProxy requires every mandatory identity role and unique exact
      subject DNs.

- name: Assert monitoring HAProxy probe routes match observer profiles
  ansible.builtin.assert:
    that:
      - >-
        monitoring_haproxy_grafana_probe_routes
        == [{'method': 'GET', 'path': '/api/health'}]
      - >-
        monitoring_haproxy_loki_probe_routes
        == [{'method': 'GET', 'path': '/ready'}]
      - >-
        monitoring_haproxy_mimir_probe_routes
        == [{'method': 'GET', 'path': '/ready'}]
    fail_msg: >-
      Monitoring HAProxy probes require exact host-scoped GET routes matching
      the locked Grafana, Loki, and Mimir observer profiles.

- name: Assert monitoring HAProxy S3 probe methods are least privilege
  ansible.builtin.assert:
    that:
      - monitoring_haproxy_s3_probe_methods == ['DELETE', 'GET', 'PUT']
    fail_msg: >-
      The monitoring S3 probe identity requires exact DELETE, GET, and PUT
      access on the S3 host; Garage credentials enforce bucket and object scope.

- name: Assert monitoring HAProxy S3 data methods
  ansible.builtin.assert:
    that:
      - monitoring_haproxy_s3_methods == ['DELETE', 'GET', 'HEAD', 'POST', 'PUT']
    fail_msg: >-
      Monitoring HAProxy S3 forwarding requires exact Garage data-plane methods.

- name: Validate monitoring HAProxy route groups
  ansible.builtin.include_tasks: validate_route_group.yml
  loop:
    - name: loki_writer
      routes: "{{ monitoring_haproxy_loki_writer_routes }}"
      methods: [POST]
    - name: loki_query
      routes: "{{ monitoring_haproxy_loki_query_routes }}"
      methods: [GET, POST]
    - name: mimir_writer
      routes: "{{ monitoring_haproxy_mimir_writer_routes }}"
      methods: [POST]
    - name: mimir_query
      routes: "{{ monitoring_haproxy_mimir_query_routes }}"
      methods: [GET, POST]
    - name: alertmanager
      routes: "{{ monitoring_haproxy_alertmanager_routes }}"
      methods: [DELETE, GET, PATCH, POST, PUT]
    - name: grafana_probe
      routes: "{{ monitoring_haproxy_grafana_probe_routes }}"
      methods: [GET]
    - name: loki_probe
      routes: "{{ monitoring_haproxy_loki_probe_routes }}"
      methods: [GET]
    - name: mimir_probe
      routes: "{{ monitoring_haproxy_mimir_probe_routes }}"
      methods: [GET]
  loop_control:
    loop_var: monitoring_haproxy_route_group
    label: "{{ monitoring_haproxy_route_group.name }}"

- name: Validate monitoring HAProxy operator routes
  ansible.builtin.include_tasks: validate_operator_routes.yml

- name: Validate monitoring HAProxy restricted source groups
  ansible.builtin.include_tasks: validate_source_group.yml
  loop:
    - name: https
      sources: "{{ monitoring_haproxy_https_allowed_sources }}"
      minimum_prefix: 24
    - name: postgresql
      sources: "{{ monitoring_haproxy_postgresql_allowed_sources }}"
      minimum_prefix: 24
    - name: metrics
      sources: "{{ monitoring_haproxy_metrics_allowed_sources }}"
      minimum_prefix: 24
    - name: operator
      sources: "{{ monitoring_haproxy_operator_allowed_sources }}"
      minimum_prefix: 24
  loop_control:
    loop_var: monitoring_haproxy_source_group
    label: "{{ monitoring_haproxy_source_group.name }}"

- name: Validate operator sources are contained by HTTPS policy
  ansible.builtin.include_tasks: validate_operator_source.yml
  loop: "{{ monitoring_haproxy_operator_allowed_sources }}"
  loop_control:
    loop_var: monitoring_haproxy_operator_source
    label: "{{ monitoring_haproxy_operator_source }}"
