---
- name: Assert monitoring HAProxy operator routes are populated
  ansible.builtin.assert:
    that:
      - monitoring_haproxy_operator_routes is sequence
      - monitoring_haproxy_operator_routes is not string
      - monitoring_haproxy_operator_routes | length > 0
    fail_msg: >-
      Monitoring HAProxy operator routes require observed exact service routes.

- name: Reset monitoring HAProxy operator route keys
  ansible.builtin.set_fact:
    monitoring_haproxy_operator_route_keys: []

- name: Validate monitoring HAProxy operator route entries
  ansible.builtin.include_tasks: validate_operator_route.yml
  loop: "{{ monitoring_haproxy_operator_routes }}"
  loop_control:
    loop_var: monitoring_haproxy_operator_route
    label: >-
      {{ monitoring_haproxy_operator_route.service | default('invalid') }}
      {{ monitoring_haproxy_operator_route.method | default('invalid') }}
      {{ monitoring_haproxy_operator_route.path | default('invalid') }}

- name: Build monitoring HAProxy operator route keys
  ansible.builtin.set_fact:
    monitoring_haproxy_operator_route_keys: >-
      {{ monitoring_haproxy_operator_route_keys + [
        monitoring_haproxy_operator_route.service ~ ' '
        ~ monitoring_haproxy_operator_route.method ~ ' '
        ~ monitoring_haproxy_operator_route.path
      ] }}
  loop: "{{ monitoring_haproxy_operator_routes }}"
  loop_control:
    loop_var: monitoring_haproxy_operator_route
    label: >-
      {{ monitoring_haproxy_operator_route.service | default('invalid') }}
      {{ monitoring_haproxy_operator_route.method | default('invalid') }}
      {{ monitoring_haproxy_operator_route.path | default('invalid') }}

- name: Assert monitoring HAProxy operator routes are unique
  ansible.builtin.assert:
    that:
      - >-
        monitoring_haproxy_operator_route_keys | unique | length
        == monitoring_haproxy_operator_route_keys | length
    fail_msg: Monitoring HAProxy operator routes must be unique.
