---
# Exact-version status-only routing checks. Bodies remain diagnostic and are not
# part of backend eligibility.
monitoring_haproxy_health_policies:
  grafana:
    method: GET
    path: /api/health
    protocol: https
    port_relation: service
  loki:
    method: GET
    path: /ready
    protocol: https
    port_relation: service
  mimir:
    method: GET
    path: /ready
    protocol: https
    port_relation: service
  alertmanager:
    method: GET
    path: /ready
    protocol: https
    port_relation: service
  s3:
    method: GET
    path: /health
    protocol: http
    port_relation: separate
  postgresql:
    method: HEAD
    path: /primary
    protocol: https
    port_relation: separate
