---
- name: Validate storage volume definitions
  ansible.builtin.include_tasks: validate.yml

- name: Collect installed storage volume packages
  ansible.builtin.package_facts:
    manager: auto
  when: storage_volumes | length > 0

- name: Install missing storage volume packages
  ansible.builtin.package:
    name: "{{ storage_volume_packages }}"
    state: present
  when:
    - storage_volumes | length > 0
    - storage_volume_packages | difference(ansible_facts.packages) | length > 0

- name: Initialize reused storage layout state
  ansible.builtin.set_fact:
    storage_volume_reuse_layout_state: {}

- name: Verify reused storage volume groups before mutation
  ansible.builtin.include_tasks: reuse_existing_vg.yml
  loop: "{{ storage_volume_layouts }}"
  loop_control:
    loop_var: storage_volume_reuse_layout
    label: "{{ storage_volume_reuse_layout.name }}"
  when: storage_volume_reuse_layout.reuse_existing_vg | default(false) | bool

- name: Manage storage volumes
  ansible.builtin.include_tasks: volume.yml
  loop: "{{ storage_volumes }}"
  loop_control:
    loop_var: storage_volume
    label: "{{ storage_volume.name | default(storage_volume.mountpoint | default(storage_volume.lv_name | default('volume'))) }}"

- name: Verify storage volume layout headroom
  ansible.builtin.include_tasks: verify_layouts.yml
  when: storage_volume_layouts | length > 0
