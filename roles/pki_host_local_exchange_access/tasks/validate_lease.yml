---
- name: Validate fixed host-local PKI exchange operation lease
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - |
        import os
        import re
        import stat
        import sys

        path, expected = sys.argv[1:]
        descriptor = os.open(path, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
        try:
            metadata = os.fstat(descriptor)
            token = os.getxattr(
                descriptor, b"user.platform_config_operation"
            ).decode("ascii")
            xattrs = set(os.listxattr(descriptor))
            if not stat.S_ISDIR(metadata.st_mode):
                raise SystemExit("lease is not a directory")
            if metadata.st_uid != 0 or metadata.st_gid != 0:
                raise SystemExit("lease is not root-owned")
            if stat.S_IMODE(metadata.st_mode) != 0o700:
                raise SystemExit("lease mode is not 0700")
            if metadata.st_nlink != 2:
                raise SystemExit("lease link count is invalid")
            if os.listdir(descriptor):
                raise SystemExit("lease directory is not empty")
            if xattrs - {
                "security.selinux",
                "user.platform_config_operation",
            }:
                raise SystemExit("lease has unexpected metadata")
            if re.fullmatch(r"[0-9a-f]{64}", token) is None:
                raise SystemExit("lease operation token is invalid")
            if expected and token != expected:
                raise SystemExit("lease belongs to another operation")
        finally:
            os.close(descriptor)
      - "{{ pki_host_local_exchange_access_lease_path }}"
      - "{{ pki_host_local_exchange_access_operation_token }}"
  changed_when: false
  check_mode: false
