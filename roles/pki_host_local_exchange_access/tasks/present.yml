---
- name: Inspect existing host-local PKI exchange account
  ansible.builtin.command:
    argv:
      - /usr/bin/getent
      - passwd
      - "{{ pki_host_local_exchange_access_user }}"
  register: pki_host_local_exchange_access_existing_user
  changed_when: false
  failed_when: pki_host_local_exchange_access_existing_user.rc not in [0, 2]
  check_mode: false

- name: Inspect existing host-local PKI exchange group
  ansible.builtin.command:
    argv:
      - /usr/bin/getent
      - group
      - "{{ pki_host_local_exchange_access_group }}"
  register: pki_host_local_exchange_access_existing_group
  changed_when: false
  failed_when: pki_host_local_exchange_access_existing_group.rc not in [0, 2]
  check_mode: false

- name: Inspect host-local PKI exchange ownership marker
  ansible.builtin.stat:
    path: "{{ pki_host_local_exchange_access_marker_path }}"
    follow: false
  register: pki_host_local_exchange_access_marker

- name: Validate existing host-local PKI exchange ownership marker metadata
  ansible.builtin.assert:
    that:
      - pki_host_local_exchange_access_marker.stat.isreg
      - not pki_host_local_exchange_access_marker.stat.islnk
      - pki_host_local_exchange_access_marker.stat.uid == 0
      - pki_host_local_exchange_access_marker.stat.gid == 0
      - pki_host_local_exchange_access_marker.stat.mode == '0600'
    fail_msg: Existing host-local PKI exchange ownership marker metadata is unsafe.
  when: pki_host_local_exchange_access_marker.stat.exists

- name: Read existing host-local PKI exchange ownership marker
  ansible.builtin.slurp:
    path: "{{ pki_host_local_exchange_access_marker_path }}"
  register: pki_host_local_exchange_access_marker_content
  when: pki_host_local_exchange_access_marker.stat.exists

- name: Decode existing host-local PKI exchange ownership marker
  ansible.builtin.set_fact:
    pki_host_local_exchange_access_marker_text: >-
      {{ pki_host_local_exchange_access_marker_content.content | b64decode }}
    pki_host_local_exchange_access_marker_record: >-
      {{ pki_host_local_exchange_access_marker_content.content | b64decode | from_json }}
  when: pki_host_local_exchange_access_marker.stat.exists

- name: Validate existing host-local PKI exchange ownership record
  ansible.builtin.assert:
    that:
      - pki_host_local_exchange_access_marker_record.state in ['reserved', 'managed']
      - >-
        (
          pki_host_local_exchange_access_marker_record.state == 'reserved'
          and pki_host_local_exchange_access_marker_record.keys() | list | sort
              == ['group', 'home', 'schema', 'shell', 'state', 'user']
        )
        or (
          pki_host_local_exchange_access_marker_record.state == 'managed'
          and pki_host_local_exchange_access_marker_record.keys() | list | sort
              == ['gid', 'group', 'home', 'schema', 'shell', 'state', 'uid', 'user']
        )
      - pki_host_local_exchange_access_marker_record.schema == 1
      - >-
        pki_host_local_exchange_access_marker_record.user
        == pki_host_local_exchange_access_user
      - >-
        pki_host_local_exchange_access_marker_record.group
        == pki_host_local_exchange_access_group
      - >-
        pki_host_local_exchange_access_marker_record.home
        == pki_host_local_exchange_access_home
      - >-
        pki_host_local_exchange_access_marker_record.shell
        == pki_host_local_exchange_access_shell
      - >-
        pki_host_local_exchange_access_marker_text
        == (
          pki_host_local_exchange_access_marker_record
          | to_json(sort_keys=true, separators=[',', ':'])
        ) ~ '\n'
    fail_msg: Existing host-local PKI exchange ownership marker is not the exact canonical record.
  when: pki_host_local_exchange_access_marker.stat.exists

- name: Refuse unmanaged host-local PKI exchange identity collisions
  ansible.builtin.assert:
    that:
      - >-
        (
          not pki_host_local_exchange_access_marker.stat.exists
          and pki_host_local_exchange_access_existing_user.rc != 0
          and pki_host_local_exchange_access_existing_group.rc != 0
        )
        or (
          pki_host_local_exchange_access_marker.stat.exists
          and (
            pki_host_local_exchange_access_marker_record.state == 'reserved'
            or (
              pki_host_local_exchange_access_marker_record.state == 'managed'
              and pki_host_local_exchange_access_existing_user.rc == 0
              and pki_host_local_exchange_access_existing_group.rc == 0
            )
          )
        )
      - >-
        pki_host_local_exchange_access_existing_user.rc != 0
        or (
          pki_host_local_exchange_access_existing_user.stdout.split(':') | length == 7
          and pki_host_local_exchange_access_existing_user.stdout.split(':')[0]
              == pki_host_local_exchange_access_user
          and pki_host_local_exchange_access_existing_user.stdout.split(':')[2] | int < 1000
          and pki_host_local_exchange_access_existing_user.stdout.split(':')[5]
              == pki_host_local_exchange_access_home
          and pki_host_local_exchange_access_existing_user.stdout.split(':')[6]
              == pki_host_local_exchange_access_shell
        )
      - >-
        pki_host_local_exchange_access_existing_group.rc != 0
        or (
          pki_host_local_exchange_access_existing_group.stdout.split(':') | length == 4
          and pki_host_local_exchange_access_existing_group.stdout.split(':')[0]
              == pki_host_local_exchange_access_group
          and pki_host_local_exchange_access_existing_group.stdout.split(':')[2] | int < 1000
          and pki_host_local_exchange_access_existing_group.stdout.split(':')[3] == ''
        )
      - >-
        pki_host_local_exchange_access_existing_user.rc != 0
        or pki_host_local_exchange_access_existing_group.rc != 0
        or pki_host_local_exchange_access_existing_user.stdout.split(':')[3]
            == pki_host_local_exchange_access_existing_group.stdout.split(':')[2]
      - >-
        not pki_host_local_exchange_access_marker.stat.exists
        or pki_host_local_exchange_access_marker_record.state == 'reserved'
        or pki_host_local_exchange_access_marker_record.uid
            == pki_host_local_exchange_access_existing_user.stdout.split(':')[2] | int
      - >-
        not pki_host_local_exchange_access_marker.stat.exists
        or pki_host_local_exchange_access_marker_record.state == 'reserved'
        or pki_host_local_exchange_access_marker_record.gid
            == pki_host_local_exchange_access_existing_group.stdout.split(':')[2] | int
    fail_msg: Refusing to adopt an unmanaged or incompatible exchange account, group, or ownership marker.

- name: Inspect fixed exchange facade and protected ancestors
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: false
  loop:
    - path: /
      kind: directory
    - path: /usr
      kind: directory
    - path: /usr/local
      kind: directory
    - path: /usr/local/libexec
      kind: directory
    - path: "{{ pki_host_local_exchange_access_helper_path }}"
      kind: file
  loop_control:
    label: "{{ item.path }}"
  register: pki_host_local_exchange_access_helper_chain

- name: Require a protected root-owned exchange facade
  ansible.builtin.assert:
    that:
      - >-
        (
          ansible_check_mode
          and item.item.kind == 'file'
          and not item.stat.exists
        )
        or (
          item.stat.exists
          and not item.stat.islnk
          and item.stat.uid == 0
          and item.stat.gid == 0
          and (
            (item.item.kind == 'directory' and item.stat.isdir)
            or (item.item.kind == 'file' and item.stat.isreg and item.stat.mode == '0755')
          )
          and item.stat.mode is match('^[0-7][0-7][0145][0145]$')
        )
    fail_msg: Exchange access requires an installed root-owned facade beneath non-writable root-owned directories.
  loop: "{{ pki_host_local_exchange_access_helper_chain.results }}"
  loop_control:
    label: "{{ item.item.path }}"

- name: Create exchange managed-state directory
  ansible.builtin.file:
    path: "{{ pki_host_local_exchange_access_marker_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Reserve host-local PKI exchange account and group names
  ansible.builtin.copy:
    dest: "{{ pki_host_local_exchange_access_marker_path }}"
    owner: root
    group: root
    mode: "0600"
    content: >
      {{
        {
          'schema': 1,
          'state': 'reserved',
          'user': pki_host_local_exchange_access_user,
          'group': pki_host_local_exchange_access_group,
          'home': pki_host_local_exchange_access_home,
          'shell': pki_host_local_exchange_access_shell
        }
        | to_json(sort_keys=true, separators=[',', ':'])
      }}
  when: not pki_host_local_exchange_access_marker.stat.exists

- name: Create locked host-local PKI exchange group
  ansible.builtin.group:
    name: "{{ pki_host_local_exchange_access_group }}"
    system: true
    state: present

- name: Create locked host-local PKI exchange account
  ansible.builtin.user:
    name: "{{ pki_host_local_exchange_access_user }}"
    group: "{{ pki_host_local_exchange_access_group }}"
    system: true
    create_home: false
    home: "{{ pki_host_local_exchange_access_home }}"
    shell: "{{ pki_host_local_exchange_access_shell }}"
    password_lock: true
    groups: ""
    append: false
    expires: -1
    state: present

- name: Inspect converged host-local PKI exchange account
  ansible.builtin.command:
    argv:
      - /usr/bin/getent
      - passwd
      - "{{ pki_host_local_exchange_access_user }}"
  register: pki_host_local_exchange_access_converged_user
  changed_when: false
  failed_when: pki_host_local_exchange_access_converged_user.rc not in [0, 2]
  check_mode: false
  when: not ansible_check_mode or pki_host_local_exchange_access_existing_user.rc == 0

- name: Inspect converged host-local PKI exchange group
  ansible.builtin.command:
    argv:
      - /usr/bin/getent
      - group
      - "{{ pki_host_local_exchange_access_group }}"
  register: pki_host_local_exchange_access_converged_group
  changed_when: false
  failed_when: pki_host_local_exchange_access_converged_group.rc not in [0, 2]
  check_mode: false
  when: not ansible_check_mode or pki_host_local_exchange_access_existing_group.rc == 0

- name: Validate converged host-local PKI exchange identity
  ansible.builtin.assert:
    that:
      - pki_host_local_exchange_access_converged_user.rc == 0
      - pki_host_local_exchange_access_converged_group.rc == 0
      - pki_host_local_exchange_access_converged_user.stdout.split(':') | length == 7
      - pki_host_local_exchange_access_converged_group.stdout.split(':') | length == 4
      - pki_host_local_exchange_access_converged_user.stdout.split(':')[2] | int < 1000
      - pki_host_local_exchange_access_converged_group.stdout.split(':')[2] | int < 1000
      - pki_host_local_exchange_access_converged_group.stdout.split(':')[3] == ''
      - >-
        pki_host_local_exchange_access_converged_user.stdout.split(':')[0]
        == pki_host_local_exchange_access_user
      - >-
        pki_host_local_exchange_access_converged_group.stdout.split(':')[0]
        == pki_host_local_exchange_access_group
      - >-
        pki_host_local_exchange_access_converged_user.stdout.split(':')[3]
        == pki_host_local_exchange_access_converged_group.stdout.split(':')[2]
      - >-
        pki_host_local_exchange_access_converged_user.stdout.split(':')[5]
        == pki_host_local_exchange_access_home
      - >-
        pki_host_local_exchange_access_converged_user.stdout.split(':')[6]
        == pki_host_local_exchange_access_shell
    fail_msg: Converged host-local PKI exchange account or group attributes are unsafe.
  when: not ansible_check_mode or pki_host_local_exchange_access_existing_user.rc == 0

- name: Claim converged host-local PKI exchange account ownership
  ansible.builtin.copy:
    dest: "{{ pki_host_local_exchange_access_marker_path }}"
    owner: root
    group: root
    mode: "0600"
    content: >
      {{
        {
          'schema': 1,
          'state': 'managed',
          'user': pki_host_local_exchange_access_user,
          'group': pki_host_local_exchange_access_group,
          'uid': pki_host_local_exchange_access_converged_user.stdout.split(':')[2] | int,
          'gid': pki_host_local_exchange_access_converged_group.stdout.split(':')[2] | int,
          'home': pki_host_local_exchange_access_home,
          'shell': pki_host_local_exchange_access_shell
        }
        | to_json(sort_keys=true, separators=[',', ':'])
      }}
  when: not ansible_check_mode or pki_host_local_exchange_access_existing_user.rc == 0

- name: Create root-controlled exchange account directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ pki_host_local_exchange_access_home }}"
    - "{{ pki_host_local_exchange_access_home }}/.ssh"
    - "{{ pki_host_local_exchange_access_dispatch_path | dirname }}"
    - "{{ pki_host_local_exchange_access_sshd_path | dirname }}"

- name: Install fixed host-local PKI exchange dispatchers
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - src: platform-pki-host-local-exchange-ssh-dispatch
      dest: "{{ pki_host_local_exchange_access_dispatch_path }}"
    - src: platform-pki-host-local-exchange-root-dispatch
      dest: "{{ pki_host_local_exchange_access_root_dispatch_path }}"
    - src: platform-pki-host-local-exchange-sshd-validate
      dest: "{{ pki_host_local_exchange_access_sshd_validate_path }}"

- name: Install account-wide host-local PKI exchange SSH policy
  ansible.builtin.copy:
    dest: "{{ pki_host_local_exchange_access_sshd_path }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      Match User {{ pki_host_local_exchange_access_user }}
          AuthenticationMethods publickey
          PubkeyAuthentication yes
          AuthorizedKeysFile {{ pki_host_local_exchange_access_home }}/.ssh/authorized_keys
          AuthorizedKeysCommand none
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitEmptyPasswords no
          ForceCommand {{ pki_host_local_exchange_access_dispatch_path }}
          DisableForwarding yes
          PermitTTY no
          X11Forwarding no
      Match all
    validate: "{{ pki_host_local_exchange_access_sshd_validate_path }} %s"
  notify: Reload host-local PKI exchange sshd
  when: not ansible_check_mode or pki_host_local_exchange_access_existing_user.rc == 0

- name: Apply account-wide host-local PKI exchange SSH policy before key enablement
  ansible.builtin.meta: flush_handlers

- name: Install fixed host-local PKI exchange sudo policy
  ansible.builtin.copy:
    dest: "{{ pki_host_local_exchange_access_sudoers_path }}"
    owner: root
    group: root
    mode: "0440"
    content: >
      {{ pki_host_local_exchange_access_user }} ALL=(root:root)
      NOPASSWD: NOSETENV: {{ pki_host_local_exchange_access_root_dispatch_path }}
    validate: /usr/sbin/visudo -cf %s
  when: not ansible_check_mode or pki_host_local_exchange_access_existing_user.rc == 0

- name: Install root-controlled forced exchange public key
  ansible.builtin.copy:
    dest: "{{ pki_host_local_exchange_access_home }}/.ssh/authorized_keys"
    owner: root
    group: root
    mode: "0644"
    content: "restrict,command=\"{{ pki_host_local_exchange_access_dispatch_path }}\" {{ pki_host_local_exchange_access_authorized_key }}\n"
    validate: /usr/bin/ssh-keygen -l -f %s
  when:
    - not ansible_check_mode or pki_host_local_exchange_access_existing_user.rc == 0
