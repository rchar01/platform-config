---
- name: Load fixed host-local PKI exchange access validation
  ansible.builtin.import_tasks: validate.yml

- name: Require one fixed host-local PKI exchange operation token
  ansible.builtin.assert:
    that:
      - >-
        pki_host_local_exchange_access_operation_token
        is match('^[0-9a-f]{64}$')
    fail_msg: Exchange access lease claim requires one exact operation token.

- name: Inspect fixed host-local PKI exchange lease ancestors
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - /
    - /var
    - /var/lib
  register: pki_host_local_exchange_access_lease_ancestors

- name: Require protected host-local PKI exchange lease ancestors
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isdir
      - not item.stat.islnk
      - item.stat.uid == 0
      - item.stat.gid == 0
      - item.stat.mode is match('^[0-7][0-7][0145][0145]$')
    fail_msg: Exchange access lease requires protected root-owned ancestors.
  loop: "{{ pki_host_local_exchange_access_lease_ancestors.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Claim fixed host-local PKI exchange operation lease
  block:
    - name: Atomically create empty host-local PKI exchange operation lease
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - |
            import os
            import sys

            path, token = sys.argv[1:]
            os.mkdir(path, 0o700)
            try:
                os.setxattr(
                    path,
                    b"user.platform_config_operation",
                    token.encode("ascii"),
                    flags=os.XATTR_CREATE,
                    follow_symlinks=False,
                )
            except BaseException:
                os.rmdir(path)
                raise
          - "{{ pki_host_local_exchange_access_lease_path }}"
          - "{{ pki_host_local_exchange_access_operation_token }}"
      register: pki_host_local_exchange_access_lease_claim
      changed_when: true
      check_mode: false

    - name: Validate claimed host-local PKI exchange operation lease
      ansible.builtin.import_tasks: validate_lease.yml
  rescue:
    - name: Release incomplete owned host-local PKI exchange lease claim
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - |
            import os
            import stat
            import sys

            path, expected = sys.argv[1:]
            descriptor = os.open(
                path, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW
            )
            try:
                metadata = os.fstat(descriptor)
                token = os.getxattr(
                    descriptor, b"user.platform_config_operation"
                ).decode("ascii")
                xattrs = set(os.listxattr(descriptor))
                if not stat.S_ISDIR(metadata.st_mode):
                    raise SystemExit("lease is not a directory")
                if metadata.st_uid != 0 or metadata.st_gid != 0:
                    raise SystemExit("lease is not root-owned")
                if stat.S_IMODE(metadata.st_mode) != 0o700:
                    raise SystemExit("lease mode is not 0700")
                if metadata.st_nlink != 2:
                    raise SystemExit("lease link count is invalid")
                if os.listdir(descriptor):
                    raise SystemExit("lease directory is not empty")
                if xattrs - {
                    "security.selinux",
                    "user.platform_config_operation",
                }:
                    raise SystemExit("lease has unexpected metadata")
                if token != expected:
                    raise SystemExit("lease belongs to another operation")
            finally:
                os.close(descriptor)
            os.rmdir(path)
          - "{{ pki_host_local_exchange_access_lease_path }}"
          - "{{ pki_host_local_exchange_access_operation_token }}"
      when:
        - pki_host_local_exchange_access_lease_claim is defined
        - pki_host_local_exchange_access_lease_claim.rc == 0
      changed_when: true
      check_mode: false

    - name: Report failed host-local PKI exchange lease claim
      ansible.builtin.fail:
        msg: Host-local PKI exchange operation lease claim failed.
