---
- name: Load fixed host-local PKI exchange access validation
  ansible.builtin.import_tasks: validate.yml

- name: Validate optional host-local PKI exchange cleanup operation token
  ansible.builtin.assert:
    that:
      - >-
        pki_host_local_exchange_access_operation_token == ''
        or pki_host_local_exchange_access_operation_token
           is match('^[0-9a-f]{64}$')
    fail_msg: Exchange access cleanup operation token is invalid.

- name: Inspect fixed host-local PKI exchange operation lease before revocation
  ansible.builtin.stat:
    path: "{{ pki_host_local_exchange_access_lease_path }}"
    follow: false
  register: pki_host_local_exchange_access_revoke_lease

- name: Require token-bound cleanup to retain its operation lease
  ansible.builtin.assert:
    that:
      - pki_host_local_exchange_access_revoke_lease.stat.exists
    fail_msg: Token-bound cleanup no longer owns the exchange operation lease.
  when: pki_host_local_exchange_access_operation_token != ''

- name: Validate host-local PKI exchange operation lease before revocation
  ansible.builtin.import_tasks: validate_lease.yml
  when: pki_host_local_exchange_access_revoke_lease.stat.exists

- name: Revoke fixed host-local PKI exchange access
  ansible.builtin.import_tasks: absent.yml

- name: Inspect fixed host-local PKI exchange paths after revocation
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - "{{ pki_host_local_exchange_access_sudoers_path }}"
    - "{{ pki_host_local_exchange_access_home }}/.ssh/authorized_keys"
    - "{{ pki_host_local_exchange_access_sshd_path }}"
    - "{{ pki_host_local_exchange_access_dispatch_path }}"
    - "{{ pki_host_local_exchange_access_root_dispatch_path }}"
    - "{{ pki_host_local_exchange_access_sshd_validate_path }}"
    - "{{ pki_host_local_exchange_access_marker_path }}"
  register: pki_host_local_exchange_access_revoked_paths

- name: Inspect fixed host-local PKI exchange account after revocation
  ansible.builtin.command:
    argv:
      - /usr/bin/getent
      - passwd
      - "{{ pki_host_local_exchange_access_user }}"
  register: pki_host_local_exchange_access_revoked_user
  changed_when: false
  failed_when: pki_host_local_exchange_access_revoked_user.rc not in [0, 2]
  check_mode: false

- name: Inspect fixed host-local PKI exchange group after revocation
  ansible.builtin.command:
    argv:
      - /usr/bin/getent
      - group
      - "{{ pki_host_local_exchange_access_group }}"
  register: pki_host_local_exchange_access_revoked_group
  changed_when: false
  failed_when: pki_host_local_exchange_access_revoked_group.rc not in [0, 2]
  check_mode: false

- name: Require fixed host-local PKI exchange access to be absent
  ansible.builtin.assert:
    that:
      - >-
        pki_host_local_exchange_access_revoked_paths.results
        | selectattr('stat.exists')
        | list
        | length == 0
      - pki_host_local_exchange_access_revoked_user.rc == 2
      - pki_host_local_exchange_access_revoked_group.rc == 2
    fail_msg: Fixed host-local PKI exchange access remains present after revocation.

- name: Revalidate host-local PKI exchange operation lease before release
  ansible.builtin.import_tasks: validate_lease.yml
  when: pki_host_local_exchange_access_revoke_lease.stat.exists

- name: Release empty host-local PKI exchange operation lease after revocation
  ansible.builtin.command:
    argv:
      - /usr/bin/rmdir
      - --
      - "{{ pki_host_local_exchange_access_lease_path }}"
  changed_when: true
  check_mode: false
  when: pki_host_local_exchange_access_revoke_lease.stat.exists

- name: Inspect fixed host-local PKI exchange operation lease after revocation
  ansible.builtin.stat:
    path: "{{ pki_host_local_exchange_access_lease_path }}"
    follow: false
  register: pki_host_local_exchange_access_released_lease

- name: Require fixed host-local PKI exchange operation lease to be absent
  ansible.builtin.assert:
    that:
      - not pki_host_local_exchange_access_released_lease.stat.exists
    fail_msg: Fixed host-local PKI exchange operation lease remains after revocation.
