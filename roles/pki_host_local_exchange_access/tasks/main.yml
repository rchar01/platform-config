---
- name: Validate host-local PKI exchange access contract
  ansible.builtin.assert:
    that:
      - pki_host_local_exchange_access_state in ['present', 'absent']
      - pki_host_local_exchange_access_user == 'exchange-operator'
      - pki_host_local_exchange_access_group == 'exchange-operator'
      - pki_host_local_exchange_access_home == '/var/lib/platform-config/pki-exchange-operator'
      - pki_host_local_exchange_access_shell == '/bin/bash'
      - pki_host_local_exchange_access_marker_path == '/var/lib/platform-config/pki-exchange-operator.managed'
      - pki_host_local_exchange_access_dispatch_path == '/usr/local/libexec/platform-pki-host-local-exchange-ssh-dispatch'
      - pki_host_local_exchange_access_root_dispatch_path == '/usr/local/libexec/platform-pki-host-local-exchange-root-dispatch'
      - pki_host_local_exchange_access_helper_path == '/usr/local/libexec/platform-pki-host-local-exchange'
      - pki_host_local_exchange_access_sudoers_path == '/etc/sudoers.d/platform-pki-host-local-exchange'
      - pki_host_local_exchange_access_sshd_path == '/etc/ssh/sshd_config.d/00-platform-pki-host-local-exchange.conf'
      - pki_host_local_exchange_access_sshd_validate_path == '/usr/local/libexec/platform-pki-host-local-exchange-sshd-validate'
      - pki_host_local_exchange_access_ssh_service == 'sshd'
      - >-
        pki_host_local_exchange_access_state == 'absent'
        or pki_host_local_exchange_access_authorized_key
        is match('^ssh-ed25519 [A-Za-z0-9+/]+={0,3}( [ -~]{1,128})?$')
      - >-
        pki_host_local_exchange_access_state == 'absent'
        or pki_host_local_exchange_access_authorized_key
        == (pki_host_local_exchange_access_authorized_key | trim)
    fail_msg: Host-local PKI exchange access requires the fixed account, group, paths, and one plain Ed25519 public key.

- name: Converge present host-local PKI exchange access
  ansible.builtin.import_tasks: present.yml
  when: pki_host_local_exchange_access_state == 'present'

- name: Revoke absent host-local PKI exchange access
  ansible.builtin.import_tasks: absent.yml
  when: pki_host_local_exchange_access_state == 'absent'
