---
- name: Install container runtime kernel packages
  ansible.builtin.package:
    name: "{{ container_runtime_kernel_packages }}"
    state: present
  when: container_runtime_kernel_packages | length > 0

- name: Inspect the managed OverlayFS exception unit
  ansible.builtin.stat:
    path: /etc/systemd/system/platform-container-runtime-overlayfs-exception.service
  register: container_runtime_kernel_overlayfs_unit

- name: Inspect the loaded OverlayFS module
  ansible.builtin.stat:
    path: /sys/module/overlay
  register: container_runtime_kernel_overlayfs_module

- name: Inspect container runtime kernel commands
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: true
  loop:
    - /usr/sbin/modinfo
    - /usr/sbin/modprobe
  register: container_runtime_kernel_command_stats

- name: Probe modinfo command
  ansible.builtin.command:
    argv:
      - /usr/sbin/modinfo
      - --version
  register: container_runtime_kernel_modinfo_version
  check_mode: false
  changed_when: false
  failed_when: false
  when: container_runtime_kernel_command_stats.results[0].stat.exists

- name: Probe modprobe command
  ansible.builtin.command:
    argv:
      - /usr/sbin/modprobe
      - --version
  register: container_runtime_kernel_modprobe_version
  check_mode: false
  changed_when: false
  failed_when: false
  when: container_runtime_kernel_command_stats.results[1].stat.exists

- name: Require container runtime kernel commands after package convergence
  ansible.builtin.assert:
    that:
      - container_runtime_kernel_command_stats.results[0].stat.isreg | default(false)
      - container_runtime_kernel_command_stats.results[0].stat.executable | default(false)
      - container_runtime_kernel_command_stats.results[1].stat.isreg | default(false)
      - container_runtime_kernel_command_stats.results[1].stat.executable | default(false)
      - container_runtime_kernel_modinfo_version.rc | default(1) == 0
      - container_runtime_kernel_modprobe_version.rc | default(1) == 0
    fail_msg: >-
      The configured container runtime kernel packages did not provide
      working /usr/sbin/modinfo and /usr/sbin/modprobe commands.
  when: not ansible_check_mode

- name: Inspect OverlayFS module availability
  ansible.builtin.command:
    argv:
      - /usr/sbin/modinfo
      - overlay
  register: container_runtime_kernel_overlayfs_modinfo
  check_mode: false
  changed_when: false
  failed_when: false
  when: container_runtime_kernel_command_stats.results[0].stat.exists

- name: Require OverlayFS support from the running kernel
  ansible.builtin.assert:
    that:
      - >-
        container_runtime_kernel_overlayfs_modinfo.rc | default(1) == 0
        or (container_runtime_kernel_overlayfs_module.stat.isdir | default(false))
    fail_msg: >-
      The running kernel does not provide the OverlayFS module required by the
      container runtime.
  when:
    - >-
      not ansible_check_mode
      or container_runtime_kernel_command_stats.results[0].stat.exists
      or (container_runtime_kernel_overlayfs_module.stat.isdir | default(false))

- name: Manage the OverlayFS policy exception
  ansible.builtin.include_tasks: enabled.yml
  when:
    - container_runtime_overlayfs_policy_exception_enabled | bool

- name: Use normal OverlayFS module policy
  ansible.builtin.include_tasks: disabled.yml
  when:
    - not (container_runtime_overlayfs_policy_exception_enabled | bool)

- name: Report OverlayFS check-mode state
  ansible.builtin.debug:
    msg: >-
      OverlayFS is {{ 'loaded' if container_runtime_kernel_overlayfs_module.stat.isdir | default(false) else 'not loaded' }};
      the managed policy exception unit is
      {{ 'present' if container_runtime_kernel_overlayfs_unit.stat.exists | default(false) else 'absent' }}.
  when: ansible_check_mode
