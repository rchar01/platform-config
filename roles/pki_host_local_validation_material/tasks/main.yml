---
- name: Validate host-local validation material provisioning contract
  ansible.builtin.assert:
    that:
      - ansible_play_hosts_all == [inventory_hostname]
      - groups.get('registry', []) | select('equalto', inventory_hostname) | list | length == 1
      - groups.get('all', []) | select('equalto', pki_host_local_certificate_remote_validator) | list | length == 1
      - pki_host_local_certificate_service is match('^[a-z0-9][a-z0-9-]{0,62}$')
      - pki_host_local_certificate_target is match('^[a-z0-9][a-z0-9.-]{0,252}$')
      - pki_host_local_certificate_target == inventory_hostname
      - pki_host_local_certificate_remote_validator is match('^[a-z0-9][a-z0-9.-]{0,252}$')
      - pki_host_local_certificate_remote_validator != inventory_hostname
      - pki_host_local_certificate_endpoint is match('^https://[a-z0-9][a-z0-9.-]*(:[1-9][0-9]{0,4})?/v2/$')
      - pki_host_local_certificate_reviewed_ca_sha256 is match('^[0-9a-f]{64}$')
      - pki_host_local_certificate_validation_boundary_sha256 is match('^[0-9a-f]{64}$')
      - pki_host_local_certificate_reviewed_ca_mode in ['0600', '0644']
      - pki_host_local_validation_material_reviewed_ca_src is string
      - pki_host_local_validation_material_boundary_src is string
      - pki_host_local_validation_material_reviewed_ca_src != pki_host_local_validation_material_boundary_src
      - pki_host_local_validation_material_reviewed_ca_src is match('^/[A-Za-z0-9_@%+=:,.-]+(/[A-Za-z0-9_@%+=:,.-]+)*\Z')
      - pki_host_local_validation_material_boundary_src is match('^/[A-Za-z0-9_@%+=:,.-]+(/[A-Za-z0-9_@%+=:,.-]+)*\Z')
      - pki_host_local_validation_material_reviewed_ca_src is not search('(^|/)\.\.?(/|$)')
      - pki_host_local_validation_material_boundary_src is not search('(^|/)\.\.?(/|$)')
      - pki_host_local_certificate_reviewed_ca_target_path is match('^/[A-Za-z0-9_@%+=:,.-]+(/[A-Za-z0-9_@%+=:,.-]+)*\Z')
      - pki_host_local_certificate_reviewed_ca_runner_path is match('^/[A-Za-z0-9_@%+=:,.-]+(/[A-Za-z0-9_@%+=:,.-]+)*\Z')
      - pki_host_local_certificate_validation_boundary_target_path is match('^/[A-Za-z0-9_@%+=:,.-]+(/[A-Za-z0-9_@%+=:,.-]+)*\Z')
      - pki_host_local_certificate_validation_boundary_runner_path is match('^/[A-Za-z0-9_@%+=:,.-]+(/[A-Za-z0-9_@%+=:,.-]+)*\Z')
      - pki_host_local_certificate_reviewed_ca_target_path is not search('(^|/)\.\.?(/|$)')
      - pki_host_local_certificate_reviewed_ca_runner_path is not search('(^|/)\.\.?(/|$)')
      - pki_host_local_certificate_validation_boundary_target_path is not search('(^|/)\.\.?(/|$)')
      - pki_host_local_certificate_validation_boundary_runner_path is not search('(^|/)\.\.?(/|$)')
      - pki_host_local_certificate_reviewed_ca_target_path is not search('(^|/)(latest|current)(/|$)')
      - pki_host_local_certificate_reviewed_ca_runner_path is not search('(^|/)(latest|current)(/|$)')
      - pki_host_local_certificate_validation_boundary_target_path is not search('(^|/)(latest|current)(/|$)')
      - pki_host_local_certificate_validation_boundary_runner_path is not search('(^|/)(latest|current)(/|$)')
      - pki_host_local_certificate_reviewed_ca_target_path != pki_host_local_certificate_validation_boundary_target_path
      - pki_host_local_certificate_reviewed_ca_runner_path != pki_host_local_certificate_validation_boundary_runner_path
      - pki_host_local_validation_material_reviewed_ca_src not in pki_host_local_validation_material_destinations
      - pki_host_local_validation_material_boundary_src not in pki_host_local_validation_material_destinations
    fail_msg: >-
      Validation material provisioning requires one exact registry target, one
      distinct existing runner, immutable coordinates, and separated sources.
  vars:
    pki_host_local_validation_material_destinations:
      - "{{ pki_host_local_certificate_reviewed_ca_target_path }}"
      - "{{ pki_host_local_certificate_reviewed_ca_runner_path }}"
      - "{{ pki_host_local_certificate_validation_boundary_target_path }}"
      - "{{ pki_host_local_certificate_validation_boundary_runner_path }}"

- name: Inspect target validation material directory
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - "{{ pki_host_local_certificate_reviewed_ca_target_path | dirname }}"
    - "{{ pki_host_local_certificate_validation_boundary_target_path | dirname }}"
  register: pki_host_local_validation_material_target_directory

- name: Validate existing target validation material directory
  ansible.builtin.assert:
    that:
      - >-
        not item.stat.exists
        or (
          item.stat.isdir
          and not item.stat.islnk
          and item.stat.uid == 0
          and item.stat.gid == 0
          and item.stat.mode == '0700'
        )
    fail_msg: Existing target validation material directory metadata is unsafe.
  loop: "{{ pki_host_local_validation_material_target_directory.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Create absent target validation material directory
  ansible.builtin.file:
    path: "{{ item.item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop: "{{ pki_host_local_validation_material_target_directory.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not item.stat.exists

- name: Inspect runner validation material directory
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - "{{ pki_host_local_certificate_reviewed_ca_runner_path | dirname }}"
    - "{{ pki_host_local_certificate_validation_boundary_runner_path | dirname }}"
  delegate_to: "{{ pki_host_local_certificate_remote_validator }}"
  register: pki_host_local_validation_material_runner_directory

- name: Validate existing runner validation material directory
  ansible.builtin.assert:
    that:
      - >-
        not item.stat.exists
        or (
          item.stat.isdir
          and not item.stat.islnk
          and item.stat.uid == 0
          and item.stat.gid == 0
          and item.stat.mode == '0700'
        )
    fail_msg: Existing runner validation material directory metadata is unsafe.
  loop: "{{ pki_host_local_validation_material_runner_directory.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Create absent runner validation material directory
  ansible.builtin.file:
    path: "{{ item.item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  delegate_to: "{{ pki_host_local_certificate_remote_validator }}"
  loop: "{{ pki_host_local_validation_material_runner_directory.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not item.stat.exists

- name: Deploy reviewed CA on registry target
  platform_pki_validation_material:
    material: reviewed-ca
    source: "{{ pki_host_local_validation_material_reviewed_ca_src }}"
    destination: "{{ pki_host_local_certificate_reviewed_ca_target_path }}"
    sha256: "{{ pki_host_local_certificate_reviewed_ca_sha256 }}"
    mode: "{{ pki_host_local_certificate_reviewed_ca_mode }}"
    service: "{{ pki_host_local_certificate_service }}"
    target: "{{ pki_host_local_certificate_target }}"
    remote_validator: "{{ pki_host_local_certificate_remote_validator }}"
    endpoint: "{{ pki_host_local_certificate_endpoint }}"

- name: Deploy validation boundary on registry target
  platform_pki_validation_material:
    material: validation-boundary
    source: "{{ pki_host_local_validation_material_boundary_src }}"
    destination: "{{ pki_host_local_certificate_validation_boundary_target_path }}"
    sha256: "{{ pki_host_local_certificate_validation_boundary_sha256 }}"
    mode: "0600"
    service: "{{ pki_host_local_certificate_service }}"
    target: "{{ pki_host_local_certificate_target }}"
    remote_validator: "{{ pki_host_local_certificate_remote_validator }}"
    endpoint: "{{ pki_host_local_certificate_endpoint }}"

- name: Deploy reviewed CA on exact validation runner
  platform_pki_validation_material:
    material: reviewed-ca
    source: "{{ pki_host_local_validation_material_reviewed_ca_src }}"
    destination: "{{ pki_host_local_certificate_reviewed_ca_runner_path }}"
    sha256: "{{ pki_host_local_certificate_reviewed_ca_sha256 }}"
    mode: "{{ pki_host_local_certificate_reviewed_ca_mode }}"
    service: "{{ pki_host_local_certificate_service }}"
    target: "{{ pki_host_local_certificate_target }}"
    remote_validator: "{{ pki_host_local_certificate_remote_validator }}"
    endpoint: "{{ pki_host_local_certificate_endpoint }}"
  delegate_to: "{{ pki_host_local_certificate_remote_validator }}"

- name: Deploy validation boundary on exact validation runner
  platform_pki_validation_material:
    material: validation-boundary
    source: "{{ pki_host_local_validation_material_boundary_src }}"
    destination: "{{ pki_host_local_certificate_validation_boundary_runner_path }}"
    sha256: "{{ pki_host_local_certificate_validation_boundary_sha256 }}"
    mode: "0600"
    service: "{{ pki_host_local_certificate_service }}"
    target: "{{ pki_host_local_certificate_target }}"
    remote_validator: "{{ pki_host_local_certificate_remote_validator }}"
    endpoint: "{{ pki_host_local_certificate_endpoint }}"
  delegate_to: "{{ pki_host_local_certificate_remote_validator }}"

- name: Inspect deployed target validation material
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
  loop:
    - "{{ pki_host_local_certificate_reviewed_ca_target_path }}"
    - "{{ pki_host_local_certificate_validation_boundary_target_path }}"
  register: pki_host_local_validation_material_target_files

- name: Inspect deployed runner validation material
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
  loop:
    - "{{ pki_host_local_certificate_reviewed_ca_runner_path }}"
    - "{{ pki_host_local_certificate_validation_boundary_runner_path }}"
  delegate_to: "{{ pki_host_local_certificate_remote_validator }}"
  register: pki_host_local_validation_material_runner_files

- name: Assert exact deployed target validation material
  ansible.builtin.assert:
    that:
      - >-
        (
          ansible_check_mode
          and (
            not item.stat.exists
            or (
              item.stat.isreg
              and not item.stat.islnk
              and item.stat.uid == 0
              and item.stat.gid == 0
              and item.stat.nlink == 1
            )
          )
        )
        or (
          item.stat.exists
          and item.stat.isreg
          and not item.stat.islnk
          and item.stat.uid == 0
          and item.stat.gid == 0
          and item.stat.nlink == 1
          and item.stat.mode == (
            pki_host_local_certificate_reviewed_ca_mode
            if item.item == pki_host_local_certificate_reviewed_ca_target_path
            else '0600'
          )
          and item.stat.checksum == (
            pki_host_local_certificate_reviewed_ca_sha256
            if item.item == pki_host_local_certificate_reviewed_ca_target_path
            else pki_host_local_certificate_validation_boundary_sha256
          )
        )
    fail_msg: Target validation material metadata or digest is not exact.
  loop: "{{ pki_host_local_validation_material_target_files.results }}"
  loop_control:
    label: "{{ item.item }}"
- name: Assert exact deployed runner validation material
  ansible.builtin.assert:
    that:
      - >-
        (
          ansible_check_mode
          and (
            not item.stat.exists
            or (
              item.stat.isreg
              and not item.stat.islnk
              and item.stat.uid == 0
              and item.stat.gid == 0
              and item.stat.nlink == 1
            )
          )
        )
        or (
          item.stat.exists
          and item.stat.isreg
          and not item.stat.islnk
          and item.stat.uid == 0
          and item.stat.gid == 0
          and item.stat.nlink == 1
          and item.stat.mode == (
            pki_host_local_certificate_reviewed_ca_mode
            if item.item == pki_host_local_certificate_reviewed_ca_runner_path
            else '0600'
          )
          and item.stat.checksum == (
            pki_host_local_certificate_reviewed_ca_sha256
            if item.item == pki_host_local_certificate_reviewed_ca_runner_path
            else pki_host_local_certificate_validation_boundary_sha256
          )
        )
    fail_msg: Runner validation material metadata or digest is not exact.
  loop: "{{ pki_host_local_validation_material_runner_files.results }}"
  loop_control:
    label: "{{ item.item }}"
