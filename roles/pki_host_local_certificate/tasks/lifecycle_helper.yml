---
- name: Inspect host-local certificate lifecycle helper directory
  ansible.builtin.stat:
    path: "{{ pki_host_local_certificate_lifecycle_helper_path | dirname }}"
    follow: false
  register: pki_host_local_certificate_lifecycle_helper_directory

- name: Validate existing host-local certificate lifecycle helper directory
  ansible.builtin.assert:
    that:
      - >-
        not pki_host_local_certificate_lifecycle_helper_directory.stat.exists
        or (
          pki_host_local_certificate_lifecycle_helper_directory.stat.isdir
          and not pki_host_local_certificate_lifecycle_helper_directory.stat.islnk
          and pki_host_local_certificate_lifecycle_helper_directory.stat.uid == 0
          and pki_host_local_certificate_lifecycle_helper_directory.stat.gid == 0
          and pki_host_local_certificate_lifecycle_helper_directory.stat.mode == '0755'
        )
    fail_msg: Existing host-local certificate lifecycle helper directory metadata is unsafe.

- name: Create absent host-local certificate lifecycle helper directory
  ansible.builtin.file:
    path: "{{ pki_host_local_certificate_lifecycle_helper_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - not ansible_check_mode
    - not pki_host_local_certificate_helper_read_only
    - not pki_host_local_certificate_lifecycle_helper_directory.stat.exists

- name: Inspect installed host-local certificate lifecycle helper
  ansible.builtin.stat:
    path: "{{ pki_host_local_certificate_lifecycle_helper_path }}"
    follow: false
  register: pki_host_local_certificate_installed_lifecycle_helper

- name: Require installed lifecycle helper for read-only preflight
  ansible.builtin.assert:
    that:
      - pki_host_local_certificate_installed_lifecycle_helper.stat.exists
      - pki_host_local_certificate_installed_lifecycle_helper.stat.isreg
      - not pki_host_local_certificate_installed_lifecycle_helper.stat.islnk
      - pki_host_local_certificate_installed_lifecycle_helper.stat.uid == 0
      - pki_host_local_certificate_installed_lifecycle_helper.stat.gid == 0
      - pki_host_local_certificate_installed_lifecycle_helper.stat.mode == '0755'
    fail_msg: Read-only lifecycle use requires the existing reviewed helper.
  when: ansible_check_mode or pki_host_local_certificate_helper_read_only

- name: Install host-local certificate lifecycle helper
  ansible.builtin.copy:
    src: platform-pki-host-local-lifecycle
    dest: "{{ pki_host_local_certificate_lifecycle_helper_path }}"
    owner: root
    group: root
    mode: "0755"
  when:
    - not ansible_check_mode
    - not pki_host_local_certificate_helper_read_only
