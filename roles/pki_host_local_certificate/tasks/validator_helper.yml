---
- name: Inspect host-local certificate validator helper directory
  ansible.builtin.stat:
    path: "{{ pki_host_local_certificate_validator_helper_path | dirname }}"
    follow: false
  delegate_to: "{{ pki_host_local_certificate_remote_validator }}"
  register: pki_host_local_certificate_validator_helper_directory

- name: Validate existing host-local certificate validator helper directory
  ansible.builtin.assert:
    that:
      - >-
        not pki_host_local_certificate_validator_helper_directory.stat.exists
        or (
          pki_host_local_certificate_validator_helper_directory.stat.isdir
          and not pki_host_local_certificate_validator_helper_directory.stat.islnk
          and pki_host_local_certificate_validator_helper_directory.stat.uid == 0
          and pki_host_local_certificate_validator_helper_directory.stat.gid == 0
          and pki_host_local_certificate_validator_helper_directory.stat.mode == '0755'
        )
    fail_msg: Existing host-local certificate validator helper directory metadata is unsafe.

- name: Create absent host-local certificate validator helper directory
  ansible.builtin.file:
    path: "{{ pki_host_local_certificate_validator_helper_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  delegate_to: "{{ pki_host_local_certificate_remote_validator }}"
  when:
    - not ansible_check_mode
    - not pki_host_local_certificate_helper_read_only
    - not pki_host_local_certificate_validator_helper_directory.stat.exists

- name: Inspect shipped host-local certificate validator helper source
  ansible.builtin.stat:
    path: "{{ role_path }}/files/platform-pki-zot-read-only-validate"
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false
  register: pki_host_local_certificate_validator_helper_source
  when: ansible_check_mode or pki_host_local_certificate_helper_read_only

- name: Inspect installed host-local certificate validator helper
  ansible.builtin.stat:
    path: "{{ pki_host_local_certificate_validator_helper_path }}"
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
  delegate_to: "{{ pki_host_local_certificate_remote_validator }}"
  register: pki_host_local_certificate_installed_validator_helper

- name: Require installed validator helper for read-only preflight
  ansible.builtin.assert:
    that:
      - pki_host_local_certificate_installed_validator_helper.stat.exists
      - pki_host_local_certificate_installed_validator_helper.stat.isreg
      - not pki_host_local_certificate_installed_validator_helper.stat.islnk
      - pki_host_local_certificate_installed_validator_helper.stat.uid == 0
      - pki_host_local_certificate_installed_validator_helper.stat.gid == 0
      - pki_host_local_certificate_installed_validator_helper.stat.mode == '0755'
      - pki_host_local_certificate_validator_helper_source.stat.exists
      - pki_host_local_certificate_validator_helper_source.stat.isreg
      - not pki_host_local_certificate_validator_helper_source.stat.islnk
      - pki_host_local_certificate_validator_helper_source.stat.checksum is match('^[0-9a-f]{64}$')
      - >-
        pki_host_local_certificate_installed_validator_helper.stat.checksum
        == pki_host_local_certificate_validator_helper_source.stat.checksum
    fail_msg: Read-only validation requires the exact shipped runner helper.
  when: ansible_check_mode or pki_host_local_certificate_helper_read_only

- name: Install host-local certificate validator helper on reviewed runner
  ansible.builtin.copy:
    src: platform-pki-zot-read-only-validate
    dest: "{{ pki_host_local_certificate_validator_helper_path }}"
    owner: root
    group: root
    mode: "0755"
  delegate_to: "{{ pki_host_local_certificate_remote_validator }}"
  when:
    - not ansible_check_mode
    - not pki_host_local_certificate_helper_read_only

- name: Inspect reviewed validation CA on reviewed runner
  ansible.builtin.stat:
    path: "{{ pki_host_local_certificate_reviewed_ca_runner_path }}"
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
  delegate_to: "{{ pki_host_local_certificate_remote_validator }}"
  register: pki_host_local_certificate_runner_reviewed_ca

- name: Validate reviewed runner CA metadata and digest
  ansible.builtin.assert:
    that:
      - pki_host_local_certificate_runner_reviewed_ca.stat.exists
      - pki_host_local_certificate_runner_reviewed_ca.stat.isreg
      - not pki_host_local_certificate_runner_reviewed_ca.stat.islnk
      - pki_host_local_certificate_runner_reviewed_ca.stat.uid == 0
      - pki_host_local_certificate_runner_reviewed_ca.stat.gid == 0
      - pki_host_local_certificate_runner_reviewed_ca.stat.nlink == 1
      - pki_host_local_certificate_runner_reviewed_ca.stat.mode == pki_host_local_certificate_reviewed_ca_mode
      - pki_host_local_certificate_runner_reviewed_ca.stat.checksum == pki_host_local_certificate_reviewed_ca_sha256
    fail_msg: Reviewed runner CA metadata or digest differs from the exact operator contract.

- name: Inspect reviewed validation boundary on reviewed runner
  ansible.builtin.stat:
    path: "{{ pki_host_local_certificate_validation_boundary_runner_path }}"
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
  delegate_to: "{{ pki_host_local_certificate_remote_validator }}"
  register: pki_host_local_certificate_runner_validation_boundary

- name: Validate reviewed runner boundary metadata and digest
  ansible.builtin.assert:
    that:
      - pki_host_local_certificate_runner_validation_boundary.stat.exists
      - pki_host_local_certificate_runner_validation_boundary.stat.isreg
      - not pki_host_local_certificate_runner_validation_boundary.stat.islnk
      - pki_host_local_certificate_runner_validation_boundary.stat.uid == 0
      - pki_host_local_certificate_runner_validation_boundary.stat.gid == 0
      - pki_host_local_certificate_runner_validation_boundary.stat.nlink == 1
      - pki_host_local_certificate_runner_validation_boundary.stat.mode == '0600'
      - pki_host_local_certificate_runner_validation_boundary.stat.checksum == pki_host_local_certificate_validation_boundary_sha256
    fail_msg: Reviewed runner validation boundary metadata or digest is not exact.
