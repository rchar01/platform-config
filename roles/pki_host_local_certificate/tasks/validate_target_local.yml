---
- name: Validate target-local certificate contract
  ansible.builtin.assert:
    that:
      - ansible_play_hosts_all == [inventory_hostname]
      - not ansible_check_mode
      - pki_host_local_certificate_service is match('^[a-z0-9][a-z0-9-]{0,62}$')
      - pki_host_local_certificate_target == inventory_hostname
      - pki_host_local_certificate_requester_principal == inventory_hostname
      - pki_host_local_certificate_response_principal is match('^[a-z0-9][a-z0-9.-]{0,252}$')
      - pki_host_local_certificate_operation in ['issue', 'renew']
      - pki_host_local_certificate_transport in ['gitlab', 'filesystem']
      - pki_host_local_certificate_service_adapter in ['zot-v1', 'openbao-pristine-v1']
      - pki_host_local_certificate_profile == 'server-p384-sha384-v1'
      - pki_host_local_certificate_request_namespace == 'platform-pki-csr-request-v2'
      - pki_host_local_certificate_inventory_sha256 is match('^[0-9a-f]{64}$')
      - pki_host_local_certificate_common_name is match('^[A-Za-z0-9][A-Za-z0-9.-]{0,252}$')
      - pki_host_local_certificate_dns_sans is sequence
      - pki_host_local_certificate_dns_sans is not string
      - pki_host_local_certificate_dns_sans | length > 0
      - pki_host_local_certificate_ip_sans is sequence
      - pki_host_local_certificate_ip_sans is not string
      - pki_host_local_certificate_trust_id is match('^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$')
      - pki_host_local_certificate_trust_paths.keys() | list | sort == pki_host_local_certificate_required_trust_names
      - pki_host_local_certificate_trust_sha256.keys() | list | sort == pki_host_local_certificate_required_trust_names
      - pki_host_local_certificate_trust_sources.keys() | list | sort == pki_host_local_certificate_required_trust_names
      - pki_host_local_certificate_state_root is match(pki_host_local_certificate_absolute_path_pattern)
      - pki_host_local_certificate_pending_root is match(pki_host_local_certificate_absolute_path_pattern)
      - pki_host_local_certificate_versions_root is match(pki_host_local_certificate_absolute_path_pattern)
      - pki_host_local_certificate_request_signing_key_path is match(pki_host_local_certificate_absolute_path_pattern)
      - pki_host_local_certificate_service_config_path is match(pki_host_local_certificate_absolute_path_pattern)
      - pki_host_local_certificate_zot_config_path == '/etc/zot/config.json'
      - pki_host_local_certificate_minimum_remaining_lifetime_seconds is integer
      - pki_host_local_certificate_minimum_remaining_lifetime_seconds > 0
      - pki_host_local_certificate_request_ttl_seconds is integer
      - pki_host_local_certificate_request_ttl_seconds > 0
      - pki_host_local_certificate_request_ttl_seconds <= 604800
      - pki_host_local_certificate_request_helper_path is match(pki_host_local_certificate_absolute_path_pattern)
      - pki_host_local_certificate_trust_helper_path is match(pki_host_local_certificate_absolute_path_pattern)
      - pki_host_local_certificate_lifecycle_helper_path is match(pki_host_local_certificate_absolute_path_pattern)
      - pki_host_local_certificate_reviewed_ca_target_path is match(pki_host_local_certificate_absolute_path_pattern)
      - >-
        pki_host_local_certificate_transport != 'gitlab'
        or
        (pki_host_local_certificate_gitlab_project_record_source is match(pki_host_local_certificate_absolute_path_pattern)
         and pki_host_local_certificate_gitlab_ca_source is match(pki_host_local_certificate_absolute_path_pattern)
         and pki_host_local_certificate_platform_pki_source is match(pki_host_local_certificate_absolute_path_pattern)
         and pki_host_local_certificate_platform_pki_sha256 is match('^[0-9a-f]{64}$')
         and pki_host_local_certificate_gitlab_helper_path is match(pki_host_local_certificate_absolute_path_pattern)
         and pki_host_local_certificate_gitlab_config_path is match(pki_host_local_certificate_absolute_path_pattern)
         and pki_host_local_certificate_gitlab_spool_root is match(pki_host_local_certificate_absolute_path_pattern)
         and pki_host_local_certificate_gitlab_project_record_path is match(pki_host_local_certificate_absolute_path_pattern)
         and pki_host_local_certificate_gitlab_token_path is match(pki_host_local_certificate_absolute_path_pattern)
         and pki_host_local_certificate_gitlab_ca_path is match(pki_host_local_certificate_absolute_path_pattern)
         and pki_host_local_certificate_platform_pki_path is match(pki_host_local_certificate_absolute_path_pattern))
      - >-
        pki_host_local_certificate_transport != 'filesystem'
        or
        (pki_host_local_certificate_operation == 'issue'
         and pki_host_local_certificate_filesystem_exchange_root is match(pki_host_local_certificate_absolute_path_pattern)
         and pki_host_local_certificate_filesystem_owner_uid is integer
         and pki_host_local_certificate_filesystem_owner_uid > 0)
      - >-
        (pki_host_local_certificate_service_adapter == 'zot-v1'
         and pki_host_local_certificate_service_unit == 'zot.service'
         and pki_host_local_certificate_service_config_path == '/etc/zot/config.json'
         and pki_host_local_certificate_zot_config_path == pki_host_local_certificate_service_config_path
         and pki_host_local_certificate_endpoint is match('^https://[a-z0-9][a-z0-9.-]*(:[1-9][0-9]{0,4})?/v2/$'))
        or
        (pki_host_local_certificate_service_adapter == 'openbao-pristine-v1'
         and pki_host_local_certificate_service is match('^openbao-[a-z0-9][a-z0-9-]{0,53}$')
         and pki_host_local_certificate_operation == 'issue'
         and pki_host_local_certificate_service_unit == 'openbao.service'
         and pki_host_local_certificate_service_config_path == '/etc/openbao/listener.hcl'
         and pki_host_local_certificate_reviewed_ca_target_path == '/etc/platform-config/openbao-validation-ca.crt'
         and pki_host_local_certificate_endpoint | length == 0
         and pki_host_local_certificate_openbao_node_dns | length <= 253
         and pki_host_local_certificate_openbao_valid_dns_labels | length
             == pki_host_local_certificate_openbao_dns_labels | length
         and pki_host_local_certificate_openbao_node_dns in pki_host_local_certificate_dns_sans
         and pki_host_local_certificate_openbao_node_address is match(pki_host_local_certificate_ipv4_pattern)
         and pki_host_local_certificate_openbao_node_address.split('.') | map('int') | select('gt', 255) | list | length == 0
         and pki_host_local_certificate_openbao_backend_port is integer
         and pki_host_local_certificate_openbao_backend_port == 18200
         and pki_host_local_certificate_openbao_cluster_port is integer
         and pki_host_local_certificate_openbao_cluster_port == 8201
         and pki_host_local_certificate_openbao_container_versions_root == '/openbao/config/tls-versions'
         and pki_host_local_certificate_openbao_base_config_dir == '/openbao/config'
         and pki_host_local_certificate_openbao_raft_data_dir == '/var/lib/openbao'
         and pki_host_local_certificate_openbao_bootstrap_marker_path == '/var/lib/platform-config/openbao-bootstrap.json')
      - pki_host_local_certificate_all_paths | select('search', '(^|/)\\.\\.?(/|$)') | list | length == 0
      - pki_host_local_certificate_adapter_host_paths | unique | length == pki_host_local_certificate_adapter_host_paths | length
      - pki_host_local_certificate_file_destinations | unique | length == pki_host_local_certificate_file_destinations | length
      - >-
        pki_host_local_certificate_transport != 'filesystem'
        or pki_host_local_certificate_filesystem_roots_disjoint
      - >-
        pki_host_local_certificate_transport != 'gitlab'
        or
        (pki_host_local_certificate_gitlab_timeout is integer
         and pki_host_local_certificate_gitlab_timeout > 0
         and pki_host_local_certificate_gitlab_timeout <= 120
         and pki_host_local_certificate_gitlab_processing_attempts is integer
         and pki_host_local_certificate_gitlab_processing_attempts > 0
         and pki_host_local_certificate_gitlab_processing_attempts <= 20
         and pki_host_local_certificate_gitlab_processing_interval is integer
         and pki_host_local_certificate_gitlab_processing_interval >= 0
         and pki_host_local_certificate_gitlab_processing_interval <= 60)
      - >-
        (pki_host_local_certificate_operation == 'issue'
         and pki_host_local_certificate_current_cert_sha256 == 'none'
         and pki_host_local_certificate_current_cert_path | length == 0)
        or (pki_host_local_certificate_operation == 'renew'
            and pki_host_local_certificate_current_cert_sha256 in ['', 'derived']
            and pki_host_local_certificate_current_cert_path in ['', 'derived'])
    fail_msg: Target-local certificate inputs are incomplete or unsafe.
  vars:
    pki_host_local_certificate_absolute_path_pattern: >-
      ^/[A-Za-z0-9_@%+=:,.-]+(/[A-Za-z0-9_@%+=:,.-]+)*$
    pki_host_local_certificate_ipv4_pattern: >-
      ^(0|[1-9][0-9]{0,2})(\.(0|[1-9][0-9]{0,2})){3}$
    pki_host_local_certificate_openbao_dns_labels: >-
      {{ pki_host_local_certificate_openbao_node_dns.split('.') }}
    pki_host_local_certificate_openbao_valid_dns_labels: >-
      {{
        pki_host_local_certificate_openbao_dns_labels
        | select('match', '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$')
        | list
      }}
    pki_host_local_certificate_required_trust_names:
      - approvers.allowed_signers
      - policy
      - requesters.allowed_signers
      - responses.allowed_signers
    pki_host_local_certificate_filesystem_protected_roots:
      - "{{ pki_host_local_certificate_state_root }}"
      - "{{ pki_host_local_certificate_pending_root }}"
      - "{{ pki_host_local_certificate_versions_root }}"
      - >-
        {{ pki_host_local_certificate_state_root }}/trust/{{ pki_host_local_certificate_trust_id }}
    pki_host_local_certificate_filesystem_roots_disjoint: >-
      {% set namespace = namespace(valid=true) %}
      {% for root in pki_host_local_certificate_filesystem_protected_roots %}
      {% if pki_host_local_certificate_filesystem_exchange_root == root
            or pki_host_local_certificate_filesystem_exchange_root.startswith(root ~ '/')
            or root.startswith(pki_host_local_certificate_filesystem_exchange_root ~ '/') %}
      {% set namespace.valid = false %}
      {% endif %}
      {% endfor %}
      {{ namespace.valid }}
    pki_host_local_certificate_all_paths: >-
      {{
        [
          pki_host_local_certificate_state_root,
          pki_host_local_certificate_pending_root,
          pki_host_local_certificate_versions_root,
          pki_host_local_certificate_request_signing_key_path,
          pki_host_local_certificate_request_helper_path,
          pki_host_local_certificate_trust_helper_path,
          pki_host_local_certificate_lifecycle_helper_path,
          pki_host_local_certificate_reviewed_ca_source,
          pki_host_local_certificate_reviewed_ca_target_path,
          pki_host_local_certificate_service_config_path,
          pki_host_local_certificate_zot_config_path,
          pki_host_local_certificate_openbao_container_versions_root,
          pki_host_local_certificate_openbao_base_config_dir,
          pki_host_local_certificate_openbao_raft_data_dir,
          pki_host_local_certificate_openbao_bootstrap_marker_path
        ]
        + (pki_host_local_certificate_trust_sources.values() | list)
        + (
          [
            pki_host_local_certificate_gitlab_project_record_source,
            pki_host_local_certificate_gitlab_ca_source,
            pki_host_local_certificate_platform_pki_source,
            pki_host_local_certificate_gitlab_helper_path,
            pki_host_local_certificate_gitlab_config_path,
            pki_host_local_certificate_gitlab_spool_root,
            pki_host_local_certificate_gitlab_project_record_path,
            pki_host_local_certificate_gitlab_token_path,
            pki_host_local_certificate_gitlab_ca_path,
            pki_host_local_certificate_platform_pki_path
          ]
          if pki_host_local_certificate_transport == 'gitlab'
          else [pki_host_local_certificate_filesystem_exchange_root]
        )
      }}
    pki_host_local_certificate_adapter_host_paths: >-
      {{
        [
          pki_host_local_certificate_service_config_path,
          pki_host_local_certificate_versions_root,
          pki_host_local_certificate_openbao_raft_data_dir,
          pki_host_local_certificate_openbao_bootstrap_marker_path
        ]
        if pki_host_local_certificate_service_adapter == 'openbao-pristine-v1'
        else [
          pki_host_local_certificate_service_config_path
        ]
      }}
    pki_host_local_certificate_file_destinations: >-
      {{
        [
          pki_host_local_certificate_request_signing_key_path,
          pki_host_local_certificate_trust_paths['approvers.allowed_signers'],
          pki_host_local_certificate_trust_paths['policy'],
          pki_host_local_certificate_trust_paths['requesters.allowed_signers'],
          pki_host_local_certificate_trust_paths['responses.allowed_signers'],
          pki_host_local_certificate_request_helper_path,
          pki_host_local_certificate_trust_helper_path,
          pki_host_local_certificate_lifecycle_helper_path,
          pki_host_local_certificate_reviewed_ca_target_path,
          pki_host_local_certificate_service_config_path
        ]
        + (
          [
            pki_host_local_certificate_gitlab_helper_path,
            pki_host_local_certificate_gitlab_config_path,
            pki_host_local_certificate_gitlab_project_record_path,
            pki_host_local_certificate_gitlab_token_path,
            pki_host_local_certificate_gitlab_ca_path,
            pki_host_local_certificate_platform_pki_path
          ]
          if pki_host_local_certificate_transport == 'gitlab'
          else []
        )
      }}

- name: Validate target-local trust bindings
  ansible.builtin.assert:
    that:
      - >-
        item.value == pki_host_local_certificate_state_root ~ '/trust/'
        ~ pki_host_local_certificate_trust_id ~ '/' ~ item.key
      - pki_host_local_certificate_trust_sha256[item.key] is match('^[0-9a-f]{64}$')
    fail_msg: Target-local trust bindings must name the exact installed schema-3 trust files.
  loop: "{{ pki_host_local_certificate_trust_paths | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Validate reviewed target-local trust sources
  ansible.builtin.assert:
    that:
      - item.value is match(pki_host_local_certificate_absolute_path_pattern)
      - item.value.endswith('/' ~ item.key)
    fail_msg: Target-local trust sources must be exact reviewed outside-Git files.
  vars:
    pki_host_local_certificate_absolute_path_pattern: >-
      ^/[A-Za-z0-9_@%+=:,.-]+(/[A-Za-z0-9_@%+=:,.-]+)*$
  loop: "{{ pki_host_local_certificate_trust_sources | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
