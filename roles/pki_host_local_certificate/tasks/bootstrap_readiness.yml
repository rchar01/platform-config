---
- name: Require non-mutating registry PKI bootstrap readiness mode
  ansible.builtin.assert:
    that:
      - ansible_check_mode
      - ansible_play_hosts_all == [inventory_hostname]
      - groups.get('registry', []) | select('equalto', inventory_hostname) | list | length == 1
      - groups.get('all', []) | select('equalto', pki_host_local_certificate_remote_validator) | list | length == 1
      - pki_host_local_certificate_remote_validator != inventory_hostname
    fail_msg: Bootstrap readiness requires check mode, one exact registry, and one distinct runner.

- name: Load host-local certificate common validation
  ansible.builtin.import_tasks: validate.yml

- name: Validate host-local certificate bootstrap readiness contract
  ansible.builtin.assert:
    that:
      - pki_host_local_certificate_request_ttl_seconds is integer
      - pki_host_local_certificate_request_ttl_seconds is not boolean
      - pki_host_local_certificate_request_ttl_seconds > 0
      - pki_host_local_certificate_request_ttl_seconds <= 604800
      - pki_host_local_certificate_request_id | length == 0
      - pki_host_local_certificate_artifact_manifest_sha256 | length == 0
      - pki_host_local_certificate_deployment_sha256 | length == 0
      - pki_host_local_certificate_outcome_sha256 | length == 0
      - pki_host_local_certificate_validation_boundary_sha256 is match('^[0-9a-f]{64}$')
      - pki_host_local_certificate_reviewed_ca_sha256 is match('^[0-9a-f]{64}$')
      - pki_host_local_certificate_reviewed_ca_mode in ['0600', '0644']
      - pki_host_local_certificate_remote_validator is match('^[a-z0-9][a-z0-9.-]{0,252}$')
      - pki_host_local_certificate_endpoint is match('^https://[a-z0-9][a-z0-9.-]*(:[1-9][0-9]{0,4})?/v2/$')
    fail_msg: Bootstrap readiness requires exact request inputs and reviewed validation material.

- name: Load host-local certificate lifecycle helper preflight
  ansible.builtin.import_tasks: lifecycle_helper.yml
  vars:
    pki_host_local_certificate_helper_read_only: true

- name: Load reviewed runner validator helper preflight
  ansible.builtin.import_tasks: validator_helper.yml
  vars:
    pki_host_local_certificate_helper_read_only: true

- name: Run existing request helper in non-mutating preflight mode
  ansible.builtin.import_tasks: request_apply.yml

- name: Inspect reviewed validation material on registry target
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
  loop:
    - "{{ pki_host_local_certificate_reviewed_ca_target_path }}"
    - "{{ pki_host_local_certificate_validation_boundary_target_path }}"
  register: pki_host_local_certificate_readiness_target_material

- name: Validate reviewed target material metadata and digest
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
      - not item.stat.islnk
      - item.stat.uid == 0
      - item.stat.gid == 0
      - item.stat.nlink == 1
      - >-
        item.stat.mode == (
          pki_host_local_certificate_reviewed_ca_mode
          if item.item == pki_host_local_certificate_reviewed_ca_target_path
          else '0600'
        )
      - >-
        item.stat.checksum == (
          pki_host_local_certificate_reviewed_ca_sha256
          if item.item == pki_host_local_certificate_reviewed_ca_target_path
          else pki_host_local_certificate_validation_boundary_sha256
        )
    fail_msg: Reviewed target validation material metadata or digest is not exact.
  loop: "{{ pki_host_local_certificate_readiness_target_material.results }}"
  loop_control:
    label: "{{ item.item }}"
