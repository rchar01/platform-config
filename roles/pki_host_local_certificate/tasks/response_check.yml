---
- name: Load host-local certificate common validation
  ansible.builtin.import_tasks: validate.yml

- name: Validate host-local certificate response intake contract
  ansible.builtin.assert:
    that:
      - not ansible_check_mode
      - pki_host_local_certificate_request_id is match('^[0-9a-f]{32}$')
      - pki_host_local_certificate_artifact_manifest_sha256 is match('^[0-9a-f]{64}$')
      - pki_host_local_certificate_response_source_dir | length > 0
      - >-
        not pki_host_local_certificate_response_source_dir.startswith(
          pki_host_local_certificate_controller_exchange_root ~ '/'
        )
      - pki_host_local_certificate_minimum_remaining_lifetime_seconds > 0
      - pki_host_local_certificate_request_ttl_seconds is integer
      - pki_host_local_certificate_request_ttl_seconds == 0
    fail_msg: Response check requires one exact external response and collected request coordinate.

- name: Authenticate and snapshot exact controller-side certificate response
  platform_pki_response_intake:
    response_dir: "{{ pki_host_local_certificate_response_source_dir }}"
    exchange_root: "{{ pki_host_local_certificate_controller_exchange_root }}"
    service: "{{ pki_host_local_certificate_service }}"
    target: "{{ pki_host_local_certificate_target }}"
    request_id: "{{ pki_host_local_certificate_request_id }}"
    inventory_sha256: "{{ pki_host_local_certificate_inventory_sha256 }}"
    expected_artifact_sha256: "{{ pki_host_local_certificate_artifact_manifest_sha256 }}"
    response_principal: "{{ pki_host_local_certificate_response_principal }}"
    trust_paths:
      policy: "{{ pki_host_local_certificate_controller_exchange_root }}/{{ pki_host_local_certificate_service }}/{{ pki_host_local_certificate_request_id }}/trust/policy"
      requesters.allowed_signers: "{{ pki_host_local_certificate_controller_exchange_root }}/{{ pki_host_local_certificate_service }}/{{ pki_host_local_certificate_request_id }}/trust/requesters.allowed_signers"
      approvers.allowed_signers: "{{ pki_host_local_certificate_controller_exchange_root }}/{{ pki_host_local_certificate_service }}/{{ pki_host_local_certificate_request_id }}/trust/approvers.allowed_signers"
      responses.allowed_signers: "{{ pki_host_local_certificate_controller_exchange_root }}/{{ pki_host_local_certificate_service }}/{{ pki_host_local_certificate_request_id }}/trust/responses.allowed_signers"
      deployers.allowed_signers: "{{ pki_host_local_certificate_controller_exchange_root }}/{{ pki_host_local_certificate_service }}/{{ pki_host_local_certificate_request_id }}/trust/deployers.allowed_signers"
    trust_sha256: "{{ pki_host_local_certificate_trust_sha256 }}"
    common_name: "{{ pki_host_local_certificate_common_name }}"
    dns_sans: "{{ pki_host_local_certificate_dns_sans }}"
    ip_sans: "{{ pki_host_local_certificate_ip_sans }}"
    minimum_remaining_lifetime_seconds: "{{ pki_host_local_certificate_minimum_remaining_lifetime_seconds }}"
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false
  register: pki_host_local_certificate_response_intake_result

- name: Validate exact controller response intake metadata
  ansible.builtin.assert:
    that:
      - pki_host_local_certificate_response_intake_result.status in ['received', 'existing']
      - pki_host_local_certificate_response_intake_result.request_id == pki_host_local_certificate_request_id
      - pki_host_local_certificate_response_intake_result.response_dir == pki_host_local_certificate_expected_response_dir
      - pki_host_local_certificate_response_intake_result.artifact_sha256 == pki_host_local_certificate_artifact_manifest_sha256
      - pki_host_local_certificate_response_intake_result.request_sha256 is match('^[0-9a-f]{64}$')
      - pki_host_local_certificate_response_intake_result.approval_sha256 is match('^[0-9a-f]{64}$')
      - pki_host_local_certificate_response_intake_result.csr_sha256 is match('^[0-9a-f]{64}$')
      - pki_host_local_certificate_response_intake_result.csr_spki_sha256 is match('^[0-9a-f]{64}$')
      - pki_host_local_certificate_response_intake_result.response_sha256 is match('^[0-9a-f]{64}$')
      - pki_host_local_certificate_response_intake_result.response_signature_sha256 is match('^[0-9a-f]{64}$')
      - pki_host_local_certificate_response_intake_result.certificate_sha256 is match('^[0-9a-f]{64}$')
      - pki_host_local_certificate_response_intake_result.certificate_spki_sha256 is match('^[0-9a-f]{64}$')
      - pki_host_local_certificate_response_intake_result.chain_sha256 is match('^[0-9a-f]{64}$')
      - pki_host_local_certificate_response_intake_result.fullchain_sha256 is match('^[0-9a-f]{64}$')
      - pki_host_local_certificate_response_intake_result.not_after_epoch is match('^[1-9][0-9]*$')
    success_msg: >-
      service={{ pki_host_local_certificate_service }}
      target={{ pki_host_local_certificate_target }}
      request={{ pki_host_local_certificate_request_id }}
      artifact={{ pki_host_local_certificate_artifact_manifest_sha256 }}
      certificate={{ pki_host_local_certificate_response_intake_result.certificate_sha256 }}
      spki={{ pki_host_local_certificate_response_intake_result.certificate_spki_sha256 }}
      not_after={{ pki_host_local_certificate_response_intake_result.not_after_epoch }}
      response_dir={{ pki_host_local_certificate_response_intake_result.response_dir }}
      status=ready
    fail_msg: Controller response intake returned incomplete or mismatched metadata.
  vars:
    pki_host_local_certificate_expected_response_dir: >-
      {{ pki_host_local_certificate_controller_exchange_root }}/{{ pki_host_local_certificate_service }}/{{ pki_host_local_certificate_request_id }}/response
