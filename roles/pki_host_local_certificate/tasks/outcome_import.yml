---
- name: Load host-local certificate common validation
  ansible.builtin.import_tasks: validate.yml

- name: Validate host-local signer-outcome import contract
  ansible.builtin.assert:
    that:
      - pki_host_local_certificate_request_id is match('^[0-9a-f]{32}$')
      - pki_host_local_certificate_artifact_manifest_sha256 is match('^[0-9a-f]{64}$')
      - pki_host_local_certificate_deployment_sha256 is match('^[0-9a-f]{64}$')
      - pki_host_local_certificate_outcome_sha256 is match('^[0-9a-f]{64}$')
      - >-
        (pki_host_local_certificate_exchange_mode == 'controller-local'
         and pki_host_local_certificate_outcome_source_dir | length > 0
         and pki_host_local_certificate_outcome_source_dir != '/')
        or (pki_host_local_certificate_exchange_mode == 'direct'
            and pki_host_local_certificate_outcome_source_dir | length == 0)
      - pki_host_local_certificate_request_ttl_seconds is integer
      - pki_host_local_certificate_request_ttl_seconds == 0
    fail_msg: Signer-outcome import requires one exact protected package and all reviewed digests.

- name: Load host-local certificate lifecycle helper preflight
  ansible.builtin.import_tasks: lifecycle_helper.yml
  vars:
    pki_host_local_certificate_helper_read_only: true

- name: Authenticate, transfer, and import exact signer outcome
  platform_pki_outcome_import:
    lifecycle_helper_path: "{{ pki_host_local_certificate_lifecycle_helper_path }}"
    state_root: "{{ pki_host_local_certificate_state_root }}"
    pending_root: "{{ pki_host_local_certificate_pending_root }}"
    versions_root: "{{ pki_host_local_certificate_versions_root }}"
    zot_config_path: "{{ pki_host_local_certificate_zot_config_path }}"
    trust_id: "{{ pki_host_local_certificate_trust_id }}"
    exchange_root: "{{ pki_host_local_certificate_controller_exchange_root }}"
    outcome_dir: "{{ pki_host_local_certificate_outcome_source_dir }}"
    service: "{{ pki_host_local_certificate_service }}"
    target: "{{ pki_host_local_certificate_target }}"
    request_id: "{{ pki_host_local_certificate_request_id }}"
    artifact_sha256: "{{ pki_host_local_certificate_artifact_manifest_sha256 }}"
    deployment_sha256: "{{ pki_host_local_certificate_deployment_sha256 }}"
    outcome_sha256: "{{ pki_host_local_certificate_outcome_sha256 }}"
    response_principal: "{{ pki_host_local_certificate_response_principal }}"
  register: pki_host_local_certificate_outcome_import_result
  no_log: true
  when: pki_host_local_certificate_exchange_mode == 'controller-local'

- name: Validate exact signer-outcome import metadata
  ansible.builtin.assert:
    that:
      - >-
        pki_host_local_certificate_outcome_import_result.status
        in (['would-import', 'existing'] if ansible_check_mode else ['imported', 'existing'])
      - pki_host_local_certificate_outcome_import_result.request_id == pki_host_local_certificate_request_id
      - pki_host_local_certificate_outcome_import_result.artifact_sha256 == pki_host_local_certificate_artifact_manifest_sha256
      - pki_host_local_certificate_outcome_import_result.deployment_sha256 == pki_host_local_certificate_deployment_sha256
      - pki_host_local_certificate_outcome_import_result.outcome_sha256 == pki_host_local_certificate_outcome_sha256
      - >-
        [
          pki_host_local_certificate_outcome_import_result.action,
          pki_host_local_certificate_outcome_import_result.result,
          pki_host_local_certificate_outcome_import_result.state
        ]
        in [
          ['finalize', 'activated', 'finalized'],
          ['abandon', 'not-activated', 'abandoned'],
          ['abandon', 'rolled-back', 'abandoned']
        ]
      - >-
        pki_host_local_certificate_outcome_import_result.history_path
        == pki_host_local_certificate_state_root ~ '/outcomes/'
           ~ pki_host_local_certificate_request_id ~ '/'
           ~ pki_host_local_certificate_outcome_sha256
    success_msg: >-
      request={{ pki_host_local_certificate_request_id }}
      artifact={{ pki_host_local_certificate_artifact_manifest_sha256 }}
      deployment={{ pki_host_local_certificate_deployment_sha256 }}
      outcome={{ pki_host_local_certificate_outcome_sha256 }}
      state={{ pki_host_local_certificate_outcome_import_result.state }}
      status={{ pki_host_local_certificate_outcome_import_result.status }}
    fail_msg: Signer-outcome import returned metadata outside the exact reviewed coordinates.
  when: pki_host_local_certificate_exchange_mode == 'controller-local'

- name: Authenticate and import exact directly staged signer outcome
  ansible.builtin.command:
    argv: >-
      {{
        [
          pki_host_local_certificate_lifecycle_helper_path,
          'outcome-import',
          '--state-root', pki_host_local_certificate_state_root,
          '--pending-root', pki_host_local_certificate_pending_root,
          '--versions-root', pki_host_local_certificate_versions_root,
          '--service', pki_host_local_certificate_service,
          '--target', pki_host_local_certificate_target,
          '--zot-config', pki_host_local_certificate_zot_config_path,
          '--trust-id', pki_host_local_certificate_trust_id,
          '--request-id', pki_host_local_certificate_request_id,
          '--artifact-sha256', pki_host_local_certificate_artifact_manifest_sha256,
          '--deployment-sha256', pki_host_local_certificate_deployment_sha256,
          '--outcome-sha256', pki_host_local_certificate_outcome_sha256,
          '--outcome-dir', pki_host_local_certificate_exchange_spool_root
             ~ '/outcomes/' ~ pki_host_local_certificate_request_id
             ~ '/' ~ pki_host_local_certificate_outcome_sha256
        ]
        + (['--check'] if ansible_check_mode else [])
      }}
  register: pki_host_local_certificate_direct_outcome_import_command
  changed_when: >-
    not ansible_check_mode
    and (pki_host_local_certificate_direct_outcome_import_command.stdout | from_json).status == 'imported'
  check_mode: false
  when: pki_host_local_certificate_exchange_mode == 'direct'

- name: Validate exact direct signer-outcome import metadata
  ansible.builtin.assert:
    that:
      - pki_host_local_certificate_direct_outcome_import_command.stderr | length == 0
      - >-
        pki_host_local_certificate_direct_outcome_import.status
        in (['would-import', 'existing'] if ansible_check_mode else ['imported', 'existing'])
      - pki_host_local_certificate_direct_outcome_import.request_id == pki_host_local_certificate_request_id
      - pki_host_local_certificate_direct_outcome_import.artifact_sha256 == pki_host_local_certificate_artifact_manifest_sha256
      - pki_host_local_certificate_direct_outcome_import.deployment_sha256 == pki_host_local_certificate_deployment_sha256
      - pki_host_local_certificate_direct_outcome_import.outcome_sha256 == pki_host_local_certificate_outcome_sha256
      - >-
        [
          pki_host_local_certificate_direct_outcome_import.action,
          pki_host_local_certificate_direct_outcome_import.result,
          pki_host_local_certificate_direct_outcome_import.state
        ] in [
          ['finalize', 'activated', 'finalized'],
          ['abandon', 'not-activated', 'abandoned'],
          ['abandon', 'rolled-back', 'abandoned']
        ]
      - >-
        pki_host_local_certificate_direct_outcome_import.history_path
        == pki_host_local_certificate_state_root ~ '/outcomes/'
           ~ pki_host_local_certificate_request_id ~ '/'
           ~ pki_host_local_certificate_outcome_sha256
    success_msg: >-
      request={{ pki_host_local_certificate_request_id }}
      artifact={{ pki_host_local_certificate_artifact_manifest_sha256 }}
      deployment={{ pki_host_local_certificate_deployment_sha256 }}
      outcome={{ pki_host_local_certificate_outcome_sha256 }}
      state={{ pki_host_local_certificate_direct_outcome_import.state }}
      status={{ pki_host_local_certificate_direct_outcome_import.status }}
    fail_msg: Direct signer-outcome import returned metadata outside the exact reviewed coordinates.
  vars:
    pki_host_local_certificate_direct_outcome_import: >-
      {{ pki_host_local_certificate_direct_outcome_import_command.stdout | from_json }}
  when: pki_host_local_certificate_exchange_mode == 'direct'

- name: Remove only the accepted direct outcome stage
  ansible.builtin.command:
    argv:
      - "{{ pki_host_local_certificate_exchange_helper_path }}"
      - cleanup-outcome
      - "{{ pki_host_local_certificate_request_id }}"
      - "{{ pki_host_local_certificate_artifact_manifest_sha256 }}"
      - "{{ pki_host_local_certificate_deployment_sha256 }}"
      - "{{ pki_host_local_certificate_outcome_sha256 }}"
  register: pki_host_local_certificate_outcome_cleanup_command
  changed_when: >-
    (pki_host_local_certificate_outcome_cleanup_command.stdout | from_json).status == 'cleaned'
  when:
    - pki_host_local_certificate_exchange_mode == 'direct'
    - not ansible_check_mode
    - (pki_host_local_certificate_direct_outcome_import_command.stdout | from_json).status in ['imported', 'existing']

- name: Validate exact direct outcome cleanup metadata
  ansible.builtin.assert:
    that:
      - pki_host_local_certificate_outcome_cleanup_command.stderr | length == 0
      - pki_host_local_certificate_outcome_cleanup.keys() | list | sort == pki_host_local_certificate_outcome_cleanup_fields
      - pki_host_local_certificate_outcome_cleanup.request_id == pki_host_local_certificate_request_id
      - pki_host_local_certificate_outcome_cleanup.artifact_sha256 == pki_host_local_certificate_artifact_manifest_sha256
      - pki_host_local_certificate_outcome_cleanup.deployment_sha256 == pki_host_local_certificate_deployment_sha256
      - pki_host_local_certificate_outcome_cleanup.outcome_sha256 == pki_host_local_certificate_outcome_sha256
      - >-
        pki_host_local_certificate_outcome_cleanup.stage_id
        == 'pki-outcome-v1:' ~ pki_host_local_certificate_request_id
           ~ ':' ~ pki_host_local_certificate_artifact_manifest_sha256
           ~ ':' ~ pki_host_local_certificate_deployment_sha256
           ~ ':' ~ pki_host_local_certificate_outcome_sha256
      - pki_host_local_certificate_outcome_cleanup.status in ['cleaned', 'absent']
    fail_msg: Direct outcome cleanup returned metadata outside the accepted exact stage.
  vars:
    pki_host_local_certificate_outcome_cleanup: "{{ pki_host_local_certificate_outcome_cleanup_command.stdout | from_json }}"
    pki_host_local_certificate_outcome_cleanup_fields:
      - artifact_sha256
      - deployment_sha256
      - outcome_sha256
      - request_id
      - stage_id
      - status
  when:
    - pki_host_local_certificate_exchange_mode == 'direct'
    - not ansible_check_mode
    - (pki_host_local_certificate_direct_outcome_import_command.stdout | from_json).status in ['imported', 'existing']
