---
- name: Load host-local certificate common validation
  ansible.builtin.import_tasks: validate.yml

- name: Validate host-local certificate evidence export contract
  ansible.builtin.assert:
    that:
      - not ansible_check_mode
      - pki_host_local_certificate_request_id is match('^[0-9a-f]{32}$')
      - pki_host_local_certificate_artifact_manifest_sha256 is match('^[0-9a-f]{64}$')
      - pki_host_local_certificate_deployment_sha256 is match('^[0-9a-f]{64}$')
      - pki_host_local_certificate_request_ttl_seconds is integer
      - pki_host_local_certificate_request_ttl_seconds == 0
    fail_msg: Evidence export requires exact request, artifact, and deployment coordinates.

- name: Load host-local certificate lifecycle helper preflight
  ansible.builtin.import_tasks: lifecycle_helper.yml
  vars:
    pki_host_local_certificate_helper_read_only: true

- name: Collect exact authenticated host-local deployment evidence
  platform_pki_evidence_collection:
    lifecycle_helper_path: "{{ pki_host_local_certificate_lifecycle_helper_path }}"
    state_root: "{{ pki_host_local_certificate_state_root }}"
    pending_root: "{{ pki_host_local_certificate_pending_root }}"
    versions_root: "{{ pki_host_local_certificate_versions_root }}"
    trust_id: "{{ pki_host_local_certificate_trust_id }}"
    exchange_root: "{{ pki_host_local_certificate_controller_exchange_root }}"
    service: "{{ pki_host_local_certificate_service }}"
    target: "{{ pki_host_local_certificate_target }}"
    request_id: "{{ pki_host_local_certificate_request_id }}"
    artifact_sha256: "{{ pki_host_local_certificate_artifact_manifest_sha256 }}"
    deployment_sha256: "{{ pki_host_local_certificate_deployment_sha256 }}"
  register: pki_host_local_certificate_evidence_collection_result
  when: pki_host_local_certificate_exchange_mode == 'controller-local'

- name: Validate exact evidence collection metadata
  ansible.builtin.assert:
    that:
      - pki_host_local_certificate_evidence_collection_result.status in ['collected', 'existing']
      - pki_host_local_certificate_evidence_collection_result.request_id == pki_host_local_certificate_request_id
      - pki_host_local_certificate_evidence_collection_result.artifact_sha256 == pki_host_local_certificate_artifact_manifest_sha256
      - pki_host_local_certificate_evidence_collection_result.deployment_sha256 == pki_host_local_certificate_deployment_sha256
      - >-
        [
          pki_host_local_certificate_evidence_collection_result.action,
          pki_host_local_certificate_evidence_collection_result.result
        ]
        in [
          ['finalize', 'activated'],
          ['abandon', 'not-activated'],
          ['abandon', 'rolled-back']
        ]
      - pki_host_local_certificate_evidence_collection_result.validation_boundary_sha256 is match('^[0-9a-f]{64}$')
      - pki_host_local_certificate_evidence_collection_result.validation_result_sha256 is match('^[0-9a-f]{64}$')
      - >-
        pki_host_local_certificate_evidence_collection_result.evidence_dir
        == pki_host_local_certificate_controller_exchange_root ~ '/'
           ~ pki_host_local_certificate_service ~ '/'
           ~ pki_host_local_certificate_request_id ~ '/evidence/'
           ~ pki_host_local_certificate_deployment_sha256
    success_msg: >-
      request={{ pki_host_local_certificate_request_id }}
      artifact={{ pki_host_local_certificate_artifact_manifest_sha256 }}
      deployment={{ pki_host_local_certificate_deployment_sha256 }}
      evidence_dir={{ pki_host_local_certificate_evidence_collection_result.evidence_dir }}
      action={{ pki_host_local_certificate_evidence_collection_result.action }}
      result={{ pki_host_local_certificate_evidence_collection_result.result }}
      status={{
        'evidence-exported'
        if pki_host_local_certificate_evidence_collection_result.action == 'finalize'
        and pki_host_local_certificate_evidence_collection_result.result == 'activated'
        else 'abandonment-evidence-exported'
      }}
    fail_msg: Evidence collection returned metadata outside the exact deployment coordinates.
  when: pki_host_local_certificate_exchange_mode == 'controller-local'

- name: Publish exact direct evidence transfer coordinates
  ansible.builtin.assert:
    that:
      - pki_host_local_certificate_exchange_mode == 'direct'
    success_msg: >-
      request={{ pki_host_local_certificate_request_id }}
      artifact={{ pki_host_local_certificate_artifact_manifest_sha256 }}
      deployment={{ pki_host_local_certificate_deployment_sha256 }}
      next=platform-pki direct-exchange evidence-pull ENDPOINT_RECORD
      {{ pki_host_local_certificate_request_id }}
      {{ pki_host_local_certificate_artifact_manifest_sha256 }}
      {{ pki_host_local_certificate_deployment_sha256 }} OUTPUT_DIR
    fail_msg: Direct evidence export requires the direct exchange mode.
  when: pki_host_local_certificate_exchange_mode == 'direct'
