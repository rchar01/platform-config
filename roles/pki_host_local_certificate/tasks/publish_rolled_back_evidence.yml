---
- name: Load host-local certificate common validation
  ansible.builtin.import_tasks: validate.yml

- name: Validate rolled-back evidence publication contract
  ansible.builtin.assert:
    that:
      - not ansible_check_mode
      - ansible_play_hosts_all == [inventory_hostname]
      - groups.get('registry', []) | select('equalto', inventory_hostname) | list | length == 1
      - groups.get('all', []) | select('equalto', pki_host_local_certificate_remote_validator) | list | length == 1
      - pki_host_local_certificate_remote_validator != inventory_hostname
      - pki_host_local_certificate_request_id is match('^[0-9a-f]{32}$')
      - pki_host_local_certificate_artifact_manifest_sha256 is match('^[0-9a-f]{64}$')
      - pki_host_local_certificate_validation_boundary_sha256 is match('^[0-9a-f]{64}$')
      - pki_host_local_certificate_validation_boundary_target_path | length > 0
      - pki_host_local_certificate_validation_boundary_runner_path | length > 0
      - pki_host_local_certificate_reviewed_ca_target_path | length > 0
      - pki_host_local_certificate_reviewed_ca_runner_path | length > 0
      - pki_host_local_certificate_reviewed_ca_sha256 is match('^[0-9a-f]{64}$')
      - pki_host_local_certificate_reviewed_ca_mode in ['0600', '0644']
      - pki_host_local_certificate_remote_validator is match('^[a-z0-9][a-z0-9.-]{0,252}$')
      - pki_host_local_certificate_endpoint is match('^https://[a-z0-9][a-z0-9.-]*(:[1-9][0-9]{0,4})?/v2/$')
      - pki_host_local_certificate_minimum_remaining_lifetime_seconds > 0
      - pki_host_local_certificate_zot_config_path == '/etc/zot/config.json'
      - pki_host_local_certificate_rollback_seconds is integer
      - pki_host_local_certificate_rollback_seconds is not boolean
      - pki_host_local_certificate_rollback_seconds >= 1209600
      - pki_host_local_certificate_request_ttl_seconds is integer
      - pki_host_local_certificate_request_ttl_seconds == 0
      - pki_host_local_certificate_activation_action == 'abandon'
      - pki_host_local_certificate_activation_result == 'rolled-back'
      - pki_host_local_certificate_interactive_confirmation is sameas false
      - pki_host_local_certificate_unattended_authorized is sameas false
      - pki_host_local_certificate_deployment_sha256 | length == 0
    fail_msg: Rolled-back evidence publication requires one exact target and one distinct reviewed runner.

- name: Load host-local certificate lifecycle helper preflight
  ansible.builtin.import_tasks: lifecycle_helper.yml

- name: Load reviewed runner validator helper preflight
  ansible.builtin.import_tasks: validator_helper.yml

- name: Inspect reviewed validation CA on registry target
  ansible.builtin.stat:
    path: "{{ pki_host_local_certificate_reviewed_ca_target_path }}"
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
  register: pki_host_local_certificate_target_reviewed_ca

- name: Validate reviewed target CA metadata and digest
  ansible.builtin.assert:
    that:
      - pki_host_local_certificate_target_reviewed_ca.stat.exists
      - pki_host_local_certificate_target_reviewed_ca.stat.isreg
      - not pki_host_local_certificate_target_reviewed_ca.stat.islnk
      - pki_host_local_certificate_target_reviewed_ca.stat.uid == 0
      - pki_host_local_certificate_target_reviewed_ca.stat.gid == 0
      - pki_host_local_certificate_target_reviewed_ca.stat.nlink == 1
      - pki_host_local_certificate_target_reviewed_ca.stat.mode == pki_host_local_certificate_reviewed_ca_mode
      - pki_host_local_certificate_target_reviewed_ca.stat.checksum == pki_host_local_certificate_reviewed_ca_sha256
    fail_msg: Reviewed target CA metadata or digest differs from the exact operator contract.

- name: Validate restored predecessor and publish rolled-back evidence
  block:
    - name: Strictly validate restored predecessor on registry target
      ansible.builtin.command:
        argv: >-
          {{
            [
              pki_host_local_certificate_lifecycle_helper_path,
              'activate-finish',
              '--state-root', pki_host_local_certificate_state_root,
              '--pending-root', pki_host_local_certificate_pending_root,
              '--versions-root', pki_host_local_certificate_versions_root,
              '--service', pki_host_local_certificate_service,
              '--target', pki_host_local_certificate_target,
              '--zot-config', pki_host_local_certificate_zot_config_path,
              '--trust-id', pki_host_local_certificate_trust_id,
              '--request-id', pki_host_local_certificate_request_id,
              '--artifact-sha256', pki_host_local_certificate_artifact_manifest_sha256,
              '--common-name', pki_host_local_certificate_common_name,
              '--minimum-remaining-lifetime-seconds', pki_host_local_certificate_minimum_remaining_lifetime_seconds | string,
              '--validation-boundary-sha256', pki_host_local_certificate_validation_boundary_sha256,
              '--remote-validator', pki_host_local_certificate_remote_validator,
              '--endpoint', pki_host_local_certificate_endpoint,
              '--validation-boundary', pki_host_local_certificate_validation_boundary_target_path,
              '--deployment-signing-key', pki_host_local_certificate_deployment_signing_key_path,
              '--reviewed-ca', pki_host_local_certificate_reviewed_ca_target_path,
              '--reviewed-ca-mode', pki_host_local_certificate_reviewed_ca_mode,
              '--rollback-seconds', pki_host_local_certificate_rollback_seconds | string,
              '--action', pki_host_local_certificate_activation_action,
              '--result', pki_host_local_certificate_activation_result,
              '--prepare-rolled-back-abandonment'
            ]
            + (pki_host_local_certificate_dns_sans | map('regex_replace', '^(.*)$', '--dns-san=\1') | list)
            + (pki_host_local_certificate_ip_sans | map('regex_replace', '^(.*)$', '--ip-san=\1') | list)
          }}
      register: pki_host_local_certificate_rollback_preflight_result
      changed_when: false

    - name: Validate exact restored predecessor metadata
      ansible.builtin.assert:
        that:
          - pki_host_local_certificate_rollback_preflight_result.stderr | length == 0
          - pki_host_local_certificate_rollback_preflight.keys() | list | sort == pki_host_local_certificate_rollback_preflight_fields
          - pki_host_local_certificate_rollback_preflight.status == 'rolled-back-abandonment-local-validated'
          - pki_host_local_certificate_rollback_preflight.action == 'abandon'
          - pki_host_local_certificate_rollback_preflight.result == 'rolled-back'
          - pki_host_local_certificate_rollback_preflight.request_id == pki_host_local_certificate_request_id
          - pki_host_local_certificate_rollback_preflight.artifact_sha256 == pki_host_local_certificate_artifact_manifest_sha256
          - pki_host_local_certificate_rollback_preflight.served_certificate_sha256 is match('^[0-9a-f]{64}$')
          - pki_host_local_certificate_rollback_preflight.served_intermediate_sha256 is match('^[0-9a-f]{64}$')
          - pki_host_local_certificate_rollback_preflight.activation_epoch is integer
          - pki_host_local_certificate_rollback_preflight.rollback_deadline_epoch is integer
        fail_msg: Restored predecessor preflight returned mismatched metadata.
      vars:
        pki_host_local_certificate_rollback_preflight: >-
          {{ pki_host_local_certificate_rollback_preflight_result.stdout | from_json }}
        pki_host_local_certificate_rollback_preflight_fields:
          - action
          - activation_epoch
          - artifact_sha256
          - request_id
          - result
          - rollback_deadline_epoch
          - served_certificate_sha256
          - served_intermediate_sha256
          - status

    - name: Validate exact restored Zot endpoint from reviewed runner
      ansible.builtin.command:
        argv:
          - "{{ pki_host_local_certificate_validator_helper_path }}"
          - --service
          - "{{ pki_host_local_certificate_service }}"
          - --target
          - "{{ pki_host_local_certificate_target }}"
          - --request-id
          - "{{ pki_host_local_certificate_request_id }}"
          - --artifact-sha256
          - "{{ pki_host_local_certificate_artifact_manifest_sha256 }}"
          - --validation-boundary
          - "{{ pki_host_local_certificate_validation_boundary_runner_path }}"
          - --validation-boundary-sha256
          - "{{ pki_host_local_certificate_validation_boundary_sha256 }}"
          - --remote-validator
          - "{{ pki_host_local_certificate_remote_validator }}"
          - --endpoint
          - "{{ pki_host_local_certificate_endpoint }}"
          - --reviewed-ca
          - "{{ pki_host_local_certificate_reviewed_ca_runner_path }}"
          - --reviewed-ca-sha256
          - "{{ pki_host_local_certificate_reviewed_ca_sha256 }}"
          - --expected-served-leaf-sha256
          - "{{ (pki_host_local_certificate_rollback_preflight_result.stdout | from_json).served_certificate_sha256 }}"
          - --expected-served-intermediate-sha256
          - "{{ (pki_host_local_certificate_rollback_preflight_result.stdout | from_json).served_intermediate_sha256 }}"
      delegate_to: "{{ pki_host_local_certificate_remote_validator }}"
      register: pki_host_local_certificate_validator_result
      changed_when: false
      check_mode: false

    - name: Load exact restored runner observation validation
      ansible.builtin.import_tasks: validate_validator_result.yml
      vars:
        pki_host_local_certificate_validator_expected_leaf_sha256: >-
          {{ (pki_host_local_certificate_rollback_preflight_result.stdout | from_json).served_certificate_sha256 }}
        pki_host_local_certificate_validator_expected_intermediate_sha256: >-
          {{ (pki_host_local_certificate_rollback_preflight_result.stdout | from_json).served_intermediate_sha256 }}

    - name: Create private transient observation directory
      ansible.builtin.file:
        path: /run/platform-pki-host-local
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Copy only canonical public runner observation to target
      ansible.builtin.copy:
        content: "{{ pki_host_local_certificate_validator_result.stdout }}\n"
        dest: "/run/platform-pki-host-local/{{ pki_host_local_certificate_request_id }}.observation"
        owner: root
        group: root
        mode: "0600"

    - name: Publish exact rolled-back host-local certificate evidence
      ansible.builtin.command:
        argv: >-
          {{
            [
              pki_host_local_certificate_lifecycle_helper_path,
              'activate-finish',
              '--state-root', pki_host_local_certificate_state_root,
              '--pending-root', pki_host_local_certificate_pending_root,
              '--versions-root', pki_host_local_certificate_versions_root,
              '--service', pki_host_local_certificate_service,
              '--target', pki_host_local_certificate_target,
              '--zot-config', pki_host_local_certificate_zot_config_path,
              '--trust-id', pki_host_local_certificate_trust_id,
              '--request-id', pki_host_local_certificate_request_id,
              '--artifact-sha256', pki_host_local_certificate_artifact_manifest_sha256,
              '--common-name', pki_host_local_certificate_common_name,
              '--minimum-remaining-lifetime-seconds', pki_host_local_certificate_minimum_remaining_lifetime_seconds | string,
              '--validation-boundary-sha256', pki_host_local_certificate_validation_boundary_sha256,
              '--remote-validator', pki_host_local_certificate_remote_validator,
              '--endpoint', pki_host_local_certificate_endpoint,
              '--validation-boundary', pki_host_local_certificate_validation_boundary_target_path,
              '--observation-file', '/run/platform-pki-host-local/' ~ pki_host_local_certificate_request_id ~ '.observation',
              '--served-intermediate-sha256', (pki_host_local_certificate_rollback_preflight_result.stdout | from_json).served_intermediate_sha256,
              '--deployment-signing-key', pki_host_local_certificate_deployment_signing_key_path,
              '--reviewed-ca', pki_host_local_certificate_reviewed_ca_target_path,
              '--reviewed-ca-mode', pki_host_local_certificate_reviewed_ca_mode,
              '--rollback-seconds', pki_host_local_certificate_rollback_seconds | string,
              '--action', pki_host_local_certificate_activation_action,
              '--result', pki_host_local_certificate_activation_result
            ]
            + (pki_host_local_certificate_dns_sans | map('regex_replace', '^(.*)$', '--dns-san=\1') | list)
            + (pki_host_local_certificate_ip_sans | map('regex_replace', '^(.*)$', '--ip-san=\1') | list)
          }}
      register: pki_host_local_certificate_rollback_finish_result
      changed_when: >-
        (pki_host_local_certificate_rollback_finish_result.stdout | from_json).status == 'evidence-published'
      check_mode: false

    - name: Validate exact rolled-back evidence metadata
      ansible.builtin.assert:
        that:
          - pki_host_local_certificate_rollback_finish_result.stderr | length == 0
          - pki_host_local_certificate_rollback_finish.keys() | list | sort == pki_host_local_certificate_rollback_finish_fields
          - pki_host_local_certificate_rollback_finish.status in ['evidence-published', 'evidence-existing']
          - pki_host_local_certificate_rollback_finish.action == 'abandon'
          - pki_host_local_certificate_rollback_finish.result == 'rolled-back'
          - pki_host_local_certificate_rollback_finish.request_id == pki_host_local_certificate_request_id
          - pki_host_local_certificate_rollback_finish.deployment_sha256 is match('^[0-9a-f]{64}$')
          - >-
            pki_host_local_certificate_rollback_finish.evidence_path
            == pki_host_local_certificate_state_root ~ '/evidence/'
               ~ pki_host_local_certificate_request_id ~ '/'
               ~ pki_host_local_certificate_rollback_finish.deployment_sha256
        success_msg: >-
          request={{ pki_host_local_certificate_request_id }}
          artifact={{ pki_host_local_certificate_artifact_manifest_sha256 }}
          deployment={{ pki_host_local_certificate_rollback_finish.deployment_sha256 }}
          evidence_path={{ pki_host_local_certificate_rollback_finish.evidence_path }}
          status=rolled-back-evidence-published
        fail_msg: Rolled-back evidence publication returned mismatched metadata.
      vars:
        pki_host_local_certificate_rollback_finish: >-
          {{ pki_host_local_certificate_rollback_finish_result.stdout | from_json }}
        pki_host_local_certificate_rollback_finish_fields:
          - action
          - deployment_sha256
          - evidence_path
          - request_id
          - result
          - status

  always:
    - name: Remove only transient host-local certificate observation
      ansible.builtin.file:
        path: "/run/platform-pki-host-local/{{ pki_host_local_certificate_request_id }}.observation"
        state: absent
      when: not ansible_check_mode
