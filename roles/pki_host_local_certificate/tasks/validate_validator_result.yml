---
- name: Validate exact canonical reviewed-runner observation
  ansible.builtin.assert:
    that:
      - pki_host_local_certificate_validator_result.stderr | length == 0
      - pki_host_local_certificate_observation_lines | length == 17
      - pki_host_local_certificate_observation_lines[0] == 'schema=1'
      - pki_host_local_certificate_observation_lines[1] == 'kind=pki-external-validation-observation'
      - pki_host_local_certificate_observation_lines[2] == 'service=' ~ pki_host_local_certificate_service
      - pki_host_local_certificate_observation_lines[3] == 'target=' ~ pki_host_local_certificate_target
      - pki_host_local_certificate_observation_lines[4] == 'request_id=' ~ pki_host_local_certificate_request_id
      - pki_host_local_certificate_observation_lines[5] == 'artifact_manifest_sha256=' ~ pki_host_local_certificate_artifact_manifest_sha256
      - pki_host_local_certificate_observation_lines[6] == 'validation_boundary_sha256=' ~ pki_host_local_certificate_validation_boundary_sha256
      - pki_host_local_certificate_observation_lines[7] == 'remote_validator=' ~ pki_host_local_certificate_remote_validator
      - pki_host_local_certificate_observation_lines[8] == 'endpoint=' ~ pki_host_local_certificate_endpoint
      - pki_host_local_certificate_observation_lines[9] == 'remote_tls_result=passed'
      - pki_host_local_certificate_observation_lines[10] == 'remote_application_result=passed'
      - pki_host_local_certificate_observation_lines[11] in ['remote_http_status=200', 'remote_http_status=401']
      - pki_host_local_certificate_observation_lines[12] == 'remote_api_version=registry/2.0'
      - >-
        [
          pki_host_local_certificate_observation_lines[11],
          pki_host_local_certificate_observation_lines[13]
        ]
        in [
          ['remote_http_status=200', 'remote_auth_challenge=not-required'],
          ['remote_http_status=401', 'remote_auth_challenge=present']
        ]
      - pki_host_local_certificate_observation_lines[14] == 'served_certificate_sha256=' ~ pki_host_local_certificate_validator_expected_leaf_sha256
      - pki_host_local_certificate_observation_lines[15] == 'served_intermediate_sha256=' ~ pki_host_local_certificate_validator_expected_intermediate_sha256
      - pki_host_local_certificate_observation_lines[16] is match('^validation_epoch=[1-9][0-9]*$')
      - pki_host_local_certificate_observation_age_seconds >= -300
      - pki_host_local_certificate_observation_age_seconds <= 300
    fail_msg: Reviewed runner returned a noncanonical, stale, or mismatched public observation.
  vars:
    pki_host_local_certificate_observation_lines: "{{ pki_host_local_certificate_validator_result.stdout.split('\n') }}"
    pki_host_local_certificate_observation_epoch: >-
      {{ pki_host_local_certificate_observation_lines[16].removeprefix('validation_epoch=') | int }}
    pki_host_local_certificate_observation_age_seconds: >-
      {{ (
        (
          (now(utc=true, fmt='%Y-%m-%d %H:%M:%S') | to_datetime)
          - ('1970-01-01 00:00:00' | to_datetime)
        ).total_seconds() | int
      ) - (pki_host_local_certificate_observation_epoch | int) }}
