---
- name: Load host-local certificate common validation
  ansible.builtin.import_tasks: validate.yml

- name: Validate expired request abandonment contract
  ansible.builtin.assert:
    that:
      - ansible_play_hosts_all == [inventory_hostname]
      - groups.get('registry', []) | select('equalto', inventory_hostname) | list | length == 1
      - pki_host_local_certificate_request_id is match('^[0-9a-f]{32}$')
      - pki_host_local_certificate_request_ttl_seconds is integer
      - pki_host_local_certificate_request_ttl_seconds is not boolean
      - pki_host_local_certificate_request_ttl_seconds == 0
      - pki_host_local_certificate_validation_boundary_sha256 | length == 0
      - pki_host_local_certificate_rollback_seconds == 0
      - not pki_host_local_certificate_helper_read_only
    fail_msg: >-
      Expired request abandonment requires one exact target and request ID with
      all unrelated mutation coordinates disabled.

- name: Load host-local certificate lifecycle helper preflight
  ansible.builtin.import_tasks: lifecycle_helper.yml

- name: Abandon exact expired host-local certificate request
  ansible.builtin.command:
    argv: >-
      {{
        [
          pki_host_local_certificate_lifecycle_helper_path,
          'abandon-expired-request',
          '--state-root', pki_host_local_certificate_state_root,
          '--pending-root', pki_host_local_certificate_pending_root,
          '--versions-root', pki_host_local_certificate_versions_root,
          '--service', pki_host_local_certificate_service,
          '--target', pki_host_local_certificate_target,
          '--trust-id', pki_host_local_certificate_trust_id,
          '--request-id', pki_host_local_certificate_request_id
        ]
        + (['--check'] if ansible_check_mode else [])
      }}
  register: pki_host_local_certificate_expired_abandonment_result
  changed_when: >-
    not ansible_check_mode
    and (pki_host_local_certificate_expired_abandonment_result.stdout | from_json).status == 'abandoned'
  check_mode: false

- name: Validate expired request abandonment result
  ansible.builtin.assert:
    that:
      - pki_host_local_certificate_expired_abandonment_result.stderr | length == 0
      - pki_host_local_certificate_expired_abandonment.keys() | list | sort == ['request_id', 'status']
      - pki_host_local_certificate_expired_abandonment.request_id == pki_host_local_certificate_request_id
      - >-
        pki_host_local_certificate_expired_abandonment.status
        in ['abandoned', 'would-abandon', 'would-complete-abandonment']
    success_msg: >-
      request={{ pki_host_local_certificate_expired_abandonment.request_id }}
      status={{ pki_host_local_certificate_expired_abandonment.status }}
    fail_msg: Expired request abandonment returned noncanonical metadata.
  vars:
    pki_host_local_certificate_expired_abandonment: >-
      {{ pki_host_local_certificate_expired_abandonment_result.stdout | from_json }}
