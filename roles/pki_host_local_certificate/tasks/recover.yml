---
- name: Load host-local certificate common validation
  ansible.builtin.import_tasks: validate.yml

- name: Validate explicit host-local certificate recovery contract
  ansible.builtin.assert:
    that:
      - ansible_play_hosts_all == [inventory_hostname]
      - groups.get('registry', []) | select('equalto', inventory_hostname) | list | length == 1
      - pki_host_local_certificate_request_id is match('^[0-9a-f]{32}$')
      - pki_host_local_certificate_artifact_manifest_sha256 is match('^[0-9a-f]{64}$')
      - pki_host_local_certificate_zot_config_path == '/etc/zot/config.json'
      - pki_host_local_certificate_request_ttl_seconds is integer
      - pki_host_local_certificate_request_ttl_seconds == 0
      - pki_host_local_certificate_minimum_remaining_lifetime_seconds > 0
    fail_msg: Recovery is an explicit one-target operator phase with exact lifecycle coordinates.

- name: Load host-local certificate lifecycle helper preflight
  ansible.builtin.import_tasks: lifecycle_helper.yml

- name: Recover exact host-local certificate lifecycle journal
  ansible.builtin.command:
    argv: >-
      {{
        [
          pki_host_local_certificate_lifecycle_helper_path,
          'recover',
          '--state-root', pki_host_local_certificate_state_root,
          '--pending-root', pki_host_local_certificate_pending_root,
          '--versions-root', pki_host_local_certificate_versions_root,
          '--service', pki_host_local_certificate_service,
          '--target', pki_host_local_certificate_target,
          '--zot-config', pki_host_local_certificate_zot_config_path,
          '--request-id', pki_host_local_certificate_request_id,
          '--artifact-sha256', pki_host_local_certificate_artifact_manifest_sha256
        ]
        + (['--check'] if ansible_check_mode else [])
      }}
  register: pki_host_local_certificate_recovery_result
  changed_when: >-
    pki_host_local_certificate_recovery_result.rc == 0
    and not ansible_check_mode
    and (pki_host_local_certificate_recovery_result.stdout | from_json).status != 'not-required'
  check_mode: false

- name: Validate exact lifecycle recovery metadata
  ansible.builtin.assert:
    that:
      - pki_host_local_certificate_recovery_result.stderr | length == 0
      - pki_host_local_certificate_recovery.status in pki_host_local_certificate_recovery_statuses
      - >-
        (pki_host_local_certificate_recovery.status == 'not-required'
         and pki_host_local_certificate_recovery.keys() | list | sort == ['status'])
        or
        (pki_host_local_certificate_recovery.status != 'not-required'
         and pki_host_local_certificate_recovery.request_id == pki_host_local_certificate_request_id
         and pki_host_local_certificate_recovery.artifact_sha256 == pki_host_local_certificate_artifact_manifest_sha256)
      - >-
        pki_host_local_certificate_recovery.status not in ['abandonment-evidence-required']
        or pki_host_local_certificate_recovery.result in ['not-activated', 'rolled-back']
    fail_msg: Lifecycle recovery returned noncanonical or mismatched metadata.
  vars:
    pki_host_local_certificate_recovery: "{{ pki_host_local_certificate_recovery_result.stdout | from_json }}"
    pki_host_local_certificate_recovery_statuses:
      - abandonment-evidence-required
      - evidence-completed
      - not-required
      - restored

- name: Load post-recovery authenticated lifecycle status
  ansible.builtin.import_tasks: status.yml

- name: Publish safe recovery and resulting lifecycle summary
  ansible.builtin.assert:
    that:
      - pki_host_local_certificate_post_recovery_status.service == pki_host_local_certificate_service
      - pki_host_local_certificate_post_recovery_status.target == pki_host_local_certificate_target
      - pki_host_local_certificate_post_recovery_status.status in pki_host_local_certificate_post_recovery_statuses
    success_msg: >-
      request={{ pki_host_local_certificate_request_id }}
      artifact={{ pki_host_local_certificate_artifact_manifest_sha256 }}
      recovery_status={{ pki_host_local_certificate_recovery.status }}
      lifecycle_status={{ pki_host_local_certificate_status_result.stdout }}
    fail_msg: Post-recovery lifecycle status does not match the authenticated target contract.
  vars:
    pki_host_local_certificate_recovery: "{{ pki_host_local_certificate_recovery_result.stdout | from_json }}"
    pki_host_local_certificate_post_recovery_status: "{{ pki_host_local_certificate_status_result.stdout | from_json }}"
    pki_host_local_certificate_post_recovery_statuses:
      - abandonment-evidence-required
      - activated-and-validated
      - activation-recovery-required
      - conflict
      - evidence-exported
      - managed-migration-needed
      - request-expired
      - request-pending
      - response-ready
