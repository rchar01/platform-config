---
- name: Load host-local certificate common validation
  ansible.builtin.import_tasks: validate.yml

- name: Validate host-local certificate activation contract
  ansible.builtin.assert:
    that:
      - ansible_play_hosts_all == [inventory_hostname]
      - groups.get('registry', []) | select('equalto', inventory_hostname) | list | length == 1
      - groups.get('all', []) | select('equalto', pki_host_local_certificate_remote_validator) | list | length == 1
      - pki_host_local_certificate_remote_validator != inventory_hostname
      - pki_host_local_certificate_request_id is match('^[0-9a-f]{32}$')
      - pki_host_local_certificate_artifact_manifest_sha256 is match('^[0-9a-f]{64}$')
      - pki_host_local_certificate_validation_boundary_sha256 is match('^[0-9a-f]{64}$')
      - pki_host_local_certificate_validation_boundary_target_path | length > 0
      - pki_host_local_certificate_validation_boundary_runner_path | length > 0
      - pki_host_local_certificate_reviewed_ca_target_path | length > 0
      - pki_host_local_certificate_reviewed_ca_runner_path | length > 0
      - pki_host_local_certificate_reviewed_ca_sha256 is match('^[0-9a-f]{64}$')
      - pki_host_local_certificate_reviewed_ca_mode in ['0600', '0644']
      - pki_host_local_certificate_remote_validator is match('^[a-z0-9][a-z0-9.-]{0,252}$')
      - pki_host_local_certificate_endpoint is match('^https://[a-z0-9][a-z0-9.-]*(:[1-9][0-9]{0,4})?/v2/$')
      - pki_host_local_certificate_minimum_remaining_lifetime_seconds > 0
      - pki_host_local_certificate_validation_wait_seconds >= 0
      - pki_host_local_certificate_validation_wait_seconds <= 240
      - pki_host_local_certificate_zot_config_path == '/etc/zot/config.json'
      - pki_host_local_certificate_rollback_seconds is integer
      - pki_host_local_certificate_rollback_seconds is not boolean
      - pki_host_local_certificate_rollback_seconds >= 1209600
      - pki_host_local_certificate_request_ttl_seconds is integer
      - pki_host_local_certificate_request_ttl_seconds == 0
      - pki_host_local_certificate_activation_action == 'finalize'
      - pki_host_local_certificate_activation_result == 'activated'
      - pki_host_local_certificate_interactive_confirmation is sameas true
      - pki_host_local_certificate_deployment_sha256 | length == 0
    fail_msg: Activation requires one target, one distinct reviewed runner, and exact immutable bindings.
- name: Load host-local certificate lifecycle helper preflight
  ansible.builtin.import_tasks: lifecycle_helper.yml

- name: Install fixed direct exchange facade
  ansible.builtin.import_tasks: exchange_helper.yml
  when:
    - pki_host_local_certificate_exchange_mode == 'direct'
    - not ansible_check_mode

- name: Load reviewed runner validator helper preflight
  ansible.builtin.import_tasks: validator_helper.yml

- name: Inspect reviewed validation CA on registry target
  ansible.builtin.stat:
    path: "{{ pki_host_local_certificate_reviewed_ca_target_path }}"
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
  register: pki_host_local_certificate_target_reviewed_ca

- name: Validate reviewed target CA metadata and digest
  ansible.builtin.assert:
    that:
      - pki_host_local_certificate_target_reviewed_ca.stat.exists
      - pki_host_local_certificate_target_reviewed_ca.stat.isreg
      - not pki_host_local_certificate_target_reviewed_ca.stat.islnk
      - pki_host_local_certificate_target_reviewed_ca.stat.uid == 0
      - pki_host_local_certificate_target_reviewed_ca.stat.gid == 0
      - pki_host_local_certificate_target_reviewed_ca.stat.nlink == 1
      - pki_host_local_certificate_target_reviewed_ca.stat.mode == pki_host_local_certificate_reviewed_ca_mode
      - pki_host_local_certificate_target_reviewed_ca.stat.checksum == pki_host_local_certificate_reviewed_ca_sha256
    fail_msg: Reviewed target CA metadata or digest differs from the exact operator contract.

- name: Prepare exact target response ingress
  ansible.builtin.command:
    argv: >-
      {{
        [
          pki_host_local_certificate_lifecycle_helper_path,
          'response-prepare',
          '--state-root', pki_host_local_certificate_state_root,
          '--pending-root', pki_host_local_certificate_pending_root,
          '--versions-root', pki_host_local_certificate_versions_root,
          '--service', pki_host_local_certificate_service,
          '--target', pki_host_local_certificate_target,
          '--request-id', pki_host_local_certificate_request_id
        ]
        + (['--check'] if ansible_check_mode or pki_host_local_certificate_exchange_mode == 'direct' else [])
      }}
  register: pki_host_local_certificate_response_prepare_result
  changed_when: >-
    pki_host_local_certificate_response_prepare_result.rc == 0
    and not ansible_check_mode
    and pki_host_local_certificate_exchange_mode == 'controller-local'
    and (pki_host_local_certificate_response_prepare_result.stdout | from_json).status == 'prepared'
  check_mode: false

- name: Validate exact response preparation metadata
  ansible.builtin.assert:
    that:
      - pki_host_local_certificate_response_prepare_result.stderr | length == 0
      - pki_host_local_certificate_response_prepare.status in ['prepared', 'existing', 'installed', 'would-prepare']
      - >-
        pki_host_local_certificate_exchange_mode == 'controller-local'
        or pki_host_local_certificate_response_prepare.status in ['existing', 'installed']
      - pki_host_local_certificate_response_prepare.request_id == pki_host_local_certificate_request_id
      - >-
        (pki_host_local_certificate_response_prepare.status == 'installed'
         and pki_host_local_certificate_response_prepare.keys() | list | sort == ['ingress_dir', 'request_id', 'status']
         and pki_host_local_certificate_response_prepare.ingress_dir == 'none')
        or
        (pki_host_local_certificate_response_prepare.status == 'would-prepare'
         and ansible_check_mode
         and pki_host_local_certificate_response_prepare.keys() | list | sort == ['ingress_dir', 'request_id', 'status']
         and pki_host_local_certificate_response_prepare.ingress_dir == pki_host_local_certificate_ingress_root)
        or
        (pki_host_local_certificate_response_prepare.status in ['prepared', 'existing']
         and pki_host_local_certificate_response_prepare.keys() | list | sort
           == ['ingress_device', 'ingress_dir', 'ingress_inode', 'request_id', 'status']
         and pki_host_local_certificate_response_prepare.ingress_dir == pki_host_local_certificate_ingress_root
         and pki_host_local_certificate_response_prepare.ingress_device is integer
         and pki_host_local_certificate_response_prepare.ingress_inode is integer)
    fail_msg: Lifecycle helper returned unsafe response preparation metadata.
  vars:
    pki_host_local_certificate_response_prepare: "{{ pki_host_local_certificate_response_prepare_result.stdout | from_json }}"
    pki_host_local_certificate_ingress_root: >-
      {{ pki_host_local_certificate_versions_root }}/.ingress-{{ pki_host_local_certificate_request_id }}

- name: Transfer exact controller response into protected target ingress
  platform_pki_response_ingress:
    exchange_root: "{{ pki_host_local_certificate_controller_exchange_root }}"
    service: "{{ pki_host_local_certificate_service }}"
    request_id: "{{ pki_host_local_certificate_request_id }}"
    ingress_root: "{{ pki_host_local_certificate_versions_root }}/.ingress-{{ pki_host_local_certificate_request_id }}"
    artifact_sha256: "{{ pki_host_local_certificate_artifact_manifest_sha256 }}"
  register: pki_host_local_certificate_response_ingress_result
  when:
    - pki_host_local_certificate_exchange_mode == 'controller-local'
    - not ansible_check_mode
    - (pki_host_local_certificate_response_prepare_result.stdout | from_json).status != 'installed'

- name: Validate exact response ingress metadata
  ansible.builtin.assert:
    that:
      - pki_host_local_certificate_response_ingress_result.status == 'transferred'
      - pki_host_local_certificate_response_ingress_result.request_id == pki_host_local_certificate_request_id
      - pki_host_local_certificate_response_ingress_result.ingress_root == pki_host_local_certificate_versions_root ~ '/.ingress-' ~ pki_host_local_certificate_request_id
      - pki_host_local_certificate_response_ingress_result.artifact_sha256 == pki_host_local_certificate_artifact_manifest_sha256
      - pki_host_local_certificate_response_ingress_result.sha256 is mapping
      - pki_host_local_certificate_response_ingress_result.sha256.keys() | list | sort == pki_host_local_certificate_response_names
      - pki_host_local_certificate_response_ingress_result.sha256.artifact == pki_host_local_certificate_artifact_manifest_sha256
    fail_msg: Response ingress action returned mismatched metadata.
  vars:
    pki_host_local_certificate_response_names:
      - artifact
      - ca-chain.crt
      - fullchain.crt
      - response
      - response.sig
      - tls.crt
  when:
    - pki_host_local_certificate_exchange_mode == 'controller-local'
    - not ansible_check_mode
    - (pki_host_local_certificate_response_prepare_result.stdout | from_json).status != 'installed'

- name: Validate derived exact response ingress digests
  ansible.builtin.assert:
    that:
      - item.value | type_debug == 'str'
      - item.value is match('^[0-9a-f]{64}$')
    fail_msg: Response ingress returned a noncanonical derived SHA-256 digest.
  loop: "{{ pki_host_local_certificate_response_ingress_result.sha256 | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when:
    - pki_host_local_certificate_exchange_mode == 'controller-local'
    - not ansible_check_mode
    - (pki_host_local_certificate_response_prepare_result.stdout | from_json).status != 'installed'

- name: Install or preflight exact immutable certificate version
  ansible.builtin.command:
    argv: >-
      {{
        [
          pki_host_local_certificate_lifecycle_helper_path,
          'response-install',
          '--state-root', pki_host_local_certificate_state_root,
          '--pending-root', pki_host_local_certificate_pending_root,
          '--versions-root', pki_host_local_certificate_versions_root,
          '--service', pki_host_local_certificate_service,
          '--target', pki_host_local_certificate_target,
          '--trust-id', pki_host_local_certificate_trust_id,
          '--request-id', pki_host_local_certificate_request_id,
          '--artifact-sha256', pki_host_local_certificate_artifact_manifest_sha256,
          '--common-name', pki_host_local_certificate_common_name,
          '--minimum-remaining-lifetime-seconds', pki_host_local_certificate_minimum_remaining_lifetime_seconds | string
        ]
        + (pki_host_local_certificate_dns_sans | map('regex_replace', '^(.*)$', '--dns-san=\1') | list)
        + (pki_host_local_certificate_ip_sans | map('regex_replace', '^(.*)$', '--ip-san=\1') | list)
        + (['--check'] if ansible_check_mode else [])
      }}
  register: pki_host_local_certificate_response_install_result
  changed_when: >-
    pki_host_local_certificate_response_install_result.rc == 0
    and not ansible_check_mode
    and (pki_host_local_certificate_response_install_result.stdout | from_json).status == 'installed'
  check_mode: false
  when: (pki_host_local_certificate_response_prepare_result.stdout | from_json).status != 'installed'

- name: Validate exact response installation metadata
  ansible.builtin.assert:
    that:
      - pki_host_local_certificate_response_install_result.stderr | length == 0
      - pki_host_local_certificate_response_install.keys() | list | sort == pki_host_local_certificate_response_install_fields
      - pki_host_local_certificate_response_install.status in ['installed', 'existing', 'would-install']
      - pki_host_local_certificate_response_install.request_id == pki_host_local_certificate_request_id
      - pki_host_local_certificate_response_install.version_path == pki_host_local_certificate_versions_root ~ '/' ~ pki_host_local_certificate_request_id
      - pki_host_local_certificate_response_install.artifact_sha256 == pki_host_local_certificate_artifact_manifest_sha256
      - pki_host_local_certificate_response_install.certificate_sha256 is match('^[0-9a-f]{64}$')
      - pki_host_local_certificate_response_install.certificate_spki_sha256 is match('^[0-9a-f]{64}$')
      - not ansible_check_mode or pki_host_local_certificate_response_install.status in ['existing', 'would-install']
    fail_msg: Lifecycle helper returned unsafe response installation metadata.
  vars:
    pki_host_local_certificate_response_install: "{{ pki_host_local_certificate_response_install_result.stdout | from_json }}"
    pki_host_local_certificate_response_install_fields:
      - artifact_sha256
      - certificate_sha256
      - certificate_spki_sha256
      - request_id
      - status
      - version_path
  when: (pki_host_local_certificate_response_prepare_result.stdout | from_json).status != 'installed'

- name: Preflight exact host-local certificate activation candidate
  ansible.builtin.command:
    argv: >-
      {{
        [
          pki_host_local_certificate_lifecycle_helper_path,
          'activate-start',
          '--state-root', pki_host_local_certificate_state_root,
          '--pending-root', pki_host_local_certificate_pending_root,
          '--versions-root', pki_host_local_certificate_versions_root,
          '--service', pki_host_local_certificate_service,
          '--target', pki_host_local_certificate_target,
          '--zot-config', pki_host_local_certificate_zot_config_path,
          '--trust-id', pki_host_local_certificate_trust_id,
          '--request-id', pki_host_local_certificate_request_id,
          '--artifact-sha256', pki_host_local_certificate_artifact_manifest_sha256,
          '--common-name', pki_host_local_certificate_common_name,
          '--minimum-remaining-lifetime-seconds', pki_host_local_certificate_minimum_remaining_lifetime_seconds | string,
          '--validation-boundary-sha256', pki_host_local_certificate_validation_boundary_sha256,
          '--remote-validator', pki_host_local_certificate_remote_validator,
          '--endpoint', pki_host_local_certificate_endpoint,
          '--validation-boundary', pki_host_local_certificate_validation_boundary_target_path,
          '--reviewed-ca', pki_host_local_certificate_reviewed_ca_target_path,
          '--reviewed-ca-mode', pki_host_local_certificate_reviewed_ca_mode,
          '--rollback-seconds', pki_host_local_certificate_rollback_seconds | string,
          '--check'
        ]
        + (pki_host_local_certificate_dns_sans | map('regex_replace', '^(.*)$', '--dns-san=\1') | list)
        + (pki_host_local_certificate_ip_sans | map('regex_replace', '^(.*)$', '--ip-san=\1') | list)
      }}
  register: pki_host_local_certificate_activation_preflight_result
  changed_when: false
  check_mode: false

- name: Validate exact activation candidate preflight metadata
  ansible.builtin.assert:
    that:
      - pki_host_local_certificate_activation_preflight_result.stderr | length == 0
      - pki_host_local_certificate_activation_preflight.keys() | list | sort == pki_host_local_certificate_activation_preflight_fields
      - pki_host_local_certificate_activation_preflight.status == 'would-activate'
      - pki_host_local_certificate_activation_preflight.request_id == pki_host_local_certificate_request_id
      - pki_host_local_certificate_activation_preflight.artifact_sha256 == pki_host_local_certificate_artifact_manifest_sha256
      - pki_host_local_certificate_activation_preflight.certificate_sha256 is match('^[0-9a-f]{64}$')
      - pki_host_local_certificate_activation_preflight.activation_epoch is integer
      - pki_host_local_certificate_activation_preflight.activation_epoch > 0
      - pki_host_local_certificate_activation_preflight.rollback_deadline_epoch is integer
      - pki_host_local_certificate_activation_preflight.rollback_deadline_epoch >= pki_host_local_certificate_activation_preflight.activation_epoch + pki_host_local_certificate_rollback_seconds
    fail_msg: Activation preflight did not identify one exact safe candidate.
  vars:
    pki_host_local_certificate_activation_preflight: "{{ pki_host_local_certificate_activation_preflight_result.stdout | from_json }}"
    pki_host_local_certificate_activation_preflight_fields:
      - activation_epoch
      - artifact_sha256
      - certificate_sha256
      - request_id
      - rollback_deadline_epoch
      - status

- name: Confirm exact host-local certificate activation mutation
  ansible.builtin.pause:
    prompt: >-
      Candidate certificate SHA-256 is
      {{ (pki_host_local_certificate_activation_preflight_result.stdout | from_json).certificate_sha256 }};
      rollback deadline is
      {{ (pki_host_local_certificate_activation_preflight_result.stdout | from_json).rollback_deadline_epoch }}.
      Type exactly activate {{ pki_host_local_certificate_service }}
      {{ pki_host_local_certificate_request_id }}
      {{ pki_host_local_certificate_artifact_manifest_sha256 }}
  register: pki_host_local_certificate_activation_confirmation
  when: not ansible_check_mode

- name: Require exact host-local certificate activation confirmation
  ansible.builtin.assert:
    that:
      - >-
        pki_host_local_certificate_activation_confirmation.user_input
        == 'activate ' ~ pki_host_local_certificate_service ~ ' '
           ~ pki_host_local_certificate_request_id ~ ' '
           ~ pki_host_local_certificate_artifact_manifest_sha256
    fail_msg: Exact interactive activation confirmation did not match.
  when: not ansible_check_mode

- name: Activate, validate, and finalize exact host-local certificate
  when: not ansible_check_mode
  block:
    - name: Start exact host-local certificate activation
      ansible.builtin.command:
        argv: >-
          {{
            [
              pki_host_local_certificate_lifecycle_helper_path,
              'activate-start',
              '--state-root', pki_host_local_certificate_state_root,
              '--pending-root', pki_host_local_certificate_pending_root,
              '--versions-root', pki_host_local_certificate_versions_root,
              '--service', pki_host_local_certificate_service,
              '--target', pki_host_local_certificate_target,
              '--zot-config', pki_host_local_certificate_zot_config_path,
              '--trust-id', pki_host_local_certificate_trust_id,
              '--request-id', pki_host_local_certificate_request_id,
              '--artifact-sha256', pki_host_local_certificate_artifact_manifest_sha256,
              '--common-name', pki_host_local_certificate_common_name,
              '--minimum-remaining-lifetime-seconds', pki_host_local_certificate_minimum_remaining_lifetime_seconds | string,
              '--validation-boundary-sha256', pki_host_local_certificate_validation_boundary_sha256,
              '--remote-validator', pki_host_local_certificate_remote_validator,
              '--endpoint', pki_host_local_certificate_endpoint,
              '--validation-boundary', pki_host_local_certificate_validation_boundary_target_path,
              '--reviewed-ca', pki_host_local_certificate_reviewed_ca_target_path,
              '--reviewed-ca-mode', pki_host_local_certificate_reviewed_ca_mode,
              '--rollback-seconds', pki_host_local_certificate_rollback_seconds | string
            ]
            + (pki_host_local_certificate_dns_sans | map('regex_replace', '^(.*)$', '--dns-san=\1') | list)
            + (pki_host_local_certificate_ip_sans | map('regex_replace', '^(.*)$', '--ip-san=\1') | list)
          }}
      register: pki_host_local_certificate_activation_start_result
      changed_when: >-
        pki_host_local_certificate_activation_start_result.rc == 0
        and (pki_host_local_certificate_activation_start_result.stdout | from_json).status == 'local-validated'
      check_mode: false

    - name: Validate exact local activation metadata
      ansible.builtin.assert:
        that:
          - pki_host_local_certificate_activation_start_result.stderr | length == 0
          - pki_host_local_certificate_activation_start.keys() | list | sort == pki_host_local_certificate_activation_start_fields
          - pki_host_local_certificate_activation_start.status == 'local-validated'
          - pki_host_local_certificate_activation_start.request_id == pki_host_local_certificate_request_id
          - pki_host_local_certificate_activation_start.artifact_sha256 == pki_host_local_certificate_artifact_manifest_sha256
          - pki_host_local_certificate_activation_start.certificate_sha256 == pki_host_local_certificate_activation_preflight.certificate_sha256
          - pki_host_local_certificate_activation_start.served_certificate_sha256 == pki_host_local_certificate_activation_start.certificate_sha256
          - pki_host_local_certificate_activation_start.served_intermediate_sha256 is match('^[0-9a-f]{64}$')
          - pki_host_local_certificate_activation_start.activation_epoch is integer
          - pki_host_local_certificate_activation_start.rollback_deadline_epoch is integer
          - pki_host_local_certificate_activation_start.rollback_deadline_epoch >= pki_host_local_certificate_activation_start.activation_epoch + pki_host_local_certificate_rollback_seconds
        fail_msg: Local activation result does not bind the exact preflight candidate.
      vars:
        pki_host_local_certificate_activation_start: "{{ pki_host_local_certificate_activation_start_result.stdout | from_json }}"
        pki_host_local_certificate_activation_preflight: "{{ pki_host_local_certificate_activation_preflight_result.stdout | from_json }}"
        pki_host_local_certificate_activation_start_fields:
          - activation_epoch
          - artifact_sha256
          - certificate_sha256
          - request_id
          - rollback_deadline_epoch
          - served_certificate_sha256
          - served_intermediate_sha256
          - status

    - name: Wait bounded interval before external Zot validation
      ansible.builtin.pause:
        seconds: "{{ pki_host_local_certificate_validation_wait_seconds }}"
      when: pki_host_local_certificate_validation_wait_seconds > 0

    - name: Validate exact active Zot endpoint from reviewed runner
      ansible.builtin.command:
        argv:
          - "{{ pki_host_local_certificate_validator_helper_path }}"
          - --service
          - "{{ pki_host_local_certificate_service }}"
          - --target
          - "{{ pki_host_local_certificate_target }}"
          - --request-id
          - "{{ pki_host_local_certificate_request_id }}"
          - --artifact-sha256
          - "{{ pki_host_local_certificate_artifact_manifest_sha256 }}"
          - --validation-boundary
          - "{{ pki_host_local_certificate_validation_boundary_runner_path }}"
          - --validation-boundary-sha256
          - "{{ pki_host_local_certificate_validation_boundary_sha256 }}"
          - --remote-validator
          - "{{ pki_host_local_certificate_remote_validator }}"
          - --endpoint
          - "{{ pki_host_local_certificate_endpoint }}"
          - --reviewed-ca
          - "{{ pki_host_local_certificate_reviewed_ca_runner_path }}"
          - --reviewed-ca-sha256
          - "{{ pki_host_local_certificate_reviewed_ca_sha256 }}"
          - --expected-served-leaf-sha256
          - "{{ (pki_host_local_certificate_activation_start_result.stdout | from_json).served_certificate_sha256 }}"
          - --expected-served-intermediate-sha256
          - "{{ (pki_host_local_certificate_activation_start_result.stdout | from_json).served_intermediate_sha256 }}"
      delegate_to: "{{ pki_host_local_certificate_remote_validator }}"
      register: pki_host_local_certificate_validator_result
      changed_when: false
      check_mode: false

    - name: Load exact runner observation validation
      ansible.builtin.import_tasks: validate_validator_result.yml
      vars:
        pki_host_local_certificate_validator_expected_leaf_sha256: >-
          {{ (pki_host_local_certificate_activation_start_result.stdout | from_json).served_certificate_sha256 }}
        pki_host_local_certificate_validator_expected_intermediate_sha256: >-
          {{ (pki_host_local_certificate_activation_start_result.stdout | from_json).served_intermediate_sha256 }}

    - name: Create private transient observation directory
      ansible.builtin.file:
        path: /run/platform-pki-host-local
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Copy only canonical public runner observation to target
      ansible.builtin.copy:
        content: "{{ pki_host_local_certificate_validator_result.stdout }}\n"
        dest: "/run/platform-pki-host-local/{{ pki_host_local_certificate_request_id }}.observation"
        owner: root
        group: root
        mode: "0600"

    - name: Finalize exact activated host-local certificate evidence
      ansible.builtin.command:
        argv: >-
          {{
            [
              pki_host_local_certificate_lifecycle_helper_path,
              'activate-finish',
              '--state-root', pki_host_local_certificate_state_root,
              '--pending-root', pki_host_local_certificate_pending_root,
              '--versions-root', pki_host_local_certificate_versions_root,
              '--service', pki_host_local_certificate_service,
              '--target', pki_host_local_certificate_target,
              '--zot-config', pki_host_local_certificate_zot_config_path,
              '--trust-id', pki_host_local_certificate_trust_id,
              '--request-id', pki_host_local_certificate_request_id,
              '--artifact-sha256', pki_host_local_certificate_artifact_manifest_sha256,
              '--common-name', pki_host_local_certificate_common_name,
              '--minimum-remaining-lifetime-seconds', pki_host_local_certificate_minimum_remaining_lifetime_seconds | string,
              '--validation-boundary-sha256', pki_host_local_certificate_validation_boundary_sha256,
              '--remote-validator', pki_host_local_certificate_remote_validator,
              '--endpoint', pki_host_local_certificate_endpoint,
              '--validation-boundary', pki_host_local_certificate_validation_boundary_target_path,
              '--observation-file', '/run/platform-pki-host-local/' ~ pki_host_local_certificate_request_id ~ '.observation',
              '--served-intermediate-sha256', (pki_host_local_certificate_activation_start_result.stdout | from_json).served_intermediate_sha256,
              '--deployment-signing-key', pki_host_local_certificate_deployment_signing_key_path,
              '--reviewed-ca', pki_host_local_certificate_reviewed_ca_target_path,
              '--reviewed-ca-mode', pki_host_local_certificate_reviewed_ca_mode,
              '--rollback-seconds', pki_host_local_certificate_rollback_seconds | string,
              '--action', pki_host_local_certificate_activation_action,
              '--result', pki_host_local_certificate_activation_result
            ]
            + (pki_host_local_certificate_dns_sans | map('regex_replace', '^(.*)$', '--dns-san=\1') | list)
            + (pki_host_local_certificate_ip_sans | map('regex_replace', '^(.*)$', '--ip-san=\1') | list)
          }}
      register: pki_host_local_certificate_activation_finish_result
      changed_when: >-
        pki_host_local_certificate_activation_finish_result.rc == 0
        and (pki_host_local_certificate_activation_finish_result.stdout | from_json).status == 'evidence-published'
      check_mode: false

    - name: Validate exact activation finalization metadata
      ansible.builtin.assert:
        that:
          - pki_host_local_certificate_activation_finish_result.stderr | length == 0
          - pki_host_local_certificate_activation_finish.keys() | list | sort == pki_host_local_certificate_activation_finish_fields
          - pki_host_local_certificate_activation_finish.status in ['evidence-published', 'evidence-existing']
          - pki_host_local_certificate_activation_finish.request_id == pki_host_local_certificate_request_id
          - pki_host_local_certificate_activation_finish.certificate_sha256 == (pki_host_local_certificate_activation_start_result.stdout | from_json).certificate_sha256
          - pki_host_local_certificate_activation_finish.deployment_sha256 is match('^[0-9a-f]{64}$')
          - >-
            pki_host_local_certificate_activation_finish.evidence_path
            == pki_host_local_certificate_state_root ~ '/evidence/'
               ~ pki_host_local_certificate_request_id ~ '/'
               ~ pki_host_local_certificate_activation_finish.deployment_sha256
        success_msg: >-
          request={{ pki_host_local_certificate_request_id }}
          artifact={{ pki_host_local_certificate_artifact_manifest_sha256 }}
          deployment={{ pki_host_local_certificate_activation_finish.deployment_sha256 }}
          certificate={{ pki_host_local_certificate_activation_finish.certificate_sha256 }}
          evidence_path={{ pki_host_local_certificate_activation_finish.evidence_path }}
          status=activated-and-validated
        fail_msg: Activation finalization returned mismatched evidence metadata.
      vars:
        pki_host_local_certificate_activation_finish: "{{ pki_host_local_certificate_activation_finish_result.stdout | from_json }}"
        pki_host_local_certificate_activation_finish_fields:
          - certificate_sha256
          - deployment_sha256
          - evidence_path
          - request_id
          - status

  rescue:
    - name: Recover exact interrupted host-local certificate activation
      ansible.builtin.command:
        argv:
          - "{{ pki_host_local_certificate_lifecycle_helper_path }}"
          - recover
          - --state-root
          - "{{ pki_host_local_certificate_state_root }}"
          - --pending-root
          - "{{ pki_host_local_certificate_pending_root }}"
          - --versions-root
          - "{{ pki_host_local_certificate_versions_root }}"
          - --service
          - "{{ pki_host_local_certificate_service }}"
          - --target
          - "{{ pki_host_local_certificate_target }}"
          - --zot-config
          - "{{ pki_host_local_certificate_zot_config_path }}"
          - --request-id
          - "{{ pki_host_local_certificate_request_id }}"
          - --artifact-sha256
          - "{{ pki_host_local_certificate_artifact_manifest_sha256 }}"
      register: pki_host_local_certificate_activation_recovery_result
      changed_when: >-
        pki_host_local_certificate_activation_recovery_result.rc == 0
        and (pki_host_local_certificate_activation_recovery_result.stdout | from_json).status != 'not-required'
      check_mode: false

    - name: Validate exact activation recovery metadata
      ansible.builtin.assert:
        that:
          - pki_host_local_certificate_activation_recovery_result.stderr | length == 0
          - pki_host_local_certificate_activation_recovery.status in ['restored', 'evidence-completed', 'abandonment-evidence-required', 'not-required']
          - >-
            pki_host_local_certificate_activation_recovery.status == 'not-required'
            or (
              pki_host_local_certificate_activation_recovery.request_id == pki_host_local_certificate_request_id
              and pki_host_local_certificate_activation_recovery.artifact_sha256 == pki_host_local_certificate_artifact_manifest_sha256
            )
        fail_msg: Exact activation recovery returned inconsistent metadata.
      vars:
        pki_host_local_certificate_activation_recovery: "{{ pki_host_local_certificate_activation_recovery_result.stdout | from_json }}"

    - name: Fail activation after exact recovery
      ansible.builtin.fail:
        msg: Host-local certificate activation failed; exact recovery completed.

  always:
    - name: Remove only transient host-local certificate observation
      ansible.builtin.file:
        path: "/run/platform-pki-host-local/{{ pki_host_local_certificate_request_id }}.observation"
        state: absent
      when: not ansible_check_mode
