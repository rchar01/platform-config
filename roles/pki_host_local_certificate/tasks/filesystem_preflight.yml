---
- name: Inspect target-local filesystem exchange ancestors
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop: "{{ pki_host_local_certificate_filesystem_ancestor_paths }}"
  register: pki_host_local_certificate_filesystem_ancestor_stats
  vars:
    pki_host_local_certificate_filesystem_ancestor_paths: >-
      {%- set namespace = namespace(path='', paths=['/']) -%}
      {%- for component in
            pki_host_local_certificate_filesystem_exchange_root.split('/')[1:-1] -%}
      {%- set namespace.path = namespace.path ~ '/' ~ component -%}
      {%- set namespace.paths = namespace.paths + [namespace.path] -%}
      {%- endfor -%}
      {{ namespace.paths }}

- name: Require protected target-local filesystem exchange ancestors
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isdir
      - not item.stat.islnk
      - item.stat.uid == 0
      - item.stat.gid == 0
      - item.stat.mode is match('^[0-7][0-7][0145][0145]$')
    fail_msg: >-
      Filesystem exchange ancestors must be existing root-owned directories
      without group or other write permission.
  loop: "{{ pki_host_local_certificate_filesystem_ancestor_stats.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Resolve target-local filesystem exchange root
  ansible.builtin.command:
    argv:
      - /usr/bin/realpath
      - -m
      - --
      - "{{ pki_host_local_certificate_filesystem_exchange_root }}"
  register: pki_host_local_certificate_filesystem_realpath
  changed_when: false
  check_mode: false

- name: Require canonical target-local filesystem exchange root
  ansible.builtin.assert:
    that:
      - pki_host_local_certificate_filesystem_realpath.stderr | length == 0
      - >-
        pki_host_local_certificate_filesystem_realpath.stdout
        == pki_host_local_certificate_filesystem_exchange_root
    fail_msg: Filesystem exchange root is noncanonical or has a symlinked ancestor.

- name: Inspect target-local filesystem exchange parents
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop: "{{ pki_host_local_certificate_filesystem_parent_paths }}"
  register: pki_host_local_certificate_filesystem_parent_stats
  vars:
    pki_host_local_certificate_filesystem_parent_paths:
      - "{{ pki_host_local_certificate_filesystem_exchange_root }}"
      - >-
        {{ pki_host_local_certificate_filesystem_exchange_root }}/{{ pki_host_local_certificate_service }}
      - >-
        {{ pki_host_local_certificate_filesystem_exchange_root }}/{{ pki_host_local_certificate_service }}/requests
      - >-
        {{ pki_host_local_certificate_filesystem_exchange_root }}/{{ pki_host_local_certificate_service }}/responses

- name: Validate existing target-local filesystem exchange parents
  ansible.builtin.assert:
    that:
      - >-
        not item.stat.exists
        or
        (item.stat.isdir
         and not item.stat.islnk
         and item.stat.uid == 0
         and item.stat.gid == 0
         and item.stat.mode == '0755')
    fail_msg: Existing filesystem exchange parent metadata is unsafe.
  loop: "{{ pki_host_local_certificate_filesystem_parent_stats.results }}"
  loop_control:
    label: "{{ item.item }}"
