---
- name: Validate host-local certificate exchange helper contract
  ansible.builtin.assert:
    that:
      - pki_host_local_certificate_service is match('^[a-z0-9][a-z0-9-]{0,62}$')
      - pki_host_local_certificate_target is match('^[a-z0-9][a-z0-9.-]{0,252}$')
      - pki_host_local_certificate_trust_id is match('^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$')
      - pki_host_local_certificate_trust_id not in ['latest', 'current']
      - pki_host_local_certificate_lifecycle_helper_path == '/usr/local/libexec/platform-pki-host-local-lifecycle'
      - pki_host_local_certificate_exchange_helper_path == '/usr/local/libexec/platform-pki-host-local-exchange'
      - pki_host_local_certificate_exchange_config_path == '/etc/platform-config/pki-host-local-exchange.json'
      - pki_host_local_certificate_zot_config_path == '/etc/zot/config.json'
      - item is match('^/[A-Za-z0-9_@%+=:,.-]+(/[A-Za-z0-9_@%+=:,.-]+)*\Z')
      - item is not search('(^|/)\.\.?(/|$)')
      - item is not search('(^|/)(latest|current)(/|$)')
    fail_msg: Host-local exchange installation requires fixed canonical lifecycle bindings.
  loop:
    - "{{ pki_host_local_certificate_state_root }}"
    - "{{ pki_host_local_certificate_pending_root }}"
    - "{{ pki_host_local_certificate_versions_root }}"
    - "{{ pki_host_local_certificate_exchange_spool_root }}"

- name: Validate disjoint host-local certificate exchange spool
  ansible.builtin.assert:
    that:
      - not pki_host_local_certificate_exchange_spool_root.startswith(item ~ '/')
      - not item.startswith(pki_host_local_certificate_exchange_spool_root ~ '/')
      - pki_host_local_certificate_exchange_spool_root != item
    fail_msg: Host-local exchange spool must be disjoint from every lifecycle root.
  loop:
    - "{{ pki_host_local_certificate_state_root }}"
    - "{{ pki_host_local_certificate_pending_root }}"
    - "{{ pki_host_local_certificate_versions_root }}"

- name: Create fixed host-local certificate exchange directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ pki_host_local_certificate_exchange_helper_path | dirname }}"
      mode: "0755"
    - path: "{{ pki_host_local_certificate_exchange_config_path | dirname }}"
      mode: "0755"
    - path: "{{ pki_host_local_certificate_exchange_spool_root }}"
      mode: "0700"
  loop_control:
    label: "{{ item.path }}"

- name: Install host-local certificate exchange facade
  ansible.builtin.copy:
    src: platform-pki-host-local-exchange
    dest: "{{ pki_host_local_certificate_exchange_helper_path }}"
    owner: root
    group: root
    mode: "0755"

- name: Install fixed host-local certificate exchange config
  ansible.builtin.copy:
    content: "{{ pki_host_local_certificate_exchange_config | to_json(sort_keys=true, separators=[',', ':']) }}\n"
    dest: "{{ pki_host_local_certificate_exchange_config_path }}"
    owner: root
    group: root
    mode: "0600"
  vars:
    pki_host_local_certificate_exchange_config:
      lifecycle_helper: "{{ pki_host_local_certificate_lifecycle_helper_path }}"
      pending_root: "{{ pki_host_local_certificate_pending_root }}"
      schema: 1
      service: "{{ pki_host_local_certificate_service }}"
      spool_root: "{{ pki_host_local_certificate_exchange_spool_root }}"
      state_root: "{{ pki_host_local_certificate_state_root }}"
      target: "{{ pki_host_local_certificate_target }}"
      trust_id: "{{ pki_host_local_certificate_trust_id }}"
      versions_root: "{{ pki_host_local_certificate_versions_root }}"
      zot_config: "{{ pki_host_local_certificate_zot_config_path }}"
