---
- name: Load host-local certificate request helper preflight
  ansible.builtin.import_tasks: request_helper.yml

- name: Create or validate the target-local certificate request
  ansible.builtin.command:
    argv: >-
      {{
        [
          pki_host_local_certificate_request_helper_path,
          'request',
          '--service', pki_host_local_certificate_service,
          '--target', pki_host_local_certificate_target,
          '--requester-principal', pki_host_local_certificate_requester_principal,
          '--operation', pki_host_local_certificate_operation,
          '--profile', pki_host_local_certificate_profile,
          '--inventory-sha256', pki_host_local_certificate_inventory_sha256,
          '--current-cert-sha256', pki_host_local_certificate_current_cert_sha256,
          '--common-name', pki_host_local_certificate_common_name,
          '--response-principal', pki_host_local_certificate_response_principal,
          '--request-ttl-seconds', pki_host_local_certificate_request_ttl_seconds | string,
          '--request-signing-key', pki_host_local_certificate_request_signing_key_path,
          '--request-namespace', pki_host_local_certificate_request_namespace,
          '--state-root', pki_host_local_certificate_state_root,
          '--pending-root', pki_host_local_certificate_pending_root,
          '--trust-binding', 'policy', pki_host_local_certificate_trust_paths['policy'], pki_host_local_certificate_trust_sha256['policy'],
          '--trust-binding', 'requesters.allowed_signers', pki_host_local_certificate_trust_paths['requesters.allowed_signers'], pki_host_local_certificate_trust_sha256['requesters.allowed_signers'],
          '--trust-binding', 'approvers.allowed_signers', pki_host_local_certificate_trust_paths['approvers.allowed_signers'], pki_host_local_certificate_trust_sha256['approvers.allowed_signers'],
          '--trust-binding', 'responses.allowed_signers', pki_host_local_certificate_trust_paths['responses.allowed_signers'], pki_host_local_certificate_trust_sha256['responses.allowed_signers'],
          '--trust-binding', 'deployers.allowed_signers', pki_host_local_certificate_trust_paths['deployers.allowed_signers'], pki_host_local_certificate_trust_sha256['deployers.allowed_signers']
        ]
        + (pki_host_local_certificate_dns_sans | map('regex_replace', '^(.*)$', '--dns-san=\1') | list)
        + (pki_host_local_certificate_ip_sans | map('regex_replace', '^(.*)$', '--ip-san=\1') | list)
        + (
          ['--current-cert-path', pki_host_local_certificate_current_cert_path]
          if pki_host_local_certificate_current_cert_path | length > 0
          else []
        )
        + (['--check'] if ansible_check_mode else [])
      }}
  register: pki_host_local_certificate_request_result
  check_mode: false
  changed_when: >-
    pki_host_local_certificate_request_result.rc == 0
    and (pki_host_local_certificate_request_result.stdout | from_json).status == 'created'

- name: Validate safe request helper result
  ansible.builtin.assert:
    that:
      - >-
        (
          ansible_check_mode
          and (pki_host_local_certificate_request_result.stdout | from_json).status in ['existing', 'would-create']
        )
        or (
          not ansible_check_mode
          and (pki_host_local_certificate_request_result.stdout | from_json).status in ['created', 'existing']
        )
      - >-
        (
          (pki_host_local_certificate_request_result.stdout | from_json).status == 'would-create'
          and ((pki_host_local_certificate_request_result.stdout | from_json).keys() | list | sort)
            == ['pending_dir', 'status']
          and (pki_host_local_certificate_request_result.stdout | from_json).pending_dir
            == pki_host_local_certificate_pending_root
        )
        or (
          (pki_host_local_certificate_request_result.stdout | from_json).keys() | list | sort
          == pki_host_local_certificate_request_result_fields
          and (pki_host_local_certificate_request_result.stdout | from_json).request_id is match('^[0-9a-f]{32}$')
          and (pki_host_local_certificate_request_result.stdout | from_json).request_sha256 is match('^[0-9a-f]{64}$')
          and (pki_host_local_certificate_request_result.stdout | from_json).csr_sha256 is match('^[0-9a-f]{64}$')
          and (pki_host_local_certificate_request_result.stdout | from_json).csr_spki_sha256 is match('^[0-9a-f]{64}$')
          and (pki_host_local_certificate_request_result.stdout | from_json).pending_dir
            == pki_host_local_certificate_pending_root ~ '/'
            ~ (pki_host_local_certificate_request_result.stdout | from_json).request_id
        )
    fail_msg: The request helper returned an unsafe or incomplete public result.
  vars:
    pki_host_local_certificate_request_result_fields:
      - csr_sha256
      - csr_spki_sha256
      - pending_dir
      - request_id
      - request_sha256
      - status
