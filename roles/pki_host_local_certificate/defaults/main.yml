---
pki_host_local_certificate_service: ""
pki_host_local_certificate_target: ""
pki_host_local_certificate_operation: ""
pki_host_local_certificate_profile: server-p384-sha384-v1
pki_host_local_certificate_inventory_sha256: ""
pki_host_local_certificate_current_cert_sha256: ""
pki_host_local_certificate_current_cert_path: ""
pki_host_local_certificate_requester_principal: ""
pki_host_local_certificate_response_principal: ""

pki_host_local_certificate_common_name: ""
pki_host_local_certificate_dns_sans: []
pki_host_local_certificate_ip_sans: []
pki_host_local_certificate_validity_days: 0
pki_host_local_certificate_request_ttl_seconds: 3600

pki_host_local_certificate_request_signing_key_path: /etc/ssh/ssh_host_ed25519_key
pki_host_local_certificate_request_namespace: platform-pki-csr-request-v2

pki_host_local_certificate_trust_paths: {}
pki_host_local_certificate_trust_sha256: {}
