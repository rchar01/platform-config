---
- name: Validate monitoring HAProxy frontend contract fixture
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    monitoring_haproxy_contract_ready: >-
      {{ monitoring_haproxy_test_contract_ready | default(true) }}
    monitoring_haproxy_enabled: >-
      {{ monitoring_haproxy_test_enabled | default(true) }}
    monitoring_haproxy_service_enabled: >-
      {{ monitoring_haproxy_test_service_enabled | default(false) }}
    monitoring_haproxy_service_state: >-
      {{ monitoring_haproxy_test_service_state | default('stopped') }}
    monitoring_haproxy_package_nevra: >-
      {{ monitoring_haproxy_test_package_nevra | default('haproxy-0:3.0.5-6.el10_2.1.x86_64') }}
    monitoring_haproxy_https_port: >-
      {{ monitoring_haproxy_test_https_port | default(443) }}
    monitoring_haproxy_postgresql_frontend_port: >-
      {{ monitoring_haproxy_test_postgresql_frontend_port | default(5432) }}
    monitoring_haproxy_metrics_bind_address: >-
      {{ monitoring_haproxy_test_metrics_address | default('192.0.2.83') }}
    monitoring_haproxy_metrics_port: >-
      {{ monitoring_haproxy_test_metrics_port | default(8405) }}
    monitoring_haproxy_grafana_dns: grafana.monitoring.example.invalid
    monitoring_haproxy_loki_dns: loki.monitoring.example.invalid
    monitoring_haproxy_mimir_dns: mimir.monitoring.example.invalid
    monitoring_haproxy_s3_dns: s3.monitoring.example.invalid
    monitoring_haproxy_alertmanager_dns: >-
      {{ monitoring_haproxy_test_alertmanager_dns | default('alertmanager.monitoring.example.invalid') }}
    monitoring_haproxy_postgresql_dns: postgres.monitoring.example.invalid
    monitoring_haproxy_frontend_pem_src: /srv/pki/monitoring/frontend.pem
    monitoring_haproxy_client_ca_src: /srv/pki/monitoring/client-ca.crt
    monitoring_haproxy_client_crl_src: /srv/pki/monitoring/client-ca.crl
    monitoring_haproxy_backend_ca_src: /srv/pki/monitoring/backend-ca.crt
    monitoring_haproxy_backend_client_pem_src: /srv/pki/monitoring/backend-client.pem
    monitoring_haproxy_tenant: platform-dev
    monitoring_haproxy_identity_roles:
      - subject_dn: >-
          {{ monitoring_haproxy_test_writer_dn | default('CN=alloy-loki,OU=telemetry,O=platform,C=XX') }}
        role: >-
          {{ monitoring_haproxy_test_writer_role | default('alloy_loki_writer') }}
      - subject_dn: CN=alloy-mimir,OU=telemetry,O=platform,C=XX
        role: alloy_mimir_writer
      - subject_dn: CN=garage-s3,OU=storage,O=platform,C=XX
        role: garage_s3
      - subject_dn: CN=grafana-alertmanager,OU=telemetry,O=platform,C=XX
        role: grafana_alertmanager
      - subject_dn: CN=grafana-browser,OU=users,O=platform,C=XX
        role: grafana_browser
      - subject_dn: CN=grafana-loki,OU=telemetry,O=platform,C=XX
        role: grafana_loki_query
      - subject_dn: CN=grafana-mimir,OU=telemetry,O=platform,C=XX
        role: grafana_mimir_query
      - subject_dn: CN=monitoring-operator,OU=operators,O=platform,C=XX
        role: operator
      - subject_dn: CN=monitoring-probe,OU=observers,O=platform,C=XX
        role: >-
          {{ monitoring_haproxy_test_probe_role | default('monitoring_probe') }}
      - subject_dn: CN=monitoring-s3-probe,OU=observers,O=platform,C=XX
        role: >-
          {{ monitoring_haproxy_test_s3_probe_role | default('monitoring_s3_probe') }}
    monitoring_haproxy_loki_writer_routes:
      - method: POST
        path: /loki/api/v1/push
    monitoring_haproxy_loki_query_routes:
      - method: GET
        path: >-
          {{ monitoring_haproxy_test_loki_query_path | default('/loki/api/v1/query_range') }}
    monitoring_haproxy_mimir_writer_routes:
      - method: POST
        path: /api/v1/push
    monitoring_haproxy_mimir_query_routes:
      - method: GET
        path: /prometheus/api/v1/query
    monitoring_haproxy_alertmanager_routes: >-
      {{ monitoring_haproxy_test_alertmanager_routes | default([
        {'method': 'GET', 'path': '/alertmanager/api/v2/alerts'}
      ]) }}
    monitoring_haproxy_operator_routes: >-
      {{ monitoring_haproxy_test_operator_routes | default([
        {'service': 'mimir', 'method': 'GET', 'path': '/-/ready'}
      ]) }}
    monitoring_haproxy_https_allowed_sources: >-
      {{ monitoring_haproxy_test_https_sources | default([
        '198.51.100.0/24', '203.0.113.0/24'
      ]) }}
    monitoring_haproxy_postgresql_allowed_sources:
      - 198.51.100.32/27
    monitoring_haproxy_metrics_allowed_sources:
      - 192.0.2.128/25
    monitoring_haproxy_operator_allowed_sources: >-
      {{ monitoring_haproxy_test_operator_sources | default(['203.0.113.0/28']) }}
    monitoring_haproxy_fixture_targets:
      - name: monitoring-1
        address: 192.0.2.64
        tls_server_name: monitoring-1.backend.example.invalid
      - name: monitoring-2
        address: 192.0.2.75
        tls_server_name: monitoring-2.backend.example.invalid
      - name: monitoring-3
        address: 192.0.2.76
        tls_server_name: monitoring-3.backend.example.invalid
    monitoring_haproxy_fixture_s3_targets:
      - name: local-garage
        address: 127.0.0.1
    monitoring_haproxy_backends: >-
      {{ monitoring_haproxy_test_backends | default({
        'grafana': {'port': 13001, 'health_port': 13001, 'targets': monitoring_haproxy_fixture_targets},
        'loki': {'port': 13002, 'health_port': 13002, 'targets': monitoring_haproxy_fixture_targets},
        'mimir': {'port': 13003, 'health_port': 13003, 'targets': monitoring_haproxy_fixture_targets},
        'alertmanager': {'port': 13003, 'health_port': 13003, 'targets': monitoring_haproxy_fixture_targets},
        's3': {'port': 13004, 'health_port': 13006, 'targets': monitoring_haproxy_fixture_s3_targets},
        'postgresql': {'port': 13005, 'health_port': 13007, 'targets': monitoring_haproxy_fixture_targets}
      }) }}
  roles:
    - role: monitoring_haproxy
