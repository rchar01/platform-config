---
- name: Exercise GitLab Runner Podman socket mode on disposable Rocky systemd
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    gitlab_runner_test_docker_enabled: true
    gitlab_runner_test_emulate_registration: false
    podman_host_package_nevra: podman-7:5.8.2-5.el10_2.x86_64
    podman_host_socket_enabled: "{{ gitlab_runner_test_docker_enabled }}"
    gitlab_runner_image: >-
      docker.io/gitlab/gitlab-runner:alpine-v18.11.3@sha256:904cc94dc8417152685f62c4c1a1add19ad2d82947ca7aead844895e16128f1e
    gitlab_runner_gitlab_url: https://127.0.0.1:1
    gitlab_runner_token_src: /tmp/gitlab-runner-test.token
    gitlab_runner_name: disposable-docker-runner
    gitlab_runner_executor: "{{ 'docker' if gitlab_runner_test_docker_enabled else 'shell' }}"
    gitlab_runner_podman_socket_enabled: "{{ gitlab_runner_test_docker_enabled }}"
    gitlab_runner_docker_image: >-
      docker.io/library/alpine:3.22.1@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
  pre_tasks:
    - name: Preflight GitLab Runner before Podman socket changes
      ansible.builtin.include_role:
        name: gitlab_runner
        tasks_from: preflight
  tasks:
    - name: Converge Podman host and GitLab Runner transactionally
      block:
        - name: Configure Podman host
          ansible.builtin.include_role:
            name: podman_host

        - name: Emulate completed fresh GitLab Runner registration
          ansible.builtin.copy:
            content: |
              concurrent = 1
              [[runners]]
                name = "disposable-docker-runner"
                url = "https://127.0.0.1:1"
                token = "glrt-disposable-invalid"
                executor = "docker"
                [runners.feature_flags]
                  FF_NETWORK_PER_BUILD = true
                [runners.docker]
                  host = "unix:///run/podman/podman.sock"
                  image = "docker.io/library/alpine:3.22.1@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1"
                  privileged = false
                  services_privileged = false
                  pull_policy = "always"
                  volumes = ["/cache"]
            dest: /etc/gitlab-runner/config.toml
            owner: root
            group: root
            mode: "0600"
          when: gitlab_runner_test_emulate_registration | bool

        - name: Configure GitLab Runner
          ansible.builtin.include_role:
            name: gitlab_runner
          vars:
            gitlab_runner_defer_backup_cleanup: true

        - name: Run GitLab Runner handlers inside transaction
          ansible.builtin.meta: flush_handlers

        - name: Remove successful migration backup
          ansible.builtin.file:
            path: "{{ gitlab_runner_config_backup.path }}"
            state: absent
          when: gitlab_runner_config_backup_ready | default(false) | bool
          no_log: true
      rescue:
        - name: Roll back failed GitLab Runner convergence
          ansible.builtin.include_role:
            name: gitlab_runner
            tasks_from: rollback
          when: not gitlab_runner_rollback_complete | default(false) | bool

        - name: Report failed GitLab Runner convergence
          ansible.builtin.fail:
            msg: >-
              GitLab Runner convergence failed. Transactional rollback was
              attempted; recovery artifacts were retained if any step failed.
