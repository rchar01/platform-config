---
- name: Exercise sandboxed Zot TLS custody helper migration
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Resolve sandboxed Zot TLS custody
      ansible.builtin.include_role:
        name: zot_registry
        tasks_from: resolve_tls_custody

    - name: Require authenticated custody after helper migration
      ansible.builtin.assert:
        that:
          - zot_registry_tls_effective_custody == 'host-local'
          - zot_registry_tls_effective_cert_path == zot_registry_test_expected_cert_path
          - zot_registry_tls_effective_key_path == zot_registry_test_expected_key_path
          - zot_registry_tls_custody_result.rc == 0
          - zot_registry_tls_custody_result.stderr == ''
          - (zot_registry_tls_custody_result.stdout | from_json).custody == 'host-local'
          - (zot_registry_tls_custody_result.stdout | from_json).request_id == zot_registry_test_request_id
