---
- name: Exercise registry host-local PKI boundary
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    pki_boundary_lifecycle_helper_path: /usr/bin/true
    pki_host_local_certificate_service: registry-dev
    pki_host_local_certificate_target: localhost
    pki_host_local_certificate_operation: migrate
    pki_host_local_certificate_inventory_sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    pki_host_local_certificate_current_cert_sha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    pki_host_local_certificate_current_cert_path: /etc/zot/tls/tls.crt
    pki_host_local_certificate_requester_principal: localhost
    pki_host_local_certificate_response_principal: offline-response
    pki_host_local_certificate_common_name: registry.dev
    pki_host_local_certificate_dns_sans:
      - registry.dev
      - localhost
    pki_host_local_certificate_ip_sans:
      - 192.0.2.61
    pki_host_local_certificate_validity_days: 397
    pki_host_local_certificate_request_ttl_seconds: 3600
    pki_host_local_certificate_trust_id: reviewed-v1
    pki_host_local_certificate_state_root: /var/lib/platform-config/pki/host-local/registry-dev
    pki_host_local_certificate_pending_root: /etc/zot/tls-pending
    pki_host_local_certificate_versions_root: /etc/zot/tls-versions
    pki_host_local_certificate_controller_exchange_root: /tmp/platform-pki-exchange
    pki_host_local_certificate_transport: sftp
    pki_host_local_certificate_transport_host_key_sha256: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
    pki_host_local_certificate_unattended_authorized: false
    pki_host_local_certificate_trust_paths:
      policy: /var/lib/platform-config/pki/host-local/registry-dev/trust/reviewed-v1/policy
      requesters.allowed_signers: /var/lib/platform-config/pki/host-local/registry-dev/trust/reviewed-v1/requesters.allowed_signers
      approvers.allowed_signers: /var/lib/platform-config/pki/host-local/registry-dev/trust/reviewed-v1/approvers.allowed_signers
      responses.allowed_signers: /var/lib/platform-config/pki/host-local/registry-dev/trust/reviewed-v1/responses.allowed_signers
      deployers.allowed_signers: /var/lib/platform-config/pki/host-local/registry-dev/trust/reviewed-v1/deployers.allowed_signers
    pki_host_local_certificate_trust_sha256:
      policy: dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
      requesters.allowed_signers: eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
      approvers.allowed_signers: ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff
      responses.allowed_signers: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      deployers.allowed_signers: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    pki_host_local_certificate_trust_sources:
      policy: /tmp/reviewed-pki-trust/policy
      requesters.allowed_signers: /tmp/reviewed-pki-trust/requesters.allowed_signers
      approvers.allowed_signers: /tmp/reviewed-pki-trust/approvers.allowed_signers
      responses.allowed_signers: /tmp/reviewed-pki-trust/responses.allowed_signers
      deployers.allowed_signers: /tmp/reviewed-pki-trust/deployers.allowed_signers
  tasks:
    - name: Require a foreign target identity to fail before the terminal stop
      block:
        - name: Run foreign-target boundary
          ansible.builtin.include_role:
            name: pki_host_local_certificate
            tasks_from: request
          vars:
            pki_host_local_certificate_target: another-host
            pki_host_local_certificate_requester_principal: another-host

        - name: Reject an accepted foreign target
          ansible.builtin.fail:
            msg: Foreign target identity was accepted.
      rescue:
        - name: Assert foreign target failed the common contract
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is search('frozen schema-2 contract')

    - name: Require an unsafe target-state root to fail before the terminal stop
      block:
        - name: Run unsafe-path boundary
          ansible.builtin.include_role:
            name: pki_host_local_certificate
            tasks_from: request
          vars:
            pki_host_local_certificate_state_root: /

        - name: Reject an accepted unsafe path
          ansible.builtin.fail:
            msg: Unsafe target-state root was accepted.
      rescue:
        - name: Assert unsafe path failed the common contract
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is search('frozen schema-2 contract')

    - name: Require malformed SAN input to fail before the terminal stop
      block:
        - name: Run malformed-SAN boundary
          ansible.builtin.include_role:
            name: pki_host_local_certificate
            tasks_from: request
          vars:
            pki_host_local_certificate_dns_sans:
              - registry.dev,malicious.example

        - name: Reject an accepted malformed SAN
          ansible.builtin.fail:
            msg: Malformed DNS SAN was accepted.
      rescue:
        - name: Assert malformed SAN failed element validation
          ansible.builtin.assert:
            that:
              - ansible_failed_result.results[0].msg is search('canonical DNS identity')

    - name: Require an IP literal in DNS SANs to fail before the terminal stop
      block:
        - name: Run confused-SAN boundary
          ansible.builtin.include_role:
            name: pki_host_local_certificate
            tasks_from: request
          vars:
            pki_host_local_certificate_dns_sans:
              - 192.0.2.61

        - name: Reject an accepted IP literal as a DNS SAN
          ansible.builtin.fail:
            msg: IP literal was accepted as a DNS SAN.
      rescue:
        - name: Assert IP literal failed DNS identity validation
          ansible.builtin.assert:
            that:
              - ansible_failed_result.results[0].msg is search('canonical DNS identity')

    - name: Require terminal dot path components to fail before the terminal stop
      block:
        - name: Run terminal-dot-path boundary
          ansible.builtin.include_role:
            name: pki_host_local_certificate
            tasks_from: request
          vars:
            pki_host_local_certificate_controller_exchange_root: /tmp/..

        - name: Reject an accepted terminal dot path component
          ansible.builtin.fail:
            msg: Terminal dot path component was accepted.
      rescue:
        - name: Assert terminal dot path failed the common contract
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is search('frozen schema-2 contract')

    - name: Require coercive numeric input to fail before the terminal stop
      block:
        - name: Run string-TTL boundary
          ansible.builtin.include_role:
            name: pki_host_local_certificate
            tasks_from: request
          vars:
            pki_host_local_certificate_request_ttl_seconds: '3600'

        - name: Reject an accepted string TTL
          ansible.builtin.fail:
            msg: String request TTL was accepted.
      rescue:
        - name: Assert string TTL failed request validation
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is search('issuance contract')

    - name: Require a trailing control character to fail before the terminal stop
      block:
        - name: Run trailing-newline-path boundary
          ansible.builtin.include_role:
            name: pki_host_local_certificate
            tasks_from: request
          vars:
            pki_host_local_certificate_controller_exchange_root: |
              /tmp/platform-pki-exchange

        - name: Reject an accepted trailing control character
          ansible.builtin.fail:
            msg: Trailing control character was accepted.
      rescue:
        - name: Assert trailing control character failed the common contract
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is search('frozen schema-2 contract')

    - name: Require a coercive helper mode to fail common validation
      block:
        - name: Run string helper-mode boundary
          ansible.builtin.include_role:
            name: pki_host_local_certificate
            tasks_from: request
          vars:
            pki_host_local_certificate_helper_read_only: 'false'

        - name: Reject an accepted coercive helper mode
          ansible.builtin.fail:
            msg: String helper mode was accepted.
      rescue:
        - name: Assert string helper mode failed the common contract
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is search('frozen schema-2 contract')

    - name: Require a coercive unattended authorization to fail common validation
      block:
        - name: Run string unattended-authorization boundary
          ansible.builtin.include_role:
            name: pki_host_local_certificate
            tasks_from: request
          vars:
            pki_host_local_certificate_unattended_authorized: 'false'

        - name: Reject an accepted coercive unattended authorization
          ansible.builtin.fail:
            msg: String unattended authorization was accepted.
      rescue:
        - name: Assert string unattended authorization failed the common contract
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is search('frozen schema-2 contract')

    - name: Require old direct noninteractive activation to fail authorization
      block:
        - name: Run unauthorized noninteractive activation boundary
          ansible.builtin.include_role:
            name: pki_host_local_certificate
            tasks_from: activate
          vars:
            pki_host_local_certificate_request_ttl_seconds: 0
            pki_host_local_certificate_request_id: '0123456789abcdef0123456789abcdef'
            pki_host_local_certificate_artifact_manifest_sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            pki_host_local_certificate_validation_boundary_sha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
            pki_host_local_certificate_validation_boundary_target_path: /tmp/reviewed-validation-boundary
            pki_host_local_certificate_validation_boundary_runner_path: /tmp/reviewed-validation-boundary
            pki_host_local_certificate_reviewed_ca_target_path: /tmp/reviewed-ca.crt
            pki_host_local_certificate_reviewed_ca_runner_path: /tmp/reviewed-ca.crt
            pki_host_local_certificate_reviewed_ca_sha256: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
            pki_host_local_certificate_reviewed_ca_mode: '0600'
            pki_host_local_certificate_remote_validator: runner-test
            pki_host_local_certificate_endpoint: https://registry.dev/v2/
            pki_host_local_certificate_minimum_remaining_lifetime_seconds: 3600
            pki_host_local_certificate_rollback_seconds: 1209600
            pki_host_local_certificate_activation_action: finalize
            pki_host_local_certificate_activation_result: activated
            pki_host_local_certificate_interactive_confirmation: false
            pki_host_local_certificate_unattended_authorized: false

        - name: Reject an accepted unauthorized noninteractive activation
          ansible.builtin.fail:
            msg: Unauthorized noninteractive activation was accepted.
      rescue:
        - name: Assert old noninteractive flag failed the activation contract
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Validate host-local certificate activation contract'
              - ansible_failed_result.assertion is search('pki_host_local_certificate_unattended_authorized')

    - name: Require a moving response path to fail exact path validation
      block:
        - name: Run moving response-path boundary
          ansible.builtin.include_role:
            name: pki_host_local_certificate
            tasks_from: request
          vars:
            pki_host_local_certificate_response_source_dir: /tmp/current/response

        - name: Reject an accepted moving response path
          ansible.builtin.fail:
            msg: Moving response path was accepted.
      rescue:
        - name: Assert moving response path failed exact path validation
          ansible.builtin.assert:
            that:
              - ansible_failed_result.results[0].msg is search('absolute, canonical, and immutable')

    - name: Require a boolean validation wait to fail common validation
      block:
        - name: Run boolean validation-wait boundary
          ansible.builtin.include_role:
            name: pki_host_local_certificate
            tasks_from: request
          vars:
            pki_host_local_certificate_validation_wait_seconds: true

        - name: Reject an accepted boolean validation wait
          ansible.builtin.fail:
            msg: Boolean validation wait was accepted.
      rescue:
        - name: Assert boolean validation wait failed the common contract
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is search('frozen schema-2 contract')

    - name: Require an unsafe reviewed CA mode to fail common validation
      block:
        - name: Run unsafe reviewed-CA-mode boundary
          ansible.builtin.include_role:
            name: pki_host_local_certificate
            tasks_from: request
          vars:
            pki_host_local_certificate_reviewed_ca_mode: '0777'

        - name: Reject an accepted unsafe reviewed CA mode
          ansible.builtin.fail:
            msg: Unsafe reviewed CA mode was accepted.
      rescue:
        - name: Assert unsafe reviewed CA mode failed the common contract
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is search('frozen schema-2 contract')

    - name: Snapshot an existing root-owned helper prerequisite before preflight
      ansible.builtin.stat:
        path: "{{ pki_boundary_lifecycle_helper_path }}"
        follow: false
        get_checksum: true
        checksum_algorithm: sha256
      register: pki_boundary_helper_before

    - name: Require mismatched lifecycle helper rejection without repair
      block:
        - name: Run mismatched lifecycle helper preflight
          ansible.builtin.include_role:
            name: pki_host_local_certificate
            tasks_from: lifecycle_helper
          vars:
            pki_host_local_certificate_lifecycle_helper_path: "{{ pki_boundary_lifecycle_helper_path }}"
            pki_host_local_certificate_helper_read_only: true

        - name: Reject an accepted mismatched lifecycle helper
          ansible.builtin.fail:
            msg: Mismatched lifecycle helper was accepted.
      rescue:
        - name: Assert mismatched lifecycle helper failed authenticity
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is search('exact shipped helper')

    - name: Snapshot the existing root-owned helper prerequisite after preflight
      ansible.builtin.stat:
        path: "{{ pki_boundary_lifecycle_helper_path }}"
        follow: false
        get_checksum: true
        checksum_algorithm: sha256
      register: pki_boundary_helper_after

    - name: Assert existing-helper preflight did not mutate its prerequisite
      ansible.builtin.assert:
        that:
          - pki_boundary_helper_before.stat.checksum == pki_boundary_helper_after.stat.checksum
          - pki_boundary_helper_before.stat.inode == pki_boundary_helper_after.stat.inode
          - pki_boundary_helper_before.stat.mode == pki_boundary_helper_after.stat.mode
          - pki_boundary_helper_before.stat.mtime == pki_boundary_helper_after.stat.mtime
