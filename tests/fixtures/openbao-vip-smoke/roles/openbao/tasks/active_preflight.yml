---
- name: Supply offline active marker and service observations
  ansible.builtin.set_fact:
    openbao_active_observation:
      inventory_host: "{{ inventory_hostname }}"
      node_id: "{{ inventory_hostname }}"
      cluster_id: test-cluster
      cluster_signature: "{{ 'a' * 64 }}"
    ansible_facts:
      services:
        haproxy.service:
          state: running
