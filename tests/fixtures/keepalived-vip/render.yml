---
- name: Render shared Keepalived VIP fixtures
  hosts: localhost
  gather_facts: false
  vars:
    keepalived_vip_role_dir: "{{ playbook_dir }}/../../../roles/keepalived_vip"
    keepalived_vip_test_package_nevra: keepalived-0:2.2.8-9.el10.x86_64
    keepalived_vip_test_priority: 150
    keepalived_vip_test_canonical_priority: "{{ keepalived_vip_test_priority }}"
    keepalived_vip_test_peer_2_router_id: test-node-02
    keepalived_vip_test_peer_2_priority: 140
    keepalived_vip_test_peer_2_extra_instances: {}
  tasks:
    - name: Exercise disabled-by-default Keepalived VIP role
      ansible.builtin.include_role:
        name: keepalived_vip

    - name: Load Keepalived VIP role defaults
      ansible.builtin.include_vars:
        file: "{{ keepalived_vip_role_dir }}/defaults/main.yml"

    - name: Configure Keepalived VIP fixture inputs
      ansible.builtin.set_fact:
        keepalived_vip_package_nevra: "{{ keepalived_vip_test_package_nevra }}"
        keepalived_vip_cluster_members:
          - name: localhost
            router_id: test-node-01
            instances:
              TEST_VIP:
                source_address: 192.0.2.10
                priority: "{{ keepalived_vip_test_canonical_priority }}"
          - name: test-node-02
            router_id: "{{ keepalived_vip_test_peer_2_router_id }}"
            instances: >-
              {{
                {
                  'TEST_VIP': {
                    'source_address': '192.0.2.11',
                    'priority': keepalived_vip_test_peer_2_priority
                  }
                }
                | combine(keepalived_vip_test_peer_2_extra_instances)
              }}
          - name: test-node-03
            router_id: test-node-03
            instances:
              TEST_VIP:
                source_address: 192.0.2.12
                priority: 130
        keepalived_vip_track_service: haproxy.service
        keepalived_vip_track_ports:
          - 8200
          - 8404
        keepalived_vip_instances:
          - name: TEST_VIP
            interface: vrrp-test
            virtual_router_id: 51
            priority: "{{ keepalived_vip_test_priority }}"
            source_address: 192.0.2.10
            peers:
              - 192.0.2.11
              - 192.0.2.12
            vip: 192.0.2.100/24

    - name: Validate Keepalived VIP fixture inputs
      ansible.builtin.include_tasks: "{{ keepalived_vip_role_dir }}/tasks/validate.yml"

    - name: Render Keepalived VIP configuration fixture
      ansible.builtin.template:
        src: "{{ keepalived_vip_role_dir }}/templates/keepalived.conf.j2"
        dest: "{{ keepalived_vip_test_output_dir }}/keepalived.conf"
        mode: "0600"

    - name: Render Keepalived VIP tracking script fixture
      ansible.builtin.template:
        src: "{{ keepalived_vip_role_dir }}/templates/check-service.sh.j2"
        dest: "{{ keepalived_vip_test_output_dir }}/check-service"
        mode: "0755"

    - name: Render Keepalived VIP systemd ordering fixture
      ansible.builtin.template:
        src: "{{ keepalived_vip_role_dir }}/templates/platform.conf.j2"
        dest: "{{ keepalived_vip_test_output_dir }}/platform.conf"
        mode: "0644"
