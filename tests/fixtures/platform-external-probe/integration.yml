---
- name: Converge staged external probe and Alloy process owner
  hosts: localhost
  gather_facts: false
  vars:
    platform_external_probe_test_active: false
    grafana_alloy_test_process_owner_only: false
    grafana_alloy_test_extra_config: ""
    platform_external_probe_enabled: true
    platform_external_probe_observer_id: openbao-test-01
    platform_external_probe_environment: test
    platform_external_probe_targets:
      - name: monitoring_vip
        service: monitoring
        address: "{{ platform_external_probe_test_address | default('https://192.0.2.201/ready') }}"
        address_mode: vip
        server_name: monitoring.example.invalid
        host_header: monitoring.example.invalid
        ca_file: /etc/platform-test-pki/ca.crt
        valid_status_codes:
          - 200
        required_body_regexes:
          - ready
        forbidden_body_regexes:
          - failed
      - name: monitoring_mtls
        service: monitoring
        address: https://127.0.0.1:18445/ready
        address_mode: direct
        server_name: monitoring.example.invalid
        host_header: monitoring.example.invalid
        ca_file: /etc/platform-test-pki/ca.crt
        client_cert_file: /etc/platform-test-pki/client.crt
        client_key_file: /etc/platform-test-pki/client.key
        valid_status_codes:
          - 200
        required_body_regexes:
          - ready
        forbidden_body_regexes:
          - failed
      - name: openbao_vip
        service: openbao
        address: https://192.0.2.200/ready
        address_mode: vip
        server_name: bao.example.invalid
        host_header: bao.example.invalid
        ca_file: /etc/platform-test-pki/ca.crt
        valid_status_codes:
          - 200
        required_body_regexes:
          - initialized
        forbidden_body_regexes:
          - sealed
      - name: grafana_health
        service: grafana
        profile: grafana_health
        address: https://127.0.0.1:18443/api/health
        address_mode: vip
        server_name: monitoring.example.invalid
        host_header: monitoring.example.invalid
        ca_file: /etc/platform-test-pki/ca.crt
      - name: loki_ready
        service: loki
        profile: loki_ready
        address: https://127.0.0.1:18443/ready
        address_mode: vip
        server_name: monitoring.example.invalid
        host_header: monitoring.example.invalid
        ca_file: /etc/platform-test-pki/ca.crt
      - name: mimir_ready
        service: mimir
        profile: mimir_ready
        address: https://127.0.0.1:18443/ready
        address_mode: vip
        server_name: monitoring.example.invalid
        host_header: monitoring.example.invalid
        ca_file: /etc/platform-test-pki/ca.crt
    platform_external_probe_vip_ownership:
      - service: openbao
        endpoint: openbao_vip
        instance: OPENBAO
        interface: vrrp-test
        vip: 192.0.2.200
    platform_external_probe_timer_enabled: "{{ platform_external_probe_test_active }}"
    platform_external_probe_timer_state: "{{ 'started' if platform_external_probe_test_active else 'stopped' }}"

    grafana_alloy_enabled: true
    grafana_alloy_download_url: "{{ grafana_alloy_test_download_url }}"
    grafana_alloy_prometheus_remote_write_url: https://mimir.example.invalid/api/v1/push
    grafana_alloy_prometheus_remote_write_ca_file: /etc/pki/tls/certs/ca-bundle.crt
    grafana_alloy_prometheus_remote_write_server_name: mimir.example.invalid
    grafana_alloy_external_labels:
      observer: openbao-test-01
    grafana_alloy_service_enabled: "{{ platform_external_probe_test_active }}"
    grafana_alloy_service_state: "{{ 'started' if platform_external_probe_test_active else 'stopped' }}"
  tasks:
    - name: Build strict external probe contribution
      ansible.builtin.include_role:
        name: platform_external_probe
      when: not grafana_alloy_test_process_owner_only | bool

    - name: Select external probe contribution for Alloy
      ansible.builtin.set_fact:
        grafana_alloy_feature_config: >-
          {{ platform_external_probe_alloy_fragment }}
          {{ grafana_alloy_test_extra_config }}
      when: not grafana_alloy_test_process_owner_only | bool

    - name: Converge the single staged Alloy process owner
      ansible.builtin.include_role:
        name: grafana_alloy
