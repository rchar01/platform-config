---
- name: Validate public HA handoff inventory
  hosts: localhost
  gather_facts: false
  vars:
    example_inventory_dir: "{{ playbook_dir }}/../../../inventories/dev"
    replacement_hosts: "{{ groups.openbao + groups.monitoring }}"
  tasks:
    - name: Load OpenBao group variable example
      ansible.builtin.include_vars:
        file: "{{ example_inventory_dir }}/group_vars/openbao.yml.example"
        name: openbao_group_example

    - name: Load monitoring group variable example
      ansible.builtin.include_vars:
        file: "{{ example_inventory_dir }}/group_vars/monitoring.yml.example"
        name: monitoring_group_example

    - name: Load OpenBao host variable examples
      ansible.builtin.include_vars:
        file: "{{ example_inventory_dir }}/host_vars/{{ item }}.yml.example"
        name: openbao_host_example
      loop: "{{ groups.openbao }}"
      register: openbao_host_examples

    - name: Load monitoring host variable examples
      ansible.builtin.include_vars:
        file: "{{ example_inventory_dir }}/host_vars/{{ item }}.yml.example"
        name: monitoring_host_example
      loop: "{{ groups.monitoring }}"
      register: monitoring_host_examples

    - name: Require the fictional 17-host topology
      ansible.builtin.assert:
        that:
          - groups.rocky | length == 17
          - groups.openbao | length == 3
          - groups.monitoring | length == 3
          - groups.monitoring_targets | length == 0
          - "'vault' not in groups"
          - replacement_hosts | intersect(groups.container_hosts) | length == 0
          - replacement_hosts | intersect(groups.storage_volume_hosts) | length == 0
          - replacement_hosts | intersect(groups.monitoring_targets) | length == 0

    - name: Require unique OpenBao identities
      ansible.builtin.assert:
        that:
          - openbao_host_examples.results | map(attribute='ansible_facts.openbao_host_example.openbao_node_name') | unique | length == 3
          - openbao_host_examples.results | map(attribute='ansible_facts.openbao_host_example.openbao_node_address') | unique | length == 3
          - openbao_host_examples.results | map(attribute='ansible_facts.openbao_host_example.openbao_node_dns') | unique | length == 3
          - openbao_group_example.openbao_service_dns is match('^[a-z0-9.-]+[.]invalid$')
          - openbao_group_example.openbao_image_digest is match('^sha256:[a-f0-9]{64}$')
          - not openbao_group_example.openbao_orchestration_ready | bool
          - not openbao_group_example.openbao_enabled | bool
          - not openbao_group_example.openbao_service_enabled | bool
          - openbao_group_example.openbao_service_state == 'stopped'
          - not openbao_group_example.openbao_haproxy_enabled | bool
          - not openbao_group_example.openbao_haproxy_service_enabled | bool
          - openbao_group_example.openbao_haproxy_service_state == 'stopped'
          - openbao_group_example.openbao_haproxy_package_nevra | length == 0
          - openbao_group_example.openbao_haproxy_client_allowed_sources | length == 0
          - openbao_group_example.openbao_haproxy_stats_allowed_sources == ['127.0.0.1/32']
          - not openbao_group_example.keepalived_vip_enabled | bool
          - not openbao_group_example.keepalived_vip_service_enabled | bool
          - openbao_group_example.keepalived_vip_service_state == 'stopped'
          - openbao_group_example.keepalived_vip_preempt_delay == 300
          - openbao_group_example.openbao_cluster_members | length == 3
          - openbao_group_example.openbao_cluster_members | map(attribute='name') | unique | length == 3
          - openbao_group_example.openbao_cluster_members | map(attribute='node_id') | unique | length == 3
          - openbao_group_example.openbao_cluster_members | map(attribute='address') | unique | length == 3
          - openbao_group_example.openbao_cluster_members | map(attribute='dns') | unique | length == 3
          - >-
            openbao_group_example.openbao_cluster_members
            | map(attribute='name')
            | difference(groups.openbao)
            | length == 0
          - >-
            groups.openbao
            | difference(
                openbao_group_example.openbao_cluster_members
                | map(attribute='name')
                | list
              )
            | length == 0
          - openbao_group_example.keepalived_vip_cluster_members | length == 3
          - openbao_group_example.keepalived_vip_cluster_members | map(attribute='router_id') | unique | length == 3
          - openbao_group_example.keepalived_vip_cluster_members | map(attribute='instances.OPENBAO.priority') | unique | length == 3
          - openbao_group_example.keepalived_vip_cluster_members | map(attribute='instances.OPENBAO.source_address') | unique | length == 3
          - not openbao_group_example.openbao_observers_orchestration_ready | bool
          - not openbao_group_example.openbao_observers_activate | bool
          - not openbao_group_example.platform_external_probe_enabled | bool
          - openbao_group_example.platform_external_probe_targets | length == 3
          - >-
            openbao_group_example.platform_external_probe_targets
            | map(attribute='profile') | sort
            == ['grafana_health', 'loki_ready', 'mimir_ready']
          - openbao_group_example.platform_external_probe_vip_ownership | length == 0
          - openbao_group_example.platform_external_probe_postgresql_primary | length == 10
          - openbao_group_example.platform_external_probe_garage_canary | length == 12
          - not openbao_group_example.grafana_alloy_enabled | bool
          - openbao_group_example.grafana_alloy_prometheus_remote_write_url is match('^https://.*[.]invalid/')

    - name: Require bounded OpenBao storage examples
      ansible.builtin.assert:
        that:
          - item.ansible_facts.openbao_host_example.storage_volume_layouts | length == 1
          - item.ansible_facts.openbao_host_example.storage_volume_layouts[0].capacity_gib | int == 20
          - item.ansible_facts.openbao_host_example.storage_volume_layouts[0].required_free_gib | int == 4
          - not item.ansible_facts.openbao_host_example.storage_volume_layouts[0].initialize | bool
          - item.ansible_facts.openbao_host_example.storage_volumes | map(attribute='size_gib') | map('int') | sum == 14
          - item.ansible_facts.openbao_host_example.storage_volumes | map(attribute='mountpoint') | unique | length == 4
          - item.ansible_facts.openbao_host_example.keepalived_vip_instances | length == 1
          - item.ansible_facts.openbao_host_example.keepalived_vip_instances[0].name == 'OPENBAO'
          - item.ansible_facts.openbao_host_example.keepalived_vip_instances[0].interface == 'eth0'
          - item.ansible_facts.openbao_host_example.keepalived_vip_instances[0].virtual_router_id == 51
          - item.ansible_facts.openbao_host_example.keepalived_vip_instances[0].source_address == item.ansible_facts.openbao_host_example.openbao_node_address
          - item.ansible_facts.openbao_host_example.keepalived_vip_instances[0].peers | length == 2
          - item.ansible_facts.openbao_host_example.keepalived_vip_instances[0].source_address not in item.ansible_facts.openbao_host_example.keepalived_vip_instances[0].peers
          - item.ansible_facts.openbao_host_example.keepalived_vip_instances[0].vip == '192.0.2.200/24'
          - >-
            item.ansible_facts.openbao_host_example.keepalived_vip_instances[0].priority
            == (
              openbao_group_example.keepalived_vip_cluster_members
              | selectattr('name', 'equalto', item.item)
              | map(attribute='instances.OPENBAO.priority')
              | first
            )
          - >-
            item.ansible_facts.openbao_host_example.keepalived_vip_instances[0].source_address
            == (
              openbao_group_example.keepalived_vip_cluster_members
              | selectattr('name', 'equalto', item.item)
              | map(attribute='instances.OPENBAO.source_address')
              | first
            )
      loop: "{{ openbao_host_examples.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Require unique monitoring identities
      ansible.builtin.assert:
        that:
          - monitoring_host_examples.results | map(attribute='ansible_facts.monitoring_host_example.monitoring_node_name') | unique | length == 3
          - monitoring_host_examples.results | map(attribute='ansible_facts.monitoring_host_example.monitoring_node_address') | unique | length == 3
          - monitoring_host_examples.results | map(attribute='ansible_facts.monitoring_host_example.monitoring_node_dns') | unique | length == 3
          - monitoring_group_example.monitoring_grafana_dns is match('^[a-z0-9.-]+[.]invalid$')
          - monitoring_group_example.monitoring_loki_dns is match('^[a-z0-9.-]+[.]invalid$')
          - monitoring_group_example.monitoring_mimir_dns is match('^[a-z0-9.-]+[.]invalid$')
          - not monitoring_group_example.monitoring_haproxy_orchestration_ready | bool
          - not monitoring_group_example.monitoring_haproxy_contract_ready | bool
          - not monitoring_group_example.monitoring_haproxy_enabled | bool
          - not monitoring_group_example.monitoring_haproxy_service_enabled | bool
          - monitoring_group_example.monitoring_haproxy_service_state == 'stopped'
          - not monitoring_group_example.monitoring_etcd_orchestration_ready | bool
          - not monitoring_group_example.monitoring_etcd_bootstrap_preflight_ready | bool
          - not monitoring_group_example.monitoring_etcd_contract_ready | bool
          - not monitoring_group_example.monitoring_etcd_enabled | bool
          - not monitoring_group_example.monitoring_etcd_converge | bool
          - not monitoring_group_example.monitoring_etcd_service_enabled | bool
          - monitoring_group_example.monitoring_etcd_service_state == 'stopped'
          - monitoring_group_example.monitoring_etcd_data_fstype == 'xfs'
          - monitoring_group_example.monitoring_etcd_data_mount_source | length == 0
          - >-
            monitoring_group_example.monitoring_etcd_bootstrap_require_selinux_enforcing
            | bool
          - monitoring_group_example.monitoring_etcd_firewalld_manage | bool
          - monitoring_group_example.monitoring_etcd_selinux_manage | bool
          - monitoring_group_example.monitoring_etcd_initial_cluster_token | length == 0
          - monitoring_group_example.monitoring_etcd_tls_ca_src | length == 0
          - monitoring_group_example.monitoring_etcd_tls_cert_src | length == 0
          - monitoring_group_example.monitoring_etcd_tls_key_src | length == 0
          - monitoring_group_example.monitoring_etcd_client_allowed_sources | length == 0
          - monitoring_group_example.monitoring_etcd_cluster_members | length == 3
          - monitoring_group_example.monitoring_etcd_cluster_members | map(attribute='name') | unique | length == 3
          - monitoring_group_example.monitoring_etcd_cluster_members | map(attribute='address') | unique | length == 3
          - monitoring_group_example.monitoring_etcd_cluster_members | map(attribute='dns') | unique | length == 3
          - >-
            monitoring_group_example.monitoring_etcd_cluster_members
            | map(attribute='name') | list | sort
            == monitoring_host_examples.results
               | map(attribute='ansible_facts.monitoring_host_example.monitoring_etcd_node_name')
               | list | sort
          - not monitoring_group_example.monitoring_keepalived_enabled | bool
          - not monitoring_group_example.keepalived_vip_enabled | bool
          - not monitoring_group_example.keepalived_vip_service_enabled | bool
          - monitoring_group_example.keepalived_vip_service_state == 'stopped'
          - monitoring_group_example.keepalived_vip_preempt_delay == 300
          - monitoring_group_example.keepalived_vip_cluster_members | length == 3
          - monitoring_group_example.keepalived_vip_cluster_members | map(attribute='router_id') | unique | length == 3
          - monitoring_group_example.keepalived_vip_cluster_members | map(attribute='instances.MONITORING.priority') | unique | length == 3
          - monitoring_group_example.keepalived_vip_cluster_members | map(attribute='instances.MONITORING.source_address') | unique | length == 3

    - name: Require bounded monitoring storage examples
      ansible.builtin.assert:
        that:
          - item.ansible_facts.monitoring_host_example.storage_volume_layouts | length == 1
          - item.ansible_facts.monitoring_host_example.storage_volume_layouts[0].capacity_gib | int == 80
          - item.ansible_facts.monitoring_host_example.storage_volume_layouts[0].required_free_gib | int == 10
          - not item.ansible_facts.monitoring_host_example.storage_volume_layouts[0].initialize | bool
          - item.ansible_facts.monitoring_host_example.storage_volumes | map(attribute='size_gib') | map('int') | sum == 59
          - item.ansible_facts.monitoring_host_example.storage_volumes | map(attribute='mountpoint') | unique | length == 9
          - item.ansible_facts.monitoring_host_example.keepalived_vip_instances | length == 1
          - item.ansible_facts.monitoring_host_example.keepalived_vip_instances[0].name == 'MONITORING'
          - item.ansible_facts.monitoring_host_example.keepalived_vip_instances[0].interface == 'eth0'
          - item.ansible_facts.monitoring_host_example.keepalived_vip_instances[0].virtual_router_id == 52
          - item.ansible_facts.monitoring_host_example.keepalived_vip_instances[0].source_address == item.ansible_facts.monitoring_host_example.monitoring_node_address
          - item.ansible_facts.monitoring_host_example.keepalived_vip_instances[0].peers | length == 2
          - item.ansible_facts.monitoring_host_example.keepalived_vip_instances[0].source_address not in item.ansible_facts.monitoring_host_example.keepalived_vip_instances[0].peers
          - item.ansible_facts.monitoring_host_example.keepalived_vip_instances[0].vip == '192.0.2.201/24'
          - >-
            item.ansible_facts.monitoring_host_example.monitoring_etcd_node_name
            == item.ansible_facts.monitoring_host_example.monitoring_node_name
          - >-
            item.ansible_facts.monitoring_host_example.monitoring_etcd_node_address
            == item.ansible_facts.monitoring_host_example.monitoring_node_address
          - >-
            item.ansible_facts.monitoring_host_example.monitoring_etcd_node_dns
            == item.ansible_facts.monitoring_host_example.monitoring_node_dns
          - >-
            monitoring_group_example.monitoring_etcd_cluster_members
            | selectattr(
                'name',
                'equalto',
                item.ansible_facts.monitoring_host_example.monitoring_etcd_node_name
              )
            | selectattr(
                'address',
                'equalto',
                item.ansible_facts.monitoring_host_example.monitoring_etcd_node_address
              )
            | selectattr(
                'dns',
                'equalto',
                item.ansible_facts.monitoring_host_example.monitoring_etcd_node_dns
              )
            | list | length == 1
          - >-
            item.ansible_facts.monitoring_host_example.keepalived_vip_instances[0].priority
            == (
              monitoring_group_example.keepalived_vip_cluster_members
              | selectattr('name', 'equalto', item.item)
              | map(attribute='instances.MONITORING.priority')
              | first
            )
          - >-
            item.ansible_facts.monitoring_host_example.keepalived_vip_instances[0].source_address
            == (
              monitoring_group_example.keepalived_vip_cluster_members
              | selectattr('name', 'equalto', item.item)
              | map(attribute='instances.MONITORING.source_address')
              | first
            )
      loop: "{{ monitoring_host_examples.results }}"
      loop_control:
        label: "{{ item.item }}"
