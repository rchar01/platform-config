---
- name: Reject reused storage without explicit noninitialization
  hosts: localhost
  gather_facts: false
  vars:
    storage_volume_layouts:
      - name: test_data
        device: /dev/disk/by-id/example-test-data
        vg_name: test_data
        capacity_gib: 20
        required_free_gib: 4
        reuse_existing_vg: true
    storage_volumes:
      - name: test_primary
        layout: test_data
        lv_name: primary
        size_gib: 8
        mountpoint: /srv/test/primary
  tasks:
    - name: Run storage layout validation only
      ansible.builtin.include_role:
        name: storage_volume
        tasks_from: validate.yml
