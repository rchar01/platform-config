---
all:
  vars:
    ansible_connection: local
    ansible_become: false
    platform_environment: test
    openbao_observers_orchestration_ready: >-
      {{ inventory_hostname != (openbao_observers_test_unready_host | default('')) }}
    openbao_observers_activate: >-
      {{
        'yes'
        if inventory_hostname == (openbao_observers_test_invalid_activation_host | default(''))
        else (openbao_observers_test_activate | default(false))
      }}
    platform_external_probe_enabled: >-
      {{ inventory_hostname != (openbao_observers_test_probe_disabled_host | default('')) }}
    platform_external_probe_targets:
      - name: monitoring_vip
        service: monitoring
        address: https://192.0.2.201/ready
        address_mode: vip
        server_name: monitoring.example.invalid
        host_header: monitoring.example.invalid
        ca_file: /tmp/test-ca.crt
        valid_status_codes:
          - 200
        required_body_regexes:
          - ready
        forbidden_body_regexes:
          - failed
    platform_external_probe_vip_ownership:
      - service: monitoring
        endpoint: monitoring_vip
        instance: MONITORING
        interface: eth0
        vip: 192.0.2.201
    platform_external_probe_postgresql_primary:
      name: postgresql_primary
      service: postgresql
      address_mode: vip
      host: postgres.example.invalid
      port: 5432
      database: observer
      user: monitoring_probe
      ca_file: /etc/platform-test/ca.crt
      client_cert_file: /etc/platform-test/postgresql.crt
      client_key_file: /etc/platform-test/postgresql.key
    platform_external_probe_garage_canary:
      name: garage_canary
      service: garage
      address_mode: vip
      host: s3.example.invalid
      port: 443
      region: garage
      bucket: "observer-canary-{{ inventory_hostname }}"
      object_key: "canary/{{ inventory_hostname }}"
      ca_file: /etc/platform-test/ca.crt
      client_cert_file: "/etc/platform-test/garage-{{ inventory_hostname }}.crt"
      client_key_file: "/etc/platform-test/garage-{{ inventory_hostname }}.key"
      credentials_file: "/etc/platform-test/garage-{{ inventory_hostname }}.json"
    grafana_alloy_enabled: >-
      {{ inventory_hostname != (openbao_observers_test_alloy_disabled_host | default('')) }}
  children:
    openbao:
      hosts:
        observer-1:
        observer-2:
        observer-3:
    unrelated:
      hosts:
        unrelated-observer:
