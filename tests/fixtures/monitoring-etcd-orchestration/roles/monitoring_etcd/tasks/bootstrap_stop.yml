---
- name: Reject mocked monitoring etcd bootstrap-stop failure
  ansible.builtin.assert:
    that:
      - >-
        monitoring_etcd_bootstrap_test_stop_failure_host | default('')
        != inventory_hostname
    fail_msg: Mocked monitoring etcd bootstrap member failed to stop.

- name: Record mocked monitoring etcd bootstrap member stop
  ansible.builtin.set_fact:
    monitoring_etcd_bootstrap_test_stopped: true
    monitoring_etcd_bootstrap_member_stopped: true
