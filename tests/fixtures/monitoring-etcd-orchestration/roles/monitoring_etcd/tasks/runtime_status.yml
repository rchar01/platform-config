---
- name: Count mocked monitoring etcd runtime status
  ansible.builtin.set_fact:
    monitoring_etcd_activation_test_runtime_count: >-
      {{ monitoring_etcd_activation_test_runtime_count | default(0) | int + 1 }}

- name: Simulate unreachable monitoring etcd activation health control
  ansible.builtin.command: /bin/true
  changed_when: false
  vars:
    ansible_connection: ssh
    ansible_host: 127.0.0.1
    ansible_port: 1
    ansible_user: nobody
    ansible_ssh_timeout: 1
  when: >-
    (monitoring_etcd_activation_test_initial_health_unreachable | default(false)
     and monitoring_etcd_activation_test_runtime_count | int <= 2)
    or (monitoring_etcd_activation_test_final_health_unreachable | default(false)
        and monitoring_etcd_activation_test_runtime_count | int > 2)

- name: Reject recovered mocked monitoring etcd activation health control
  ansible.builtin.assert:
    that:
      - not monitoring_etcd_activation_test_initial_health_unreachable | default(false)
      - >-
        not monitoring_etcd_activation_test_final_health_unreachable | default(false)
        or monitoring_etcd_activation_test_runtime_count | int <= 2
    fail_msg: Mocked monitoring etcd activation health control was unreachable.

- name: Require every mocked monitoring etcd runtime member started
  ansible.builtin.assert:
    that:
      - >-
        groups.get('monitoring', [])
        | map('extract', hostvars, 'monitoring_etcd_bootstrap_test_started')
        | select('equalto', true) | length == 3
    fail_msg: Mocked monitoring etcd runtime status ran before every member started.

- name: Reject mocked monitoring etcd runtime health failure
  ansible.builtin.assert:
    that:
      - >-
        not (monitoring_etcd_activation_test_initial_health_failure | default(false))
        or monitoring_etcd_activation_test_runtime_count | int > 2
      - >-
        not (monitoring_etcd_activation_test_final_health_failure | default(false))
        or monitoring_etcd_activation_test_runtime_count | int <= 2
    fail_msg: Mocked monitoring etcd activation runtime health failed.

- name: Publish mocked monitoring etcd runtime status
  ansible.builtin.set_fact:
    monitoring_etcd_runtime_status_observation:
      cluster_id: >-
        {{ '999' if monitoring_etcd_activation_test_runtime_identity_drift
                    | default(false) else '100' }}
      leader_member_id: >-
        {{
          '102' if monitoring_etcd_activation_test_new_leader | default(false)
          else ('102'
                if monitoring_etcd_activation_test_unstable | default(false)
                   and monitoring_etcd_activation_test_runtime_count | int in [2, 4]
                else '101')
        }}
      members:
        - {name: monitoring-stage-1, member_id: "101"}
        - {name: monitoring-stage-2, member_id: "102"}
        - {name: monitoring-stage-3, member_id: "103"}
      endpoints:
        - https://monitoring-stage-1.internal.invalid:2379
        - https://monitoring-stage-2.internal.invalid:2379
        - https://monitoring-stage-3.internal.invalid:2379
