---
- name: Record entry into mocked monitoring etcd convergence
  ansible.builtin.copy:
    dest: "{{ monitoring_etcd_test_marker_path }}"
    content: firewalld
    mode: "0600"
  delegate_to: localhost
  run_once: true # noqa run-once[task]

- name: Start mocked monitoring etcd role order
  ansible.builtin.set_fact:
    monitoring_etcd_test_role_order:
      - firewalld
