---
auth_enabled: false

analytics:
  reporting_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    s3:
      endpoint: garage-1:3900
      insecure: true
      region: garage
      bucketnames: loki-compat
      s3forcepathstyle: true
      access_key_id: ${LOKI_S3_ACCESS_KEY_ID}
      secret_access_key: ${LOKI_S3_SECRET_ACCESS_KEY}

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-active
    cache_location: /loki/tsdb-cache

ingester:
  wal:
    enabled: true
    dir: /loki/wal
    flush_on_shutdown: true

compactor:
  working_directory: /loki/compactor

ruler:
  rule_path: /loki/rules-temp
  storage:
    type: local
    local:
      directory: /loki/rules
