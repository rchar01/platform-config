---
target: all,alertmanager
multitenancy_enabled: false
no_auth_tenant: garage-compat

server:
  http_listen_port: 8080

activity_tracker:
  filepath: ""

memberlist:
  node_name: ${MIMIR_NODE_NAME}
  randomize_node_name: false
  bind_port: 7947
  advertise_addr: ${MIMIR_NODE_IP}
  advertise_port: 7947
  join_members:
    - mimir-cluster-1:7947
    - mimir-cluster-2:7947
    - mimir-cluster-3:7947
  dead_node_reclaim_time: 5s
  rejoin_interval: 2s

distributor:
  ring:
    kvstore:
      store: memberlist
    heartbeat_period: 1s
    heartbeat_timeout: 10s
    instance_id: ${MIMIR_NODE_NAME}
    instance_addr: ${MIMIR_NODE_IP}
    instance_availability_zone: ${MIMIR_ZONE}

ingester:
  ring:
    min_ready_duration: 0s
    final_sleep: 0s
    kvstore:
      store: memberlist
    heartbeat_period: 1s
    heartbeat_timeout: 10s
    replication_factor: 3
    zone_awareness_enabled: true
    instance_id: ${MIMIR_NODE_NAME}
    instance_addr: ${MIMIR_NODE_IP}
    instance_availability_zone: ${MIMIR_ZONE}
    tokens_file_path: /data/ingester.tokens
    unregister_on_shutdown: false

blocks_storage:
  backend: s3
  s3:
    endpoint: garage-1:3900
    region: garage
    bucket_name: mimir-blocks
    access_key_id: ${MIMIR_BLOCKS_S3_ACCESS_KEY_ID}
    secret_access_key: ${MIMIR_BLOCKS_S3_SECRET_ACCESS_KEY}
    insecure: true
    signature_version: v4
    bucket_lookup_type: path
  tsdb:
    dir: /data/tsdb
    block_ranges_period: [1m]
    retention_period: 1h
    ship_interval: 1s
    head_compaction_interval: 1s
    head_compaction_idle_timeout: 5s
  bucket_store:
    sync_dir: /data/tsdb-sync
    sync_interval: 5s
    ignore_blocks_within: 0s

compactor:
  data_dir: /data/compactor
  compaction_interval: 2s
  cleanup_interval: 2s
  deletion_delay: 15s
  first_level_compaction_wait_period: 0s
  sharding_ring:
    kvstore:
      store: memberlist
    heartbeat_period: 1s
    heartbeat_timeout: 10s
    instance_id: ${MIMIR_NODE_NAME}
    instance_addr: ${MIMIR_NODE_IP}
    wait_stability_min_duration: 0s
    wait_stability_max_duration: 30s
    wait_active_instance_timeout: 30s

querier:
  query_store_after: 0s

store_gateway:
  sharding_ring:
    kvstore:
      store: memberlist
    heartbeat_period: 1s
    heartbeat_timeout: 10s
    replication_factor: 3
    zone_awareness_enabled: true
    instance_id: ${MIMIR_NODE_NAME}
    instance_addr: ${MIMIR_NODE_IP}
    instance_availability_zone: ${MIMIR_ZONE}
    tokens_file_path: /data/store-gateway.tokens
    unregister_on_shutdown: false
    wait_stability_min_duration: 0s
    wait_stability_max_duration: 30s

ruler:
  rule_path: /data/ruler
  poll_interval: 2s
  alertmanager_url: http://127.0.0.1:8080/alertmanager
  ring:
    kvstore:
      store: memberlist
    heartbeat_period: 1s
    heartbeat_timeout: 10s
    instance_id: ${MIMIR_NODE_NAME}
    instance_addr: ${MIMIR_NODE_IP}

ruler_storage:
  backend: s3
  s3:
    endpoint: garage-1:3900
    region: garage
    bucket_name: mimir-ruler
    access_key_id: ${MIMIR_RULER_S3_ACCESS_KEY_ID}
    secret_access_key: ${MIMIR_RULER_S3_SECRET_ACCESS_KEY}
    insecure: true
    signature_version: v4
    bucket_lookup_type: path

alertmanager:
  data_dir: /data/alertmanager
  fallback_config_file: /etc/mimir/alertmanager-fallback.yaml
  external_url: http://${MIMIR_NODE_NAME}:8080/alertmanager
  poll_interval: 2s
  persist_interval: 1s
  sharding_ring:
    replication_factor: 3
    kvstore:
      store: memberlist
    heartbeat_period: 1s
    heartbeat_timeout: 10s
    zone_awareness_enabled: true
    instance_id: ${MIMIR_NODE_NAME}
    instance_addr: ${MIMIR_NODE_IP}
    instance_availability_zone: ${MIMIR_ZONE}

alertmanager_storage:
  backend: s3
  s3:
    endpoint: garage-1:3900
    region: garage
    bucket_name: mimir-alertmanager
    access_key_id: ${MIMIR_ALERTMANAGER_S3_ACCESS_KEY_ID}
    secret_access_key: ${MIMIR_ALERTMANAGER_S3_SECRET_ACCESS_KEY}
    insecure: true
    signature_version: v4
    bucket_lookup_type: path

limits:
  compactor_blocks_retention_period: 10m
  compactor_tenant_shard_size: 1
