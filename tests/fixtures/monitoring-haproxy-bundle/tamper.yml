---
- name: Restore the healthy fixture and tamper one property
  ansible.builtin.command:
    argv:
      - "{{ ansible_python_interpreter }}"
      - "{{ playbook_dir }}/bundle_state.py"
      - prepare
      - "{{ bundle_test_root }}"
      - "{{ bundle_test_case | to_json }}"
  changed_when: false
  check_mode: false

- name: Clear the previous case rejection
  ansible.builtin.set_fact:
    bundle_test_failure: ""

- name: Capture production rejection without aborting the matrix
  block:
    - name: Reuse the tampered bundle through the full production entry point
      ansible.builtin.include_role:
        name: monitoring_haproxy
        tasks_from: bundle.yml
  rescue:
    - name: Record the actual production failure
      ansible.builtin.set_fact:
        bundle_test_failure: "{{ ansible_failed_result.msg | default('failure without message') }}"

- name: Record bytes metadata pointer preservation and native validator calls
  ansible.builtin.command:
    argv:
      - "{{ ansible_python_interpreter }}"
      - "{{ playbook_dir }}/bundle_state.py"
      - record
      - "{{ bundle_test_root }}"
      - "{{ bundle_test_case | to_json }}"
      - "{{ bundle_test_failure }}"
  changed_when: false
  check_mode: false
