---
- name: Verify delegated RKE2 SSH identity resolution
  hosts: serial-node
  gather_facts: false
  vars:
    rke2_bootstrap_host: bootstrap
  tasks:
    - name: Require the serial node identity outside delegation
      ansible.builtin.assert:
        that:
          - ansible_ssh_private_key_file == '/synthetic-keys/serial-node'

    - name: Require the bootstrap identity during delegation
      ansible.builtin.assert:
        that:
          - ansible_ssh_private_key_file == '/synthetic-keys/bootstrap'
      delegate_to: "{{ rke2_bootstrap_host }}"
      vars:
        ansible_ssh_private_key_file: >-
          {{ hostvars[rke2_bootstrap_host].ansible_ssh_private_key_file }}
