# Synthetic Phase 0 capability fixture. These ports, hosts, and paths are not
# production monitoring policy.
global
  log stdout format raw local0
  maxconn 256
  user haproxy
  group haproxy

defaults
  log global
  option dontlognull
  timeout connect 2s
  timeout client 10s
  timeout server 10s
  timeout check 2s

frontend monitoring_https
  bind *:8443 ssl crt /etc/monitoring-haproxy-test/frontend.pem ca-file /etc/monitoring-haproxy-test/client-ca/ca.crt crl-file /etc/monitoring-haproxy-test/client-ca/ca.crl verify required strict-sni
  mode http
  option httplog

  http-request del-header X-Scope-OrgID
  http-request set-var(txn.role) ssl_c_s_dn(cn),map_str(/etc/monitoring-haproxy-test/roles.map,__denied__)

  acl host_loki hdr(host),lower -m str loki.test.invalid loki.test.invalid:8443
  acl host_grafana hdr(host),lower -m str grafana.test.invalid grafana.test.invalid:8443
  acl host_bad_backend hdr(host),lower -m str bad-backend.test.invalid bad-backend.test.invalid:8443
  acl host_untrusted_backend hdr(host),lower -m str untrusted-backend.test.invalid untrusted-backend.test.invalid:8443
  http-request deny deny_status 421 if !host_loki !host_grafana !host_bad_backend !host_untrusted_backend
  http-request deny deny_status 403 if { var(txn.role) -m str __denied__ }

  acl role_writer var(txn.role) -m str writer
  acl role_loki_query var(txn.role) -m str loki_query
  acl role_browser var(txn.role) -m str browser
  acl method_post method POST
  acl method_get method GET
  acl path_loki_push path -m str /loki/api/v1/push
  acl path_loki_query path -m str /loki/api/v1/query_range
  acl path_grafana_login path -m str /login
  acl path_bad_ready path -m str /ready

  http-request set-var(txn.authorized) str(yes) if host_loki role_writer method_post path_loki_push
  http-request set-var(txn.authorized) str(yes) if host_loki role_loki_query method_get path_loki_query
  http-request set-var(txn.authorized) str(yes) if host_grafana role_browser method_get path_grafana_login
  http-request set-var(txn.authorized) str(yes) if host_bad_backend role_loki_query method_get path_bad_ready
  http-request set-var(txn.authorized) str(yes) if host_untrusted_backend role_loki_query method_get path_bad_ready
  http-request deny deny_status 403 unless { var(txn.authorized) -m str yes }

  http-request set-header X-Scope-OrgID synthetic-tenant if host_loki
  use_backend loki_backend if host_loki
  use_backend grafana_backend if host_grafana
  use_backend wrong_identity_backend if host_bad_backend
  use_backend untrusted_ca_backend if host_untrusted_backend

backend loki_backend
  mode http
  http-request set-header Host loki-backend.test.invalid
  option httpchk
  http-check send meth GET uri /ready ver HTTP/1.1 hdr Host loki-backend.test.invalid
  http-check expect status 200
  server loki 127.0.0.2:18443 ssl check verify required ca-file /etc/monitoring-haproxy-test/server-ca.crt crt /etc/monitoring-haproxy-test/backend-client.pem sni str(loki-backend.test.invalid) check-sni loki-backend.test.invalid verifyhost loki-backend.test.invalid inter 1s fall 2 rise 2

backend grafana_backend
  mode http
  http-request set-header Host grafana-backend.test.invalid
  option httpchk
  http-check send meth GET uri /ready ver HTTP/1.1 hdr Host grafana-backend.test.invalid
  http-check expect status 200
  server grafana 127.0.0.3:18443 ssl check verify required ca-file /etc/monitoring-haproxy-test/server-ca.crt crt /etc/monitoring-haproxy-test/backend-client.pem sni str(grafana-backend.test.invalid) check-sni grafana-backend.test.invalid verifyhost grafana-backend.test.invalid inter 1s fall 2 rise 2

backend wrong_identity_backend
  mode http
  option httpchk
  http-check send meth GET uri /ready ver HTTP/1.1 hdr Host bad-backend.test.invalid
  http-check expect status 200
  server wrong 127.0.0.4:18443 ssl check verify required ca-file /etc/monitoring-haproxy-test/server-ca.crt crt /etc/monitoring-haproxy-test/backend-client.pem sni str(bad-backend.test.invalid) check-sni bad-backend.test.invalid verifyhost bad-backend.test.invalid inter 1s fall 1 rise 1

backend untrusted_ca_backend
  mode http
  option httpchk
  http-check send meth GET uri /ready ver HTTP/1.1 hdr Host untrusted-backend.test.invalid
  http-check expect status 200
  server untrusted 127.0.0.6:18443 ssl check verify required ca-file /etc/monitoring-haproxy-test/server-ca.crt crt /etc/monitoring-haproxy-test/backend-client.pem sni str(untrusted-backend.test.invalid) check-sni untrusted-backend.test.invalid verifyhost untrusted-backend.test.invalid inter 1s fall 1 rise 1

frontend postgresql_tls_passthrough
  bind *:15432
  mode tcp
  option tcplog
  default_backend postgresql_primary

backend postgresql_primary
  mode tcp
  option httpchk
  http-check send meth GET uri /primary ver HTTP/1.1 hdr Host patroni.test.invalid
  http-check expect status 200
  server pg1 127.0.0.5:15433 check port 18443 check-ssl check-sni patroni.test.invalid verify required ca-file /etc/monitoring-haproxy-test/server-ca.crt crt /etc/monitoring-haproxy-test/backend-client.pem verifyhost patroni.test.invalid inter 1s fall 2 rise 2

frontend monitoring_metrics
  bind 127.0.0.1:18404
  mode http
  acl metrics_source src 127.0.0.1/32
  http-request deny deny_status 403 unless metrics_source
  http-request use-service prometheus-exporter if { path -m str /metrics }
  http-request deny deny_status 404
  no log
