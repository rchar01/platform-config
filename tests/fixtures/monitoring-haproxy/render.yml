---
- name: Render monitoring HAProxy fixtures
  hosts: localhost
  gather_facts: false
  vars:
    monitoring_haproxy_role_dir: "{{ playbook_dir }}/../../../roles/monitoring_haproxy"
  tasks:
    - name: Load inactive monitoring HAProxy role defaults and vars
      ansible.builtin.include_role:
        name: monitoring_haproxy

    - name: Load monitoring HAProxy role defaults for rendering
      ansible.builtin.include_vars:
        file: "{{ monitoring_haproxy_role_dir }}/defaults/main.yml"

    - name: Load role-owned monitoring HAProxy health policy
      ansible.builtin.include_vars:
        file: "{{ monitoring_haproxy_role_dir }}/vars/main.yml"

    - name: Load monitoring HAProxy synthetic contract
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/contract.yml"

    - name: Validate monitoring HAProxy render fixture inputs
      ansible.builtin.include_tasks: "{{ monitoring_haproxy_role_dir }}/tasks/validate.yml"

    - name: Render monitoring HAProxy configuration fixture
      ansible.builtin.template:
        src: "{{ monitoring_haproxy_role_dir }}/templates/haproxy.cfg.j2"
        dest: "{{ monitoring_haproxy_test_output_dir }}/haproxy.cfg"
        mode: "0640"

    - name: Render monitoring HAProxy identity map fixture
      ansible.builtin.template:
        src: "{{ monitoring_haproxy_role_dir }}/templates/monitoring-roles.map.j2"
        dest: "{{ monitoring_haproxy_test_output_dir }}/roles.map"
        mode: "0640"
