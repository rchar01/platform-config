---
monitoring_haproxy_enabled: true
monitoring_haproxy_contract_ready: true
monitoring_haproxy_package_nevra: haproxy-0:3.0.5-6.el10_2.1.x86_64
monitoring_haproxy_https_port: 443
monitoring_haproxy_postgresql_frontend_port: 5432
monitoring_haproxy_metrics_bind_address: 127.0.0.1
monitoring_haproxy_metrics_port: 18404
monitoring_haproxy_tenant: synthetic-tenant
monitoring_haproxy_frontend_pem_src: /fixture/frontend.pem
monitoring_haproxy_client_ca_src: /fixture/client-ca.crt
monitoring_haproxy_client_crl_src: /fixture/client-ca.crl
monitoring_haproxy_backend_ca_src: /fixture/backend-ca.crt
monitoring_haproxy_backend_client_pem_src: /fixture/backend-client.pem
monitoring_haproxy_frontend_pem_path: /etc/monitoring-haproxy-test/frontend.pem
monitoring_haproxy_client_ca_path: /etc/monitoring-haproxy-test/client-ca/ca.crt
monitoring_haproxy_client_crl_path: /etc/monitoring-haproxy-test/client-ca/ca.crl
monitoring_haproxy_backend_ca_path: /etc/monitoring-haproxy-test/server-ca.crt
monitoring_haproxy_backend_client_pem_path: /etc/monitoring-haproxy-test/backend-client.pem
monitoring_haproxy_identity_map_path: /etc/monitoring-haproxy-test/rendered-roles.map
monitoring_haproxy_grafana_dns: grafana.test.invalid
monitoring_haproxy_loki_dns: loki.test.invalid
monitoring_haproxy_mimir_dns: mimir.test.invalid
monitoring_haproxy_alertmanager_dns: alertmanager.test.invalid
monitoring_haproxy_s3_dns: s3.test.invalid
monitoring_haproxy_postgresql_dns: postgresql.test.invalid
monitoring_haproxy_identity_roles:
  - role: alloy_loki_writer
    subject_dn: CN=alloy-writer,OU=telemetry,O=platform-test,C=XX
  - role: alloy_mimir_writer
    subject_dn: CN=alloy-mimir,OU=telemetry,O=platform-test,C=XX
  - role: garage_s3
    subject_dn: CN=garage-s3,OU=storage,O=platform-test,C=XX
  - role: grafana_alertmanager
    subject_dn: CN=grafana-alertmanager,OU=telemetry,O=platform-test,C=XX
  - role: grafana_browser
    subject_dn: CN=grafana-browser,OU=users,O=platform-test,C=XX
  - role: grafana_loki_query
    subject_dn: CN=grafana-loki-query,OU=telemetry,O=platform-test,C=XX
  - role: grafana_mimir_query
    subject_dn: CN=grafana-mimir,OU=telemetry,O=platform-test,C=XX
  - role: monitoring_probe
    subject_dn: CN=monitoring-probe,OU=observers,O=platform-test,C=XX
  - role: monitoring_s3_probe
    subject_dn: CN=monitoring-s3-probe,OU=observers,O=platform-test,C=XX
  - role: operator
    subject_dn: CN=operator,OU=operators,O=platform-test,C=XX
monitoring_haproxy_loki_writer_routes:
  - method: POST
    path: /loki/api/v1/push
monitoring_haproxy_loki_query_routes:
  - method: GET
    path: /loki/api/v1/query_range
monitoring_haproxy_mimir_writer_routes:
  - method: POST
    path: /api/v1/push
monitoring_haproxy_mimir_query_routes:
  - method: GET
    path: /prometheus/api/v1/query
monitoring_haproxy_alertmanager_routes:
  - method: GET
    path: /alertmanager/api/v2/alerts
monitoring_haproxy_operator_routes:
  - service: mimir
    method: GET
    path: /-/ready
monitoring_haproxy_https_allowed_sources:
  - 127.0.0.0/24
monitoring_haproxy_postgresql_allowed_sources:
  - 127.0.0.0/24
monitoring_haproxy_metrics_allowed_sources:
  - 127.0.0.1/32
monitoring_haproxy_operator_allowed_sources:
  - 127.0.0.1/32
monitoring_haproxy_backends:
  grafana:
    port: 18443
    health_port: 18443
    targets:
      - {name: monitoring-1, address: 127.0.0.3, tls_server_name: grafana-backend.test.invalid}
      - {name: monitoring-2, address: 127.0.0.13, tls_server_name: grafana-2.test.invalid}
      - {name: monitoring-3, address: 127.0.0.23, tls_server_name: grafana-3.test.invalid}
  loki:
    port: 18444
    health_port: 18444
    targets:
      - {name: monitoring-1, address: 127.0.0.2, tls_server_name: loki-backend.test.invalid}
      - {name: monitoring-2, address: 127.0.0.4, tls_server_name: loki-2.test.invalid}
      - {name: monitoring-3, address: 127.0.0.6, tls_server_name: loki-3.test.invalid}
  mimir:
    port: 18445
    health_port: 18445
    targets: &mimir_targets
      - {name: monitoring-1, address: 127.0.0.8, tls_server_name: mimir-backend.test.invalid}
      - {name: monitoring-2, address: 127.0.0.18, tls_server_name: mimir-2.test.invalid}
      - {name: monitoring-3, address: 127.0.0.28, tls_server_name: mimir-3.test.invalid}
  alertmanager:
    port: 18445
    health_port: 18445
    targets: *mimir_targets
  s3:
    port: 19000
    health_port: 19001
    targets:
      - {name: local-garage, address: 127.0.0.1}
  postgresql:
    port: 15433
    health_port: 18448
    targets:
      - {name: postgresql-1, address: 127.0.0.5, tls_server_name: patroni.test.invalid}
      - {name: postgresql-2, address: 127.0.0.15, tls_server_name: patroni-2.test.invalid}
      - {name: postgresql-3, address: 127.0.0.25, tls_server_name: patroni-3.test.invalid}
