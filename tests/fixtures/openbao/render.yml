---
- name: Render staged OpenBao HA role fixtures
  hosts: localhost
  gather_facts: false
  vars:
    openbao_role_dir: "{{ playbook_dir }}/../../../roles/openbao"
    openbao_test_image_digest: sha256:15e90b578c970ae57b596ed51295380cd54f93860fe36758f05b455d71aae0e0
    openbao_test_local_node_name: bao-1
    openbao_test_peer_2_node_name: bao-2
    openbao_test_peer_2_dns: bao-2.internal.invalid
    openbao_test_cluster_port: 8201
    openbao_test_seal_type: shamir
    openbao_test_cluster_members:
      - name: localhost
        node_id: bao-1
        address: 192.0.2.10
        dns: bao-1.internal.invalid
      - name: test-node-02
        node_id: "{{ openbao_test_peer_2_node_name }}"
        address: 192.0.2.11
        dns: "{{ openbao_test_peer_2_dns }}"
      - name: test-node-03
        node_id: bao-3
        address: 192.0.2.12
        dns: bao-3.internal.invalid
  tasks:
    - name: Exercise disabled-by-default OpenBao role
      ansible.builtin.include_role:
        name: openbao

    - name: Load OpenBao role defaults
      ansible.builtin.include_vars:
        file: "{{ openbao_role_dir }}/defaults/main.yml"

    - name: Configure OpenBao render fixture inputs
      ansible.builtin.set_fact:
        ansible_facts:
          architecture: x86_64
        openbao_image_digest: "{{ openbao_test_image_digest }}"
        openbao_image: "{{ openbao_image_registry }}@{{ openbao_test_image_digest }}"
        openbao_cluster_members: "{{ openbao_test_cluster_members }}"
        openbao_node_name: "{{ openbao_test_local_node_name }}"
        openbao_node_address: 192.0.2.10
        openbao_node_dns: bao-1.internal.invalid
        openbao_service_dns: bao.example.invalid
        openbao_service_vip: 192.0.2.100
        openbao_cluster_port: "{{ openbao_test_cluster_port }}"
        openbao_seal_type: "{{ openbao_test_seal_type }}"
        openbao_tls_ca_src: /outside-git/openbao/ca.crt
        pki_host_local_certificate_state_root: /var/lib/platform-config/pki/openbao
        pki_host_local_certificate_pending_root: /var/lib/platform-config/pki/openbao-pending
        pki_host_local_certificate_versions_root: /etc/openbao/tls-versions
        pki_host_local_certificate_lifecycle_helper_path: /usr/local/libexec/platform-pki-host-local-lifecycle
        pki_host_local_certificate_service: openbao-test-01
        pki_host_local_certificate_target: localhost
        pki_host_local_certificate_service_adapter: openbao-pristine-v1
        pki_host_local_certificate_service_unit: openbao.service
        pki_host_local_certificate_service_config_path: /etc/openbao/listener.hcl
        pki_host_local_certificate_reviewed_ca_target_path: /etc/platform-config/openbao-validation-ca.crt
        pki_host_local_certificate_openbao_node_dns: bao-1.internal.invalid
        pki_host_local_certificate_openbao_node_address: 192.0.2.10
        pki_host_local_certificate_openbao_backend_port: 18200
        pki_host_local_certificate_openbao_cluster_port: "{{ openbao_test_cluster_port }}"
        pki_host_local_certificate_openbao_container_versions_root: /openbao/config/tls-versions
        pki_host_local_certificate_openbao_base_config_dir: /openbao/config
        pki_host_local_certificate_openbao_raft_data_dir: /var/lib/openbao
        pki_host_local_certificate_openbao_bootstrap_marker_path: /var/lib/platform-config/openbao-bootstrap.json
        openbao_backend_allowed_sources:
          - 198.51.100.0/24

    - name: Validate OpenBao render fixture inputs
      ansible.builtin.include_tasks: "{{ openbao_role_dir }}/tasks/validate.yml"

    - name: Render OpenBao configuration fixture
      ansible.builtin.template:
        src: "{{ openbao_role_dir }}/templates/openbao.hcl.j2"
        dest: "{{ openbao_test_output_dir }}/openbao.hcl"
        mode: "0600"

    - name: Render OpenBao Quadlet fixture
      ansible.builtin.template:
        src: "{{ openbao_role_dir }}/templates/openbao.container.j2"
        dest: "{{ openbao_test_output_dir }}/openbao.container"
        mode: "0600"

    - name: Render dormant OpenBao listener fixture
      ansible.builtin.template:
        src: "{{ openbao_role_dir }}/templates/listener.hcl.j2"
        dest: "{{ openbao_test_output_dir }}/listener.hcl"
        mode: "0600"

    - name: Render declarative OpenBao audit fixture
      ansible.builtin.template:
        src: "{{ openbao_role_dir }}/templates/audit.hcl.j2"
        dest: "{{ openbao_test_output_dir }}/audit.hcl"
        mode: "0600"

    - name: Select rendered OpenBao base config for validator fixture
      ansible.builtin.set_fact:
        openbao_config_path: >-
          {{
            openbao_test_validator_base_path
            | default(openbao_test_output_dir ~ '/openbao.hcl')
          }}
        openbao_listener_path: >-
          {{
            openbao_test_validator_listener_path
            | default(openbao_test_output_dir ~ '/listener.hcl')
          }}

    - name: Render OpenBao validator fixture
      ansible.builtin.template:
        src: "{{ openbao_role_dir }}/templates/validate-config.sh.j2"
        dest: "{{ openbao_test_output_dir }}/validate-config"
        mode: "0700"
