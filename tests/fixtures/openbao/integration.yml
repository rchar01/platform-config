---
- name: Exercise staged OpenBao HA role on disposable Rocky systemd
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    firewalld_enabled: false
    podman_host_package_nevra: podman-7:5.8.2-5.el10_2.x86_64
    podman_host_socket_manage: false
    openbao_enabled: true
    openbao_service_enabled: "{{ openbao_test_service_started | default(false) }}"
    openbao_service_state: "{{ 'started' if openbao_test_service_started | default(false) else 'stopped' }}"
    openbao_firewalld_manage: true
    openbao_backend_allowed_sources:
      - "{{ openbao_test_backend_source | default('198.51.100.1/32') }}"
    openbao_node_name: bao-test-1
    openbao_node_address: 127.0.0.1
    openbao_node_dns: bao-test-1.internal.invalid
    openbao_service_dns: bao-test.internal.invalid
    openbao_service_vip: 192.0.2.100
    openbao_tls_ca_src: /tmp/openbao-test/ca.crt
    pki_host_local_certificate_state_root: /var/lib/platform-config/pki/openbao
    pki_host_local_certificate_pending_root: /var/lib/platform-config/pki/openbao-pending
    pki_host_local_certificate_versions_root: /etc/openbao/tls-versions
    pki_host_local_certificate_lifecycle_helper_path: /usr/local/libexec/platform-pki-host-local-lifecycle
    pki_host_local_certificate_service: openbao-test-01
    pki_host_local_certificate_target: localhost
    pki_host_local_certificate_service_adapter: openbao-pristine-v1
    pki_host_local_certificate_service_unit: openbao.service
    pki_host_local_certificate_service_config_path: /etc/openbao/listener.hcl
    pki_host_local_certificate_trust_id: openbao-test-v1
    pki_host_local_certificate_reviewed_ca_target_path: /etc/platform-config/openbao-validation-ca.crt
    pki_host_local_certificate_openbao_node_dns: bao-test-1.internal.invalid
    pki_host_local_certificate_openbao_node_address: 127.0.0.1
    pki_host_local_certificate_openbao_backend_port: 18200
    pki_host_local_certificate_openbao_cluster_port: 8201
    pki_host_local_certificate_openbao_container_versions_root: /openbao/config/tls-versions
    pki_host_local_certificate_openbao_base_config_dir: /openbao/config
    pki_host_local_certificate_openbao_raft_data_dir: /var/lib/openbao
    pki_host_local_certificate_openbao_bootstrap_marker_path: /var/lib/platform-config/openbao-bootstrap.json
    openbao_cluster_members:
      - name: localhost
        node_id: bao-test-1
        address: 127.0.0.1
        dns: bao-test-1.internal.invalid
      - name: test-node-02
        node_id: bao-test-2
        address: 127.0.0.2
        dns: bao-test-2.internal.invalid
      - name: test-node-03
        node_id: bao-test-3
        address: 127.0.0.3
        dns: bao-test-3.internal.invalid
  pre_tasks:
    - name: Install fixed OpenBao custody fixture helper
      ansible.builtin.copy:
        src: openbao-custody-helper
        dest: /usr/local/libexec/platform-pki-host-local-lifecycle
        owner: root
        group: root
        mode: "0755"
      check_mode: false
  roles:
    - firewalld
    - podman_host
    - openbao
  post_tasks:
    - name: Assert expected OpenBao restart requirement
      ansible.builtin.assert:
        that:
          - >-
            openbao_restart_required
            == openbao_test_expect_restart_required
        fail_msg: >-
          OpenBao convergence reported an unexpected restart requirement.
      when: openbao_test_expect_restart_required is defined
