---
all:
  vars:
    ansible_connection: local
    ansible_become: false
    platform_environment: dev
    openbao_orchestration_ready: true
    openbao_enabled: true
    openbao_service_enabled: >-
      {{ inventory_hostname == (openbao_test_active_openbao | default('')) }}
    openbao_service_state: >-
      {{ 'started' if openbao_service_enabled else 'stopped' }}
    openbao_haproxy_enabled: true
    openbao_haproxy_service_enabled: >-
      {{ inventory_hostname == (openbao_test_active_haproxy | default('')) }}
    openbao_haproxy_service_state: >-
      {{ 'started' if openbao_haproxy_service_enabled else 'stopped' }}
    keepalived_vip_enabled: true
    keepalived_vip_service_enabled: >-
      {{ inventory_hostname == (openbao_test_active_keepalived | default('')) }}
    keepalived_vip_service_state: >-
      {{ 'started' if keepalived_vip_service_enabled else 'stopped' }}
  children:
    openbao:
      hosts:
        bao-stage-1:
        bao-stage-2:
        bao-stage-3:
    unrelated:
      hosts:
        unrelated-stage:
